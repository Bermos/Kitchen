apiVersion: kitchen.bermos.dev/v1alpha1
kind: Kitchen
metadata:
  labels:
    app.kubernetes.io/name: kitchen
    app.kubernetes.io/managed-by: kustomize
  # Only the singleton named "default" is reconciled.
  name: default
spec:
  # Generated URLs are <slug>.<baseDomain>; needs wildcard DNS.
  baseDomain: apps.example.com
  ingress:
    gatewayClassName: cilium
    cloudflared:
      enabled: false
  tls:
    mode: acme
  builds:
    defaultStrategy: auto
    concurrency: 2
    # What one build may take, reserved for it and capped at it. Times the
    # concurrency above, it is the whole of the platform's build footprint.
    resources:
      cpu: "2"
      memory: 4Gi
  observability:
    clickhouse:
      retentionDays: 30
