# This rule is not used by the project kitchen itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the kitchen.bermos.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kitchen
    app.kubernetes.io/managed-by: kustomize
  name: connection-editor-role
rules:
- apiGroups:
  - kitchen.bermos.dev
  resources:
  - connections
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kitchen.bermos.dev
  resources:
  - connections/status
  verbs:
  - get
