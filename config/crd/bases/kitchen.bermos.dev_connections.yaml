---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: connections.kitchen.bermos.dev
spec:
  group: kitchen.bermos.dev
  names:
    kind: Connection
    listKind: ConnectionList
    plural: connections
    singular: connection
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.provider
      name: Provider
      type: string
    - jsonPath: .status.conditions[?(@.type=="Connected")].status
      name: Connected
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Connection is the Schema for the connections API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ConnectionSpec defines a plugin instance: a link to an external system such
              as a git provider, an image registry, or a database provisioner.
            properties:
              config:
                description: Provider-specific configuration, validated by the plugin.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              credentialsSecretRef:
                description: |-
                  Secret holding the provider credentials (typically synced from
                  Infisical). Every provider outside ConnectionProvidersWithoutCredential
                  requires one; see CredentialsReference for why those do not.
                properties:
                  name:
                    type: string
                type: object
              provider:
                description: Provider selects the plugin implementation.
                enum:
                - github
                - gitlab
                - gitea
                - dockerRegistry
                - neon
                - cnpg
                - s3
                - inngest
                - valkey
                - redis
                type: string
            required:
            - provider
            type: object
            x-kubernetes-validations:
            - message: 'credentialsSecretRef is required: it names the Secret holding
                this provider''s credential. Only a provider that provisions into
                this cluster with the operator''s own account goes without one.'
              messageExpression: '''credentialsSecretRef is required: it names the
                Secret holding the credential of a '' + self.provider + '' connection.
                Only a provider that provisions into this cluster with the account
                the operator itself holds (cnpg) goes without one.'''
              rule: self.provider in ['cnpg', 'valkey'] || (has(self.credentialsSecretRef)
                && has(self.credentialsSecretRef.name) && size(self.credentialsSecretRef.name)
                > 0)
            - message: 'this provider takes no credentialsSecretRef: it provisions
                into this cluster with the operator''s own account, and a Secret here
                would name a credential nothing reads.'
              messageExpression: '''a '' + self.provider + '' connection takes no
                credentialsSecretRef: it provisions into this cluster with the account
                the operator itself holds, and a Secret here would name a credential
                nothing reads.'''
              rule: '!(self.provider in [''cnpg'', ''valkey'']) || !has(self.credentialsSecretRef)
                || !has(self.credentialsSecretRef.name) || size(self.credentialsSecretRef.name)
                == 0'
          status:
            description: ConnectionStatus defines the observed state of a Connection.
            properties:
              cache:
                description: |-
                  Cache is what a cache provider records about the server this
                  Connection reaches. Only the `redis` provider writes it: an external
                  server's logical databases are one finite pool shared by every claim
                  through the Connection, so which claim holds which has to be written
                  down somewhere both a later reconcile and every other claim can read.
                properties:
                  databases:
                    description: |-
                      Databases is every logical database of this server the platform has
                      handed out, and who holds it. It is the allocation itself and not a
                      report of one: a claim's database is read back from here on every
                      reconcile, which is what keeps it the same one.
                    items:
                      description: CacheDatabase is one logical database at an external
                        cache server.
                      properties:
                        database:
                          description: |-
                            Database is the logical database number, as the binding's URL selects
                            it (redis://host:6379/3).
                          minimum: 0
                          type: integer
                        holder:
                          description: |-
                            Holder is what holds it: the claim's own provider-side name, or
                            "<name>/<environment>" for one of its previews. Empty means the
                            database has been handed out before and given back — it can be handed
                            out again, and the platform cannot empty a server it does not run, so
                            one that has never been used is preferred to it.
                          type: string
                      required:
                      - database
                      type: object
                    type: array
                type: object
              capabilities:
                description: |-
                  Capabilities the provider implements. The operator matches on these,
                  never on provider names.
                items:
                  description: |-
                    Capability is an abstract feature a Connection provider implements. The
                    operator matches on capabilities, never on provider names.
                  enum:
                  - gitSource
                  - statusChecks
                  - imageStore
                  - database
                  - objectStore
                  - backgroundJobs
                  - cache
                  type: string
                type: array
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
