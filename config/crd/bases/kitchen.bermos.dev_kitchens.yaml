---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: kitchens.kitchen.bermos.dev
spec:
  group: kitchen.bermos.dev
  names:
    kind: Kitchen
    listKind: KitchenList
    plural: kitchens
    singular: kitchen
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.baseDomain
      name: BaseDomain
      type: string
    - jsonPath: .status.gatewayAddress
      name: Gateway
      type: string
    - jsonPath: .status.conditions[?(@.type=="ComponentsHealthy")].message
      name: Components
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Kitchen is the cluster-wide platform configuration singleton.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              KitchenSpec defines platform-wide configuration. There is exactly one
              Kitchen object per cluster; it is the operator's runtime configuration and
              is editable from the management UI.
            properties:
              access:
                description: |-
                  Access is who may do what with the platform itself. It belongs on this
                  object because this object is already the platform's configuration and
                  is already edited through PATCH /settings, so granting somebody the
                  operator hat needs no new store and no kubectl.

                  It deliberately carries no `+kubebuilder:default={}`, unlike the fields
                  above it. Those defaults exist so that an installation predating a
                  field still gets the feature; here the absence is the information. An
                  absent operator list means nobody has ever said who the operators are —
                  an installation upgrading into enforcement, where every account today
                  can call every route and so every account read honestly *is* an
                  operator, and the list is seeded from the accounts that exist. An empty
                  list means somebody narrowed it to nobody on purpose, and is left
                  exactly as it is. Defaulting the object into existence would collapse
                  those two into one on the first write, and the upgraded installation
                  would be locked out of its own platform by a minor version bump.
                properties:
                  operators:
                    description: |-
                      Operators own the platform: everything, everywhere, and project admin
                      on every project, present and future. Every other account is a member —
                      an ordinary account, with no platform surface at all, which sees what
                      project membership grants it and may create projects.

                      The entries name accounts the same way a Project's grants do, minus the
                      role: there is exactly one platform role worth writing down, and being
                      on this list is it.

                      The field carries no `omitempty`, unlike almost everything else in
                      these types, for the same reason spec.access carries no default: an
                      absent list and an empty one mean different things here. With
                      `omitempty` an empty list marshals away, so narrowing the operators to
                      nobody would be indistinguishable from never having named any — and
                      the reconciler would seed the list straight back from the accounts
                      that exist. Writers diff two marshalled objects (client.MergeFrom), so
                      a nil list on both sides is still no change to patch.
                    items:
                      description: |-
                        AccessSubject names the account an access entry is about.

                        The canonical subject is the issuer's `sub`, which is opaque: the dashboard
                        resolves an address to one when it writes an entry, and Email is carried
                        beside it only so that a list of opaque strings still reads. Hand-written
                        YAML may name an address in Subject instead, and the rule that tells the two
                        apart is deliberately blunt: **a subject containing `@` is read as an email
                        address**, matched case-insensitively (addresses are), and honoured only for
                        a token whose `email_verified` claim is true.

                        That last condition is the whole point. An unverified address is something
                        the token holder said about themselves, so an unverified-email grant is a
                        grant to whoever can get the identity provider to let them type that
                        address — it resolves to no role at all rather than to the one written down.

                        The rule has one corollary worth knowing: an issuer whose `sub` is itself an
                        address cannot be named by `sub` here, because that spelling is read as the
                        email it looks like. That is the conservative direction — it asks for a
                        verified address rather than trusting an opaque string that happens to
                        contain an `@`.
                      properties:
                        email:
                          description: |-
                            Email is informational: it is what makes a list of opaque subjects
                            readable in `kubectl get -o yaml` and in a git diff. Nothing resolves
                            against it — an entry that means to name an address puts the address in
                            Subject, and accepts the verified-email condition that comes with it.
                          type: string
                        subject:
                          description: |-
                            Subject is the issuer's `sub` for the account, or an email address. A
                            value containing `@` is treated as an address and resolves against the
                            token's `email` claim only when `email_verified` is true, because an
                            unverified-email grant is a grant to whoever can claim that address at
                            the identity provider.
                          minLength: 1
                          type: string
                      required:
                      - subject
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - subject
                    x-kubernetes-list-type: map
                type: object
              api:
                description: APISpec configures how the operator's API is exposed.
                properties:
                  externalURL:
                    description: |-
                      ExternalURL is the base URL the operator API (including the git
                      webhook receiver) is reachable at from outside the cluster.
                      Defaults to kitchen.<baseDomain>, under the scheme tls.mode serves:
                      https, or http when tls.mode is none.
                    type: string
                type: object
              appNamespaces:
                default: {}
                description: |-
                  AppNamespaces configures the namespaces the operator creates for
                  projects. The empty-object default is what gives an installation
                  predating the field the Pod Security level below: structural defaulting
                  only descends into objects that are present.
                properties:
                  podSecurity:
                    default: privileged
                    description: |-
                      PodSecurity is the Pod Security Standards level enforced on every
                      application namespace, written as the enforce, audit and warn labels
                      when the namespace is created and kept in step afterwards.

                      It is set rather than inherited for the same reason the platform
                      namespace's is: clusters disagree about the default (kind is
                      privileged, Talos is baseline), and the level decides whether the
                      Dockerfile build strategy works at all. Rootless BuildKit needs an
                      unconfined seccomp profile and an unconfined AppArmor profile, both of
                      which baseline forbids, and a Job whose pods Pod Security refuses
                      creates no pod at all — the build simply never starts.

                      Lower it to baseline on an installation that builds with buildpacks
                      alone: the lifecycle asks for neither relaxation.

                      It is deliberately not on the settings screen. Everything else the
                      dashboard can change here is a choice about the platform; this is a
                      fact about the cluster underneath it, decided once at install time
                      beside namespace.podSecurity — and lowering it from a browser would
                      stop every Dockerfile build in the installation with no failure the
                      person who did it would recognise.
                    enum:
                    - privileged
                    - baseline
                    - restricted
                    type: string
                type: object
              auth:
                default: {}
                description: |-
                  An installation with no auth block at all still has an identity
                  provider: the defaults inside it only apply once the object is there.
                properties:
                  databaseSecretRef:
                    description: |-
                      DatabaseSecretRef names the Secret in the platform namespace holding the
                      connection to the identity provider's own Postgres: the key dsn, or the
                      pieces host, port, database, username and password. The chart writes it
                      as <release>-postgres.

                      The identity provider is handed this connection by the chart and does not
                      need the operator to find it. What does is the backup: the accounts,
                      sessions and OAuth clients in that database are the one part of the
                      platform's state that deliberately does not live in a CRD
                      (docs/SCOPE.md item 9), so they are also the one part an export has to
                      reach into a database for, and a restore has to put back.

                      Left unset it is the conventional release name's, kitchen-postgres —
                      which is what gives an installation whose Kitchen object predates this
                      field a backup with its accounts in it rather than one that quietly
                      leaves them out.
                    properties:
                      name:
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  enabled:
                    default: true
                    description: |-
                      Whether the platform has an identity provider at all. Without one there
                      is no login for the UI and no issuer for apps to claim clients from.
                    type: boolean
                  host:
                    description: |-
                      Hostname the identity provider is served on, and therefore the OIDC
                      issuer — under the scheme tls.mode serves, so https://<host> unless
                      tls.mode is none. Defaults to auth.<baseDomain>.
                    type: string
                  previewGate:
                    default: {}
                    description: |-
                      PreviewGateSpec configures the forward-auth gate that protected preview
                      environments are served through: an in-path component that turns an
                      anonymous request into a platform login and only then proxies to the app.
                    properties:
                      enabled:
                        default: true
                        description: |-
                          Whether the platform runs a gate at all. A Project asking for protected
                          previews without one gets no route rather than a public one.
                        type: boolean
                      host:
                        description: |-
                          Hostname the gate serves its OAuth callback on. It is the only redirect
                          URI registered with the identity provider, which is what lets previews
                          come and go without touching the OAuth client.
                          Defaults to previews.<baseDomain>.
                        type: string
                      replicas:
                        default: 2
                        description: |-
                          Replicas of the gate. It is in the request path of every protected
                          preview, so it is worth more than one.
                        format: int32
                        minimum: 1
                        type: integer
                      sessionTTL:
                        default: 8h
                        description: |-
                          How long a visitor's session on a preview lasts before the gate sends
                          them back to the identity provider — which, if they are still signed in
                          there, costs them a redirect and no interaction.
                        type: string
                    type: object
                  secretRef:
                    description: |-
                      SecretRef names the Secret in the platform namespace holding the
                      operator's view of the identity provider: the keys issuer, serviceKey
                      and, optionally, internalURL — a cluster-internal address for the same
                      issuer, for clusters that cannot resolve their own base domain from the
                      inside — and directoryURL, where the operator alone reaches the private
                      /kitchen prefix, which is served on a listener no HTTPRoute publishes.
                      Both addresses fall back to the issuer when absent.
                      The chart writes it as <release>-auth. Without it the operator
                      cannot register OAuth clients, so nothing that depends on one — the
                      preview gate, later the oidcClient claims — can be reconciled.
                    properties:
                      name:
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                type: object
              backup:
                default: {}
                description: |-
                  Backup is the platform's own scheduled backup: when it runs, where the
                  archive goes, and how much of it is kept.

                  The empty-object default is what gives an installation predating the
                  field the run timeout: structural defaulting only descends into objects
                  that are present. It configures nothing on its own — an empty block has
                  no schedule, and no schedule is no CronJob.
                properties:
                  destination:
                    description: Destination is where archives are written.
                    properties:
                      s3:
                        description: S3Destination is a bucket at an S3-compatible
                          store.
                        properties:
                          bucket:
                            description: |-
                              Bucket archives are written into. It should be a bucket of its own:
                              see the retention note below, and docs/BACKUP.md on why this bucket is
                              the cluster's root credential store.
                            minLength: 1
                            type: string
                          credentialsSecretRef:
                            description: |-
                              CredentialsSecretRef names a Secret in the platform namespace holding
                              accessKeyId and secretAccessKey. It is written by
                              PUT /platform/backup/destination and never read back, like every other
                              credential this API stores.

                              Absent means the ambient credential chain — IRSA, EKS Pod Identity, an
                              instance role — which is the better answer where it is available,
                              because there is then no long-lived key anywhere to leak.
                            properties:
                              name:
                                minLength: 1
                                type: string
                            required:
                            - name
                            type: object
                          endpoint:
                            description: |-
                              Endpoint overrides AWS. This is what makes MinIO, R2, Backblaze,
                              Wasabi, Ceph and Garage the same code path rather than five backends.
                            type: string
                          forcePathStyle:
                            description: |-
                              ForcePathStyle addresses the bucket as <endpoint>/<bucket> rather than
                              <bucket>.<endpoint>. Every store that is reached by IP address or by a
                              name with no wildcard certificate behind it needs this — MinIO in a
                              cluster is the usual one.
                            type: boolean
                          kmsKeyId:
                            description: KMSKeyID names the key when the encryption
                              is aws:kms.
                            type: string
                          prefix:
                            description: |-
                              Prefix is the key prefix inside the bucket. Pruning only ever considers
                              objects under it that are named like an archive this platform wrote, so
                              a bucket somebody also keeps other things in does not lose them.
                            type: string
                          region:
                            description: |-
                              Region the bucket is in. Most S3-compatible stores want one even where
                              it means nothing; us-east-1 is the conventional answer for those.
                            type: string
                          serverSideEncryption:
                            description: |-
                              ServerSideEncryption asks the store to encrypt the object at rest:
                              "AES256" or "aws:kms". The archive is every credential the platform
                              holds, so a store that can encrypt it should be told to.
                            enum:
                            - AES256
                            - aws:kms
                            type: string
                        required:
                        - bucket
                        type: object
                      type:
                        description: |-
                          Type is the kind of store. The enum lives on BackupDestinationType
                          itself, so it is not repeated here.
                        enum:
                        - s3
                        type: string
                    required:
                    - type
                    type: object
                    x-kubernetes-validations:
                    - message: 'spec.backup.destination.s3 is required when the destination
                        type is s3: it names the bucket archives are written to.'
                      rule: self.type != 's3' || has(self.s3)
                    - message: an s3 block belongs to a destination of type s3 alone.
                      rule: self.type == 's3' || !has(self.s3)
                  retention:
                    description: |-
                      Retention is how many archives the destination keeps. Left empty,
                      nothing is ever pruned, which is the safe default: an archive costs
                      pennies and the failure this feature exists to prevent is having too
                      few of them.
                    properties:
                      keepDays:
                        description: KeepDays deletes archives older than this many
                          days.
                        format: int32
                        minimum: 1
                        type: integer
                      keepLast:
                        description: KeepLast is how many of the newest archives survive
                          a prune.
                        format: int32
                        minimum: 1
                        type: integer
                    type: object
                  schedule:
                    description: |-
                      Schedule is a five-field cron expression, in UTC — as every schedule on
                      this platform is, and worth saying out loud on a platform that already
                      measures node clock drift. Empty means no scheduled backup, which is
                      what an installation that predates this field keeps having.

                      A quiet hour is the right answer: the accounts half of an archive is
                      taken through the identity provider's database, and a dump competing
                      with sign-ins helps nobody.
                    type: string
                  suspend:
                    description: |-
                      Suspend pauses the schedule without losing it — the answer to "we are
                      doing maintenance" that is not "delete the configuration and hope
                      somebody puts it back".
                    type: boolean
                  timeout:
                    default: 30m
                    description: |-
                      Timeout bounds one run: the export, the upload, the read-back and the
                      prune together.
                    type: string
                type: object
                x-kubernetes-validations:
                - message: 'spec.backup.destination is required when a schedule is
                    set: an archive written to a volume on this cluster does not survive
                    the loss of this cluster, so there is deliberately no local destination.
                    Configure a destination, or clear the schedule.'
                  rule: '!has(self.schedule) || size(self.schedule) == 0 || has(self.destination)'
                - message: 'spec.backup.retention needs a destination to apply to:
                    retention prunes what is at the destination, and with no destination
                    it overrides nothing.'
                  rule: '!has(self.retention) || (!has(self.retention.keepLast) &&
                    !has(self.retention.keepDays)) || has(self.destination)'
              baseDomain:
                description: |-
                  Base domain for generated URLs: <slug>.<baseDomain>. Requires wildcard
                  DNS (and wildcard TLS unless cloudflared is enabled).
                minLength: 1
                type: string
              builds:
                description: BuildsSpec configures platform-wide build defaults.
                properties:
                  cache:
                    default: {}
                    description: |-
                      Cache is the layer cache builds reuse between runs.

                      The empty-object default is what gives an installation that predates
                      the field a cache at all: structural defaulting only descends into
                      objects that are present.
                    properties:
                      enabled:
                        default: true
                        description: |-
                          Enabled builds against the layer cache. Off means every build starts
                          from nothing, which is slower and the only way to be certain a build
                          reused nothing at all.
                        type: boolean
                      mode:
                        default: max
                        description: |-
                          Mode is how much of a BuildKit build is cached. It does not reach the
                          buildpacks lifecycle, which has one cache image and no such choice.
                        enum:
                        - max
                        - min
                        type: string
                      scope:
                        default: project
                        description: Scope is what two builds have to share to reuse
                          each other's layers.
                        enum:
                        - project
                        - branch
                        type: string
                    type: object
                  concurrency:
                    default: 2
                    description: |-
                      Maximum number of builds running at once.

                      It is half of what the platform's builds can take from the cluster;
                      Resources is the other half, and the two are read together.
                    format: int32
                    minimum: 1
                    type: integer
                  defaultStrategy:
                    default: auto
                    description: BuildStrategy selects how an image is produced from
                      a repository.
                    enum:
                    - auto
                    - dockerfile
                    - buildpacks
                    type: string
                  imagePollInterval:
                    default: 10m
                    description: |-
                      ImagePollInterval is how often the platform asks whether a watched tag
                      has moved (#308).

                      A project whose software this platform did not build has no push to
                      react to: what corresponds to one is a new digest under the tag it
                      follows, and nothing would ever notice that without asking. So the
                      platform asks, and this is how often — one registry manifest HEAD per
                      watched reference, never a pull, so the cost of the question is a
                      request and a few hundred bytes rather than an image.

                      Ten minutes is the default because that is well inside how quickly
                      anybody expects a vendored update to arrive and far outside anything a
                      registry would call traffic. A reference pinned to a digest is not
                      polled at all, whatever this says: pinning is how a project opts out.

                      `0` turns the poll off entirely, which is the installation that would
                      rather move a vendored image by hand — through the acquire route or by
                      changing the project — than have the platform move it. It is a
                      pointer for the reason BuildsSpec.TimeoutMinutes is one: that zero is
                      a setting, and a duration serialized as an absent field would have the
                      default applied back over it.
                    type: string
                  releaseRetention:
                    default: 10
                    description: |-
                      ReleaseRetention is how many Releases each Project keeps. Every
                      successful build leaves one behind, so without a bound a busy project
                      accumulates them — and the images they point at — forever.

                      It is a build setting because a Release is what a build leaves behind.
                      The count is per Project, and a Release an Environment references is
                      never deleted however old it is: the newest ReleaseRetention are kept,
                      and anything still serving is kept on top of them, so rollback targets
                      do not vanish out from under a parked environment.

                      0 keeps every Release forever.
                    format: int32
                    minimum: 0
                    type: integer
                  resources:
                    default: {}
                    description: |-
                      Resources is the ceiling one build may take.

                      Concurrency times this is the whole of the platform's build footprint,
                      which is why the two are one decision rather than two settings that
                      happen to be near each other.

                      The empty-object default is what gives an installation that predates
                      the field a ceiling at all: structural defaulting only descends into
                      objects that are present.
                    properties:
                      cpu:
                        default: "2"
                        description: |-
                          CPU one build may take, as a Kubernetes quantity ("2", "500m").

                          CPU is compressible — a build that wants more is throttled, never
                          killed — so this bounds how much of the node a build can crowd out
                          rather than whether it finishes.
                        pattern: ^$|^[0-9]+(\.[0-9]+)?(m|k|M|G|T|P|E|Ki|Mi|Gi|Ti|Pi|Ei)?$
                        type: string
                      memory:
                        default: 4Gi
                        description: |-
                          Memory one build may take, as a Kubernetes quantity ("4Gi", "512Mi").

                          Memory is not compressible: a build that asks for more than this is
                          killed by the kernel, and the platform reports that as a build failure
                          naming the ceiling rather than as an unexplained non-zero exit. Four
                          gibibytes is past where a front-end build of any size peaks and well
                          short of what a single-node cluster can lose without noticing.
                        pattern: ^$|^[0-9]+(\.[0-9]+)?(m|k|M|G|T|P|E|Ki|Mi|Gi|Ti|Pi|Ei)?$
                        type: string
                    type: object
                  timeoutMinutes:
                    default: 60
                    description: |-
                      TimeoutMinutes is the longest one build may run before the platform
                      ends it. It is the ceiling in time that Resources is in capacity, and
                      it exists for the same reason the job needs an end at all: a build
                      that hangs where the reconciler cannot see it — a builder waiting on a
                      registry that never answers — otherwise occupies a build slot forever.

                      An hour is far past anything this platform is meant to build, which is
                      the point: it is a backstop, not a time budget. It is a setting because
                      "meant to" was doing the work in that sentence — a cold-cache monorepo,
                      a Rust workspace or a buildpacks build on a small node can legitimately
                      take longer, and an installation that knows that has to be able to say
                      so.

                      0 is no deadline at all, which is the installation that would rather
                      end a runaway build by hand than lose an hour's work to a number.

                      It is a pointer because that zero is a setting: an int32 with
                      `omitempty` serializes 0 as an absent field, so the default would be
                      applied back over it and clearing the deadline would be unsayable —
                      through a merge patch it would arrive as a deletion. Unset is the
                      default, which is also what an installation that predates the field
                      gets.

                      It reaches a build as the Job's activeDeadlineSeconds, which is
                      immutable once a Job exists: changing this affects builds started
                      after the change, never the one in flight.
                    format: int32
                    minimum: 0
                    type: integer
                type: object
              clusterName:
                description: |-
                  ClusterName is what this cluster is called in the dashboard's status
                  bar. Kitchen owns the cluster it is installed into, so this names the
                  installation as much as the machines: it is what someone with a staging
                  platform and a production one reads to tell which is on screen.
                  Defaults to the first label of the base domain.
                type: string
              compliance:
                description: |-
                  Compliance configures the evidence the platform produces about its own
                  operation: the audit log and the attestations attached to artifacts.
                properties:
                  access:
                    default: {}
                    description: |-
                      Access is the recertification cadence, the orphaned-identity window
                      and the out-of-band write detection. It lives here rather than
                      anywhere else for the reason everything here does: a team that decided
                      how often its own access was reviewed would not be reviewed.
                    properties:
                      detectOutOfBandWrites:
                        default: true
                        description: |-
                          DetectOutOfBandWrites watches Kitchen's own objects for changes no
                          reconcile and no API call made — somebody with cluster access editing
                          a Project, an Environment's requirements or the operator list
                          directly.

                          It is detection and never prevention: anybody holding cluster-admin can
                          do all of it, and Kitchen's answer is to notice and say so loudly
                          rather than to pretend it can refuse. See docs/COMPLIANCE.md §11.4 for
                          what the mechanism sees and what it cannot.
                        type: boolean
                      dueDays:
                        default: 14
                        description: DueDays is how long a cycle has from opening
                          before it is Overdue.
                        format: int32
                        minimum: 1
                        type: integer
                      enabled:
                        default: true
                        description: |-
                          Enabled runs the cadence, the orphan survey and the detection. Off
                          leaves the routes answering and the register readable — a cycle
                          somebody opens by hand still works — and stops the platform opening
                          cycles or watching its own objects on its own.
                        type: boolean
                      expectedManagers:
                        description: |-
                          ExpectedManagers are Kubernetes field-manager names whose writes to
                          Kitchen's objects are not out of band, in addition to the platform's
                          own and Helm's.

                          It exists because a real cluster has legitimate writers Kitchen has
                          never heard of — a GitOps controller applying the singleton, a policy
                          mutating webhook, a backup tool restoring. Naming them is the operator
                          saying "this one is expected", which is a decision on the record rather
                          than an alert everybody learns to ignore. Matched exactly.
                        items:
                          type: string
                        type: array
                        x-kubernetes-list-type: atomic
                      inactivityDays:
                        default: 90
                        description: |-
                          InactivityDays is how long without a recorded action makes an identity
                          dormant. Ninety days matches the review cadence on purpose: an account
                          that did nothing between two reviews is exactly the one a reviewer
                          should be asked about.

                          Read it knowing what the log holds. The audit log records *writes*, so
                          an account that only ever reads — opens the dashboard, follows logs,
                          looks at a build — is dormant by this measure and is not dormant in
                          fact. That is the honest limit of the evidence, and it is why dormancy
                          alone is not an orphan.
                        format: int32
                        minimum: 1
                        type: integer
                      intervalDays:
                        default: 90
                        description: |-
                          IntervalDays is how often a cycle opens: counted from the last cycle's
                          close, so an installation that recertifies late does not immediately
                          owe two.

                          Ninety days is the default because it is what a quarterly control cycle
                          means in practice, and the floor is 7 rather than 1 because a
                          recertification nobody has time to finish before the next one opens is
                          a queue rather than a control. Zero opens no cycle at all: the cadence
                          is off, the surface stays, and an operator opens one when they need
                          one.
                        format: int32
                        maximum: 3650
                        minimum: 0
                        type: integer
                    type: object
                  attestation:
                    description: Attestation is the signed evidence attached to built
                      artifacts.
                    properties:
                      build:
                        description: |-
                          Build asks the builder itself for provenance and a bill of materials,
                          which are claims the reconciler cannot make on its own.
                        properties:
                          provenance:
                            default: true
                            description: |-
                              Provenance asks the builder how the artifact was produced: the source
                              commit it resolved, the base images it pulled and their digests, and
                              the parameters it was invoked with.

                              This is SLSA provenance, and it is a different and stronger claim than
                              Kitchen's own build record: it is made by the process that did the
                              work rather than by the one that asked for it.
                            type: boolean
                          sbom:
                            default: true
                            description: SBOM asks the builder for a bill of materials
                              for the finished image.
                            type: boolean
                          sbomGenerator:
                            description: |-
                              SBOMGenerator is the scanner image the builder runs to produce it.

                              The **format follows the generator**, and the platform records what
                              came out rather than converting it: the default emits SPDX 2.3, which
                              Grype, Trivy and OSV-Scanner all read unmodified, and a generator that
                              emits CycloneDX produces a CycloneDX attestation whose predicate type
                              says so. Kitchen does not transcode between them — a bill of materials
                              rewritten by something that did not scan the image is a claim by the
                              transcoder.

                              Left unset the operator uses a pinned default. Pinning matters here
                              more than it looks: the tag the ecosystem points at is a floating one,
                              and a build's evidence should not change because an image someone else
                              owns moved overnight.
                            type: string
                        type: object
                      enabled:
                        default: true
                        description: |-
                          Enabled signs an attestation for every artifact the platform builds
                          and attaches it to the artifact's digest.
                        type: boolean
                      signingKeyRef:
                        description: |-
                          SigningKeyRef names the Secret in the platform namespace holding the
                          key attestations are signed with: the keys `tls.key` and `tls.crt`
                          spelling are deliberately not used — it is `private.pem` and
                          `public.pem`, an ECDSA P-256 keypair in PKCS#8 and PKIX PEM.

                          Left unset the operator generates one once, into
                          `kitchen-attestation-key`, and keeps it across upgrades. Supplying one
                          is how an installation whose key custody rules forbid a key the
                          platform generated brings its own.
                        properties:
                          name:
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                      vendored:
                        description: |-
                          Vendored is the evidence produced about artifacts the platform did not
                          build (#309), which is a different question from Build in every
                          respect: there is no builder to ask.
                        properties:
                          sbom:
                            default: true
                            description: |-
                              SBOM generates a bill of materials over a vendored digest **where the
                              vendor published none**, and attests it as the platform's own
                              observation rather than as the vendor's claim.

                              It never replaces a vendor's own: a bill of materials the publisher
                              stands behind is the better evidence, and a generated one beside it
                              would be a second answer to one question. It is on by default because
                              an artifact with no bill of materials cannot be rescanned at all — the
                              continuous re-evaluation pass matches an SBOM against today's
                              vulnerability database, so an artifact without one is one nobody ever
                              looks inside again.
                            type: boolean
                          sbomGenerator:
                            description: |-
                              SBOMGenerator is the image that produces it: a scanner pointed at the
                              artifact, writing SPDX or CycloneDX to a file. It is **not** the
                              builder-side generator above — that one speaks BuildKit's scanner
                              protocol and runs inside a build, and this one is an ordinary
                              container run over a digest — which is why it is its own setting
                              rather than a reuse of one word for two tools.

                              Empty uses a pinned default, pinned for the reason the other one is:
                              evidence about an artifact should not change because somebody else's
                              tag moved overnight.
                            type: string
                          timeoutSeconds:
                            default: 1800
                            description: |-
                              TimeoutSeconds bounds one generation. A vendored image can be large
                              and the pod pulls all of it, so this is generous by default; a run
                              that overruns is recorded as a generation that did not happen, which
                              is a different fact from an artifact with no bill of materials to
                              generate one from.
                            format: int32
                            minimum: 60
                            type: integer
                        type: object
                    type: object
                  audit:
                    description: Audit is the tamper-evident log of state transitions.
                    properties:
                      enabled:
                        default: true
                        description: |-
                          Enabled records every state transition the platform makes.

                          Off is a deliberate choice with a consequence worth stating: the
                          decisions the rest of the compliance suite produces still happen, they
                          just leave nothing behind that can be shown to anyone.
                        type: boolean
                      retentionDays:
                        default: 365
                        description: |-
                          RetentionDays is how long audit records are kept.

                          The floor is 90 days and it is not a rounded-up guess: the incident
                          reporting duty the log exists to serve runs from when an institution
                          became aware, which can be well after the transition that caused it,
                          and a log that has already aged out cannot substantiate the report.
                          Installations under a records-retention obligation will want years
                          rather than months — the ceiling is disk.
                        format: int32
                        minimum: 90
                        type: integer
                    type: object
                  exceptions:
                    default: {}
                    description: |-
                      Exceptions configures break-glass exceptions: the escalation ladder
                      deciding who may approve a waiver of a given duration. The default
                      `{}` keeps an upgraded singleton reading the same as a fresh one; the
                      compiled-in ladder applies while nothing is configured.
                    properties:
                      ladder:
                        description: |-
                          Ladder maps requested duration to the approver role it takes,
                          evaluated shortest rung first. A duration beyond every rung always
                          needs a platform operator. Empty uses the compiled-in default:
                          up to 24h needs developer, up to 720h (30 days) needs admin, and
                          anything longer needs an operator.
                        items:
                          description: |-
                            ExceptionTier is one rung of the escalation ladder: grants up to
                            MaxDuration need an approver holding at least Role.
                          properties:
                            maxDuration:
                              description: MaxDuration is the longest grant this rung
                                covers, e.g. "24h".
                              type: string
                            role:
                              description: |-
                                Role is the least role the approver must hold: developer or admin on
                                the project, or operator on the platform.
                              enum:
                              - developer
                              - admin
                              - operator
                              type: string
                          required:
                          - maxDuration
                          - role
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                    type: object
                  gates:
                    description: |-
                      Gates are the quality gates run over every artifact the platform
                      builds. They live here, on the operator's own object, and not on a
                      Project: a team that chose which scanners ran over its own code would
                      be marking its own homework.
                    items:
                      description: |-
                        QualityGateSpec is one gate the platform runs over every artifact it builds.

                        A gate is a pod: an image somebody else wrote, pointed at the artifact, that
                        writes what it found to a file. Kitchen contributes the artifact reference,
                        the credential to pull it with, and a signature over the result — and
                        nothing else. That is what makes adding a gate a change to this list rather
                        than a change to every application repository.

                        **A gate records findings and never a verdict.** Whether a finding is
                        disqualifying is a policy question about the environment being deployed to,
                        and putting the answer here would fix it platform-wide at the moment of
                        scanning — which is precisely what makes the same scan unable to be
                        acceptable in staging and blocking in production.
                      properties:
                        args:
                          description: |-
                            Args are passed to the image. Kubernetes' own `$(VAR)` expansion
                            applies, so a gate names the artifact as `$(KITCHEN_ARTIFACT)` rather
                            than through any templating of Kitchen's — along with
                            `$(KITCHEN_FINDINGS)` for where to write, and `$(KITCHEN_PROJECT)`,
                            `$(KITCHEN_BUILD)` and `$(KITCHEN_COMMIT)` for what is being scanned.
                          items:
                            type: string
                          type: array
                        disabled:
                          description: |-
                            Disabled stops the gate running without removing it, so that turning
                            one off is a visible line in the configuration rather than a deletion
                            nobody can date.
                          type: boolean
                        format:
                          description: |-
                            Format names the shape of what the gate writes, recorded alongside the
                            findings so a reader knows how to parse them. It is informational:
                            nothing here validates it, because a gate that lied about its format
                            would still have produced whatever it produced.
                          type: string
                        image:
                          description: |-
                            Image is the runner. It is run as an unprivileged user with no access
                            to the cluster, and the only thing it is given is the artifact and the
                            credential to pull it.
                          minLength: 1
                          type: string
                        name:
                          description: |-
                            Name identifies the gate in its attestation and on the Build. It has to
                            be stable: a policy that requires "trivy" to have run is matching on
                            this, and renaming a gate silently invalidates every artifact that
                            carries the old name.
                          maxLength: 40
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        timeoutSeconds:
                          default: 900
                          description: |-
                            TimeoutSeconds bounds one run. A gate that hangs must not hold up the
                            evidence the other gates produced.
                          format: int32
                          minimum: 30
                          type: integer
                        version:
                          description: |-
                            Version is what the gate's own version is recorded as in the
                            attestation. A finding is only reproducible against the version that
                            produced it, and the image tag is not always the answer — a scanner
                            whose vulnerability database updates hourly is a different gate every
                            hour under the same tag.
                          type: string
                      required:
                      - image
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  machineIdentities:
                    description: |-
                      MachineIdentities are accounts whose commits are exempt from a
                      project's pull request requirement.

                      The list exists because the requirement is otherwise unsatisfiable by
                      the automation every repository has. Renovate opens and merges its own
                      dependency bumps; release-please merges its own release commits; this
                      repository's release automation would fail the check on day one. None
                      of them will ever have an independent reviewer, and the realistic
                      alternative to naming them here is somebody turning the requirement off
                      altogether.

                      Naming them is what makes the exemption **auditable**: every use of it
                      is an audit record saying which identity was exempted for which commit,
                      so "who is allowed to bypass review" is a question with a written
                      answer and a history, rather than a property of whoever last edited a
                      pipeline. They are the operator's list, not a project's, for the same
                      reason: a team that could add its own service account to its own
                      exemption list has no requirement at all.

                      Entries are provider usernames, matched case-insensitively and exactly
                      — no patterns. A glob here would eventually exempt more than whoever
                      wrote it meant, and an exemption that surprises its author is the one
                      kind this must not have.
                    items:
                      type: string
                    type: array
                  rescan:
                    description: |-
                      Rescan is the continuous re-evaluation pass: what turns the promotion
                      gate into an ongoing control. It lives here for the same reason Gates
                      does — a team that chose how often its own running release was checked
                      against today's vulnerability database would be marking its own
                      homework, on a slower schedule.
                    properties:
                      concurrency:
                        default: 4
                        description: |-
                          Concurrency bounds how many scans are in flight at once, across the
                          whole platform.

                          It is here because the first sweep after an upgrade has every
                          environment due at the same instant: two hundred environments would be
                          two hundred image pulls into two hundred namespaces, which is a denial
                          of service the platform performed on itself. Four at a time finishes a
                          two-hundred-environment install inside an hour and is invisible while
                          it does.
                        format: int32
                        maximum: 64
                        minimum: 1
                        type: integer
                      enabled:
                        default: false
                        description: |-
                          Enabled walks every deployed release on Interval.

                          Off by default, because it costs a scanner pod per environment per
                          interval in the application's own namespace, and an installation should
                          turn that on knowing it. Off does not mean the question goes unasked —
                          it means nobody is asking it, which is a state
                          `GET /api/v1/compliance/drift` reports rather than hides.
                        type: boolean
                      interval:
                        default: 24h
                        description: |-
                          Interval is how often each deployed release is re-evaluated.

                          Daily is the default because vulnerability databases move daily; the
                          floor is an hour, which is already far below the rate at which the
                          answer can change. The interval is per (environment, release) pair and
                          counted from the last scan that finished, so a sweep spreads itself out
                          instead of firing every environment at the same minute forever.
                        type: string
                      scanner:
                        description: |-
                          Scanner is the matcher run over each artifact's bill of materials.
                          Absent, the pass is enabled and inert, and says so.
                        properties:
                          args:
                            description: |-
                              Args are passed to the image. Kubernetes' own `$(VAR)` expansion
                              applies, exactly as it does for a gate, so the scanner names its inputs
                              as `$(KITCHEN_SBOM)` and `$(KITCHEN_FINDINGS)` — and, where it can say
                              so, `$(KITCHEN_DATA_SNAPSHOT)` for the file it writes its vulnerability
                              database's identifier to.

                              Nothing from an API request ever reaches this list: it is the platform
                              operator's configuration, read off the singleton, and the pod is
                              assembled from it and from the artifact reference alone.
                            items:
                              type: string
                            type: array
                          format:
                            description: |-
                              Format names the shape of what the scanner writes, so the operator
                              knows how to read a finding out of it: `grype-json`, `trivy-json` or
                              `osv-json` are understood, and anything else is carried verbatim and
                              normalized on a best-effort basis. The raw report is signed either way
                              — the normalized list is the platform's reading of it, never a
                              replacement for it.
                            type: string
                          image:
                            description: |-
                              Image is the matcher. It is run as an unprivileged user with no access
                              to the cluster and no service account token; what it is given is the
                              bill of materials on a volume and a file to write its findings to.
                            minLength: 1
                            type: string
                          name:
                            default: scanner
                            description: |-
                              Name identifies the scanner in its attestation, the way a gate's name
                              does. It has to be stable: a decision that cites a scan cites this.
                            maxLength: 40
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                            type: string
                          timeoutSeconds:
                            default: 900
                            description: |-
                              TimeoutSeconds bounds one scan. A scanner that hangs must not hold a
                              place in the sweep's concurrency budget forever.
                            format: int32
                            minimum: 30
                            type: integer
                          version:
                            description: |-
                              Version is what the scanner's own version is recorded as. It is not the
                              same claim as the data snapshot and does not replace it: the binary and
                              the database it matches against move on different schedules, and a
                              finding is only reproducible against both.
                            type: string
                        required:
                        - image
                        type: object
                    type: object
                  vex:
                    default: {}
                    description: |-
                      VEX is what the platform will admit as an exploitability assertion:
                      the OpenVEX documents that can stop a finding disqualifying an
                      artifact. It lives here for the same reason Gates and Rescan do.
                    properties:
                      enabled:
                        default: true
                        description: |-
                          Enabled admits OpenVEX documents through POST /builds/{name}/vex.

                          Off is a defensible position and not a broken one: an installation that
                          wants every finding to count, or that has not decided who may assert
                          otherwise, turns it off and gets a refusal at ingest naming this field.
                          Documents already attached stay attached and stay readable — evidence
                          is never retracted by a setting — and whether they suppress anything is
                          still the environment's bundle's question.
                        type: boolean
                      trustedAuthors:
                        description: |-
                          TrustedAuthors, when non-empty, is the closed list of document authors
                          the platform will sign and attach anything for. A document whose author
                          is not on it is refused at ingest, naming the list.

                          Empty means the platform admits any authenticated caller's document and
                          the attribution is the control — which is the right default for an
                          installation that has not yet decided, and the wrong one for an
                          installation that has. Matching is exact and case-insensitive, with no
                          patterns, for the same reason MachineIdentities has none: a glob here
                          would eventually admit more than whoever wrote it meant.
                        items:
                          type: string
                        type: array
                        x-kubernetes-list-type: atomic
                    type: object
                type: object
              databases:
                default: {}
                description: |-
                  Databases configures the platform's own Postgres — where provisioned
                  databases live, and whether the operator installs CloudNativePG itself.
                  The empty-object default is what gives an installation predating the
                  field the namespace defaults: structural defaulting only descends into
                  objects that are present.
                properties:
                  namespace:
                    default: kitchen-databases
                    description: |-
                      Namespace is where the provisioned database Clusters are created. It is
                      deliberately not a project's application namespace: deleting a project
                      deletes that namespace, and a claim under `deletionPolicy: Retain` has
                      to survive exactly that.
                    type: string
                type: object
              ingress:
                description: IngressSpec configures how traffic enters the cluster.
                properties:
                  cloudflared:
                    description: CloudflaredSpec configures the optional cloudflared
                      tunnel fronting the Gateway.
                    properties:
                      enabled:
                        default: false
                        type: boolean
                      tunnelSecretRef:
                        description: Secret holding the tunnel credentials.
                        properties:
                          name:
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                    type: object
                  gatewayClassName:
                    default: cilium
                    description: |-
                      GatewayClass used for the shared Gateway. Cilium's Gateway API
                      implementation is the expected default.
                    type: string
                  publicAddresses:
                    description: |-
                      PublicAddresses are the addresses the internet reaches this platform on,
                      where they are not the Gateway's own.

                      The Gateway is programmed with whatever its LoadBalancer implementation
                      assigned it, and on bare metal that is routinely a private address: a
                      router forwards :80 and :443 from 85.195.238.240 to the Gateway at
                      10.0.10.240, and both of those are correct. Nothing inside the cluster
                      can see the outside of that translation, so this is where it is written
                      down.

                      It is what a published name is compared against — the `dns.mismatch`
                      signal — and it exists for no other reason. Left empty with a private
                      Gateway address, the platform does not know what its own records ought
                      to say and declines to guess: a name that resolves nowhere is still a
                      finding, a name that resolves somewhere is not compared.

                      Addresses, not hostnames: it is the answer a lookup should give.
                    items:
                      type: string
                    type: array
                type: object
              objectStore:
                default: {}
                description: |-
                  ObjectStore configures the platform's own S3-compatible store, and
                  the Connection the operator seeds to point at it. Off by default.
                properties:
                  enabled:
                    description: |-
                      Enabled seeds the Connection that points at the bundled store. Off —
                      the default — means an installation brings its own S3-compatible
                      store, which is an s3 Connection someone creates. The chart renders
                      the store itself only when its own objectStore.enabled is set.
                    type: boolean
                  port:
                    default: 9000
                    description: Port the store's Service publishes.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  region:
                    default: us-east-1
                    description: |-
                      Region the store reports for its buckets. It is a formality an S3
                      client insists on; the bundled store is told the same value.
                    type: string
                  secretRef:
                    description: |-
                      SecretRef names the Secret in the platform namespace holding the
                      store's root credential: the keys accessKeyId and secretAccessKey. The
                      chart writes it as <release>-objectstore, generating the secret once
                      and keeping it across upgrades. It is what the operator copies into the
                      seeded Connection's credential, and what mints every claim's own.

                      Left unset it is the conventional release name's, kitchen-objectstore.
                    properties:
                      name:
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  service:
                    description: |-
                      Service in the platform namespace the store answers on. The chart
                      writes it as <release>-objectstore.
                    type: string
                type: object
              observability:
                description: ObservabilitySpec configures the telemetry pipeline.
                properties:
                  clickhouse:
                    description: ClickHouseSpec configures the telemetry store.
                    properties:
                      retentionDays:
                        default: 30
                        description: Days to retain logs, metrics, traces and flow
                          data.
                        format: int32
                        minimum: 1
                        type: integer
                      secretRef:
                        description: |-
                          SecretRef names the Secret in the platform namespace holding the
                          connection details for the store: the keys host, httpPort, database,
                          username and password. The chart writes it as
                          <release>-clickhouse, whether it runs ClickHouse itself or points at
                          an external one. Without it the operator manages no telemetry schema
                          and the collectors have nowhere to ship to.
                        properties:
                          name:
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                    type: object
                  clockSync:
                    default: {}
                    description: |-
                      ClockSync measures how far the cluster's clocks are from the
                      operator's own, because every timestamp in the store is only worth
                      what the clock that stamped it is worth. The empty-object default is
                      what turns it on for an installation that predates the field, for the
                      reason spelled out above Metrics.
                    properties:
                      enabled:
                        default: true
                        description: |-
                          Enabled measures node clock drift on every platform reconcile.

                          The empty-object default on the block above is what turns it on for an
                          installation that predates it; this pointer is what lets somebody turn
                          it off again, on a cluster whose kubelets renew their leases so
                          slowly that the measurement says nothing useful.
                        type: boolean
                      maxDriftSeconds:
                        default: 5
                        description: |-
                          MaxDriftSeconds is how far a node's clock may be from the operator's
                          before the survey calls the check unhealthy.

                          Five seconds is the default and it is chosen against the *use*, not
                          against NTP's accuracy: a correlation in an incident report is built
                          from log lines, a request trace and an audit record that were stamped
                          on three different machines, and five seconds is roughly where "these
                          happened in this order" stops being safe to say. A properly
                          synchronised cluster sits three orders of magnitude inside it, so a
                          breach means time sync is broken rather than merely imprecise.
                        format: int32
                        maximum: 3600
                        minimum: 1
                        type: integer
                    type: object
                  hubble:
                    description: |-
                      HubbleSpec configures the network flow pipeline. Cilium is the platform's
                      CNI (a prerequisite, not something Kitchen installs), and Hubble Relay is
                      its cluster-wide flow API; when an address is given, the operator follows
                      it and ships flow observations into the telemetry store, which is what the
                      dashboard's traffic view draws.
                    properties:
                      relayAddress:
                        description: |-
                          RelayAddress is the host:port of Hubble Relay's gRPC endpoint,
                          typically "hubble-relay.kube-system.svc.cluster.local:80" once Hubble
                          is enabled in Cilium. Empty means no flow collection — the traffic
                          view stays empty and says why.
                        type: string
                    type: object
                  metrics:
                    default: {}
                    description: |-
                      The empty-object defaults are what make these on by default for an
                      installation that predates them. Structural defaulting only descends
                      into objects that are present, so without one an upgraded Kitchen —
                      whose singleton the chart does not re-apply — would read back with
                      every field at its zero value, and the platform would quietly stop
                      collecting what it had just learned to collect.
                    properties:
                      enabled:
                        default: true
                        description: |-
                          Enabled turns the sampler on. Off means restarts, limits and replica
                          counts go uncollected; the collector's own CPU and memory are
                          unaffected.
                        type: boolean
                      intervalSeconds:
                        default: 30
                        description: |-
                          IntervalSeconds between samples of every application container.
                          Below the default the row count climbs faster than the answers
                          improve; above about a minute a short-lived spike falls between two
                          samples and is never seen at all.
                        format: int32
                        maximum: 300
                        minimum: 10
                        type: integer
                    type: object
                  traces:
                    default: {}
                    description: |-
                      TracesSpec configures where applications send their spans.

                      Traces come from the applications themselves: an application that is not
                      instrumented has no spans to send, and nothing the platform can see from
                      outside it — not Hubble's L7 data, not the Gateway's access logs — is a
                      substitute. What the platform does is remove every other obstacle: the
                      collector's OTLP endpoint is always there, and every environment is told
                      where it is.

                      The endpoint is also where the operator exports the metrics it samples, so
                      switching this off leaves the collector receiving nothing at all.
                    properties:
                      enabled:
                        default: true
                        description: |-
                          Enabled advertises the endpoint to applications, through the OTLP
                          environment variables every SDK reads. The collector receives either
                          way; off means applications are not told where to send.
                        type: boolean
                      endpoint:
                        default: http://kitchen-otlp.kitchen-system.svc.cluster.local:4318
                        description: |-
                          Endpoint is the OTLP/HTTP base URL applications export to, as it is
                          advertised to them. The default is the collector's Service under the
                          conventional release name; the chart always writes its own, because
                          every name it generates carries the release's. Set it by hand only to
                          put something else in front.

                          The Service routes to the collector pod on the caller's own node, so
                          the name is stable but the path is node-local.
                        type: string
                    type: object
                type: object
              previews:
                default: {}
                description: |-
                  Previews is the platform's ceiling on preview environments, which is
                  the one resource dimension a pull request moves without anybody
                  choosing a number (#294).

                  It sits beside Builds deliberately: the two are the same kind of
                  statement — how much of this cluster a project may take by pushing —
                  and reading either on its own answers half the question.

                  The empty-object default is what gives an installation that predates
                  the field a ceiling at all: structural defaulting only descends into
                  objects that are present.
                properties:
                  maxPerProject:
                    default: 5
                    description: |-
                      MaxPerProject is how many preview Environments one Project may have
                      live at once. A pull request that would exceed it gets no preview: a
                      commit status and the preview comment say so and name this field,
                      which is the whole point — the alternative is a preview that succeeds
                      and lets the node sort it out.

                      Production environments and anything promoted are never counted: the
                      ceiling is on the ephemeral half, because the ephemeral half is what
                      multiplies.

                      Five is the default because Kitchen is built for single-node clusters,
                      where five previews of a project with a database and a cache claim is
                      already ten backing deployments. `0` is no ceiling at all, which is
                      the installation with room to spare saying so.

                      It is a pointer because that zero is a setting: an int32 with
                      `omitempty` serializes 0 as an absent field, so the default would be
                      applied back over it and clearing the ceiling would be unsayable.
                    format: int32
                    minimum: 0
                    type: integer
                type: object
              registry:
                default: {}
                description: |-
                  The empty-object default is what gives an installation that predates
                  the field a registry at all: structural defaulting only descends into
                  objects that are present.
                properties:
                  enabled:
                    default: true
                    description: |-
                      Enabled publishes the bundled registry and seeds the Connection that
                      points at it. Off means an installation brings its own registry, which
                      is a Connection someone creates by hand.
                    type: boolean
                  host:
                    description: |-
                      Host the registry is published on, and therefore the prefix images are
                      pushed under: <host>/<project>:<sha>. Defaults to
                      registry.<baseDomain>.
                    type: string
                  port:
                    default: 5000
                    description: Port the registry's Service publishes.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  secretRef:
                    description: |-
                      SecretRef names the Secret in the platform namespace holding the
                      registry's own credential: the keys username and password. The chart
                      writes it as <release>-registry, generating the password once and
                      keeping it across upgrades. It is what the operator copies into the
                      seeded Connection's credential.

                      Left unset it is the conventional release name's, kitchen-registry —
                      which is what makes the registry appear on an upgrade, where this
                      object is not re-applied and so names none of these fields.
                    properties:
                      name:
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  service:
                    description: |-
                      Service in the platform namespace the route sends traffic to. The
                      chart writes it as <release>-registry.
                    type: string
                type: object
              residency:
                description: |-
                  Residency declares where this installation's data is located — the
                  region or jurisdiction of the cluster itself, in the operator's own
                  vocabulary ("CH", "eu-central-1"). It is the platform-wide default an
                  Environment without a residency of its own inherits in the compliance
                  inventory.

                  It is declared, not observed: Kitchen runs inside the cluster and has
                  no vantage point to verify where the metal is, so this field records
                  the answer the institution is accountable for rather than pretending
                  to measure one. Provisioned resources are the exception — a provider
                  that reports its actual placement gets that recorded on the claim's
                  status, which takes precedence over any declaration.
                type: string
              retention:
                description: |-
                  Retention is how long each class of what the platform keeps is kept.

                  It is here, at the top of the object, rather than inside
                  `observability` or inside `compliance`, because it spans both and
                  belongs to neither: container logs are telemetry, audit records are
                  evidence, and "how long do you keep it" is one question asked of the
                  whole platform. It deliberately carries no `+kubebuilder:default={}` —
                  an absent block means every class inherits the knob it used to have,
                  which is exactly what an upgraded installation should keep doing.
                properties:
                  activity:
                    description: |-
                      Activity is how long the dashboard's activity feed is kept. It is
                      prose for a person catching up rather than evidence — the audit log is
                      the evidence — so it is the one class where a short window costs
                      nothing but convenience.
                    format: int32
                    minimum: 1
                    type: integer
                  audit:
                    description: |-
                      Audit is how long audit records and the policy decisions they gate are
                      kept. The two share a retention deliberately: a decision and the audit
                      record that gated it substantiate each other, and aging them out
                      separately would leave whichever survives pointing at nothing.

                      The floor is AuditFloorDays and the way under it is the override
                      below, not a smaller number.
                    format: int32
                    minimum: 1
                    type: integer
                  auditFloorOverride:
                    description: |-
                      AuditFloorOverride is the written decision to keep audit records for
                      less than the floor.

                      It exists because a floor with no way past it is a floor somebody
                      eventually removes from the code. An installation that genuinely
                      cannot keep ninety days — a demonstration cluster, a jurisdiction
                      whose data-minimisation rule bites first — should be able to say so
                      *in the object*, with a reason and a name against it, rather than by
                      patching the platform.

                      Setting it is a privileged audit record in its own right, recorded
                      with the number and the reason, so "who decided we keep sixty days"
                      has a written answer.
                    properties:
                      approvedBy:
                        description: |-
                          ApprovedBy is who decided it, as an address or a name a person can be
                          found by. The platform does not resolve it against the identity
                          provider — an override may well be approved by somebody who has no
                          account here — so it is recorded as written.
                        maxLength: 200
                        minLength: 1
                        type: string
                      reason:
                        description: |-
                          Reason is why this installation keeps less than the floor. It is read
                          by whoever asks why the log does not go back far enough.
                        maxLength: 500
                        minLength: 20
                        type: string
                    required:
                    - approvedBy
                    - reason
                    type: object
                  buildLogs:
                    description: |-
                      BuildLogs is how long a build's own output is kept.

                      It is its own class because it answers a different question. A
                      container log is operational — what was this process doing on Tuesday
                      — and a build log is part of the account of how an artifact came to
                      exist, which is read months later beside the artifact's provenance.
                      Installations routinely want the second kept longer than the first.

                      Both live in the same table, which has a consequence worth knowing
                      before setting them apart: see docs/COMPLIANCE.md §12.2.
                    format: int32
                    minimum: 1
                    type: integer
                  clusterEvents:
                    description: |-
                      ClusterEvents is how long the cluster's Warning-event history is kept
                      — the API server expires the originals about an hour after they
                      happen, so this is the only copy.
                    format: int32
                    minimum: 1
                    type: integer
                  containerLogs:
                    description: |-
                      ContainerLogs is how long the stdout and stderr of application,
                      platform and cluster containers are kept.
                    format: int32
                    minimum: 1
                    type: integer
                  flows:
                    description: |-
                      Flows is how long observed network flows are kept — who talked to
                      whom, which is what the traffic view draws.
                    format: int32
                    minimum: 1
                    type: integer
                  metrics:
                    description: Metrics is how long metric series and their rollups
                      are kept.
                    format: int32
                    minimum: 1
                    type: integer
                  requests:
                    description: |-
                      Requests is how long HTTP request telemetry is kept. It is the one
                      class the store scales rather than applies: raw rows are the densest
                      thing in it and live a week or this window, whichever is shorter, and
                      the hourly rollup keeps twelve of these windows so a year-scale view
                      has something to read. Those two ratios are not configurable.
                    format: int32
                    minimum: 1
                    type: integer
                  traces:
                    description: Traces is how long spans are kept.
                    format: int32
                    minimum: 1
                    type: integer
                type: object
                x-kubernetes-validations:
                - message: 'spec.retention.audit is below the 90-day floor: an incident
                    reporting duty runs from when an institution became aware, which
                    can be long after the transition that caused it. Raise it to at
                    least 90, or set spec.retention.auditFloorOverride with a reason
                    and an approver — the override is itself an audit record'
                  rule: '!has(self.audit) || self.audit >= 90 || has(self.auditFloorOverride)'
                - message: 'spec.retention.auditFloorOverride overrides nothing: it
                    is only meaningful beside spec.retention.audit'
                  rule: '!has(self.auditFloorOverride) || has(self.audit)'
              scaleToZero:
                default: {}
                description: |-
                  ScaleToZeroSpec is the platform switch for idling environments down to no
                  pods at all. It is off by default: it needs KEDA and its HTTP add-on running
                  in the cluster, and those are the one platform dependency Kitchen's *chart*
                  cannot install — which is not the same as the platform not installing them.
                  Whether the platform installs them is the `keda` Addon's spec.install; this
                  is whether environments idle once something has.

                  With it on, each Project decides for itself which of its environments idle,
                  through its own `spec.scaleToZero`.
                properties:
                  enabled:
                    default: false
                    type: boolean
                  interceptor:
                    default: {}
                    description: |-
                      InterceptorSpec locates the KEDA HTTP add-on's interceptor proxy: the
                      component that sits between the shared Gateway and an idling application,
                      holds the first request while KEDA scales the workload back up, and forwards
                      it once there is a pod to forward it to.

                      The add-on is a Helm release of its own rather than part of Kitchen's — it
                      cannot be a sub-chart of anything, see the chart's Chart.yaml — so this is
                      how the operator is told where it went.
                    properties:
                      namespace:
                        default: keda
                        description: Namespace the interceptor runs in.
                        type: string
                      port:
                        default: 8080
                        description: Port the proxy accepts live traffic on.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                      service:
                        default: keda-add-ons-http-interceptor-proxy
                        description: |-
                          Service name of the interceptor's proxy. The add-on names it after its
                          own chart rather than after the release, so this is stable.
                        type: string
                    type: object
                type: object
              tls:
                description: |-
                  TLSSpec configures platform-wide TLS defaults. acme mode cannot be
                  half-configured: a Kitchen asking for it with no acme block is refused at
                  admission, rather than accepted and then reported as a condition on an object
                  whose HTTPS listener has no certificate to terminate with.
                properties:
                  acme:
                    description: |-
                      ACME configures the issuer the operator creates, and the wildcard
                      certificate it requests from it. It is required in acme mode and
                      pointless outside it: the wildcard is read by the Gateway's HTTPS
                      listener, which exists in acme mode alone.
                    properties:
                      dns01:
                        description: DNS01 configures how challenges are solved.
                        properties:
                          cloudflare:
                            description: CloudflareSolverSpec configures the Cloudflare
                              DNS-01 solver.
                            properties:
                              apiTokenSecretRef:
                                description: |-
                                  APITokenSecretRef selects the Cloudflare API token to write challenge
                                  records with. The token needs Zone:DNS:Edit on the zone the base domain
                                  belongs to, and Zone:Zone:Read to find it.
                                properties:
                                  key:
                                    minLength: 1
                                    type: string
                                  name:
                                    minLength: 1
                                    type: string
                                required:
                                - key
                                - name
                                type: object
                            required:
                            - apiTokenSecretRef
                            type: object
                        type: object
                        x-kubernetes-validations:
                        - message: 'spec.tls.acme.dns01 needs a solver: set dns01.cloudflare.
                            Every generated URL is a subdomain, so the platform needs
                            a wildcard certificate, and ACME issues wildcards over
                            DNS-01 only.'
                          rule: has(self.cloudflare)
                      email:
                        description: Email the CA contacts about expiring certificates
                          and account problems.
                        minLength: 1
                        type: string
                      server:
                        default: https://acme-v02.api.letsencrypt.org/directory
                        description: |-
                          Server is the ACME directory URL. Point it at Let's Encrypt's staging
                          directory while setting the platform up: staging has far higher rate
                          limits, at the cost of a certificate browsers do not trust.
                        type: string
                    required:
                    - dns01
                    - email
                    type: object
                  mode:
                    default: acme
                    description: TLSMode selects how edge TLS is provided.
                    enum:
                    - cloudflared
                    - acme
                    - none
                    type: string
                type: object
                x-kubernetes-validations:
                - message: 'spec.tls.acme is required when tls.mode is acme: the shared
                    Gateway''s HTTPS listener terminates with the wildcard certificate
                    the operator requests from it. Configure it, or set tls.mode to
                    cloudflared or none.'
                  rule: self.mode != 'acme' || has(self.acme)
            required:
            - baseDomain
            type: object
          status:
            description: KitchenStatus defines the observed state of the platform.
            properties:
              addons:
                description: |-
                  Addons reports which catalogue entries the operator has seeded an Addon
                  for. Each Addon carries its own state; this is only the record that
                  stops a deleted one coming back.
                properties:
                  seeded:
                    description: Seeded names every catalogue entry an Addon has been
                      created for.
                    items:
                      type: string
                    type: array
                type: object
              backup:
                description: |-
                  Backup reports what the scheduled backup has actually been doing: when
                  one last worked, where it went, and what went wrong if something did.
                  Absent means no run has ever been observed.
                properties:
                  archives:
                    description: |-
                      Archives is how many archives the last run left at the destination,
                      after its prune.
                    format: int32
                    type: integer
                  destination:
                    description: 'Destination described, and never its credential:
                      "s3://bucket/prefix".'
                    type: string
                  lastFailure:
                    description: LastFailure is when a run last failed.
                    format: date-time
                    type: string
                  lastRun:
                    description: LastRun is when a run last started, whatever became
                      of it.
                    format: date-time
                    type: string
                  lastSuccess:
                    description: |-
                      LastSuccess is when a run last finished, having uploaded an archive and
                      read it back. It is the number an operator should be watching.
                    format: date-time
                    type: string
                  lastSuccessArchive:
                    description: |-
                      LastSuccessArchive is the key that run wrote, and LastSuccessBytes how
                      big it was.
                    type: string
                  lastSuccessBytes:
                    format: int64
                    type: integer
                  message:
                    description: |-
                      Message explains the state above in the words that name the fix: why
                      there is no schedule, why the last run failed, or why a schedule that
                      exists has never produced an archive.
                    type: string
                  schedule:
                    description: |-
                      Schedule in force, echoed so that a reader of the status does not have
                      to fetch the spec to know what "late" would mean.
                    type: string
                  suspended:
                    description: Suspended is whether the schedule is paused.
                    type: boolean
                type: object
              clockSync:
                description: |-
                  ClockSync reports the last measurement of node clock drift. The
                  *consequence* of drift is a component in the survey above; this is the
                  measurement behind it, including the method, because no number here
                  should be read without the caveat that belongs to it.
                properties:
                  checked:
                    description: Checked is when the measurement was taken.
                    format: date-time
                    type: string
                  drifted:
                    description: Drifted is how many of them are beyond the threshold.
                    format: int32
                    type: integer
                  maxDriftSeconds:
                    description: MaxDriftSeconds is the threshold that was applied.
                    format: int32
                    type: integer
                  message:
                    description: |-
                      Message is what to do about it, for a check that is failing, and why
                      nothing was measured, for one that could not run.
                    type: string
                  method:
                    description: |-
                      Method names how it was taken, so a number is never read without the
                      caveat that belongs to it.
                    type: string
                  nodes:
                    description: Nodes measured.
                    format: int32
                    type: integer
                  worstDriftMillis:
                    format: int64
                    type: integer
                  worstNode:
                    description: |-
                      WorstNode is the node furthest from the operator's clock, and
                      WorstDriftMillis how far. Milliseconds because a healthy cluster's
                      answer is a two-digit number of them and rounding it to seconds would
                      report every healthy cluster as perfect.
                    type: string
                type: object
              compliance:
                description: |-
                  Compliance reports the audit log and the signing identity, so that an
                  installation which believes it is producing evidence can find out that
                  it is not.
                properties:
                  access:
                    description: |-
                      AccessComplianceStatus is where the access controls stand: whether a
                      recertification is open and by when, how many identities look orphaned, and
                      how many writes the platform has seen that it did not make.

                      It is on the singleton rather than anywhere else because all three are
                      facts about the installation, and because this is where an operator looks
                      when the dashboard says something is wrong. The counts are the survey's
                      last pass, not a live number — see the sweep in internal/controller.
                    properties:
                      dueBy:
                        format: date-time
                        type: string
                      identities:
                        description: |-
                          Identities is how many grants the last survey found and Orphaned how
                          many of them were dormant *and* unknown to the identity provider.
                        format: int32
                        type: integer
                      lastClosed:
                        description: |-
                          LastClosed is when a cycle last closed — the answer to "when was
                          access last recertified here", which is the question that gets asked.
                        format: date-time
                        type: string
                      lastOutOfBand:
                        format: date-time
                        type: string
                      message:
                        description: |-
                          Message explains a survey that is not running, or names what it could
                          not read. The failure mode of evidence is silence, so a survey that
                          could not reach the identity provider says so rather than reporting
                          zero orphans.
                        type: string
                      openReview:
                        description: |-
                          OpenReview names the cycle currently open, and DueBy when it is
                          expected to be closed. Both empty means there is none, which is the
                          ordinary state between cycles.
                        type: string
                      orphaned:
                        format: int32
                        type: integer
                      outOfBandWrites:
                        description: |-
                          OutOfBandWrites is how many Kitchen-managed objects currently carry a
                          field manager the platform does not recognise, and LastOutOfBand when
                          the newest such write was made.

                          It is a standing count rather than a running total: a foreign manager
                          stays on an object's managedFields until the platform writes those
                          fields again, so this answers "what is currently marked" and the audit
                          log answers "what happened".
                        format: int32
                        type: integer
                      reviewing:
                        description: Reviewing is true when the cadence is on and
                          has somewhere to run.
                        type: boolean
                    required:
                    - reviewing
                    type: object
                  attestation:
                    description: |-
                      AttestationStatus reports the identity evidence is signed under. The key id
                      is the SHA-256 of the public key's DER encoding, which is what a verifier
                      matches an envelope's `keyid` against.
                    properties:
                      keyID:
                        description: KeyID identifies the public key attestations
                          are signed under.
                        type: string
                      message:
                        description: Message explains a platform that is not signing.
                        type: string
                      secretName:
                        description: |-
                          SecretName is where that key lives, so an operator rotating it knows
                          what to replace without guessing at defaults.
                        type: string
                      signing:
                        description: Signing is true when the operator holds a usable
                          key.
                        type: boolean
                    required:
                    - signing
                    type: object
                  audit:
                    description: |-
                      AuditStatus reports whether the audit log is actually recording, which is
                      not the same question as whether it is enabled: it needs the telemetry
                      store, and an installation configured without one records nothing however
                      the spec reads.
                    properties:
                      immutabilityMessage:
                        description: |-
                          ImmutabilityMessage explains an audit table whose mutation privileges
                          are still held by the platform's own user.
                        type: string
                      immutable:
                        description: |-
                          Immutable is true when the store has taken the audit table's mutation
                          privileges away from the platform's own credential — so a compromised
                          operator or API can append to the log and cannot rewrite it.

                          False is not a fault and does not stop anything: it means the claim
                          this installation can make about its log is the hash chain's alone,
                          which is a smaller claim and an honest one. The message says why the
                          revoke did not take. docs/COMPLIANCE.md §12.3 states exactly what the
                          true case does and does not cover.
                        type: boolean
                      message:
                        description: Message explains a log that is not recording.
                        type: string
                      recording:
                        description: Recording is true when the operator has a store
                          to append to.
                        type: boolean
                      sequence:
                        description: |-
                          Sequence is the number of the last record appended, so that a jump
                          backwards is visible without reading the log itself. Zero means
                          nothing has been recorded yet.
                        format: int64
                        type: integer
                    required:
                    - recording
                    type: object
                  policy:
                    description: |-
                      PolicyStatus reports whether policy decisions are being stored, which —
                      like AuditStatus — is a different question from whether they are being
                      made. The engine is a pure function and always answers; what needs the
                      telemetry store is keeping the answer, with the inputs that make it
                      reproducible. An installation without one still gets decisions, and this
                      is where it is told they leave no replayable record behind.
                    properties:
                      message:
                        description: Message explains decisions that are not being
                          stored.
                        type: string
                      storing:
                        description: Storing is true when the operator has a store
                          to keep decisions in.
                        type: boolean
                    required:
                    - storing
                    type: object
                  rescan:
                    description: |-
                      RescanStatus reports whether the re-evaluation pass is actually running,
                      which — like AuditStatus and PolicyStatus — is a different question from
                      whether it is enabled: it needs a scanner configured, and a pass that is on
                      with nothing to run reports nothing rather than nothing being wrong.
                    properties:
                      environments:
                        description: |-
                          Environments is how many deployed (environment, release) pairs the last
                          pass considered, and Scanning how many had a scan in flight when it
                          finished. Both are the sweep's own count, so a zero next to a running
                          pass is a platform with nothing deployed rather than a broken sweep.
                        format: int32
                        type: integer
                      lastSweep:
                        description: |-
                          LastSweep is when the sweep last looked at the whole estate — not when
                          it last scanned anything, which is per environment.
                        format: date-time
                        type: string
                      message:
                        description: Message explains a pass that is not running.
                        type: string
                      running:
                        description: Running is true when the sweep is on and has
                          a scanner to run.
                        type: boolean
                      scanning:
                        format: int32
                        type: integer
                    required:
                    - running
                    type: object
                type: object
              components:
                description: |-
                  Components reports every platform workload the operator can see, in
                  name order, whether or not it is healthy. Something missing from this
                  list was never created; something in it with Healthy false was created
                  and is not running.
                items:
                  description: |-
                    ComponentStatus reports the runtime health of one platform workload.

                    This is deliberately about pods, not about reconciliation: the conditions
                    say whether the operator could do its job, this says whether what it (or the
                    chart) asked for is actually running.
                  properties:
                    available:
