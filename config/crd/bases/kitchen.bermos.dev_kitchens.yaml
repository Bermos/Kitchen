---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: kitchens.kitchen.bermos.dev
spec:
  group: kitchen.bermos.dev
  names:
    kind: Kitchen
    listKind: KitchenList
    plural: kitchens
    singular: kitchen
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.baseDomain
      name: BaseDomain
      type: string
    - jsonPath: .status.gatewayAddress
      name: Gateway
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Kitchen is the cluster-wide platform configuration singleton.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              KitchenSpec defines platform-wide configuration. There is exactly one
              Kitchen object per cluster; it is the operator's runtime configuration and
              is editable from the management UI.
            properties:
              api:
                description: APISpec configures how the operator's API is exposed.
                properties:
                  externalURL:
                    description: |-
                      ExternalURL is the base URL the operator API (including the git
                      webhook receiver) is reachable at from outside the cluster.
                      Defaults to https://kitchen.<baseDomain>.
                    type: string
                type: object
              auth:
                default: {}
                description: |-
                  An installation with no auth block at all still has an identity
                  provider: the defaults inside it only apply once the object is there.
                properties:
                  enabled:
                    default: true
                    description: |-
                      Whether the platform has an identity provider at all. Without one there
                      is no login for the UI and no issuer for apps to claim clients from.
                    type: boolean
                  host:
                    description: |-
                      Hostname the identity provider is served on, and therefore the OIDC
                      issuer (https://<host>). Defaults to auth.<baseDomain>.
                    type: string
                  previewGate:
                    default: {}
                    description: |-
                      PreviewGateSpec configures the forward-auth gate that protected preview
                      environments are served through: an in-path component that turns an
                      anonymous request into a platform login and only then proxies to the app.
                    properties:
                      enabled:
                        default: true
                        description: |-
                          Whether the platform runs a gate at all. A Project asking for protected
                          previews without one gets no route rather than a public one.
                        type: boolean
                      host:
                        description: |-
                          Hostname the gate serves its OAuth callback on. It is the only redirect
                          URI registered with the identity provider, which is what lets previews
                          come and go without touching the OAuth client.
                          Defaults to previews.<baseDomain>.
                        type: string
                      replicas:
                        default: 2
                        description: |-
                          Replicas of the gate. It is in the request path of every protected
                          preview, so it is worth more than one.
                        format: int32
                        minimum: 1
                        type: integer
                      sessionTTL:
                        default: 8h
                        description: |-
                          How long a visitor's session on a preview lasts before the gate sends
                          them back to the identity provider — which, if they are still signed in
                          there, costs them a redirect and no interaction.
                        type: string
                    type: object
                  secretRef:
                    description: |-
                      SecretRef names the Secret in the platform namespace holding the
                      operator's view of the identity provider: the keys issuer, serviceKey
                      and, optionally, internalURL — a cluster-internal address for the same
                      issuer, for clusters that cannot resolve their own base domain from the
                      inside. The chart writes it as <release>-auth. Without it the operator
                      cannot register OAuth clients, so nothing that depends on one — the
                      preview gate, later the oidcClient claims — can be reconciled.
                    properties:
                      name:
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                type: object
              baseDomain:
                description: |-
                  Base domain for generated URLs: <slug>.<baseDomain>. Requires wildcard
                  DNS (and wildcard TLS unless cloudflared is enabled).
                minLength: 1
                type: string
              builds:
                description: BuildsSpec configures platform-wide build defaults.
                properties:
                  concurrency:
                    default: 2
                    description: Maximum number of builds running at once.
                    format: int32
                    minimum: 1
                    type: integer
                  defaultStrategy:
                    default: auto
                    description: BuildStrategy selects how an image is produced from
                      a repository.
                    enum:
                    - auto
                    - dockerfile
                    - buildpacks
                    type: string
                type: object
              ingress:
                description: IngressSpec configures how traffic enters the cluster.
                properties:
                  cloudflared:
                    description: CloudflaredSpec configures the optional cloudflared
                      tunnel fronting the Gateway.
                    properties:
                      enabled:
                        default: false
                        type: boolean
                      tunnelSecretRef:
                        description: Secret holding the tunnel credentials.
                        properties:
                          name:
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                    type: object
                  gatewayClassName:
                    default: cilium
                    description: |-
                      GatewayClass used for the shared Gateway. Cilium's Gateway API
                      implementation is the expected default.
                    type: string
                type: object
              observability:
                description: ObservabilitySpec configures the telemetry pipeline.
                properties:
                  clickhouse:
                    description: ClickHouseSpec configures the telemetry store.
                    properties:
                      retentionDays:
                        default: 30
                        description: Days to retain logs, metrics, traces and flow
                          data.
                        format: int32
                        minimum: 1
                        type: integer
                      secretRef:
                        description: |-
                          SecretRef names the Secret in the platform namespace holding the
                          connection details for the store: the keys host, httpPort, database,
                          username and password. The chart writes it as
                          <release>-clickhouse, whether it runs ClickHouse itself or points at
                          an external one. Without it the operator manages no telemetry schema
                          and the collectors have nowhere to ship to.
                        properties:
                          name:
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                    type: object
                type: object
              tls:
                description: TLSSpec configures platform-wide TLS defaults.
                properties:
                  acme:
                    description: |-
                      ACME configures the issuer the operator creates, and the wildcard
                      certificate it requests from it, when Mode is acme. Without it the
                      operator manages no certificate and the Gateway's HTTPS listener waits
                      for one to appear by other means.
                    properties:
                      dns01:
                        description: DNS01 configures how challenges are solved.
                        properties:
                          cloudflare:
                            description: CloudflareSolverSpec configures the Cloudflare
                              DNS-01 solver.
                            properties:
                              apiTokenSecretRef:
                                description: |-
                                  APITokenSecretRef selects the Cloudflare API token to write challenge
                                  records with. The token needs Zone:DNS:Edit on the zone the base domain
                                  belongs to, and Zone:Zone:Read to find it.
                                properties:
                                  key:
                                    minLength: 1
                                    type: string
                                  name:
                                    minLength: 1
                                    type: string
                                required:
                                - key
                                - name
                                type: object
                            required:
                            - apiTokenSecretRef
                            type: object
                        type: object
                      email:
                        description: Email the CA contacts about expiring certificates
                          and account problems.
                        minLength: 1
                        type: string
                      server:
                        default: https://acme-v02.api.letsencrypt.org/directory
                        description: |-
                          Server is the ACME directory URL. Point it at Let's Encrypt's staging
                          directory while setting the platform up: staging has far higher rate
                          limits, at the cost of a certificate browsers do not trust.
                        type: string
                    required:
                    - dns01
                    - email
                    type: object
                  mode:
                    default: acme
                    description: TLSMode selects how edge TLS is provided.
                    enum:
                    - cloudflared
                    - acme
                    - none
                    type: string
                type: object
            required:
            - baseDomain
            type: object
          status:
            description: KitchenStatus defines the observed state of the platform.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              gatewayAddress:
                description: Externally reachable address of the shared Gateway, once
                  programmed.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
