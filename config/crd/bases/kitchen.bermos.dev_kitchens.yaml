                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              gatewayAddress:
                description: Externally reachable address of the shared Gateway, once
                  programmed.
                type: string
              objectStore:
                description: |-
                  ObjectStore reports the bundled object store: where it is reached, and
                  the Connection the operator seeded to point at it.
                properties:
                  connection:
                    description: |-
                      Connection the operator seeded, by name. Set once and never cleared
                      while the store stays enabled.
                    type: string
                  endpoint:
                    description: Endpoint the store is reached at inside the cluster.
                    type: string
                type: object
              registry:
                description: |-
                  Registry reports the bundled image registry: where it is published,
                  and the Connection the operator seeded to point at it.
                properties:
                  connection:
                    description: |-
                      Connection the operator seeded, by name. Set once and never cleared
                      while the registry stays enabled.
                    type: string
                  host:
                    description: Host the registry is published on.
                    type: string
                type: object
              retention:
                description: |-
                  Retention reports the retention model as it is actually in force, per
                  class, with what each class currently holds and how far back it goes.
                properties:
                  auditFloorOverridden:
                    description: |-
                      AuditFloorOverridden is true when audit records are kept for less than
                      AuditFloorDays under a written override. It is on the status as well
                      as in the spec so that a reader who came for "is this installation
                      keeping its evidence" gets the answer without having to know which
                      field to look at.
                    type: boolean
                  classes:
                    description: Classes is every class, in name order.
                    items:
                      description: |-
                        RetentionClassStatus is what the platform is actually doing about one class,
                        as opposed to what it was asked to do.
                      properties:
                        class:
                          description: Class names the class, in the vocabulary the
                            spec uses.
                          type: string
                        days:
                          description: |-
                            Days is the retention in force — the configured value, or the knob it
                            inherits from.
                          format: int32
                          type: integer
                        enforced:
                          description: |-
                            Enforced is true when the store is holding the retention this class
                            asks for. False means the platform asked and the store has not (yet)
                            agreed — the message says why.
                          type: boolean
                        expired:
                          description: |-
                            Expired counts rows still present on the wrong side of the horizon at
                            the last sweep. It is normally zero or one partition's worth; a number
                            that stays large means the store is holding data past its date, which
                            is a thing this platform reports rather than hides.
                          format: int64
                          type: integer
                        message:
                          description: |-
                            Message explains a class that is not being enforced, or a store that
                            could not be asked.
                          type: string
                        oldest:
                          description: |-
                            Oldest surviving row, as of the last sweep. This is the claim
                            retention actually makes: nothing about this class is older than this.
                          format: date-time
                          type: string
                        removed:
                          description: |-
                            Removed is how many rows the last sweep deleted itself. It is the one
                            number here that is exact rather than observed: the sweep only ever
                            drops a partition every row of which is past the horizon, so it can
                            count them. Everything the store expired on its own schedule is
                            invisible to it, and §12.4 says so.
                          format: int64
                          type: integer
                        rows:
                          description: Rows the class currently holds, as of the last
                            sweep.
                          format: int64
                          type: integer
                        source:
                          description: |-
                            Source says where Days came from: `retention` for this block, or the
                            legacy field it fell back to. It is here because an operator reading
                            "30" wants to know whether anybody chose it.
                          type: string
                      required:
                      - class
                      - days
                      - enforced
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - class
                    x-kubernetes-list-type: map
                  lastSweep:
                    description: LastSweep is when the retention sweep last completed
                      a pass.
                    format: date-time
                    type: string
                  message:
                    description: |-
                      Message explains a model that is configured and not being enforced —
                      an installation with no telemetry store, most often.
                    type: string
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
