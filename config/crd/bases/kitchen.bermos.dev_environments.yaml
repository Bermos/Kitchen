---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: environments.kitchen.bermos.dev
spec:
  group: kitchen.bermos.dev
  names:
    kind: Environment
    listKind: EnvironmentList
    plural: environments
    singular: environment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.projectRef.name
      name: Project
      type: string
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.url
      name: URL
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Environment is the Schema for the environments API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              EnvironmentSpec defines a running instance of a Release with a URL.
              Rollback is changing ReleaseRef to an older Release.
            properties:
              criticality:
                description: |-
                  Criticality is how much it matters that *this environment* keeps
                  working, which is a different question from how much the project
                  matters. A critical project's preview environments are not critical
                  functions, and a nonCritical project may own the staging environment
                  four teams integrate against. Absent means undesignated: a production
                  environment then reads its project's designation and a preview reads
                  nothing, derived rather than written — see [EffectiveContinuity].

                  It is declared here by the environment's owners, through the same
                  owner-gated endpoint as the bar and the data class, and for the same
                  reason: what an environment is worth is not the deploying team's to
                  say.
                enum:
                - nonCritical
                - important
                - critical
                type: string
              dataClass:
                description: |-
                  DataClass is the highest sensitivity class of data this environment is
                  rated to hold — its ceiling, not a label on its contents. At promotion
                  the policy engine refuses a project whose class exceeds it (rule
                  dataclass-le-environment), which includes a classified project landing
                  on an environment nobody has rated. Absent means unclassified,
                  surfaced as such and never defaulted. Like requirements, it is the
                  owners' declaration rather than the deploying team's, and it is
                  written through the same owner-gated endpoint.
                enum:
                - public
                - internal
                - confidential
                - strictlyConfidential
                type: string
              owners:
                description: |-
                  Owners name who may change this environment's Requirements. Entries
                  use the AccessSubject vocabulary: the issuer's `sub`, or an email
                  address — a value containing `@` is read as one, matched
                  case-insensitively and honoured only for a token whose address is
                  verified. Platform operators always may.

                  This list is segregation of duties written as a schema: the team that
                  deploys into an environment holds project roles, the people who decide
                  what it demands are named here, and neither grants the other. An empty
                  or absent list leaves the requirements to the platform's operators
                  alone — the safe default, since an environment nobody owns must not be
                  one whoever deploys into it can lower the bar of.
                items:
                  type: string
                type: array
              preview:
                description: Required when Type is preview.
                properties:
                  branch:
                    minLength: 1
                    type: string
                  pullRequest:
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - branch
                - pullRequest
                type: object
              projectRef:
                description: |-
                  LocalObjectReference references another Kitchen object by name within the
                  platform namespace. Cross-namespace references are not supported in v1alpha1.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              releaseRef:
                description: |-
                  LocalObjectReference references another Kitchen object by name within the
                  platform namespace. Cross-namespace references are not supported in v1alpha1.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              requirements:
                description: |-
                  Requirements is what an artifact must bring in order to land here,
                  declared by the environment's owners rather than by the project that
                  deploys into it. Absent means this environment declares no bar, which
                  is every environment's starting state and exactly today's behaviour.
                properties:
                  bundleDigest:
                    description: |-
                      BundleDigest names the policy bundle by its sha256, in the
                      `sha256:<64 hex>` form every artifact digest already uses. Anything
                      else is refused at admission.
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  parameters:
                    additionalProperties:
                      type: string
                    description: |-
                      Parameters reach the policy as input.parameters: the owner's tuning of
                      the bundle's rules — which gate to require, a severity ceiling —
                      without a bundle of their own for every environment.
                    type: object
                required:
                - bundleDigest
                type: object
              residency:
                description: |-
                  Residency declares where this environment's data is located — a
                  region or jurisdiction in the operator's own vocabulary ("CH",
                  "eu-central-1"). It is declared, not observed: the platform runs in
                  the one cluster it is installed into and cannot see past it, so this
                  records the answer the institution is accountable for. Absent falls
                  back to the platform default on the Kitchen object, and reads as
                  "unknown" in the inventory when neither is set. Provisioned resources
                  record their *actual* placement separately, on the claim's status.
                type: string
              rpo:
                description: |-
                  RPO is how much of this environment's data may be lost. Carried,
                  mapped and reachable by policy; nothing alerts on it yet, because the
                  platform observes no recovery points.
                maxLength: 16
                minLength: 2
                pattern: ^([0-9]+h)?([0-9]+m)?$
                type: string
              rto:
                description: |-
                  RTO is how long this environment may be unavailable before the
                  institution's tolerance is breached — a Go duration of whole hours and
                  minutes. It is the threshold the environment.rto-at-risk signal fires
                  against, so setting it changes what wakes somebody up.
                maxLength: 16
                minLength: 2
                pattern: ^([0-9]+h)?([0-9]+m)?$
                type: string
              type:
                default: production
                description: |-
                  EnvironmentType distinguishes the single production Environment from
                  ephemeral previews.
                enum:
                - production
                - preview
                type: string
            required:
            - projectRef
            - releaseRef
            type: object
          status:
            description: EnvironmentStatus defines the observed state of an Environment.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              gitReport:
                description: |-
                  GitReport is what was last posted back to the git provider about this
                  Environment. Absent on a platform that reports nothing — a source
                  connection without the statusChecks capability.
                properties:
                  at:
                    description: At is when the last attempt ran.
                    format: date-time
                    type: string
                  commentID:
                    description: |-
                      CommentID is the provider-side ID of the pull request comment the
                      platform keeps up to date, so the next report rewrites that comment
                      instead of hunting for it — or appending a second one.
                    type: string
                  error:
                    description: |-
                      Error is why the last attempt did not land, empty when it did. A
                      provider that refuses the report is recorded here and nowhere else:
                      posting is commentary on a deployment, never a condition of it.
                    type: string
                  revision:
                    description: Revision is the commit the report was about.
                    type: string
                  state:
                    description: |-
                      State reported for the deployment, in the provider-neutral vocabulary
                      (in_progress, success, failure, inactive).
                    type: string
                  url:
                    description: URL published with the report.
                    type: string
                type: object
              history:
                description: History of Releases that stopped being current, newest
                  first.
                items:
                  description: |-
                    ReleaseHistoryEntry is one completed stint of a Release being current on
                    this Environment: which Release, when it held the spec, and how and by whom
                    it stopped being current.
                  properties:
                    by:
                      description: |-
                        By names who caused the move: the API caller, or the Build whose
                        Release was promoted. Empty for moves made directly on the spec.
                      type: string
                    from:
                      description: From is when the Release became current.
                      format: date-time
                      type: string
                    reason:
                      description: ReleaseMoveReason is how an Environment moved off
                        a Release.
                      enum:
                      - promoted
                      - rolledBack
                      - superseded
                      type: string
                    release:
                      minLength: 1
                      type: string
                    to:
                      description: To is when it stopped being current.
                      format: date-time
                      type: string
                  required:
                  - from
                  - reason
                  - release
                  - to
                  type: object
                maxItems: 10
                type: array
              observedRelease:
                description: Release the running workload was last reconciled to.
                type: string
              phase:
                description: EnvironmentPhase is the coarse lifecycle summary of an
                  Environment.
                enum:
                - Pending
                - Deploying
                - Live
                - Degraded
                - Terminating
                type: string
              processes:
                description: |-
                  Processes is what the reconciler last saw of this environment's workers
                  and scheduled jobs: how many replicas are ready, when each schedule
                  last fired, and — the field the feature lives or dies on — the most
                  recent run that failed. A CronJob whose pods fail silently is the
                  classic way this disappoints, so the failure is carried on the object
                  the project page and the API already read.
                items:
                  description: |-
                    ProcessStatus is what an Environment's reconciler last saw of one process.

                    A `CronJob` whose pods fail silently is the classic way this feature
                    disappoints, so the failure is carried here — on the Environment, which is
                    what the project page and the API read — rather than left in
                    `kubectl get jobs`.
                  properties:
                    active:
                      description: Active is how many runs are in flight.
                      format: int32
                      type: integer
                    address:
                      description: |-
                        Address is where a service workload answers, inside the cluster and
                        nowhere else: `http://<host>:<port>`, the same value its siblings read
                        out of `KITCHEN_SERVICE_<NAME>`. It is written by the reconciler that
                        created the Service rather than derived by every reader, so that one
                        place decides what the address is.

                        It is empty for a worker and a scheduled job, which nothing addresses,
                        and for a service this environment does not run.
                      type: string
                    attempt:
                      format: int32
                      minimum: 0
                      type: integer
                    image:
                      description: |-
                        Image is what this workload is running, when that is not the
                        Release's own image — a workload with a build of its own. It is the
                        digest reference the Release froze, echoed here so that a reader
                        looking at one environment can see the four images it is running
                        without opening the Release beside it.
                      type: string
                    lastFailure:
                      description: |-
                        ProcessRun is one run of a scheduled process or of a deploy task: the Job
                        that ran it, when, and what came of it. One shape for both, because a
                        person asking how a run went asks the same question either way — and it is
                        what lets a task's output and outcome be read exactly the way every other
                        run's already are.
                      properties:
                        finishedAt:
                          format: date-time
                          type: string
                        message:
                          description: |-
                            Message is the one line a person reads: why it failed, or nothing at
                            all when it did not.
                          type: string
                        name:
                          description: |-
                            Name is the Job in the application namespace. It is also the value the
                            log pipeline keys on as `run:<name>`, which is what makes a run's
                            output queryable after the pods are gone.
                          minLength: 1
                          type: string
                        phase:
                          description: RunPhase is how one run of a scheduled process
                            ended, or that it has not.
                          enum:
                          - Running
                          - Succeeded
                          - Failed
                          type: string
                        startedAt:
                          format: date-time
                          type: string
                      required:
                      - name
                      - phase
                      type: object
                    lastRun:
                      description: |-
                        LastRun is the most recent run that started, whatever it did next, and
                        LastFailure the most recent one that failed — a schedule's firings, or
                        a deploy task's one run per deploy. Both are kept because the
                        question a person asks is "is it working" and the question they ask
                        next is "when did it stop" — and a job that has been failing for a week
                        answers the first with a green tick if only the last run is recorded.

                        There is deliberately no "next run": computing it means parsing the
                        cron expression, and a whole scheduling library carried for one
                        display string is not a trade worth making when the schedule itself is
                        right there beside it.
                      properties:
                        finishedAt:
                          format: date-time
                          type: string
                        message:
                          description: |-
                            Message is the one line a person reads: why it failed, or nothing at
                            all when it did not.
                          type: string
                        name:
                          description: |-
                            Name is the Job in the application namespace. It is also the value the
                            log pipeline keys on as `run:<name>`, which is what makes a run's
                            output queryable after the pods are gone.
                          minLength: 1
                          type: string
                        phase:
                          description: RunPhase is how one run of a scheduled process
                            ended, or that it has not.
                          enum:
                          - Running
                          - Succeeded
                          - Failed
                          type: string
                        startedAt:
                          format: date-time
                          type: string
                      required:
                      - name
                      - phase
                      type: object
                    name:
                      minLength: 1
                      type: string
                    readyReplicas:
                      format: int32
                      type: integer
                    release:
                      description: |-
                        Release is the Release a deploy task's LastRun was started for, and
                        Attempt how many runs of it this environment has ever started.

                        Together they are what makes "once per deploy" a fact rather than a
                        hope, and they are on the object because the reconciler is stateless
                        between passes: a run is started when the release recorded here is not
                        the one being deployed, and skipped when it is — so a hundred
                        reconciles of one release run one migration, and a rollback to a
                        release this environment ran before is a *new* deploy and runs it
                        again. Attempt is what keeps each of those runs its own Job rather
                        than a name that collides with a finished one, and asking for a retry
                        is exactly clearing Release.

                        Both are empty for every other type of workload.
                      type: string
                    replicas:
                      description: |-
                        Replicas and ReadyReplicas are a worker's, and are left at zero for a
                        scheduled process.
                      format: int32
                      type: integer
                    schedule:
                      description: |-
                        Schedule is a scheduled process's, echoed so a reader does not have to
                        hold the Release open beside this.
                      type: string
                    suspended:
                      description: |-
                        Suspended marks a process this environment declares but deliberately
                        does not run: a preview whose process did not opt in. Nothing is
                        materialized for it at all — the flag is what stops a preview's process
                        list reading like a shorter version of the project's.
                      type: boolean
                    type:
                      description: |-
                        ProcessType is how one of a Project's processes runs.

                        There is deliberately no `web` here. A Project's web process is
                        `spec.runtime` — the port, the replica count and the resources of the thing
                        with the URL — and it is singular because the URL is: an Environment
                        publishes one hostname, one Service and one route, and a second process
                        claiming to be the web one would have to be told which of those it got. So
                        this list is what a Project has *besides* its web process, which is exactly
                        the gap #78 was filed for: a queue worker and a nightly job that today have
                        to be a second Project with a port nothing talks to.

                        `service` is the third value and the one #271 added. It is the workload a
                        monorepo has several of: an image of its own, addressed by the rest of the
                        unit over the cluster network, and **not published**. Publishing stays the
                        exception the project declares — `spec.runtime`, the one process with the
                        URL — so a workload that should not be on the internet is not on it by
                        saying nothing, rather than by remembering to turn something off.

                        `task` is the fourth and the one #272 added, and it is the only one of them
                        that is not a thing that keeps running: it is work that happens once per
                        deploy and finishes before any of that release serves a request. The
                        schema migration is the universal case and had nowhere to go — a readiness
                        probe stops traffic reaching a pod that is not ready, and does nothing
                        about the previous release's pods being retired while a migration is half
                        applied, which is why applications end up running it from their entrypoint
                        once per replica instead.
                      enum:
                      - worker
                      - cron
                      - service
                      - task
                      type: string
                    workload:
                      description: |-
                        Workload is the Deployment or CronJob the process materialized as, in
                        the project's application namespace. A deploy task materializes no
                        standing object at all — its runs are Jobs, and LastRun names the one
                        this deploy made — so it carries none.
                      type: string
                  required:
                  - name
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              rescan:
                description: |-
                  Rescan is where the continuous re-evaluation pass (#134) keeps its
                  place: what it last scanned, against which vulnerability database, and
                  what the environment's own bar said about the result. It is the
                  sweep's working state as much as its answer — the sweep is stateless
                  between passes and reads its next move off this.
                properties:
                  artifact:
                    type: string
                  dataSnapshot:
                    description: |-
                      DataSnapshot identifies the vulnerability database the findings were
                      produced against. It is the field that makes a scan reproducible: the
                      same artifact matched against the same snapshot yields the same
                      findings, and a decision that cannot name its snapshot can only be
                      repeated, never reproduced.
                    type: string
                  decisionID:
                    type: string
                  findings:
                    description: |-
                      Findings is how many the scanner reported, after the platform's
                      normalization. Zero with an Evaluated phase means a clean scan; zero
                      with a Failed one means nothing was scanned.
                    format: int32
                    type: integer
                  finishedAt:
                    format: date-time
                    type: string
                  jobName:
                    description: |-
                      JobName is the scanner Job in the application's namespace while one is
                      in flight. It is the sweep's own bookkeeping and is left behind after a
                      pass so that a person can look at what happened before the Job's TTL
                      collects it.
                    type: string
                  message:
                    description: Message is the one line a person reads.
                    type: string
                  phase:
                    description: Phase is where the pass stands.
                    enum:
                    - Scanning
                    - Evaluated
                    - Failed
                    type: string
                  release:
                    description: |-
                      Release is the release that was scanned, and Artifact the
                      repository@digest it deploys. Both are recorded because a release can
                      be deleted and the digest is what the evidence is attached to.
                    type: string
                  startedAt:
                    description: |-
                      StartedAt and FinishedAt time-stamp the scan itself. FinishedAt is what
                      the sweep counts the interval from, so a scan that never finishes
                      delays the next one rather than doubling it.
                    format: date-time
                    type: string
                  unmetRules:
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                  verdict:
                    description: |-
                      Verdict, UnmetRules and DecisionID are the re-evaluation's outcome and
                      the way back to the stored decision that holds its whole input.
                    type: string
                type: object
              url:
                description: Primary URL the Environment is reachable at.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
