---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: projects.kitchen.bermos.dev
spec:
  group: kitchen.bermos.dev
  names:
    kind: Project
    listKind: ProjectList
    plural: projects
    singular: project
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.source.repo
      name: Repo
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Project is the Schema for the projects API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ProjectSpec defines the desired state of a Project: a repository that
              becomes a running application.
            properties:
              build:
                description: ProjectBuildSpec overrides platform build defaults for
                  one project.
                properties:
                  dockerfilePath:
                    default: Dockerfile
                    description: |-
                      Path to the Dockerfile, relative to RootDirectory. Used when the
                      strategy is (or resolves to) dockerfile.
                    type: string
                  rootDirectory:
                    default: .
                    description: Directory within the repository to build from (monorepo
                      support).
                    type: string
                  strategy:
                    default: auto
                    description: BuildStrategy selects how an image is produced from
                      a repository.
                    enum:
                    - auto
                    - dockerfile
                    - buildpacks
                    type: string
                type: object
              env:
                description: Environment variables, overlaid per environment type.
                items:
                  description: |-
                    EnvVar is a single environment variable for an application. Exactly one of
                    Value, SecretRef, or FromResourceClaim should be set. PreviewValue, when set,
                    replaces Value in preview environments.
                  properties:
                    fromResourceClaim:
                      description: Value taken from a ResourceClaim binding (e.g.
                        a provisioned database URL).
                      properties:
                        key:
                          minLength: 1
                          type: string
                        name:
                          minLength: 1
                          type: string
                      required:
                      - key
                      - name
                      type: object
                    name:
                      minLength: 1
                      type: string
                    previewValue:
                      description: Literal value used in preview environments instead
                        of Value.
                      type: string
                    secretRef:
                      description: |-
                        Value taken from a Secret in the application namespace. The name
                        "kitchen-secrets" resolves per environment type to the Secret the
                        project's secret store syncs into (see Project spec.secrets):
                        kitchen-secrets-production or kitchen-secrets-preview — which is how the
                        same key gets production values in production and preview values in
                        previews. Any other name is used as written.
                      properties:
                        key:
                          minLength: 1
                          type: string
                        name:
                          minLength: 1
                          type: string
                      required:
                      - key
                      - name
                      type: object
                    value:
                      description: Literal value.
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              previews:
                description: PreviewsSpec configures preview environments for pull
                  requests.
                properties:
                  enabled:
                    default: true
                    type: boolean
                  protected:
                    default: true
                    description: |-
                      Protected gates preview URLs behind platform login: the Environment's
                      route goes through the forward-auth gate, which sends anonymous
                      requests to the identity provider and only proxies signed-in ones to
                      the application. The application itself needs no changes. Production
                      environments are never gated.

                      It defaults to on, so unreleased work is not published to anyone who
                      guesses the URL. With no gate on the platform the Environment gets no
                      route at all rather than a public one — set this to false to serve
                      previews openly on purpose.
                    type: boolean
                  ttlAfterClosed:
                    description: |-
                      Grace period before a preview Environment is torn down after its
                      pull request closes.
                    type: string
                type: object
              registry:
                description: RegistrySpec selects where built images are stored.
                properties:
                  connectionRef:
                    description: Connection with the imageStore capability.
                    properties:
                      name:
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                required:
                - connectionRef
                type: object
              runtime:
                description: RuntimeSpec describes how an application runs.
                properties:
                  port:
                    default: 3000
                    description: Container port the application listens on.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  replicas:
                    default: 1
                    description: Replica count for production environments. Previews
                      always run 1.
                    format: int32
                    type: integer
                  resources:
                    description: Compute resources per replica.
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This is an alpha field and requires enabling the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                type: object
              secrets:
                description: |-
                  Secrets synced from a secret store into the application namespace,
                  scoped per environment type.
                properties:
                  connectionRef:
                    description: Connection with the secretStore capability.
                    properties:
                      name:
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  previewEnv:
                    default: staging
                    description: |-
                      PreviewEnv is the store environment previews sync from. All previews
                      share it: a preview is unreleased code, not unreleased credentials.
                    type: string
                  productionEnv:
                    default: prod
                    description: |-
                      ProductionEnv is the store environment production syncs from. The
                      default matches Infisical's built-in environments.
                    type: string
                  projectSlug:
                    description: |-
                      ProjectSlug names the project in the secret store to sync from (for
                      Infisical, the project slug).
                    minLength: 1
                    type: string
                  secretsPath:
                    default: /
                    description: |-
                      SecretsPath is the folder within the store's project to sync,
                      recursively.
                    type: string
                required:
                - connectionRef
                - projectSlug
                type: object
              source:
                description: GitSourceSpec links a Project to a repository via a gitSource
                  Connection.
                properties:
                  connectionRef:
                    description: Connection with the gitSource capability.
                    properties:
                      name:
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  productionBranch:
                    default: main
                    description: Branch whose builds auto-promote to the production
                      Environment.
                    type: string
                  repo:
                    description: Repository in the provider's owner/name form.
                    minLength: 1
                    type: string
                required:
                - connectionRef
                - repo
                type: object
            required:
            - registry
            - source
            type: object
          status:
            description: ProjectStatus defines the observed state of a Project.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              latestBuildRef:
                description: Most recently created Build.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              productionEnvironmentRef:
                description: The Project's production Environment, once created.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              webhookId:
                description: Provider-side identifier of the registered git webhook.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
