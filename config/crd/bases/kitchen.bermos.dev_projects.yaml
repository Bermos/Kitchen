---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: projects.kitchen.bermos.dev
spec:
  group: kitchen.bermos.dev
  names:
    kind: Project
    listKind: ProjectList
    plural: projects
    singular: project
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.source.repo
      name: Repo
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Project is the Schema for the projects API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ProjectSpec defines the desired state of a Project: a repository that
              becomes a running application.
            properties:
              access:
                description: |-
                  Access is who may do what with this Project, and it is the whole of the
                  answer: an account with no entry here holds no role on the Project at
                  all, so it is not in their project list and not theirs to build,
                  redeploy or read. The one exception is a platform operator, who holds
                  admin on every project, present and future — see
                  `spec.access.operators` on the Kitchen singleton.

                  Membership lives here, on the object the access is about, rather than
                  in the identity provider or in a token claim. A role carried in a token
                  is a snapshot good for as long as the token is, which means removing
                  somebody leaves them on the project for up to an hour — and removal is
                  the case where that delay matters most. See docs/AUTH.md, "Where
                  membership lives".

                  Entries merge per subject rather than by position (listType=map), so an
                  apply that adds one person cannot drop another.
                items:
                  description: AccessGrant is one account's role on a Project.
                  properties:
                    email:
                      description: |-
                        Email is informational: it is what makes a list of opaque subjects
                        readable in `kubectl get -o yaml` and in a git diff. Nothing resolves
                        against it — an entry that means to name an address puts the address in
                        Subject, and accepts the verified-email condition that comes with it.
                      type: string
                    role:
                      description: Role this subject holds on the Project.
                      enum:
                      - admin
                      - developer
                      - viewer
                      type: string
                    subject:
                      description: |-
                        Subject is the issuer's `sub` for the account, or an email address. A
                        value containing `@` is treated as an address and resolves against the
                        token's `email` claim only when `email_verified` is true, because an
                        unverified-email grant is a grant to whoever can claim that address at
                        the identity provider.
                      minLength: 1
                      type: string
                  required:
                  - role
                  - subject
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - subject
                x-kubernetes-list-type: map
              build:
                description: ProjectBuildSpec overrides platform build defaults for
                  one project.
                properties:
                  dockerfilePath:
                    default: Dockerfile
                    description: |-
                      Path to the Dockerfile, relative to RootDirectory. Used when the
                      strategy is (or resolves to) dockerfile.
                    type: string
                  rootDirectory:
                    default: .
                    description: Directory within the repository to build from (monorepo
                      support).
                    type: string
                  strategy:
                    default: auto
                    description: BuildStrategy selects how an image is produced from
                      a repository.
                    enum:
                    - auto
                    - dockerfile
                    - buildpacks
                    type: string
                type: object
              env:
                description: Environment variables, overlaid per environment type.
                items:
                  description: |-
                    EnvVar is a single environment variable for an application. Exactly one of
                    Value, SecretRef, or FromResourceClaim should be set. PreviewValue, when set,
                    replaces Value in preview environments.
                  properties:
                    fromResourceClaim:
                      description: Value taken from a ResourceClaim binding (e.g.
                        a provisioned database URL).
                      properties:
                        key:
                          minLength: 1
                          type: string
                        name:
                          minLength: 1
                          type: string
                      required:
                      - key
                      - name
                      type: object
                    name:
                      minLength: 1
                      type: string
                    previewValue:
                      description: Literal value used in preview environments instead
                        of Value.
                      type: string
                    secretRef:
                      description: Value taken from a Secret (typically synced from
                        Infisical).
                      properties:
                        key:
                          minLength: 1
                          type: string
                        name:
                          minLength: 1
                          type: string
                      required:
                      - key
                      - name
                      type: object
                    value:
                      description: Literal value.
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              previews:
                description: PreviewsSpec configures preview environments for pull
                  requests.
                properties:
                  enabled:
                    default: true
                    type: boolean
                  protected:
                    default: true
                    description: |-
                      Protected gates preview URLs behind platform login: the Environment's
                      route goes through the forward-auth gate, which sends anonymous
                      requests to the identity provider and only proxies signed-in ones to
                      the application. The application itself needs no changes. Production
                      environments are never gated.

                      It defaults to on, so unreleased work is not published to anyone who
                      guesses the URL. With no gate on the platform the Environment gets no
                      route at all rather than a public one — set this to false to serve
                      previews openly on purpose.
                    type: boolean
                  ttlAfterClosed:
                    description: |-
                      Grace period before a preview Environment is torn down after its
                      pull request closes.
                    type: string
                type: object
              registry:
                description: RegistrySpec selects where built images are stored.
                properties:
                  connectionRef:
                    description: Connection with the imageStore capability.
                    properties:
                      name:
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                required:
                - connectionRef
                type: object
              runtime:
                description: RuntimeSpec describes how an application runs.
                properties:
                  port:
                    description: |-
                      Container port the application listens on, and the value of PORT in
                      every environment.

                      Left unset it is derived from the framework the build detected — 8080
                      for a static site, 8000 for Python — and falls back to 3000 when
                      nothing was detected. It has no default for exactly that reason: a
                      default here would be indistinguishable from someone having chosen
                      3000, and detection would never get to answer.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  replicas:
                    default: 1
                    description: Replica count for production environments. Previews
                      always run 1.
                    format: int32
                    type: integer
                  resources:
                    description: Compute resources per replica.
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This is an alpha field and requires enabling the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                type: object
              scaleToZero:
                default: {}
                description: |-
                  Which of this Project's environments may idle down to no pods at all,
                  cold-starting on the next request. It does nothing unless the platform
                  runs the machinery for it — `spec.scaleToZero.enabled` on the Kitchen
                  object — and every environment then stays on plain Deployment routing.
                properties:
                  idleAfter:
                    default: 5m
                    description: |-
                      IdleAfter is how long an environment goes without a request before it
                      is scaled to zero. Shorter saves more and cold-starts more often.
                    type: string
                  maxReplicas:
                    default: 5
                    description: |-
                      MaxReplicas caps how far request pressure may scale an idling
                      environment up. It is raised to the environment's own replica count
                      where that is higher, so idling can never shrink an environment.
                    format: int32
                    minimum: 1
                    type: integer
                  mode:
                    default: previews
                    description: |-
                      ScaleToZeroMode says which of a Project's environments may idle down to no
                      pods at all.
                    enum:
                    - previews
                    - always
                    - never
                    type: string
                type: object
              source:
                description: GitSourceSpec links a Project to a repository via a gitSource
                  Connection.
                properties:
                  connectionRef:
                    description: Connection with the gitSource capability.
                    properties:
                      name:
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  productionBranch:
                    default: main
                    description: Branch whose builds auto-promote to the production
                      Environment.
                    type: string
                  repo:
                    description: Repository in the provider's owner/name form.
                    minLength: 1
                    type: string
                required:
                - connectionRef
                - repo
                type: object
            required:
            - registry
            - source
            type: object
          status:
            description: ProjectStatus defines the observed state of a Project.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              latestBuildRef:
                description: Most recently created Build.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              productionEnvironmentRef:
                description: The Project's production Environment, once created.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              webhookId:
                description: Provider-side identifier of the registered git webhook.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
