---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: projects.kitchen.bermos.dev
spec:
  group: kitchen.bermos.dev
  names:
    kind: Project
    listKind: ProjectList
    plural: projects
    singular: project
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.source.repo
      name: Repo
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Project is the Schema for the projects API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ProjectSpec defines the desired state of a Project: a repository that
              becomes a running application.
            properties:
              access:
                description: |-
                  Access is who may do what with this Project, and it is the whole of the
                  answer: an account with no entry here holds no role on the Project at
                  all, so it is not in their project list and not theirs to build,
                  redeploy or read. The one exception is a platform operator, who holds
                  admin on every project, present and future — see
                  `spec.access.operators` on the Kitchen singleton.

                  Membership lives here, on the object the access is about, rather than
                  in the identity provider or in a token claim. A role carried in a token
                  is a snapshot good for as long as the token is, which means removing
                  somebody leaves them on the project for up to an hour — and removal is
                  the case where that delay matters most. See docs/AUTH.md, "Where
                  membership lives".

                  Entries merge per subject rather than by position (listType=map), so an
                  apply that adds one person cannot drop another.
                items:
                  description: AccessGrant is one account's role on a Project.
                  properties:
                    email:
                      description: |-
                        Email is informational: it is what makes a list of opaque subjects
                        readable in `kubectl get -o yaml` and in a git diff. Nothing resolves
                        against it — an entry that means to name an address puts the address in
                        Subject, and accepts the verified-email condition that comes with it.
                      type: string
                    role:
                      description: Role this subject holds on the Project.
                      enum:
                      - admin
                      - developer
                      - viewer
                      type: string
                    subject:
                      description: |-
                        Subject is the issuer's `sub` for the account, or an email address. A
                        value containing `@` is treated as an address and resolves against the
                        token's `email` claim only when `email_verified` is true, because an
                        unverified-email grant is a grant to whoever can claim that address at
                        the identity provider.
                      minLength: 1
                      type: string
                  required:
                  - role
                  - subject
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - subject
                x-kubernetes-list-type: map
              build:
                description: ProjectBuildSpec overrides platform build defaults for
                  one project.
                properties:
                  dockerfilePath:
                    default: Dockerfile
                    description: |-
                      Path to the Dockerfile, relative to RootDirectory. Used when the
                      strategy is (or resolves to) dockerfile.
                    type: string
                  rootDirectory:
                    default: .
                    description: Directory within the repository to build from (monorepo
                      support).
                    type: string
                  strategy:
                    default: auto
                    description: BuildStrategy selects how an image is produced from
                      a repository.
                    enum:
                    - auto
                    - dockerfile
                    - buildpacks
                    type: string
                type: object
              criticality:
                description: |-
                  Criticality is how much it matters that this project's function keeps
                  working: nonCritical, important or critical. Absent means undesignated
                  — surfaced as such, never defaulted, because Kitchen does not decide
                  what is critical and must not appear to have. It is the institution's
                  input; what the platform does with it is map it onto the resources
                  that serve the function (GET /compliance/criticality) and let it
                  decide how loudly the environments running it alert.

                  A project's designation reaches its *production* environments as a
                  fallback and reaches its previews not at all — see
                  [EffectiveContinuity] for why criticality does not inherit the way a
                  data class does.
                enum:
                - nonCritical
                - important
                - critical
                type: string
              dataClass:
                description: |-
                  DataClass is the sensitivity classification of the data this project
                  handles: public, internal, confidential or strictlyConfidential, in
                  that order. Absent means unclassified — surfaced as such, never
                  defaulted. It is the parent of the classification hierarchy: a claim's
                  class may not exceed it (checked at the API), and at promotion the
                  policy engine checks it does not exceed the target environment's
                  (rule dataclass-le-environment). Reclassifying a project is always
                  possible — it makes environments below the new class non-compliant,
                  which the drift and inventory views surface rather than the API
                  refusing the correction.
                enum:
                - public
                - internal
                - confidential
                - strictlyConfidential
                type: string
              env:
                description: Environment variables, overlaid per environment type.
                items:
                  description: |-
                    EnvVar is a single environment variable for an application. Exactly one of
                    Value, SecretRef, or FromResourceClaim should be set. PreviewValue, when set,
                    replaces Value in preview environments.
                  properties:
                    fromResourceClaim:
                      description: Value taken from a ResourceClaim binding (e.g.
                        a provisioned database URL).
                      properties:
                        key:
                          minLength: 1
                          type: string
                        name:
                          minLength: 1
                          type: string
                      required:
                      - key
                      - name
                      type: object
                    name:
                      minLength: 1
                      type: string
                    previewValue:
                      description: Literal value used in preview environments instead
                        of Value.
                      type: string
                    secretRef:
                      description: Value taken from a Secret (typically synced from
                        Infisical).
                      properties:
                        key:
                          minLength: 1
                          type: string
                        name:
                          minLength: 1
                          type: string
                      required:
                      - key
                      - name
                      type: object
                    value:
                      description: Literal value.
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              previews:
                description: PreviewsSpec configures preview environments for pull
                  requests.
                properties:
                  enabled:
                    default: true
                    description: |-
                      Enabled says whether a pull request against this Project gets a preview
                      environment of its own. It defaults to on: the preview is the review
                      vehicle, and a project that wants pull requests generally wants them
                      looked at somewhere.

                      It is a pointer for the reason Protected next to it is: a plain bool
                      with omitempty cannot express false — the field is dropped from the
                      serialized object, and the API server then applies the default, so
                      turning previews off would be silently undone on every write.
                    type: boolean
                  protected:
                    default: true
                    description: |-
                      Protected gates preview URLs behind platform login: the Environment's
                      route goes through the forward-auth gate, which sends anonymous
                      requests to the identity provider and only proxies signed-in ones to
                      the application. The application itself needs no changes. Production
                      environments are never gated.

                      It defaults to on, so unreleased work is not published to anyone who
                      guesses the URL. With no gate on the platform the Environment gets no
                      route at all rather than a public one — set this to false to serve
                      previews openly on purpose.
                    type: boolean
                  ttlAfterClosed:
                    description: |-
                      Grace period before a preview Environment is torn down after its
                      pull request closes.
                    type: string
                type: object
              processes:
                description: |-
                  Processes are the project's other processes: the queue workers and the
                  scheduled jobs that share the web process's image and environment and
                  are started differently. The web process itself is `spec.runtime` and
                  is not listed here — see [ProcessType] for why it cannot be.

                  The list is snapshotted into every Release, so a rollback runs the
                  processes that release declared rather than the ones the project
                  declares now. Removing a process from the list is how it is deleted:
                  the environment reconciler tears down anything it materialized that
                  the current Release no longer names.

                  Entries merge per name rather than by position (listType=map), so two
                  people adding two workers do not drop each other's.
                items:
                  description: |-
                    ProcessSpec is one process of a Project besides its web process: the same
                    image, the same environment, started differently.

                    The Release is already the right unit — an immutable image plus a config
                    snapshot — so a worker and a scheduled job are not another build. They are
                    the build's image run with another command, which is why this list is
                    snapshotted into the Release along with the environment variables and the
                    runtime: rolling back runs the processes the rollback target declared, not
                    the ones the Project declares today.

                    The two rules test `has(self.schedule)` rather than comparing to an empty
                    string, and it is not only shorter: the field is `omitempty`, so an absent
                    schedule is an absent key and `has` is the exact question.

                    The health rules are the same shape of refusal rather than a silent
                    omission. A process publishes no container port of its own, so a health
                    check that named none would be a setting that read back and did nothing;
                    and a scheduled run's verdict is its exit status, not a probe.
                  properties:
                    args:
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: atomic
                    command:
                      description: |-
                        Command replaces the image's entrypoint, and Args its arguments. Both
                        are optional and both are exec form — a list of words, never a shell
                        line — which is the same reason the build jobs take two containers
                        instead of an `sh -c`: a string that reaches a shell is a string
                        somebody can put a `;` in.

                        A worker whose image already starts the right process needs neither. A
                        buildpacks-built image does: the buildpack chose a web server, and
                        `command: ["node", "worker.js"]` is how the same image becomes the
                        worker.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: atomic
                    concurrencyPolicy:
                      default: Forbid
                      description: |-
                        ConcurrencyPolicy is what happens when a run is due and the last one
                        has not finished.
                      enum:
                      - Allow
                      - Forbid
                      - Replace
                      type: string
                    health:
                      description: |-
                        Health is how the platform checks that a worker is working. It is
                        opt-in here where it is automatic for the web process, and the reason
                        is the same one that makes a worker cheap: nothing addresses it, so
                        there is no port to fall back on and no request whose failure would
                        otherwise show. A worker that serves a health listener says which port
                        on it; one that does not gets no probes, and its liveness is whether
                        its process is still running.
                      properties:
                        failureThreshold:
                          description: |-
                            FailureThreshold is how many checks in a row have to fail before a
                            running container is taken out of service — and, where the check is an
                            HTTP one, restarted. Defaults to DefaultProbeFailureThreshold.
                          format: int32
                          minimum: 1
                          type: integer
                        path:
                          description: |-
                            Path is the HTTP path the platform asks for. A 2xx or 3xx answer is
                            the application saying it is working.

                            **Left unset, the check is a TCP connect to the port instead.** That
                            is a weaker claim than an HTTP 200 and much better than asserting a
                            readiness nothing established. It is deliberately not `GET /`: plenty
                            of applications answer that before they are ready, and one that 404s
                            there would never become Ready at all.
                          maxLength: 253
                          pattern: ^/
                          type: string
                        periodSeconds:
                          description: |-
                            PeriodSeconds is how often the check is made. Defaults to
                            DefaultProbePeriodSeconds.
                          format: int32
                          minimum: 1
                          type: integer
                        port:
                          description: |-
                            Port the probe is made against, when it is not the port the
                            application is published on. A separate admin or metrics listener is
                            the usual reason.
                          format: int32
                          maximum: 65535
                          minimum: 1
                          type: integer
                        startupFailureThreshold:
                          description: |-
                            StartupFailureThreshold is the same count for a container that has not
                            answered yet, and it is generous — DefaultStartupFailureThreshold
                            checks, so a container has StartupFailureThreshold x PeriodSeconds to
                            come up before the platform gives up on it.

                            It is a separate number, and that is the whole point of a startup
                            probe: slow startup is a legitimate state, and a liveness threshold
                            loose enough to tolerate it is too loose to catch a wedge afterwards.
                          format: int32
                          minimum: 1
                          type: integer
                        timeoutSeconds:
                          description: |-
                            TimeoutSeconds is how long one check may take before it counts as a
                            failure. Defaults to DefaultProbeTimeoutSeconds.
                          format: int32
                          minimum: 1
                          type: integer
                      type: object
                    name:
                      description: |-
                        Name identifies the process within the project. It is a DNS label
                        because it appears in the name of everything the process
                        materializes — `<environment>-<name>` — and in the log query
                        vocabulary as `process:<name>`.

                        `web` is refused: the web process is `spec.runtime`, and a second
                        spelling of it would be a process nothing routes to answering to the
                        name of the one that is routed to.
                      maxLength: 48
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                      x-kubernetes-validations:
                      - message: the web process is spec.runtime, not a named process
                        rule: self != 'web'
                    previews:
                      default: false
                      description: |-
                        Previews says whether this process runs in preview environments too.

                        **It is off, and that is the decision rather than an omission.** A
                        preview that emails customers nightly is a bad afternoon, and a
                        preview worker draining the production queue is a worse one — the
                        preview shares the project's environment variables, so it is pointed
                        at whatever the production process is pointed at unless somebody
                        overrode it. One rule for both types, opted into per process: a
                        preview that should run its worker says so.
                      type: boolean
                    replicas:
                      default: 1
                      description: |-
                        Replicas is how many copies of a worker run. It is meaningless for a
                        scheduled process — how many run at once is ConcurrencyPolicy's
                        answer — and is ignored there rather than refused, so that changing a
                        process's type does not require deleting a field first.
                      format: int32
                      minimum: 0
                      type: integer
                    resources:
                      description: Resources is what one replica, or one run, asks
                        for.
                      properties:
                        claims:
                          description: |-
                            Claims lists the names of resources, defined in spec.resourceClaims,
                            that are used by this container.

                            This is an alpha field and requires enabling the
                            DynamicResourceAllocation feature gate.

                            This field is immutable. It can only be set for containers.
                          items:
                            description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                            properties:
                              name:
                                description: |-
                                  Name must match the name of one entry in pod.spec.resourceClaims of
                                  the Pod where this field is used. It makes that resource available
                                  inside a container.
                                type: string
                              request:
                                description: |-
                                  Request is the name chosen for a request in the referenced claim.
                                  If empty, everything from the claim is made available, otherwise
                                  only the result of this request.
                                type: string
                            required:
                            - name
                            type: object
                          type: array
                          x-kubernetes-list-map-keys:
                          - name
                          x-kubernetes-list-type: map
                        limits:
                          additionalProperties:
                            anyOf:
                            - type: integer
                            - type: string
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          description: |-
                            Limits describes the maximum amount of compute resources allowed.
                            More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                          type: object
                        requests:
                          additionalProperties:
                            anyOf:
                            - type: integer
                            - type: string
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          description: |-
                            Requests describes the minimum amount of compute resources required.
                            If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                            otherwise to an implementation-defined value. Requests cannot exceed Limits.
                            More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                          type: object
                      type: object
                    schedule:
                      description: |-
                        Schedule is the cron expression a scheduled process runs on, in the
                        five-field form `batch/v1` takes, interpreted in UTC. Required for a
                        cron process and refused on a worker, both at admission.
                      type: string
                    timeout:
                      description: |-
                        Timeout is how long one run may take before the platform stops it.
                        Defaults to an hour; see DefaultRunTimeout.
                      type: string
                    type:
                      description: |-
                        ProcessType is how one of a Project's processes runs.

                        There is deliberately no `web` here. A Project's web process is
                        `spec.runtime` — the port, the replica count and the resources of the thing
                        with the URL — and it is singular because the URL is: an Environment
                        publishes one hostname, one Service and one route, and a second process
                        claiming to be the web one would have to be told which of those it got. So
                        this list is what a Project has *besides* its web process, which is exactly
                        the gap #78 was filed for: a queue worker and a nightly job that today have
                        to be a second Project with a port nothing talks to.
                      enum:
                      - worker
                      - cron
                      type: string
                  required:
                  - name
                  - type
                  type: object
                  x-kubernetes-validations:
                  - message: a cron process needs a schedule
                    rule: self.type != 'cron' || has(self.schedule)
                  - message: a worker runs continuously and has no schedule; use type
                      cron
                    rule: self.type != 'worker' || !has(self.schedule)
                  - message: 'a process health check must name the port it is made
                      against: a process publishes no port of its own'
                    rule: '!has(self.health) || has(self.health.port)'
                  - message: a scheduled process is not kept alive by a health check;
                      how a run went is its exit status
                    rule: self.type != 'cron' || !has(self.health)
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              promotion:
                description: |-
                  Promotion is the project's staged pipeline, absent for the default
                  build-straight-to-production flow. The stages are topology — which
                  environments, in which order — and deliberately not policy: what each
                  environment demands lives on the Environment (spec.requirements), owned
                  by its owners, so the team that arranges the pipeline cannot lower any
                  stage's bar by rearranging it.
                properties:
                  stages:
                    description: |-
                      Stages, in promotion order. The order is the pipeline, so this is a
                      plain ordered list rather than a merge-by-name map.
                    items:
                      description: |-
                        PromotionStage is one rung of a project's promotion ladder: a name for the
                        rung, the Environment that is the rung, and whether an artifact climbs onto
                        the next one by itself.
                      properties:
                        autoPromote:
                          description: |-
                            AutoPromote creates the next Promotion into this stage automatically
                            when the stage before it applies successfully. Whether that promotion
                            then goes through is this stage's environment's own requirements —
                            evidence-gating an automatic promotion is a rule on the environment
                            (a required gate, a severity ceiling), not a second mechanism here.
                          type: boolean
                        environment:
                          description: |-
                            Environment names the Environment this stage deploys into. It must
                            belong to this project — validated where the stages are written and
                            where they are acted on, since a cross-object rule cannot live in CEL.
                            The first build for a stage creates the Environment if it is missing.
                          minLength: 1
                          type: string
                        name:
                          description: |-
                            Name of the stage — "staging", "production" — a DNS label so it can
                            appear in generated names.
                          maxLength: 63
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                      required:
                      - environment
                      - name
                      type: object
                    minItems: 1
                    type: array
                required:
                - stages
                type: object
              registry:
                description: RegistrySpec selects where built images are stored.
                properties:
                  connectionRef:
                    description: Connection with the imageStore capability.
                    properties:
                      name:
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                required:
                - connectionRef
                type: object
              rpo:
                description: |-
                  RPO is the recovery point objective: how much data this project's
                  function may lose. Same spelling as RTO.

                  Kitchen carries and maps it and does not yet alert on it, because the
                  platform observes no recovery points to measure it against — see
                  docs/OBSERVABILITY.md, "What an RPO would take".
                maxLength: 16
                minLength: 2
                pattern: ^([0-9]+h)?([0-9]+m)?$
                type: string
              rto:
                description: |-
                  RTO is the recovery time objective: how long this project's function
                  may be unavailable before the institution's own tolerance is breached.
                  A Go duration of whole hours and minutes — "4h", "30m". Absent means
                  no tolerance has been set, which is not the same as zero.
                maxLength: 16
                minLength: 2
                pattern: ^([0-9]+h)?([0-9]+m)?$
                type: string
              runtime:
                description: RuntimeSpec describes how an application runs.
                properties:
                  health:
                    description: |-
                      Health is how the platform checks that the application is working.
                      Every environment gets probes whether or not this is set — absent, they
                      are a TCP connect to the container port on the platform's default
                      timings — and setting it is how an application says what working means
                      for it.

                      Like the rest of RuntimeSpec it is snapshotted into the Release, so a
                      rollback restores the check the release was running with, and previews
                      inherit it from production.
                    properties:
                      failureThreshold:
                        description: |-
                          FailureThreshold is how many checks in a row have to fail before a
                          running container is taken out of service — and, where the check is an
                          HTTP one, restarted. Defaults to DefaultProbeFailureThreshold.
                        format: int32
                        minimum: 1
                        type: integer
                      path:
                        description: |-
                          Path is the HTTP path the platform asks for. A 2xx or 3xx answer is
                          the application saying it is working.

                          **Left unset, the check is a TCP connect to the port instead.** That
                          is a weaker claim than an HTTP 200 and much better than asserting a
                          readiness nothing established. It is deliberately not `GET /`: plenty
                          of applications answer that before they are ready, and one that 404s
                          there would never become Ready at all.
                        maxLength: 253
                        pattern: ^/
                        type: string
                      periodSeconds:
                        description: |-
                          PeriodSeconds is how often the check is made. Defaults to
                          DefaultProbePeriodSeconds.
                        format: int32
                        minimum: 1
                        type: integer
                      port:
                        description: |-
                          Port the probe is made against, when it is not the port the
                          application is published on. A separate admin or metrics listener is
                          the usual reason.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                      startupFailureThreshold:
                        description: |-
                          StartupFailureThreshold is the same count for a container that has not
                          answered yet, and it is generous — DefaultStartupFailureThreshold
                          checks, so a container has StartupFailureThreshold x PeriodSeconds to
                          come up before the platform gives up on it.

                          It is a separate number, and that is the whole point of a startup
                          probe: slow startup is a legitimate state, and a liveness threshold
                          loose enough to tolerate it is too loose to catch a wedge afterwards.
                        format: int32
                        minimum: 1
                        type: integer
                      timeoutSeconds:
                        description: |-
                          TimeoutSeconds is how long one check may take before it counts as a
                          failure. Defaults to DefaultProbeTimeoutSeconds.
                        format: int32
                        minimum: 1
                        type: integer
                    type: object
                  port:
                    description: |-
                      Container port the application listens on, and the value of PORT in
                      every environment.

                      Left unset it is derived from the framework the build detected — 8080
                      for a static site, 8000 for Python — and falls back to 3000 when
                      nothing was detected. It has no default for exactly that reason: a
                      default here would be indistinguishable from someone having chosen
                      3000, and detection would never get to answer.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  replicas:
                    default: 1
                    description: Replica count for production environments. Previews
                      always run 1.
                    format: int32
                    type: integer
                  resources:
                    description: Compute resources per replica.
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This is an alpha field and requires enabling the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
