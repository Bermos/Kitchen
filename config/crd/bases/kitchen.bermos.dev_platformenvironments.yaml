---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: platformenvironments.kitchen.bermos.dev
spec:
  group: kitchen.bermos.dev
  names:
    kind: PlatformEnvironment
    listKind: PlatformEnvironmentList
    plural: platformenvironments
    singular: platformenvironment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.dataClass
      name: DataClass
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PlatformEnvironment is an instance-wide policy environment ("production",
              "staging", ...): who owns it, what it demands, and what it serves.

              Runtime Environments remain per-project and bind to one of these.
            properties:
              criticality:
                description: |-
                  Criticality and RTO/RPO are the continuity designation for this policy
                  environment.
                enum:
                - nonCritical
                - important
                - critical
                type: string
              dataClass:
                description: DataClass is the highest sensitivity class this policy
                  environment admits.
                enum:
                - public
                - internal
                - confidential
                - strictlyConfidential
                type: string
              owners:
                description: |-
                  Owners name who may change this policy environment's governance
                  declaration. Platform operators always may.
                items:
                  type: string
                type: array
              requirements:
                description: |-
                  Requirements is the policy bundle and parameters runtime environments
                  bound to this policy environment are judged against.
                properties:
                  bundleDigest:
                    description: |-
                      BundleDigest names the policy bundle by its sha256, in the
                      `sha256:<64 hex>` form every artifact digest already uses. Anything
                      else is refused at admission.
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  parameters:
                    additionalProperties:
                      type: string
                    description: |-
                      Parameters reach the policy as input.parameters: the owner's tuning of
                      the bundle's rules — which gate to require, a severity ceiling —
                      without a bundle of their own for every environment.
                    type: object
                required:
                - bundleDigest
                type: object
              residency:
                description: Residency declares where this policy environment's data
                  is located.
                type: string
              rpo:
                description: |-
                  Tolerance is a disruption tolerance — an RTO or an RPO — written as a Go
                  duration of whole hours and minutes: "4h", "30m", "1h30m", "0m" for none at
                  all.

                  One spelling, enforced at admission, is the whole point. A number of minutes
                  would be unambiguous and unreadable; ISO 8601 would be readable to a
                  standards body and to nobody in a terminal. A Go duration is what every
                  other duration in these CRDs already is, and the pattern below is what stops
                  it from being the *other* Go durations: an RTO of 300ms is not a tolerance
                  anybody set, it is a unit somebody guessed. Because it is a string and not a
                  metav1.Duration it round-trips exactly — "4h" comes back "4h", not "4h0m0s"
                  — through the API, the CLI and the dashboard alike.
                maxLength: 16
                minLength: 2
                pattern: ^([0-9]+h)?([0-9]+m)?$
                type: string
              rto:
                description: |-
                  Tolerance is a disruption tolerance — an RTO or an RPO — written as a Go
                  duration of whole hours and minutes: "4h", "30m", "1h30m", "0m" for none at
                  all.

                  One spelling, enforced at admission, is the whole point. A number of minutes
                  would be unambiguous and unreadable; ISO 8601 would be readable to a
                  standards body and to nobody in a terminal. A Go duration is what every
                  other duration in these CRDs already is, and the pattern below is what stops
                  it from being the *other* Go durations: an RTO of 300ms is not a tolerance
                  anybody set, it is a unit somebody guessed. Because it is a string and not a
                  metav1.Duration it round-trips exactly — "4h" comes back "4h", not "4h0m0s"
                  — through the API, the CLI and the dashboard alike.
                maxLength: 16
                minLength: 2
                pattern: ^([0-9]+h)?([0-9]+m)?$
                type: string
              serves:
                description: |-
                  Serves is who may bind to offerings served from runtime environments that
                  bind to this policy environment.
                properties:
                  consumers:
                    description: |-
                      Consumers are the classes of consumer environment admitted here: a
                      production environment of another project, a stage of one, a preview
                      of one.

                      **Absent or empty serves nothing.** An environment nobody has rated
                      must not be one that whoever deploys into it can point previews at —
                      the same safe default Owners already takes, and the reason a claim
                      that resolves to an unrated environment is refused with the sentence
                      that would permit it rather than quietly binding to production.
                    items:
                      description: |-
                        EnvironmentType says what an Environment is for, and where it is
                        published: the project's production environment, a rung of its promotion
                        pipeline on the way there, or an ephemeral preview of one pull request.
                      enum:
                      - production
                      - stage
                      - preview
                      type: string
                    maxItems: 3
                    type: array
                type: object
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
