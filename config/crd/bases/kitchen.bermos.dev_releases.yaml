---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: releases.kitchen.bermos.dev
spec:
  group: kitchen.bermos.dev
  names:
    kind: Release
    listKind: ReleaseList
    plural: releases
    singular: release
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.projectRef.name
      name: Project
      type: string
    - jsonPath: .spec.buildRef.name
      name: Build
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Release is the Schema for the releases API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ReleaseSpec is an immutable snapshot: an image digest plus the configuration
              it should run with. Named Release (not Deployment) to avoid colliding with
              apps/v1 Deployment.
            properties:
              buildRef:
                description: |-
                  LocalObjectReference references another Kitchen object by name within the
                  platform namespace. Cross-namespace references are not supported in v1alpha1.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              configSnapshot:
                description: |-
                  ConfigSnapshot is a frozen copy of a Project's deployable configuration at
                  build time. Old Releases do not drift when the Project spec changes later,
                  which is what makes rollback exact.
                properties:
                  env:
                    items:
                      description: |-
                        EnvVar is a single environment variable for an application. Exactly one of
                        Value, SecretRef, or FromResourceClaim should be set. PreviewValue, when set,
                        replaces Value in preview environments.
                      properties:
                        fromResourceClaim:
                          description: Value taken from a ResourceClaim binding (e.g.
                            a provisioned database URL).
                          properties:
                            key:
                              minLength: 1
                              type: string
                            name:
                              minLength: 1
                              type: string
                          required:
                          - key
                          - name
                          type: object
                        name:
                          minLength: 1
                          type: string
                        previewValue:
                          description: Literal value used in preview environments
                            instead of Value.
                          type: string
                        secretRef:
                          description: Value taken from a Secret (typically synced
                            from Infisical).
                          properties:
                            key:
                              minLength: 1
                              type: string
                            name:
                              minLength: 1
                              type: string
                          required:
                          - key
                          - name
                          type: object
                        value:
                          description: Literal value.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  processes:
                    description: |-
                      Processes are the project's workers and scheduled jobs as they stood
                      when this Release was built. They are here for the same reason the
                      environment variables are: a rollback that ran today's worker command
                      against yesterday's image would not be a rollback.
                    items:
                      description: |-
                        ProcessSpec is one process of a Project besides its web process: the same
                        image, the same environment, started differently.

                        The Release is already the right unit — an immutable image plus a config
                        snapshot — so a worker and a scheduled job are not another build. They are
                        the build's image run with another command, which is why this list is
                        snapshotted into the Release along with the environment variables and the
                        runtime: rolling back runs the processes the rollback target declared, not
                        the ones the Project declares today.

                        The two rules test `has(self.schedule)` rather than comparing to an empty
                        string, and it is not only shorter: the field is `omitempty`, so an absent
                        schedule is an absent key and `has` is the exact question.

                        The health rules are the same shape of refusal rather than a silent
                        omission. A process publishes no container port of its own, so a health
                        check that named none would be a setting that read back and did nothing;
                        and a scheduled run's verdict is its exit status, not a probe.

                        The singleton rules are `RuntimeSpec`'s, read for a process. A worker is
                        exactly the workload that declaration was filed for and the one it did not
                        reach (#250), and it refuses a second replica rather than clamping one for
                        the same reason: a value silently lowered reads back as a setting that did
                        not take. A scheduled process is refused it outright, because whether two of
                        its runs may overlap is `concurrencyPolicy` — a second spelling of that
                        question would be a setting that reads back and does nothing.
                      properties:
                        args:
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                        command:
                          description: |-
                            Command replaces the image's entrypoint, and Args its arguments. Both
                            are optional and both are exec form — a list of words, never a shell
                            line — which is the same reason the build jobs take two containers
                            instead of an `sh -c`: a string that reaches a shell is a string
                            somebody can put a `;` in.

                            A worker whose image already starts the right process needs neither. A
                            buildpacks-built image does: the buildpack chose a web server, and
                            `command: ["node", "worker.js"]` is how the same image becomes the
                            worker.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                        concurrencyPolicy:
                          default: Forbid
                          description: |-
                            ConcurrencyPolicy is what happens when a run is due and the last one
                            has not finished.
                          enum:
                          - Allow
                          - Forbid
                          - Replace
                          type: string
                        health:
                          description: |-
                            Health is how the platform checks that a worker is working. It is
                            opt-in here where it is automatic for the web process, and the reason
                            is the same one that makes a worker cheap: nothing addresses it, so
                            there is no port to fall back on and no request whose failure would
                            otherwise show. A worker that serves a health listener says which port
                            on it; one that does not gets no probes, and its liveness is whether
                            its process is still running.
                          properties:
                            failureThreshold:
                              description: |-
                                FailureThreshold is how many checks in a row have to fail before a
                                running container is taken out of service — and, where the check is an
                                HTTP one, restarted. Defaults to DefaultProbeFailureThreshold.
                              format: int32
                              minimum: 1
                              type: integer
                            path:
                              description: |-
                                Path is the HTTP path the platform asks for. A 2xx or 3xx answer is
                                the application saying it is working.

                                **Left unset, the check is a TCP connect to the port instead.** That
                                is a weaker claim than an HTTP 200 and much better than asserting a
                                readiness nothing established. It is deliberately not `GET /`: plenty
                                of applications answer that before they are ready, and one that 404s
                                there would never become Ready at all.
                              maxLength: 253
                              pattern: ^/
                              type: string
                            periodSeconds:
                              description: |-
                                PeriodSeconds is how often the check is made. Defaults to
                                DefaultProbePeriodSeconds.
                              format: int32
                              minimum: 1
                              type: integer
                            port:
                              description: |-
                                Port the probe is made against, when it is not the port the
                                application is published on. A separate admin or metrics listener is
                                the usual reason.
                              format: int32
                              maximum: 65535
                              minimum: 1
                              type: integer
                            startupFailureThreshold:
                              description: |-
                                StartupFailureThreshold is the same count for a container that has not
                                answered yet, and it is generous — DefaultStartupFailureThreshold
                                checks, so a container has StartupFailureThreshold x PeriodSeconds to
                                come up before the platform gives up on it.

                                It is a separate number, and that is the whole point of a startup
                                probe: slow startup is a legitimate state, and a liveness threshold
                                loose enough to tolerate it is too loose to catch a wedge afterwards.
                              format: int32
                              minimum: 1
                              type: integer
                            timeoutSeconds:
                              description: |-
                                TimeoutSeconds is how long one check may take before it counts as a
                                failure. Defaults to DefaultProbeTimeoutSeconds.
                              format: int32
                              minimum: 1
                              type: integer
                          type: object
                        name:
                          description: |-
                            Name identifies the process within the project. It is a DNS label
                            because it appears in the name of everything the process
                            materializes — `<environment>-<name>` — and in the log query
                            vocabulary as `process:<name>`.

                            `web` is refused: the web process is `spec.runtime`, and a second
                            spelling of it would be a process nothing routes to answering to the
                            name of the one that is routed to.
                          maxLength: 48
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                          x-kubernetes-validations:
                          - message: the web process is spec.runtime, not a named
                              process
                            rule: self != 'web'
                        previews:
                          default: false
                          description: |-
                            Previews says whether this process runs in preview environments too.

                            **It is off, and that is the decision rather than an omission.** A
                            preview that emails customers nightly is a bad afternoon, and a
                            preview worker draining the production queue is a worse one — the
                            preview shares the project's environment variables, so it is pointed
                            at whatever the production process is pointed at unless somebody
                            overrode it. One rule for both types, opted into per process: a
                            preview that should run its worker says so.
                          type: boolean
                        replicas:
                          default: 1
                          description: |-
                            Replicas is how many copies of a worker run. It is meaningless for a
                            scheduled process — how many run at once is ConcurrencyPolicy's
                            answer — and is ignored there rather than refused, so that changing a
                            process's type does not require deleting a field first.
                          format: int32
                          minimum: 0
                          type: integer
                        resources:
                          description: Resources is what one replica, or one run,
                            asks for.
                          properties:
                            claims:
                              description: |-
                                Claims lists the names of resources, defined in spec.resourceClaims,
                                that are used by this container.

                                This is an alpha field and requires enabling the
                                DynamicResourceAllocation feature gate.

                                This field is immutable. It can only be set for containers.
                              items:
                                description: ResourceClaim references one entry in
                                  PodSpec.ResourceClaims.
                                properties:
                                  name:
                                    description: |-
                                      Name must match the name of one entry in pod.spec.resourceClaims of
                                      the Pod where this field is used. It makes that resource available
                                      inside a container.
                                    type: string
                                  request:
                                    description: |-
                                      Request is the name chosen for a request in the referenced claim.
                                      If empty, everything from the claim is made available, otherwise
                                      only the result of this request.
                                    type: string
                                required:
                                - name
                                type: object
                              type: array
                              x-kubernetes-list-map-keys:
                              - name
                              x-kubernetes-list-type: map
                            limits:
                              additionalProperties:
                                anyOf:
                                - type: integer
                                - type: string
                                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                x-kubernetes-int-or-string: true
                              description: |-
                                Limits describes the maximum amount of compute resources allowed.
                                More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                              type: object
                            requests:
                              additionalProperties:
                                anyOf:
                                - type: integer
                                - type: string
                                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                x-kubernetes-int-or-string: true
                              description: |-
                                Requests describes the minimum amount of compute resources required.
                                If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                                otherwise to an implementation-defined value. Requests cannot exceed Limits.
                                More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                              type: object
                          type: object
                        schedule:
                          description: |-
                            Schedule is the cron expression a scheduled process runs on, in the
                            five-field form `batch/v1` takes, interpreted in UTC. Required for a
                            cron process and refused on a worker, both at admission.
                          type: string
                        singleton:
                          description: |-
                            Singleton says two of this worker must never run at once.

                            It is `RuntimeSpec.Singleton` for a process, and it exists because the
                            web process is the one that least needed it. A poller moved out of the
                            web binary into a worker — which is the arrangement that makes the web
                            process safely scalable — would otherwise lose the guarantee it had by
                            staying in it: a worker takes the API server's default rolling update,
                            which at one replica surges to two copies on every rollout.

                            What it does is what it does for the web process: `strategy: Recreate`
                            on the Deployment, so the old pod stops before the new one starts. A
                            worker is not addressed, so the gap that costs the web process a few
                            seconds of serving costs a worker only a few seconds of not consuming.
                            It refuses Replicas above one rather than clamping it, and it is
                            refused on a scheduled process, whose answer to the same question is
                            ConcurrencyPolicy.

                            One replica does not imply it, and deliberately: a queue consumer at
                            one replica is usually fine overlapping, and inferring the constraint
                            from the count would make the count mean two things.
                          type: boolean
                        timeout:
                          description: |-
                            Timeout is how long one run may take before the platform stops it.
                            Defaults to an hour; see DefaultRunTimeout.
                          type: string
                        type:
                          description: |-
                            ProcessType is how one of a Project's processes runs.

                            There is deliberately no `web` here. A Project's web process is
                            `spec.runtime` — the port, the replica count and the resources of the thing
                            with the URL — and it is singular because the URL is: an Environment
                            publishes one hostname, one Service and one route, and a second process
                            claiming to be the web one would have to be told which of those it got. So
                            this list is what a Project has *besides* its web process, which is exactly
                            the gap #78 was filed for: a queue worker and a nightly job that today have
                            to be a second Project with a port nothing talks to.
                          enum:
                          - worker
                          - cron
                          type: string
                      required:
                      - name
                      - type
                      type: object
                      x-kubernetes-validations:
                      - message: a cron process needs a schedule
                        rule: self.type != 'cron' || has(self.schedule)
                      - message: a worker runs continuously and has no schedule; use
                          type cron
                        rule: self.type != 'worker' || !has(self.schedule)
                      - message: 'a process health check must name the port it is
                          made against: a process publishes no port of its own'
                        rule: '!has(self.health) || has(self.health.port)'
                      - message: a scheduled process is not kept alive by a health
                          check; how a run went is its exit status
                        rule: self.type != 'cron' || !has(self.health)
                      - message: 'only a worker can be a singleton: whether two runs
                          of a scheduled process may overlap is concurrencyPolicy,
                          and Forbid is its default'
                        rule: '!has(self.singleton) || !self.singleton || self.type
                          == ''worker'''
                      - message: 'a singleton worker cannot run more than one replica:
                          leave replicas at 1, or turn singleton off'
                        rule: '!has(self.singleton) || !self.singleton || !has(self.replicas)
                          || self.replicas <= 1'
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  runtime:
                    description: |-
                      RuntimeSpec describes how an application runs.

                      The singleton rule is a refusal rather than a clamp, and deliberately: a
                      value silently lowered reads back as a setting that did not take, and the
                      project would go on believing it runs three. `has(self.singleton)` is the
                      exact question for an `omitempty` bool — false is an absent key — and the
                      replicas half has to allow an absent one too, since the CRD's own default
                      only fills it in on a write.
                    properties:
                      args:
                        items:
                          type: string
                        type: array
                        x-kubernetes-list-type: atomic
                      command:
                        description: |-
                          Command replaces the image's entrypoint, and Args its arguments —
                          the same two fields a ProcessSpec has, in the same exec form: a list
                          of words, never a shell line, for the same reason the build jobs take
                          two containers instead of an `sh -c`.

                          Plenty of programs are configured by flags rather than by environment
                          variables, and the alternative was an entrypoint script in every
                          project translating one into the other — which is precisely the
                          per-project boilerplate Kitchen exists to delete.

                          The `PORT` contract is untouched: a buildpacks-built image still reads
                          it, and an image started with a command of its own is free to ignore
                          it exactly as a Dockerfile build already could.
                        items:
                          type: string
                        type: array
                        x-kubernetes-list-type: atomic
                      health:
                        description: |-
                          Health is how the platform checks that the application is working.
                          Every environment gets probes whether or not this is set — absent, they
                          are a TCP connect to the container port on the platform's default
                          timings — and setting it is how an application says what working means
                          for it.

                          Like the rest of RuntimeSpec it is snapshotted into the Release, so a
                          rollback restores the check the release was running with, and previews
                          inherit it from production.
                        properties:
                          failureThreshold:
                            description: |-
                              FailureThreshold is how many checks in a row have to fail before a
                              running container is taken out of service — and, where the check is an
                              HTTP one, restarted. Defaults to DefaultProbeFailureThreshold.
                            format: int32
                            minimum: 1
                            type: integer
                          path:
                            description: |-
                              Path is the HTTP path the platform asks for. A 2xx or 3xx answer is
                              the application saying it is working.

                              **Left unset, the check is a TCP connect to the port instead.** That
                              is a weaker claim than an HTTP 200 and much better than asserting a
                              readiness nothing established. It is deliberately not `GET /`: plenty
                              of applications answer that before they are ready, and one that 404s
                              there would never become Ready at all.
                            maxLength: 253
                            pattern: ^/
                            type: string
                          periodSeconds:
                            description: |-
                              PeriodSeconds is how often the check is made. Defaults to
                              DefaultProbePeriodSeconds.
                            format: int32
                            minimum: 1
                            type: integer
                          port:
                            description: |-
                              Port the probe is made against, when it is not the port the
                              application is published on. A separate admin or metrics listener is
                              the usual reason.
                            format: int32
                            maximum: 65535
                            minimum: 1
                            type: integer
                          startupFailureThreshold:
                            description: |-
                              StartupFailureThreshold is the same count for a container that has not
                              answered yet, and it is generous — DefaultStartupFailureThreshold
                              checks, so a container has StartupFailureThreshold x PeriodSeconds to
                              come up before the platform gives up on it.

                              It is a separate number, and that is the whole point of a startup
                              probe: slow startup is a legitimate state, and a liveness threshold
                              loose enough to tolerate it is too loose to catch a wedge afterwards.
                            format: int32
                            minimum: 1
                            type: integer
                          timeoutSeconds:
                            description: |-
                              TimeoutSeconds is how long one check may take before it counts as a
                              failure. Defaults to DefaultProbeTimeoutSeconds.
                            format: int32
                            minimum: 1
                            type: integer
                        type: object
                      notRequestDriven:
                        description: |-
                          NotRequestDriven says this workload does work nobody asked for.

                          Scale to zero is request-driven by construction: the HTTP add-on parks
                          an environment nobody is asking for and the interceptor brings it back
                          on the next request to its URL. For an application that works only
                          when asked, that is free money. An application with a background loop
                          parked stops — and stops silently. The hole that leaves in whatever it
                          was collecting is indistinguishable from the upstream having been
                          down, which is worse than the pods simply being gone: the environment
                          comes back, serves, and reports nothing wrong, while its data has a
                          gap in it that means something it did not do.

                          Setting it turns idling off for every environment of the Project —
                          previews included, which is where it matters, since previews idle by
                          default and a preview pointed at a real datastore will quietly write a
                          partial record of a period it was asleep for. The Environment says so
                          in its ScaleToZero condition rather than merely not idling.

                          It lives here, on the runtime, because it describes what the workload
                          *is* rather than what it costs — but the idling decision reads the
                          Project's live value, not the Release's frozen copy, for exactly the
                          reason `ScaleToZeroPolicy` is not snapshotted either: rolling back
                          must not quietly un-park an environment, and saying "this one must not
                          be parked" must not have to wait for a build.
                        type: boolean
                      port:
                        description: |-
                          Container port the application listens on, and the value of PORT in
                          every environment.

                          Left unset it is derived from the framework the build detected — 8080
                          for a static site, 8000 for Python — and falls back to 3000 when
                          nothing was detected. It has no default for exactly that reason: a
                          default here would be indistinguishable from someone having chosen
                          3000, and detection would never get to answer.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                      previewArgs:
                        description: |-
                          PreviewArgs replaces Args in preview environments, and is the sibling
                          of EnvVar.PreviewValue — the same idea for the same reason. A preview
                          runs against a fake or a seeded data source where production runs
                          against the real one, from the same commit and the same artifact,
                          because the artifact is built once and never rebuilt.

                          It replaces the list rather than extending it: an override that
                          appended could not remove a flag, and removing one is half of what a
                          preview wants. An empty list is no override, exactly as an empty
                          PreviewValue is — the sibling is the sibling all the way down, and it
                          is what lets an override be taken away through an API that never
                          distinguishes an absent field from a cleared one.
                        items:
                          type: string
                        type: array
                        x-kubernetes-list-type: atomic
                      replicas:
                        default: 1
                        description: Replica count for production environments. Previews
                          always run 1.
                        format: int32
                        type: integer
                      resources:
                        description: Compute resources per replica.
                        properties:
                          claims:
                            description: |-
                              Claims lists the names of resources, defined in spec.resourceClaims,
                              that are used by this container.

                              This is an alpha field and requires enabling the
                              DynamicResourceAllocation feature gate.

                              This field is immutable. It can only be set for containers.
                            items:
                              description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                              properties:
                                name:
                                  description: |-
                                    Name must match the name of one entry in pod.spec.resourceClaims of
                                    the Pod where this field is used. It makes that resource available
                                    inside a container.
                                  type: string
                                request:
                                  description: |-
                                    Request is the name chosen for a request in the referenced claim.
                                    If empty, everything from the claim is made available, otherwise
                                    only the result of this request.
                                  type: string
                              required:
                              - name
                              type: object
                            type: array
                            x-kubernetes-list-map-keys:
                            - name
                            x-kubernetes-list-type: map
                          limits:
                            additionalProperties:
                              anyOf:
                              - type: integer
                              - type: string
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            description: |-
                              Limits describes the maximum amount of compute resources allowed.
                              More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                            type: object
                          requests:
                            additionalProperties:
                              anyOf:
                              - type: integer
                              - type: string
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            description: |-
                              Requests describes the minimum amount of compute resources required.
                              If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                              otherwise to an implementation-defined value. Requests cannot exceed Limits.
                              More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                            type: object
                        type: object
                      security:
                        description: |-
                          Security is the posture every workload of this project runs under —
                          the web process, its workers and its scheduled runs alike, because
                          they are one image and a posture is a property of the image rather
                          than of the command it is started with.

                          A project that declares nothing still gets [SecuritySpec]'s default,
                          which is the platform's and not the image's. Like the rest of
                          RuntimeSpec it is snapshotted into the Release, so a rollback restores
                          the posture that release ran under.
                        properties:
                          allowPrivilegeEscalation:
                            description: |-
                              AllowPrivilegeEscalation puts back the one default the platform
                              tightens on the container. Left alone, no process in the container can
                              gain more privileges than its parent — `no_new_privs`, which is what
                              stops a setuid binary being a way out of the user the container runs
                              as. An image that legitimately needs one (`sudo`, a setuid helper) says
                              so here rather than losing it silently.
                            type: boolean
                          dropCapabilities:
                            description: |-
                              DropCapabilities are the Linux capabilities taken away from the
                              containers, in the kernel's own spelling without the `CAP_` prefix —
                              `NET_RAW`, `SYS_ADMIN` — or the single entry `ALL`.

                              There is deliberately no list of capabilities to *add*. The platform
