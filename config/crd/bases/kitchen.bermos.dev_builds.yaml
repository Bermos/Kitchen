                                    - `vendor-asserted`: somebody else published it on the digest, and
                                      the platform checked it describes that digest and restated it
                                      under its own key. It is the vendor's claim, not the platform's;
                                    - `platform-observed`: the platform produced it by looking at an
                                      image it only pulled — a bill of materials generated over a
                                      digest nobody here compiled. It is an observation, and it is
                                      never presented as the vendor's word.

                                  The distinction matters to anyone reading the evidence. The platform's
                                  signature is on all four, so the signature cannot tell them apart, and
                                  a claim about what a build did is worth more when the thing that did
                                  the building made it — just as a bill of materials the vendor stands
                                  behind is a different artefact from one the platform derived by
                                  unpacking layers.
                                enum:
                                - builder
                                - platform
                                - vendor-asserted
                                - platform-observed
                                type: string
                            required:
                            - predicateType
                            type: object
                          type: array
                        keyID:
                          description: |-
                            KeyID is the signing key the build record was signed under, which is
                            what a verifier matches against the published public key.
                          type: string
                        message:
                          description: |-
                            Message explains an artifact the platform could not attest. An
                            unattested artifact is not a failed build — the image is real and the
                            deployment is honest — but it is one that no policy requiring evidence
                            will ever let move, which is where that fact is meant to bite.
                          type: string
                        observedSBOM:
                          description: |-
                            ObservedSBOM is what became of the platform's own attempt to describe
                            what is inside an image it did not build. It is absent for a built
                            artifact, whose bill of materials comes from the builder; absent where
                            the vendor published one — the publisher's is the better evidence, and
                            a generated one beside it would be a second answer to one question —
                            and absent again where the installation turned generation off.
                          properties:
                            finishedAt:
                              description: FinishedAt is when the run ended.
                              format: date-time
                              type: string
                            generator:
                              description: |-
                                Generator is the image that produced it, so a reader can tell which
                                tool's view of the artifact this is — two scanners disagree about what
                                is in an image far more often than either admits.
                              type: string
                            job:
                              description: Job is the Job in the application namespace,
                                while it exists.
                              type: string
                            message:
                              description: |-
                                Message explains a generation that did not happen, or output that
                                could not be attested.
                              type: string
                            phase:
                              description: Phase is what became of the run.
                              enum:
                              - Pending
                              - Running
                              - Completed
                              - Failed
                              - Skipped
                              type: string
                            predicateType:
                              description: |-
                                PredicateType is what the generated document was attested under —
                                SPDX's or CycloneDX's, whichever the generator emitted. The platform
                                records what came out rather than converting it.
                              type: string
                          type: object
                        repository:
                          description: Repository the image was pushed to, without
                            a tag or digest.
                          type: string
                        sourceType:
                          description: |-
                            SourceType says where this artifact's evidence comes from, which is a
                            different question from who signed it and a different one again from
                            who made each claim (`Evidence[].Source`).

                            It has one value today and that is the point: every artifact Kitchen
                            holds evidence about is an artifact Kitchen built, so the enum reads
                            `built` everywhere and says so explicitly rather than by silence. An
                            artifact the platform did not build carries evidence of a different
                            kind — a vendor's own assertions, or the platform's observations of
                            something it only pulled — and the reader has to be able to tell them
                            apart *without* knowing which release of Kitchen wrote the field. So
                            the enum exists now, with one value, and gains values rather than
                            gaining a shape.
                          enum:
                          - built
                          - vendored
                          type: string
                        upstream:
                          description: |-
                            Upstream is where a vendored artifact came from and what the platform
                            established about the vendor's own signature on it. It is absent for
                            an artifact this platform built, which has no upstream: the build is
                            the origin, and `Evidence` carries the account of it.
                          properties:
                            admittedAt:
                              description: AdmittedAt is when.
                              format: date-time
                              type: string
                            admittedBy:
                              description: |-
                                AdmittedBy is who brought this digest onto the platform: the
                                authenticated caller that asked for the acquisition where one did, and
                                the reconciler that acted otherwise (`system:controller/...`). It is
                                never blank and never "the operator" — an adoption nobody is named for
                                is an adoption nothing can be asked about, and the four-eyes rule
                                digest-approved-by-someone-else is written against exactly this field.
                              type: string
                            pullConnection:
                              description: |-
                                PullConnection is the Connection the image was pulled with, empty for
                                an anonymous pull of a public image.
                              type: string
                            reference:
                              description: |-
                                Reference is what the project declared, as written — a tag most of the
                                time, which is exactly why the digest beside it is recorded separately.
                              type: string
                            repository:
                              description: Repository the artifact was pulled from,
                                without a tag or digest.
                              type: string
                            signature:
                              description: Signature is what became of the vendor's
                                own signature on the digest.
                              properties:
                                identity:
                                  description: |-
                                    Identity is who the signature was required to name: the identity the
                                    project or its Connection named, and empty where a key alone was asked
                                    for — a key-based check is complete without one. It is the
                                    *configured* identity rather than one read out of the signature,
                                    because a subject copied out of an unverified certificate is a claim
                                    by whoever wrote the certificate.
                                  type: string
                                message:
                                  description: |-
                                    Message explains an `unverifiable`, in the words of whatever could not
                                    be established. It is empty for `verified` and for `none`, both of
                                    which are complete facts on their own.
                                  type: string
                                result:
                                  description: Result is the fact. See UpstreamSignatureResult.
                                  enum:
                                  - verified
                                  - unverifiable
                                  - none
                                  type: string
                                signatures:
                                  description: |-
                                    Signatures is how many signatures were found attached to the digest.
                                    Zero with Result `none` is the ordinary unsigned image; more than zero
                                    with `unverifiable` is the case worth looking at.
                                  format: int32
                                  type: integer
                              type: object
                            vendorAttestations:
                              description: |-
                                VendorAttestations counts the statements the vendor published on this
                                digest that the platform restated and signed. Zero is ordinary: most
                                images carry nothing at all.
                              format: int32
                              type: integer
                          type: object
                      type: object
                    detectedFramework:
                      description: |-
                        DetectedFramework is what `strategy: auto` made of this workload's own
                        root directory — `dockerfile` where it found one, the framework it
                        recognised otherwise. It is empty for a workload that named its
                        strategy, which asked detection nothing.

                        It is per workload rather than folded into the Build's own
                        `detectedFramework` because a unit is several directories: the field
                        above is the project's own image, and a monorepo whose API is a
                        Dockerfile and whose worker is Python has two answers, not one.
                      type: string
                    dockerfileTarget:
                      description: |-
                        DockerfileTarget is the stage of this workload's Dockerfile its build
                        was told to produce, empty for the file's last stage. It is recorded
                        beside the rest of this workload's outcome, and for the reason the
                        Build records its own: the setting moves and the image does not, so an
                        old build reads as the artifacts it actually shipped rather than as
                        the ones today's settings would produce.
                      type: string
                    gates:
                      description: |-
                        Gates is what each quality gate did over *this workload's* artifact.
                        A gate is a claim about an image, so a unit of several images runs
                        each gate once per image and records each run against the image it
                        ran over — the Build's own `status.gates` being the web process's.
                      items:
                        description: |-
                          QualityGateStatus is one gate's run over one artifact.

                          It says whether the gate ran and whether its findings were signed. It does
                          not say whether the findings were acceptable, because nothing at this level
                          knows: that is a policy question about the environment an artifact is being
                          promoted to, and it is answered at promotion.
                        properties:
                          attested:
                            description: |-
                              Attested is when the findings were signed and attached. Absent on a
                              gate that ran but whose findings could not be attested — which is a
                              gate that produced no evidence, and is worth telling apart from one
                              that never ran.
                            format: date-time
                            type: string
                          finishedAt:
                            description: FinishedAt is when the run ended.
                            format: date-time
                            type: string
                          message:
                            description: |-
                              Message explains a gate that did not run, or findings that were not
                              attested. It never carries findings: those are in the attestation, in
                              the registry, against the artifact's digest.
                            type: string
                          name:
                            description: Name is the gate's, from the platform configuration.
                            type: string
                          phase:
                            description: |-
                              Phase is what became of the run. `Completed` means the gate ran and
                              its findings were recorded, whatever they were.
                            enum:
                            - Pending
                            - Running
                            - Completed
                            - Failed
                            - Skipped
                            type: string
                          predicateType:
                            description: |-
                              PredicateType is what the gate's attestation was written under, so a
                              reader can find it among everything else attached to the artifact.
                            type: string
                          reportedBy:
                            description: |-
                              ReportedBy names the identity that submitted an external result. It is
                              empty for a gate the platform ran, where the platform is the answer.
                            type: string
                          source:
                            description: |-
                              Source says where the result came from: `platform` for a gate Kitchen
                              ran, `external` for one ingested from somewhere that ran it already —
                              an application's own CI, usually. An external result is evidence about
                              who reported it as much as about what it says, which is why the two are
                              never merged into one word.
                            enum:
                            - platform
                            - external
                            type: string
                        required:
                        - name
                        type: object
                      type: array
