                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              detectedFramework:
                description: Framework detected by the auto strategy (e.g. nextjs,
                  vite, static).
                type: string
              image:
                description: Image reference by digest, never by tag.
                type: string
              phase:
                description: BuildPhase is the coarse lifecycle summary of a Build.
                enum:
                - Queued
                - Running
                - Succeeded
                - Failed
                - Cancelled
                type: string
              startedAt:
                format: date-time
                type: string
            type: object
