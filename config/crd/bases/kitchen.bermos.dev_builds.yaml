---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: builds.kitchen.bermos.dev
spec:
  group: kitchen.bermos.dev
  names:
    kind: Build
    listKind: BuildList
    plural: builds
    singular: build
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.projectRef.name
      name: Project
      type: string
    - jsonPath: .spec.git.branch
      name: Branch
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Build is the Schema for the builds API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              BuildSpec defines one build execution for one commit. Builds are immutable:
              a rebuild is a new Build object.
            properties:
              git:
                description: GitRevision identifies the commit a Build builds.
                properties:
                  author:
                    type: string
                  body:
                    description: |-
                      Body is the rest of the commit message, under the subject: what the
                      commit says about itself at length, kept so that a build can be asked
                      and not only skimmed. Empty for the great majority of commits, which
                      have no body at all, and cut at CommitBodyLimit for the few that have a
                      long one. The schema's limit is that cut plus a little: it counts
                      characters where the cut counts bytes, and the ellipsis marking a cut
                      body is one more.
                    maxLength: 4100
                    type: string
                  branch:
                    minLength: 1
                    type: string
                  message:
                    description: |-
                      Message is the commit's *subject* — its first line and nothing else.
                      Every surface the platform shows it on is a row in a table: a build
                      list, a release list, the command palette, an audit pack. Writers split
                      a message with SplitCommitMessage rather than each reader trimming what
                      it was given.
                    type: string
                  pullRequest:
                    description: Pull request number, when the commit belongs to one.
                    format: int32
                    type: integer
                  sha:
                    minLength: 7
                    type: string
                required:
                - branch
                - sha
                type: object
              projectRef:
                description: |-
                  LocalObjectReference references another Kitchen object by name within the
                  platform namespace. Cross-namespace references are not supported in v1alpha1.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - git
            - projectRef
            type: object
            x-kubernetes-validations:
            - message: Build spec is immutable
              rule: self == oldSelf
          status:
            description: BuildStatus defines the observed state of a Build.
            properties:
              artifact:
                description: |-
                  Artifact is what the build produced, identified by content rather than
                  by name, and what the platform has asserted about it.
                properties:
                  attestedAt:
                    description: |-
                      AttestedAt is when the platform attached its own build record to the
                      digest.
                    format: date-time
                    type: string
                  digest:
                    description: |-
                      Digest of the image manifest, as `sha256:…`. Empty when the builder
                      pushed successfully but did not report a digest, which is the one case
                      where the platform has an image it cannot make claims about.
                    type: string
                  evidence:
                    description: |-
                      Evidence lists what is now attached to the digest, by predicate type.

                      It is an index, not a copy: the attestations themselves stay in the
                      registry, and this says which of them exist so that a screen can show
                      "provenance and an SBOM are attached" without a registry round trip.
                      A reader that needs the content asks the registry, or asks the API for
                      the materialized evidence set, and either way gets the signed bytes
                      rather than this summary.
                    items:
                      description: |-
                        ArtifactEvidence names one attestation attached to an artifact.

                        It carries the predicate type and nothing that interprets it. Which claims
                        count as provenance, and which formats of bill of materials are acceptable,
                        are policy questions, and phase three is where policy lives — a status field
                        that answered them here would be a verdict, and gates do not emit verdicts.
                      properties:
                        manifest:
                          description: |-
                            Manifest is the digest of the manifest that refers to the artifact and
                            holds this evidence, which is where a reader goes to fetch it without
                            listing anything.
                          type: string
                        predicateType:
                          description: |-
                            PredicateType is the URI of what the attestation asserts: SLSA's for
                            provenance, SPDX's or CycloneDX's for a bill of materials, one of
                            Kitchen's own for a claim no standard covers.
                          type: string
                        source:
                          description: |-
                            Source says who made the claim this evidence carries: `builder` for
                            one the build process itself produced and the platform countersigned,
                            `platform` for one the reconciler made on its own account.

                            The distinction matters to anyone reading the evidence. The platform's
                            signature is on both, so the signature cannot tell them apart, and a
                            claim about what a build did is worth more when the thing that did the
                            building made it.
                          enum:
                          - builder
                          - platform
                          type: string
                      required:
                      - predicateType
                      type: object
                    type: array
                  keyID:
                    description: |-
                      KeyID is the signing key the build record was signed under, which is
                      what a verifier matches against the published public key.
                    type: string
                  message:
                    description: |-
                      Message explains an artifact the platform could not attest. An
                      unattested artifact is not a failed build — the image is real and the
                      deployment is honest — but it is one that no policy requiring evidence
                      will ever let move, which is where that fact is meant to bite.
                    type: string
                  repository:
                    description: Repository the image was pushed to, without a tag
                      or digest.
                    type: string
                type: object
              cache:
                description: |-
                  Cache is what the layer cache did for this build. Absent on a build
                  that never got as far as being run.
                properties:
                  enabled:
                    description: |-
                      Enabled is whether this build imported from and exported to the cache.
                      False with a Message is a cache the platform turned off for a reason;
                      false without one is an installation that asked for no caching.
                    type: boolean
                  message:
                    description: |-
                      Message explains a cache that is not there: the first build of a
                      project, or a registry that would not keep the cache manifest.
                    type: string
                  mode:
                    description: |-
                      Mode is how much of the build was exported: max or min. Empty for a
                      buildpacks build, whose lifecycle has one cache image and no such
                      choice.
                    enum:
                    - max
                    - min
                    type: string
                  ref:
                    description: |-
                      Ref is the registry reference the cache is kept under, empty when
                      there is no cache.
                    type: string
                  warm:
                    description: |-
                      Warm is whether the cache existed when the build started. A cold build
                      is the first of its scope, or the first after the cache was removed —
                      either way it had nothing to reuse and the next one will.
                    type: boolean
                required:
                - enabled
                - warm
                type: object
              completedAt:
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              config:
                description: |-
                  Config is the kitchen.json this commit carried, when it carried one.

                  It is on the Build rather than on the Project because it belongs to a
                  commit: the file is read at the commit under build, and a build of an
                  older commit is built with the settings that commit declared. That is
                  also what makes a rollback exact — the Release this build writes
                  freezes the merged result, so redeploying it redeploys the
                  configuration it was built with rather than today's.
                properties:
                  build:
                    description: Build is what the file said about how the commit
                      is built.
                    properties:
                      dockerfilePath:
                        description: |-
                          DockerfilePath, relative to the build root — which it may not leave,
                          for the same reason the project's own setting may not: the build root
                          is the whole of what a build sees.
                        type: string
                      strategy:
                        description: 'Strategy the commit is built with: auto, dockerfile
                          or buildpacks.'
                        enum:
                        - auto
                        - dockerfile
                        - buildpacks
                        type: string
                    type: object
                  env:
                    description: |-
                      Env are the environment variables it declared, already in the
                      platform's own form. They carry literal values only: the file is
                      committed to a repository anybody who can open a pull request can
                      write to, so a value in it is public by construction and a reference
                      to a credential is refused rather than resolved.
                    items:
                      description: |-
                        EnvVar is a single environment variable for an application. Exactly one of
                        Value, SecretRef, or FromResourceClaim should be set. PreviewValue, when set,
                        replaces Value in preview environments.
                      properties:
                        fromResourceClaim:
                          description: Value taken from a ResourceClaim binding (e.g.
                            a provisioned database URL).
                          properties:
                            key:
                              minLength: 1
                              type: string
                            name:
                              minLength: 1
                              type: string
                          required:
                          - key
                          - name
                          type: object
                        name:
                          minLength: 1
                          type: string
                        previewValue:
                          description: Literal value used in preview environments
                            instead of Value.
                          type: string
                        secretRef:
                          description: Value taken from a Secret (typically synced
                            from Infisical).
                          properties:
                            key:
                              minLength: 1
                              type: string
                            name:
                              minLength: 1
                              type: string
                          required:
                          - key
                          - name
                          type: object
                        value:
                          description: Literal value.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  path:
                    description: |-
                      Path the file was read from, relative to the repository root — the
                      project's build root plus kitchen.json, so "kitchen.json" for a
                      project at the top of its repository and "apps/web/kitchen.json" for
                      one in a monorepo.
                    type: string
                  processes:
                    description: |-
                      Processes are the workers and scheduled jobs it declared. Unlike the
                      variables, which merge by name, this list replaces the project's
                      wholesale — a process the file does not name is a process the commit
                      does not have, and a worker that outlives the code that defined it is
                      the failure this replaces.
                    items:
                      description: |-
                        ProcessSpec is one workload of a Project besides its web process: the
                        project's environment, started differently — and, since #271, optionally
                        built differently and addressed on its own.

                        The Release is already the right unit — an immutable image plus a config
                        snapshot — so a worker and a scheduled job are not another build. They are
                        the build's image run with another command, which is why this list is
                        snapshotted into the Release along with the environment variables and the
                        runtime: rolling back runs the processes the rollback target declared, not
                        the ones the Project declares today. A workload that declares a [Build] of
                        its own is the same story with one more frozen field: the Release records
                        the digest each workload was built to, so a rollback restores the exact set
                        of images that release declared rather than today's.

                        The two rules test `has(self.schedule)` rather than comparing to an empty
                        string, and it is not only shorter: the field is `omitempty`, so an absent
                        schedule is an absent key and `has` is the exact question. Only a `cron`
                        takes one — a worker and a service both run continuously, and a schedule on
                        either would be a setting that read back and did nothing.

                        The port rules and the health rules are the same shape of refusal rather
                        than a silent omission. Only a service is addressed, so only a service has
                        a port; a worker publishes no container port of its own, so a health check
                        that named none would check nothing; and a scheduled run's verdict is its
                        exit status, not a probe.

                        The singleton rules are `RuntimeSpec`'s, read for a workload. A worker is
                        exactly the workload that declaration was filed for and the one it did not
                        reach (#250), and it refuses a second replica rather than clamping one for
                        the same reason: a value silently lowered reads back as a setting that did
                        not take. A service takes it on the same terms. A scheduled process is
                        refused it outright, because whether two of its runs may overlap is
                        `concurrencyPolicy` — a second spelling of that question would be a setting
                        that reads back and does nothing.
                      properties:
                        args:
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                        build:
                          description: |-
                            Build says this workload is built from the repository in its own
                            right, rather than running the project's image with another command.

                            It is what makes a monorepo one project instead of four (#271): four
                            directories, four images, one commit, one Release, one rollback. The
                            Release records the digest each workload was built to, so restoring it
                            restores that exact set — never today's.

                            Absent is the original arrangement and stays the default: the workload
                            runs the project's own image, which is what a worker sharing the web
                            process's codebase wants and is one build rather than two.

                            It is refused on a scheduled process. A cron workload is a command run
                            against an image on a timer; giving it a build of its own would mean
                            an image built on every commit whose only purpose is to be started
                            four times a day, which is the worker or service that ships it —
                            declare the build there and point the schedule at it.
                          properties:
                            dockerfilePath:
                              default: Dockerfile
                              description: |-
                                DockerfilePath is the Dockerfile, relative to RootDirectory, for a
                                dockerfile build.
                              type: string
                            rootDirectory:
                              default: .
                              description: |-
                                RootDirectory is the directory of the repository this workload is
                                built from — this workload's **build root**, on exactly the terms
                                `ProjectBuildSpec.RootDirectory` is the project's: it is what is
                                built, DockerfilePath is relative to it, and nothing above it is part
                                of this workload's build. internal/detect is where that meaning is
                                written down, and everything that spells or refuses one of these paths
                                reads it there.

                                It is relative to the repository root, not to the project's own root
                                directory: the whole point is that the unit is a repository holding
                                several workloads, so each names where it lives once rather than
                                relative to whichever of them the project happened to call its own.
                              type: string
                            strategy:
                              allOf:
                              - enum:
                                - auto
                                - dockerfile
                                - buildpacks
                              - enum:
                                - dockerfile
                                - buildpacks
                              default: dockerfile
                              description: |-
                                Strategy is how the image is produced. It defaults to `dockerfile`,
                                which is what a monorepo shipping several images almost always has.
                              type: string
                          type: object
                        command:
                          description: |-
                            Command replaces the image's entrypoint, and Args its arguments. Both
                            are optional and both are exec form — a list of words, never a shell
                            line — which is the same reason the build jobs take two containers
                            instead of an `sh -c`: a string that reaches a shell is a string
                            somebody can put a `;` in.

                            A worker whose image already starts the right process needs neither. A
                            buildpacks-built image does: the buildpack chose a web server, and
                            `command: ["node", "worker.js"]` is how the same image becomes the
                            worker.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                        concurrencyPolicy:
                          default: Forbid
                          description: |-
                            ConcurrencyPolicy is what happens when a run is due and the last one
                            has not finished.
                          enum:
                          - Allow
                          - Forbid
                          - Replace
                          type: string
                        health:
                          description: |-
                            Health is how the platform checks that a worker is working. It is
                            opt-in here where it is automatic for the web process, and the reason
                            is the same one that makes a worker cheap: nothing addresses it, so
                            there is no port to fall back on and no request whose failure would
                            otherwise show. A worker that serves a health listener says which port
                            on it; one that does not gets no probes, and its liveness is whether
                            its process is still running.
                          properties:
                            failureThreshold:
                              description: |-
                                FailureThreshold is how many checks in a row have to fail before a
                                running container is taken out of service — and, where the check is an
                                HTTP one, restarted. Defaults to DefaultProbeFailureThreshold.
                              format: int32
                              minimum: 1
                              type: integer
                            path:
                              description: |-
                                Path is the HTTP path the platform asks for. A 2xx or 3xx answer is
                                the application saying it is working.

                                **Left unset, the check is a TCP connect to the port instead.** That
                                is a weaker claim than an HTTP 200 and much better than asserting a
                                readiness nothing established. It is deliberately not `GET /`: plenty
                                of applications answer that before they are ready, and one that 404s
                                there would never become Ready at all.
                              maxLength: 253
                              pattern: ^/
                              type: string
                            periodSeconds:
                              description: |-
                                PeriodSeconds is how often the check is made. Defaults to
                                DefaultProbePeriodSeconds.
                              format: int32
                              minimum: 1
                              type: integer
                            port:
                              description: |-
                                Port the probe is made against, when it is not the port the
                                application is published on. A separate admin or metrics listener is
                                the usual reason.
                              format: int32
                              maximum: 65535
                              minimum: 1
                              type: integer
                            startupFailureThreshold:
                              description: |-
                                StartupFailureThreshold is the same count for a container that has not
                                answered yet, and it is generous — DefaultStartupFailureThreshold
                                checks, so a container has StartupFailureThreshold x PeriodSeconds to
                                come up before the platform gives up on it.

                                It is a separate number, and that is the whole point of a startup
                                probe: slow startup is a legitimate state, and a liveness threshold
                                loose enough to tolerate it is too loose to catch a wedge afterwards.
                              format: int32
                              minimum: 1
                              type: integer
                            timeoutSeconds:
                              description: |-
                                TimeoutSeconds is how long one check may take before it counts as a
                                failure. Defaults to DefaultProbeTimeoutSeconds.
                              format: int32
                              minimum: 1
                              type: integer
                          type: object
                        name:
                          description: |-
                            Name identifies the process within the project. It is a DNS label
                            because it appears in the name of everything the process
                            materializes — `<environment>-<name>` — and in the log query
                            vocabulary as `process:<name>`.

                            `web` is refused: the web process is `spec.runtime`, and a second
                            spelling of it would be a process nothing routes to answering to the
                            name of the one that is routed to.
                          maxLength: 48
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                          x-kubernetes-validations:
                          - message: the web process is spec.runtime, not a named
                              process
                            rule: self != 'web'
                        port:
                          description: |-
                            Port is the port a service workload listens on, and the port the
                            Service in front of it is published on — the two are the same number
                            deliberately, because a workload addressed by the rest of the unit is
                            addressed over whatever protocol it speaks, and a Service that
                            renumbered the port would make `KITCHEN_SERVICE_<NAME>_PORT` and the
                            application's own configuration disagree.

                            It is required on a service and refused on anything else, at admission
                            and at the API. A worker publishes nothing, so a port on one would be
                            a setting that reads back and does nothing — the port a worker's
                            health listener sits on is `health.port`, which is the question that
                            field already asks.
                          format: int32
                          maximum: 65535
                          minimum: 1
                          type: integer
                        previews:
                          description: |-
                            Previews says whether this workload runs in preview environments too.

                            **A worker and a scheduled job are off unless they say otherwise, and
                            that is the decision rather than an omission.** A preview that emails
                            customers nightly is a bad afternoon, and a preview worker draining
                            the production queue is a worse one — the preview shares the project's
                            environment variables, so it is pointed at whatever the production
                            process is pointed at unless somebody overrode it.

                            **A service is on unless it says otherwise**, and for the reason the
                            unit exists: a service workload is addressed by its own environment's
                            siblings and by nothing else, so leaving it out of a preview protects
                            nothing and breaks the preview — the web process comes up pointed at a
                            Service with no pods behind it. #271's whole argument is that a
                            preview of a multi-workload unit has to be the whole set; a default
                            that quietly shipped half of it would defeat it.

                            It is a pointer so that an absent value can mean "the default for this
                            type" and `false` can mean false, which a bool with `omitempty` cannot
                            say: the field is dropped from the serialized object, and a service
                            deliberately kept out of previews would be silently put back on every
                            write. It is [PreviewsSpec.Enabled]'s reasoning, one level down.
                          type: boolean
                        replicas:
                          default: 1
                          description: |-
                            Replicas is how many copies of a worker run. It is meaningless for a
                            scheduled process — how many run at once is ConcurrencyPolicy's
                            answer — and is ignored there rather than refused, so that changing a
                            process's type does not require deleting a field first.
                          format: int32
                          minimum: 0
                          type: integer
                        resources:
                          description: Resources is what one replica, or one run,
                            asks for.
                          properties:
                            claims:
                              description: |-
                                Claims lists the names of resources, defined in spec.resourceClaims,
                                that are used by this container.

                                This is an alpha field and requires enabling the
                                DynamicResourceAllocation feature gate.

                                This field is immutable. It can only be set for containers.
                              items:
                                description: ResourceClaim references one entry in
                                  PodSpec.ResourceClaims.
                                properties:
                                  name:
                                    description: |-
                                      Name must match the name of one entry in pod.spec.resourceClaims of
                                      the Pod where this field is used. It makes that resource available
                                      inside a container.
                                    type: string
                                  request:
                                    description: |-
                                      Request is the name chosen for a request in the referenced claim.
                                      If empty, everything from the claim is made available, otherwise
                                      only the result of this request.
                                    type: string
                                required:
                                - name
                                type: object
                              type: array
                              x-kubernetes-list-map-keys:
                              - name
                              x-kubernetes-list-type: map
                            limits:
                              additionalProperties:
                                anyOf:
                                - type: integer
                                - type: string
                                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                x-kubernetes-int-or-string: true
                              description: |-
                                Limits describes the maximum amount of compute resources allowed.
                                More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                              type: object
                            requests:
                              additionalProperties:
                                anyOf:
                                - type: integer
                                - type: string
                                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                x-kubernetes-int-or-string: true
                              description: |-
                                Requests describes the minimum amount of compute resources required.
                                If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                                otherwise to an implementation-defined value. Requests cannot exceed Limits.
                                More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                              type: object
                          type: object
                        schedule:
                          description: |-
                            Schedule is the cron expression a scheduled process runs on, in the
                            five-field form `batch/v1` takes, interpreted in UTC. Required for a
                            cron process and refused on a worker, both at admission.
                          type: string
                        singleton:
                          description: |-
                            Singleton says two of this worker must never run at once.

                            It is `RuntimeSpec.Singleton` for a process, and it exists because the
