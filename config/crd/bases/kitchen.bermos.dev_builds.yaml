---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: builds.kitchen.bermos.dev
spec:
  group: kitchen.bermos.dev
  names:
    kind: Build
    listKind: BuildList
    plural: builds
    singular: build
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.projectRef.name
      name: Project
      type: string
    - jsonPath: .spec.git.branch
      name: Branch
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Build is the Schema for the builds API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              BuildSpec defines one build execution for one commit. Builds are immutable:
              a rebuild is a new Build object.
            properties:
              git:
                description: GitRevision identifies the commit a Build builds.
                properties:
                  author:
                    type: string
                  branch:
                    minLength: 1
                    type: string
                  message:
                    type: string
                  pullRequest:
                    description: Pull request number, when the commit belongs to one.
                    format: int32
                    type: integer
                  sha:
                    minLength: 7
                    type: string
                required:
                - branch
                - sha
                type: object
              projectRef:
                description: |-
                  LocalObjectReference references another Kitchen object by name within the
                  platform namespace. Cross-namespace references are not supported in v1alpha1.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - git
            - projectRef
            type: object
            x-kubernetes-validations:
            - message: Build spec is immutable
              rule: self == oldSelf
          status:
            description: BuildStatus defines the observed state of a Build.
            properties:
              artifact:
                description: |-
                  Artifact is what the build produced, identified by content rather than
                  by name, and what the platform has asserted about it.
                properties:
                  attestedAt:
                    description: |-
                      AttestedAt is when the platform attached its own build record to the
                      digest.
                    format: date-time
                    type: string
                  digest:
                    description: |-
                      Digest of the image manifest, as `sha256:…`. Empty when the builder
                      pushed successfully but did not report a digest, which is the one case
                      where the platform has an image it cannot make claims about.
                    type: string
                  keyID:
                    description: |-
                      KeyID is the signing key the build record was signed under, which is
                      what a verifier matches against the published public key.
                    type: string
                  message:
                    description: |-
                      Message explains an artifact the platform could not attest. An
                      unattested artifact is not a failed build — the image is real and the
                      deployment is honest — but it is one that no policy requiring evidence
                      will ever let move, which is where that fact is meant to bite.
                    type: string
                  repository:
                    description: Repository the image was pushed to, without a tag
                      or digest.
                    type: string
                type: object
              completedAt:
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              detectedFramework:
                description: Framework detected by the auto strategy (e.g. nextjs,
                  vite, static).
                type: string
              image:
                description: Image reference by digest, never by tag.
                type: string
              phase:
                description: BuildPhase is the coarse lifecycle summary of a Build.
                enum:
                - Queued
                - Running
                - Succeeded
                - Failed
                - Cancelled
                type: string
              startedAt:
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
