apiVersion: v2
name: kitchen
description: |
  Self-hosted Vercel alternative for people who bring their own Kubernetes
  cluster: git push -> build -> deploy -> URL.
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.30.0-0"
# cert-manager is part of the platform, not a prerequisite: Kitchen owns the
# cluster it is installed into. Its CRDs are templates rather than crds/ files,
# so `helm upgrade` applies schema changes — the reason bundling it is safe
# here. The Certificate and ClusterIssuer are created by the operator, not by
# this chart, because cert-manager's webhook has to be serving before either is
# admitted.
dependencies:
  - name: cert-manager
    version: v1.21.1
    repository: https://charts.jetstack.io
    condition: cert-manager.enabled
home: https://github.com/Bermos/Kitchen
sources:
  - https://github.com/Bermos/Kitchen
keywords:
  - paas
  - operator
  - gateway-api
  - cilium
  - preview-deployments
annotations:
  # Cluster prerequisites Kitchen assumes but does not install.
  kitchen.bermos.dev/requires: |
    Cilium as the cluster CNI with gatewayAPI.enabled=true,
    Gateway API CRDs (gateway.networking.k8s.io/v1)
