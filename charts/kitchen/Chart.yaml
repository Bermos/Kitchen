apiVersion: v2
name: kitchen
description: |
  Self-hosted Vercel alternative for people who bring their own Kubernetes
  cluster: git push -> build -> deploy -> URL.
type: application
# Both are maintained by release-please, from the Conventional Commits on main
# (CONTRIBUTING.md). The annotations are how it finds them — keep them on the
# same line as the value. The chart version and the appVersion are deliberately
# the same number: one release publishes the chart and the images it deploys,
# and `helm package` in the publish workflow stamps that number over both.
version: 0.30.0 # x-release-please-version
appVersion: "0.30.0" # x-release-please-version
kubeVersion: ">=1.30.0-0"
# cert-manager is part of the platform, not a prerequisite: Kitchen owns the
# cluster it is installed into. Its CRDs are templates rather than crds/ files,
# so `helm upgrade` applies schema changes — the reason bundling it is safe
# here. The Certificate and ClusterIssuer are created by the operator, not by
# this chart, because cert-manager's webhook has to be serving before either is
# admitted.
#
# KEDA and its HTTP add-on — what scaleToZero.enabled needs — are deliberately
# *not* here, even though Kitchen owns its cluster and bundles what it can. The
# platform can still end up having installed them: scaleToZero.install lets the
# *operator* run those two installs, one after the other, which is a thing no
# chart can do and every controller can. What follows is why the chart cannot.
# They cannot be sub-charts of anything: the add-on ships a keda.sh ScaledObject
# of its own (it autoscales its interceptor fleet), and Helm builds and
# validates a release's whole manifest against the API server before applying
# any of it, so a custom resource whose CRD arrives in the same release can
# never resolve — "no matches for kind ScaledObject". Neither hooks nor a crds/
# directory fix it for both install and upgrade, and a bundled copy also
# collides with a cluster that already runs KEDA, since Helm refuses to adopt
# CRDs another release owns. Upstream says the same thing by installing the two
# as separate releases. See the chart README's scale-to-zero section.
dependencies:
  - name: cert-manager
    version: v1.21.1
    repository: https://charts.jetstack.io
    condition: cert-manager.enabled
home: https://github.com/Bermos/Kitchen
sources:
  - https://github.com/Bermos/Kitchen
keywords:
  - paas
  - operator
  - gateway-api
  - cilium
  - preview-deployments
annotations:
  # Cluster prerequisites Kitchen assumes but does not install.
  kitchen.bermos.dev/requires: |
    Cilium as the cluster CNI with gatewayAPI.enabled=true,
    Gateway API CRDs (gateway.networking.k8s.io/v1)
