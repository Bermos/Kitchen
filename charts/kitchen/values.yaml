# Default values for the Kitchen chart.

# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the fully qualified resource name prefix.
fullnameOverride: ""

# The operator hardcodes `kitchen-system` as the platform namespace: the shared
# Gateway, the Kitchen CRs and the webhook secrets all live there. Installing
# the chart anywhere else produces a control plane that cannot see its own
# resources, so the templates refuse to render. Set this to false only if you
# know what you are doing.
namespaceCheck: true

namespace:
  # -- Manage the platform namespace as part of the release, so its Pod
  # Security level is set rather than inherited. Still install with
  # `--create-namespace`: Helm writes the release record into the namespace
  # before it applies any manifest, so a chart cannot bootstrap the namespace
  # it installs into — it can only adopt the empty one Helm just made. A
  # namespace created any other way (`kubectl create namespace`) cannot be
  # adopted and fails the install; see the chart README.
  create: true
  # -- Pod Security level enforced on the platform namespace. The telemetry
  # agent mounts the node's log directory and root filesystem, and `hostPath`
  # is admitted at `privileged` alone, so anything stricter needs
  # `collector.enabled=false`.
  podSecurity: privileged
  # -- Extra labels for the platform namespace.
  labels: {}

image:
  repository: ghcr.io/bermos/kitchen
  # -- Image tag. Defaults to the chart's appVersion.
  tag: ""
  # -- Pin by digest instead of tag (takes precedence over tag when set).
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# -- Number of manager replicas. Leader election keeps a single active
# reconciler; extra replicas serve git webhooks and fail over faster.
replicaCount: 1

# -- Enable leader election. Required when replicaCount > 1.
leaderElection: true

# -- Run the manager's logger in development mode (console encoder, debug level).
developmentLogging: false

serviceAccount:
  create: true
  # -- Name of the service account. Generated when empty.
  name: ""
  annotations: {}

rbac:
  # -- Create the ClusterRole/Role and their bindings for the manager.
  create: true

# Letting the platform upgrade its own Helm release from the dashboard.
#
# Off by default, and the default is the safe one: the upgrade runs as a Job
# bound to **cluster-admin**, because a `helm upgrade` of this chart applies
# CRDs, ClusterRoles, the namespace and cert-manager. Enabling it is a
# deliberate `helm upgrade` from a terminal — a chart cannot grant itself
# permissions it was not installed with — and from then on upgrades are a
# button in the settings page.
#
# Who can actually use that grant: only something that can create a pod with
# the ServiceAccount in `kitchen-system`, which is the operator. But the
# operator creates one when an authenticated API caller asks it to, and the
# API has no roles yet, so **every user who can sign in to the dashboard can
# trigger a platform upgrade** while that is true. Weigh that before enabling
# it on an installation with accounts you do not control.
selfUpdate:
  # -- Let the platform upgrade its own release from the dashboard. Creates a
  # ServiceAccount bound to cluster-admin; see the note above.
  enabled: false
  # -- Chart reference the upgrade pulls from. The published chart, unless you
  # mirror it somewhere the cluster can reach.
  chart: oci://ghcr.io/bermos/charts/kitchen
  # -- Helm release name to upgrade. Defaults to this release's own name,
  # which is what an in-place upgrade has to target.
  releaseName: ""
  # -- Allow an upgrade that crosses a minor version. While Kitchen is pre-1.0
  # the minor is where breaking changes land, so those are the upgrades whose
  # release notes may name manual steps: they are opted into separately.
  allowMinor: false
  # -- How long helm is given to finish. It waits for the whole release to come
  # back up, StatefulSets included.
  timeout: 15m
  # -- Name of the update job's ServiceAccount. Generated when empty.
  serviceAccountName: ""
  image:
    repository: alpine/helm
    tag: 3.19.0

crds:
  # -- Install the kitchen.bermos.dev CRDs. Disable when they are managed
  # out of band (GitOps, cluster bootstrap).
  install: true
  # -- Annotate CRDs with `helm.sh/resource-policy: keep` so `helm uninstall`
  # leaves them (and the custom resources they hold) in place.
  keep: true

# The Kitchen singleton: the operator's runtime configuration. It is created as
# a post-install hook, after the CRDs exist. It is *not* re-applied on upgrade
# by default, because it is also editable from the management UI — see
# `applyOnUpgrade`.
kitchen:
  # -- Create the cluster-wide Kitchen object. Requires `kitchen.baseDomain`.
  create: true
  # -- Also re-apply the Kitchen object on `helm upgrade`, making Helm the
  # source of truth for platform config. Any change made through the UI or
  # kubectl is overwritten on the next upgrade.
  applyOnUpgrade: false
  # -- Base domain for generated URLs: `<slug>.<baseDomain>`. Requires wildcard
  # DNS, and wildcard TLS unless cloudflared terminates at the edge.
  baseDomain: ""
  # -- What this cluster is called in the dashboard's status bar — how someone
  # running a staging platform and a production one tells which is on screen.
  # Defaults to the first label of `kitchen.baseDomain`.
  clusterName: ""
  # Who owns the platform. An account named here is an operator — everything,
  # everywhere, plus `admin` on every project, present and future — and every
  # other account is an ordinary member.
  access:
    # -- Name the platform's operators at install time. Each entry is an email
    # address, the issuer's opaque `sub`, or a map of `subject` and an
    # informational `email`. Empty leaves it to the operator, which seeds the
    # list once from the accounts the bundled identity provider holds: the
    # bootstrap account on a fresh install, every existing account on one
    # upgrading into enforcement.
    #
    # **An installation federated to an issuer of its own has to set this.**
    # There is no account directory on a Keycloak or an Auth0 — OIDC does not
    # define one — so nothing would ever be seeded, no account would hold the
    # operator role, and every operator-only route would refuse everybody,
    # including the `PATCH /settings` that names an operator. The `Kitchen`
    # object's `OperatorsConfigured` condition says so when it happens.
    #
    # Setting it also makes the chart the source of truth for who owns the
    # platform: with `kitchen.applyOnUpgrade=true`, every upgrade puts exactly
    # this list back, so somebody added on the settings screen and not added
    # here is removed again. Left empty, an upgrade preserves the list that is
    # live rather than dropping it.
    operators: []
  api:
    # -- Public base URL of the operator API and git webhook receiver.
    # Defaults to `kitchen.<baseDomain>` under the scheme `kitchen.tls.mode`
    # serves — `https`, or `http` when the mode is `none`.
    externalURL: ""
  ingress:
    # -- GatewayClass backing the shared Gateway.
    gatewayClassName: cilium
    cloudflared:
      # -- Front the Gateway with a cloudflared tunnel instead of a
      # LoadBalancer address.
      enabled: false
      # -- Existing secret holding the tunnel token under the key `token`.
      tunnelSecretName: ""
  tls:
    # -- Edge TLS mode: acme | cloudflared | none. It also decides the scheme
    # of every URL the platform publishes, the OIDC issuer included: `none`
    # gives the shared Gateway an HTTP listener alone, so those URLs are
    # `http://`. `acme` requires the `acme` block below — the API server
    # refuses a Kitchen in acme mode without it — so `none` is what brings a
    # cluster up before DNS and certificates are ready.
    mode: acme
    # How the wildcard certificate for `*.<baseDomain>` is obtained in acme
    # mode. The operator — not this chart — creates the ClusterIssuer and the
    # Certificate from these values: cert-manager's webhook admits both, so on
    # a first install they cannot exist until it is serving, and a reconcile
    # loop can wait where a Helm release cannot.
    acme:
      # -- Contact address the CA uses for expiry and account notices.
      # Required when mode is `acme`.
      email: ""
      # -- ACME directory URL. Let's Encrypt's staging directory
      # (`https://acme-staging-v02.api.letsencrypt.org/directory`) has far
      # higher rate limits while you are setting the platform up.
      server: https://acme-v02.api.letsencrypt.org/directory
      dns01:
        cloudflare:
          # -- Existing secret holding a Cloudflare API token. Required when
          # mode is `acme`: every generated URL is a subdomain, so the platform
          # needs a wildcard, and ACME issues those over DNS-01 only. The token
          # needs `Zone:DNS:Edit` on the zone and `Zone:Zone:Read` to find it.
          apiTokenSecretName: ""
          # -- Key inside that secret.
          apiTokenSecretKey: api-token
  builds:
    # -- Default build strategy: auto | dockerfile | buildpacks.
    defaultStrategy: auto
    # -- Maximum number of builds running at once.
    concurrency: 2
    # -- How many releases each project keeps. Every successful build leaves
    # one behind; older ones are pruned, except any an environment still
    # references. `0` keeps every release forever.
    releaseRetention: 10
  compliance:
    audit:
      # -- Record every state transition the platform makes into an
      # append-only, hash-chained log, so that what the platform did can be
      # shown to somebody later rather than only believed. Off is a
      # deliberate choice: the decisions still happen, they just leave
      # nothing behind. Needs a telemetry store — the log is a table in it.
      enabled: true
      # -- Days to retain audit records. This is deliberately not the
      # telemetry retention above: logs and metrics age out in weeks, and the
      # evidence an incident is reconstructed from must not go with them. The
      # floor is 90 days; installations under a records-retention obligation
      # will want years.
      retentionDays: 365
    attestation:
      # -- Sign a build record for every artifact the platform builds and
      # attach it to the artifact's digest, as a DSSE envelope over an
      # in-toto statement, through OCI referrers. The evidence is readable
      # with cosign and needs nothing from Kitchen.
      enabled: true
      # -- Secret in the platform namespace holding the ECDSA P-256 keypair
      # attestations are signed with, under `private.pem` and `public.pem`.
      # Empty has the operator generate one into `kitchen-attestation-key`
      # and keep it across upgrades. Set it to bring your own key, which is
      # what an installation whose custody rules forbid a platform-generated
      # key does.
      signingKeySecretName: ""
  observability:
    clickhouse:
      # -- Days to retain logs, metrics, traces and flow data.
      retentionDays: 30
    hubble:
      # -- host:port of Hubble Relay's gRPC endpoint, e.g.
      # `hubble-relay.kube-system.svc.cluster.local:80` once Hubble is enabled
      # in Cilium. When set, the operator follows the flow stream and ships
      # observations into the telemetry store — the dashboard's traffic view.
      # Empty disables flow collection.
      relayAddress: ""
    metrics:
      # -- Sample what no receiver can see — container restarts, OOM kills,
      # configured limits and replica counts — and export it to the node
      # agent over OTLP, where it lands beside the CPU and memory the agent
      # reads from the kubelet. Together they are what gives the environment
      # page a history rather than an instant. Turning the agent off leaves
      # this sampling with nowhere to export to.
      enabled: true
      # -- Seconds between samples. Below this the row count climbs faster
      # than the answers improve; much above a minute and a short spike falls
      # between two samples.
      intervalSeconds: 30
    traces:
      # -- Hand every environment the agent's OTLP address through the
      # standard OTLP environment variables. The receiver itself belongs to
      # the node agent and is always running with it — this decides only
      # whether application pods are told where it is.
      enabled: true
      # -- Port applications export to: the port the Service publishes and the
      # port the agent's OTLP/HTTP receiver binds. This is OTLP/HTTP's
      # registered port; an SDK given only a hostname assumes it.
      port: 4318
      # -- Endpoint applications are told to export to. Empty means the
      # receiver's own in-cluster Service, which is almost always right — set
      # this only to put something else in front of it.
      endpoint: ""
      service:
        annotations: {}

# The operator's REST API: what the Kitchen UI, the CLI and CI talk to. Every
# endpoint sits behind the platform's identity provider, so the API is only
# useful with `auth.enabled` — the operator resolves the issuer, and the
# audience it accepts, from the Kitchen object at request time.
api:
  # -- Container port the API binds to.
  port: 8092
  service:
    type: ClusterIP
    # -- Service port fronting the API.
    port: 80
    annotations: {}
  route:
    # -- Publish the API on the shared Gateway with an HTTPRoute. Requires the
    # Kitchen object (the Gateway is created by its reconciler).
    enabled: true
    # -- Hostname for the API. Defaults to the host of
    # `kitchen.api.externalURL`, or `kitchen.<baseDomain>` — the same name the
    # git webhook receiver answers on, under the path prefix `/api/`.
    host: ""
    gateway:
      # -- Name of the shared Gateway. Must match the operator's constant.
      name: kitchen
      # -- Namespace of the shared Gateway.
      namespace: kitchen-system
    annotations: {}
  # -- Token audiences the API accepts on top of the issuer and the API's own
  # external URL. Only needed when tokens are minted for another name than the
  # one the platform generates.
  extraAudiences: []
  ui:
    # -- Serve the dashboard at the API host's root: the operator embeds the
    # built SPA and answers everything outside `/api/` with it. Disabling this
    # only removes the route rule — the operator still serves the files.
    enabled: true

# The git webhook receiver: the endpoint providers deliver push and
# pull_request events to. It has to be reachable from the internet for
# `git push` to trigger anything.
webhookReceiver:
  # -- Container port the receiver binds to.
  port: 8090
  service:
    type: ClusterIP
    # -- Service port fronting the receiver.
    port: 80
    annotations: {}
  route:
    # -- Publish the receiver on the shared Gateway with an HTTPRoute. Requires
    # the Kitchen object (the Gateway is created by its reconciler).
    enabled: true
    # -- Hostname for the receiver. Defaults to the host of
    # `kitchen.api.externalURL`, or `kitchen.<baseDomain>`.
    host: ""
    gateway:
      # -- Name of the shared Gateway. Must match the operator's constant.
      name: kitchen
      # -- Namespace of the shared Gateway.
      namespace: kitchen-system
    annotations: {}

metrics:
  # -- Serve controller-runtime metrics.
  enabled: true
  # -- Port the metrics endpoint binds to.
  port: 8443
  # -- Serve metrics over HTTPS, protected by TokenReview/SubjectAccessReview.
  # Scrapers need the `<release>-metrics-reader` ClusterRole.
  secure: true
  service:
    annotations: {}
  serviceMonitor:
    # -- Create a Prometheus Operator ServiceMonitor for the metrics endpoint.
    enabled: false
    interval: ""
    scrapeTimeout: ""
    # -- Extra labels, e.g. the `release: kube-prometheus-stack` selector.
    labels: {}
    # -- Skip verification of the metrics server's certificate. The operator
    # serves a self-signed certificate unless one is mounted in.
    insecureSkipVerify: true

# ClickHouse: the store for every kind of telemetry Kitchen collects — logs,
# metrics, traces, build logs and Hubble flow data. It is not the system of
# record; the CRDs are. Connection details always land in the secret
# `<release>-clickhouse`, whether the chart runs ClickHouse or points at yours.
clickhouse:
  # -- Run a single-node ClickHouse as part of the release.
  enabled: true
  image:
    repository: clickhouse/clickhouse-server
    tag: 26.3.17.110-alpine
    pullPolicy: IfNotPresent
  auth:
    database: kitchen
    username: kitchen
    # -- Password for that user. Generated on install and preserved across
    # upgrades when empty. Set it explicitly if you render manifests with
    # `helm template`, which cannot read the existing secret back.
    password: ""
  service:
    type: ClusterIP
    httpPort: 8123
    nativePort: 9000
    annotations: {}
  persistence:
    # -- Back the data directory with a PVC. Disable for ephemeral test
    # installs; telemetry then dies with the pod.
    enabled: true
    size: 20Gi
    # -- StorageClass for the data volume. Empty uses the cluster default.
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      memory: 4Gi
  podSecurityContext:
    runAsNonRoot: true
    # The image's clickhouse user.
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  # -- XML dropped into /etc/clickhouse-server/config.d, as filename -> content.
  # Values are passed through `tpl`.
  extraConfig: {}
  # -- Extra environment variables for the ClickHouse container.
  extraEnv: []
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  # Point at a ClickHouse that already exists instead of running one. Requires
  # clickhouse.enabled=false and a password in clickhouse.auth.password.
  external:
    host: ""
    httpPort: 8123
    nativePort: 9000
  # -- Install with no telemetry store at all. Only meaningful with both
  # clickhouse.enabled=false and no external host.
  acknowledgeNoStore: false

# The telemetry agent: one OpenTelemetry collector per node, and the only way
# any signal enters the platform. It tails every container log file the kubelet
# writes, scrapes the kubelet and the node, and receives OTLP from applications
# and from the operator — writing all of it into ClickHouse. Kitchen's labels
# (`kitchen.bermos.dev/project`, `/environment`, `/build`) become resource
# attributes, and the schema materializes its project, environment and build
# columns out of them, so the API and the dashboard can ask for one project's
# logs, one environment's memory or one build's output. Nothing is rendered
# when there is no store to ship to.
collector:
  # -- Run the telemetry agent. Off means no logs, no metrics and nowhere for
  # applications to export OTLP to — the OTLP Service is not rendered either.
  enabled: true
  image:
    repository: otel/opentelemetry-collector-contrib
    # -- Pinned deliberately. The operator owns the DDL of the tables this
    # writes, and that DDL tracks the exporter's INSERT column list for this
    # exact version; contrib ships fortnightly. Move both together.
    tag: 0.158.0
    pullPolicy: IfNotPresent
  logs:
    # -- Tail the container log files on each node. Off leaves the OTLP
    # receiver as the only source of logs, which collects applications that
    # export them and nothing else.
    enabled: true
    # -- Namespaces whose containers are not tailed, e.g. `kube-system`. The
    # default collects everything on the node, which is what makes
    # cluster-wide troubleshooting possible — a sick node is exactly when
    # Kitchen looks broken.
    excludeNamespaces: []
    # -- Extra log file globs to skip, on top of the agent's own output.
    exclude: []
    # -- How many fields of a JSON log line are kept as log attributes,
    # queryable as `http.status:500`. Nesting is flattened with dots and
    # counted after flattening. A line with more fields than this still ships,
    # with its message intact and no attributes — one dump should not widen
    # the map for every line written alongside it.
    maxStructuredFields: 64
    # -- Top-level fields of a JSON log line its severity may be written
    # under, first match wins. A line that is not JSON is scanned for the
    # common spellings instead; one that says nothing recognisable keeps no
    # severity rather than being guessed at.
    levelFields:
      - level
      - severity
      - lvl
    # -- Fields a line's trace id may be written under, first match wins, and
    # lifted into `otel_logs`' own TraceId column. The name belongs to
    # whichever instrumentation library the application uses, so the agent
    # accepts all the usual ones rather than asking every project to agree on
    # one. Lifting it into a column is what makes a log line and a trace two
    # views of the same request. Nested names work: fields are flattened with
    # dots first.
    traceIdFields:
      - trace_id
      - traceId
      - traceID
      - trace.id
      - dd.trace_id
    # -- The same for a line's span id.
    spanIdFields:
      - span_id
      - spanId
      - spanID
      - span.id
      - dd.span_id
  metrics:
    kubelet:
      # -- Scrape the node's kubelet for per-pod and per-container CPU and
      # memory. This is what gives an environment's page a history rather than
      # an instant.
      enabled: true
    node:
      # -- Scrape the node itself: CPU, load, memory, network, disk and
      # filesystem.
      enabled: true
    # -- Seconds between scrapes, for both. Below this the row count climbs
    # faster than the answers improve; much above a minute and a short spike
    # falls between two samples.
    intervalSeconds: 30
  otlp:
    # -- Port the OTLP/gRPC receiver binds. OTLP/HTTP's port is
    # `kitchen.observability.traces.port`, because that one is also the
    # Service's and is what applications are handed.
    grpcPort: 4317
  export:
    # -- Signals held per node while the store is unreachable, counted in log
    # lines, spans and metric data points. Beyond this the newest are dropped
    # rather than collection stalling behind a wedged store.
    queueSize: 20000
    batch:
      # -- Signals an insert waits to accumulate before it ships.
      minSize: 5000
      # -- Ceiling on one insert, or 0 for none. A ceiling splits a batch that
      # arrived all at once into several inserts.
      maxSize: 0
      # -- How long a partial batch waits before it ships anyway. Build logs
      # are watched live, so this is latency, not throughput.
      flushTimeoutSeconds: 5
  # -- Log level of the agent itself: debug | info | warn | error.
  logLevel: info
  serviceAccount:
    create: true
    # -- Name of the agent's service account. Generated when empty.
    name: ""
    annotations: {}
  rbac:
    # -- Create the ClusterRole/Binding letting the agent read pod and
    # namespace metadata for enrichment, and the kubelet's stats and pods
    # endpoints. Supplying the role yourself instead means granting all of
    # them: the kubelet fails the whole scrape when /pods answers 403, so a
    # role written for an earlier release stops CPU and memory too, not only
    # the volume metrics that need it.
    create: true
  # -- Where the kubelet writes container logs on the node.
  hostLogsPath: /var/log
  # -- Where the agent keeps its read offsets, so a restart resumes instead of
  # skipping whatever was written while it was down.
  hostDataPath: /var/lib/kitchen/collector
  # -- Soft memory limit for the Go runtime, which makes it collect before the
  # kernel's OOM killer decides for it. Keep it at roughly 80% of
  # `resources.limits.memory`; the two are not derived from each other because
  # Helm cannot do arithmetic on a quantity like `1Gi`.
  goMemLimit: 800MiB
  resources:
    requests:
      # Three pipelines in one process: tailing, two scrapers and an OTLP
      # server. Steady state is well under this; the request is what keeps the
      # agent off an already-full node rather than a measurement.
      cpu: 100m
      memory: 256Mi
    limits:
      # The limit is a real ceiling here in a way it was not for the collector
      # this replaces: `memory_limiter` refuses data at 80% of it and the
      # export queue is bounded, so the failure mode under a backlog is
      # dropped signals rather than an OOM kill, a lost checkpoint and a
      # restart that reads the same backlog again.
      memory: 1Gi
  # -- Run on every node, including tainted ones: a control-plane node's logs
  # are exactly the ones wanted when the platform itself misbehaves.
  tolerations:
    - operator: Exists
  # -- Time the agent gets to drain its export queue on shutdown.
  terminationGracePeriodSeconds: 60
  # -- Extra environment variables for the agent, readable from the collector
  # configuration as `${env:NAME}`.
  extraEnv: []
  podAnnotations: {}
  nodeSelector: {}
  affinity: {}
  priorityClassName: ""

# Postgres: the auth service's system of record — accounts, sessions, OAuth
# clients and consents. Platform-critical OLTP, which is why it is Postgres and
# not ClickHouse or CRDs. Connection details always land in the secret
# `<release>-postgres`, whether the chart runs Postgres or points at yours.
postgres:
  # -- Run a single-node Postgres as part of the release.
  enabled: true
  image:
    repository: postgres
    tag: 17.6-alpine
    pullPolicy: IfNotPresent
  auth:
    database: kitchen_auth
    username: kitchen
    # -- Password for that user. Generated on install and preserved across
    # upgrades when empty. Set it explicitly if you render manifests with
    # `helm template`, which cannot read the existing secret back.
    password: ""
  service:
    type: ClusterIP
    port: 5432
    annotations: {}
  persistence:
    # -- Back the data directory with a PVC. Disabling it means every account
    # and OAuth client dies with the pod; only sensible for tests.
    enabled: true
    size: 8Gi
    # -- StorageClass for the data volume. Empty uses the cluster default.
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  podSecurityContext:
    runAsNonRoot: true
    # The image's postgres user.
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  # -- Extra environment variables for the Postgres container.
  extraEnv: []
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  # Point at a Postgres that already exists instead of running one. Requires
  # postgres.enabled=false and a password in postgres.auth.password.
  external:
    host: ""
    port: 5432

# The identity provider: better-auth with its OAuth/OIDC provider plugin,
# served at `auth.<baseDomain>`. One login for the Kitchen UI, the operator API
# and — for projects that opt in — the apps Kitchen deploys.
auth:
  # -- Deploy the identity provider. Requires a Postgres (see above).
  enabled: true
  image:
    repository: ghcr.io/bermos/kitchen-auth
    # -- Image tag. Defaults to the chart's appVersion.
    tag: ""
    # -- Pin by digest instead of tag (takes precedence over tag when set).
    digest: ""
    pullPolicy: IfNotPresent
  # -- Number of auth replicas. The service is stateless; state lives in
  # Postgres.
  replicaCount: 1
  # -- Signing secret for sessions and tokens. Generated on install and
  # preserved across upgrades when empty; changing it signs everyone out.
  secret: ""
  # -- API key the operator uses to register OAuth clients. Generated when
  # empty, at least 64 characters when set. Lands in the secret
  # `<release>-auth` under `serviceKey`.
  serviceKey: ""
  # -- Email of the machine account that owns the service key.
  serviceAccountEmail: operator@kitchen.local
  bootstrap:
    # -- Generate a one-time link for creating the first administrator. The
    # link stops working as soon as the installation has an account.
    enabled: true
    # -- Use this token instead of a generated one.
    token: ""
  # The Kitchen UI as an OAuth client: the platform's own front end, seeded on
  # start so its client id is a constant the UI can be built with. A browser
  # application keeps no secret, so it is a public client and the provider
  # requires PKCE.
  ui:
    # -- Register the Kitchen UI as an OAuth client.
    enabled: true
    # -- Client id the UI authenticates with.
    clientId: kitchen-ui
    # -- Redirect URIs the issuer will send people back to. Defaults to
    # `<kitchen.api.externalURL>/auth/callback`. Add a `http://localhost:…`
    # entry to run the UI against this installation while developing it.
    redirectURIs: []
  # Upstream GitHub OAuth app, so people sign in to Kitchen with the same
  # account they push from. Callback URL: https://<auth host>/callback/github
  github:
    # -- OAuth app client id. Enables the "Continue with GitHub" button.
    clientId: ""
    # -- OAuth app client secret. Stored in the release's auth secret.
    clientSecret: ""
    # -- Read the client secret from an existing secret instead.
    existingSecret: ""
    # -- Key holding the client secret in `existingSecret`.
    existingSecretKey: clientSecret
  # -- Let an unknown upstream account create a Kitchen account. Off by
  # default: everyone with a GitHub account would otherwise be a platform user.
  allowSocialSignUp: false
  # -- Extra browser origins allowed to call the identity provider.
  trustedOrigins: []
  # -- Container port the service binds to.
  port: 8080
  service:
    type: ClusterIP
    # -- Service port fronting the identity provider.
    port: 80
    annotations: {}
  route:
    # -- Publish the identity provider on the shared Gateway with an HTTPRoute.
    enabled: true
    # -- Hostname for the identity provider, which is also the OIDC issuer.
    # Defaults to `auth.<baseDomain>`.
    host: ""
    gateway:
      # -- Name of the shared Gateway. Must match the operator's constant.
      name: kitchen
      # -- Namespace of the shared Gateway.
      namespace: kitchen-system
    annotations: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  podSecurityContext:
    runAsNonRoot: true
    # The node image's unprivileged user.
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  # -- Log level: debug, info, warn, error.
  logLevel: info
  # -- Extra environment variables for the auth container.
  extraEnv: []
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""

# The image registry the platform runs for itself, so that a fresh install has
# somewhere to push. Kitchen owns the cluster it is installed into, and every
# install needs a registry — the same reasoning that bundles cert-manager
# rather than listing it as a prerequisite.
#
# It is published on the shared Gateway at `registry.<baseDomain>`, on the
# platform's own wildcard certificate, and that is what makes it work at all:
# the node's container runtime is what pulls an image, and it trusts neither
# the cluster's CA nor a plain-HTTP address unless the node is configured to.
# Configuring nodes is what every other in-cluster registry needs and what
# Kitchen cannot ask for. The cost is that image pulls leave the cluster and
# come back in through the Gateway, and that `kitchen.tls.mode: none` does not
# get this feature — there is no trusted certificate to pull over.
#
# The operator publishes the route and seeds a `dockerRegistry` Connection
# pointing at it, so a new project's registry picker has a working default.
# That Connection is an ordinary one: delete it and it stays deleted.
registry:
  # -- Run the bundled registry. Off means bringing your own — a
  # `dockerRegistry` Connection created on the connections page.
  enabled: true
  image:
    # -- zot: a CNCF sandbox registry that is a single Go binary with no
    # database, and the one that reclaims disk **while running**. Distribution's
    # garbage collector needs the registry stopped, which is a poor fit for the
    # thing most likely to bite here: every build pushes a tag and nothing
    # deletes any of them.
    repository: ghcr.io/project-zot/zot
    tag: v2.1.20
    pullPolicy: IfNotPresent
  auth:
    # -- Username builds and pulls authenticate with.
    username: kitchen
    # -- Password for that user. Generated on install and preserved across
    # upgrades when empty. Set it explicitly if you render manifests with
    # `helm template`, which cannot read the existing secret back.
    password: ""
  # -- Hostname the registry is published on, and therefore the prefix images
  # are pushed under: `<host>/<project>:<sha>`. Defaults to
  # `registry.<baseDomain>`.
  host: ""
  service:
    type: ClusterIP
    # -- Service port fronting the registry, and the port zot binds.
    port: 5000
    annotations: {}
  persistence:
    # -- Back the image store with a PVC. Without it every image dies with the
    # pod, which means every environment stops being able to pull the image it
    # is running.
    enabled: true
    size: 20Gi
    # -- StorageClass for the image store. Empty uses the cluster default.
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  # Reclaiming disk. Every build pushes a tag and nothing else ever deletes
  # one, so without this the volume fills and the platform stops being able to
  # build — six months in, and all at once. zot enforces all of it online.
  retention:
    # -- Delete anything the policy no longer keeps. Off leaves the registry
    # growing without bound, which is only sensible while you decide what to
    # keep.
    enabled: true
    # -- Tagged images kept per repository, newest push first. A project's
    # last few deploys are what a rollback reaches for; older ones are
    # rebuildable from the commit.
    keepTags: 20
    # -- Also keep anything pushed within this window, however many newer tags
    # there are — so a busy afternoon does not evict the release you shipped
    # this morning.
    keepPushedWithin: 720h
    # -- Grace period before a manifest that policy has stopped keeping is
    # actually removed. It is what stops a push and a pull that race from
    # meeting a half-deleted image.
    delay: 24h
    # -- How often the collector runs, and how long a newly written blob is
    # left alone by it. `gcDelay` has to outlast the slowest push: a blob
    # uploaded but not yet referenced by a manifest looks exactly like a blob
    # nothing references.
    gcInterval: 24h
    gcDelay: 2h
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 1Gi
  podSecurityContext:
    runAsNonRoot: true
    # The image runs as root by default; nothing in zot needs it, and the
    # image store is chowned to the group through fsGroup.
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  # -- Log level of the registry: debug | info | warn | error.
  logLevel: info
  # -- Extra environment variables for the registry container.
  extraEnv: []
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""

# The forward-auth gate: what makes a preview URL useless to anyone who has
# not signed in to the platform. Protected previews route through it, it sends
# anonymous visitors to the identity provider and proxies the ones that come
# back — the deployed application needs no changes and never sees the session.
#
# The operator deploys it (it needs an OAuth client registered first, which
# only the operator can do), from the same image as the manager. What lives
# here is the switch and the hostname; per-Project protection is
# `spec.previews.protected`, which defaults to on.
previewGate:
  # -- Run the forward-auth gate. Requires the identity provider. With it off,
  # Projects that ask for protected previews get no route at all rather than a
  # public one — turn protection off per Project to serve previews openly.
  enabled: true
  # -- Hostname the gate finishes logins on, and the only redirect URI its
  # OAuth client is registered with. Defaults to `previews.<baseDomain>`.
  host: ""
  # -- Number of gate replicas. It is in the request path of every protected
  # preview.
  replicas: 2
  # -- How long a visitor stays signed in to a preview before being sent back
  # to the identity provider.
  sessionTTL: 8h

# Scale-to-zero: an environment nobody is using drops to no pods at all, and
# the next request to its URL starts it again. It is what makes a dozen open
# pull requests nearly free — a preview costs a URL and a Deployment record
# until someone opens it.
#
# This is the one platform feature with a prerequisite the chart does not
# install: KEDA and its HTTP add-on go in as their own Helm releases, which is
# how upstream ships them and the only way Helm can install them at all (see
# the chart README, and the reasoning in Chart.yaml). Turning this on without
# them costs nothing — every environment stays on plain Deployment routing and
# says so in its ScaleToZero condition.
#
# Which environments actually idle is each Project's own decision, through
# `spec.scaleToZero` — previews by default, production only when asked.
scaleToZero:
  # -- Idle unused environments down to zero pods. Requires KEDA and the KEDA
  # HTTP add-on in the cluster; see the chart README for the two commands.
  enabled: false
  # The add-on's interceptor: what an idling environment's URL points at, since
  # it has no pods of its own. The defaults describe the add-on installed the
  # way the README describes; change them to match wherever yours runs.
  interceptor:
    # -- Name of the interceptor's proxy Service. The add-on names it after its
    # own chart rather than after the release, so this is a constant.
    service: keda-add-ons-http-interceptor-proxy
    # -- Namespace the interceptor runs in.
    namespace: keda
    # -- Port the proxy accepts live traffic on.
    port: 8080

healthProbe:
  # -- Port the /healthz and /readyz endpoints bind to.
  port: 8081

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 10m
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- Extra arguments appended to the manager's command line.
extraArgs: []
# -- Extra environment variables for the manager container.
extraEnv: []
# -- Extra volumes for the manager pod.
extraVolumes: []
# -- Extra volume mounts for the manager container.
extraVolumeMounts: []

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
terminationGracePeriodSeconds: 10

# cert-manager ships with the platform rather than being a prerequisite:
# Kitchen owns the cluster it is installed into, so there is no other workload
# to collide with. Its CRDs are plain templates in the sub-chart — not files in
# a crds/ directory — so `helm upgrade` applies schema changes, the same reason
# Kitchen ships its own CRDs as templates.
#
# The keys below belong to the cert-manager chart; see its values for the rest.
cert-manager:
  # -- Install cert-manager with the platform. Turn off for a cluster that
  # already runs one — the operator then uses that installation.
  enabled: true
  crds:
    # -- Install cert-manager's CRDs alongside it.
    enabled: true
    # -- Keep the CRDs, and the certificates they hold, on `helm uninstall`.
    keep: true
  config:
    # Custom-domain certificates are solved over HTTP-01 through the shared
    # Gateway (the DNS-01 token only writes to the base domain's zone), and
    # cert-manager publishes those challenges as HTTPRoutes only with its
    # Gateway API support switched on. The Gateway API CRDs are a platform
    # prerequisite anyway — Cilium's Gateway support needs them first.
    gatewayAPI:
      enabled: true
