{{- if or .Values.clickhouse.enabled .Values.clickhouse.external.host }}
{{- /*
Connection details for the telemetry store, in one place regardless of whether
ClickHouse is deployed by this chart or lives outside the cluster. The
collectors and the operator's log/metric queries read this secret.

A generated password is read back from the cluster on upgrade so it stays
stable. `helm template` cannot look it up, so rendering offline produces a
fresh password every time — set clickhouse.auth.password explicitly if you
render manifests instead of installing.
*/}}
{{- $password := include "kitchen.clickhousePassword" . }}
{{- $host := include "kitchen.clickhouseHost" . }}
{{- $native := include "kitchen.clickhouseNativePort" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kitchen.clickhouseSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kitchen.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
type: Opaque
stringData:
  host: {{ $host | quote }}
  httpPort: {{ include "kitchen.clickhouseHTTPPort" . | quote }}
  nativePort: {{ $native | quote }}
  database: {{ .Values.clickhouse.auth.database | quote }}
  username: {{ .Values.clickhouse.auth.username | quote }}
  password: {{ $password | quote }}
  dsn: {{ printf "clickhouse://%s:%s@%s:%s/%s"
        .Values.clickhouse.auth.username $password $host $native
        .Values.clickhouse.auth.database | quote }}
{{- end }}
