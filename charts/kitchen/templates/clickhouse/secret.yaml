{{- if or .Values.clickhouse.enabled .Values.clickhouse.external.host }}
{{- /*
Connection details for the telemetry store, in one place regardless of whether
ClickHouse is deployed by this chart or lives outside the cluster. The
collectors and the operator's log/metric queries read this secret.

A generated password is read back from the cluster on upgrade so it stays
stable. `helm template` cannot look it up, so rendering offline produces a
fresh password every time — set clickhouse.auth.password explicitly if you
render manifests instead of installing.
*/}}
{{- $password := include "kitchen.clickhousePassword" . }}
{{- $host := include "kitchen.clickhouseHost" . }}
{{- $native := include "kitchen.clickhouseNativePort" . }}
{{- $scheme := include "kitchen.clickhouseScheme" . }}
{{- $secure := eq $scheme "https" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kitchen.clickhouseSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kitchen.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
type: Opaque
stringData:
  host: {{ $host | quote }}
  httpPort: {{ include "kitchen.clickhouseHTTPPort" . | quote }}
  nativePort: {{ $native | quote }}
  database: {{ .Values.clickhouse.auth.database | quote }}
  username: {{ .Values.clickhouse.auth.username | quote }}
  password: {{ $password | quote }}
  # Whether the store answers in the clear, and what the platform's own
  # clients verify its certificate against. Both are read by
  # internal/clickhouse: the scheme decides the address, and the bundle is the
  # difference between `require` and `verify-full`. An absent bundle is the
  # host's roots, which is what an external store with a publicly trusted
  # certificate wants; it is never "do not verify".
  scheme: {{ $scheme | quote }}
  {{- if eq (include "kitchen.clickhouseTLSEnabled" .) "true" }}
  caFile: {{ include "kitchen.internalCAFile" . | quote }}
  # Addressed to the operator rather than to any client: it names the Secret
  # the store's certificate belongs in, and by naming it asks for one to be
  # issued from the platform's internal CA. Left out, the operator issues
  # nothing — an external store's certificate is somebody else's, and a
  # bundled store without this key is one somebody has chosen to leave in the
  # clear.
  certificateSecret: {{ include "kitchen.clickhouseTLSSecretName" . | quote }}
  {{- end }}
  dsn: {{ printf "clickhouse://%s:%s@%s:%s/%s%s"
        .Values.clickhouse.auth.username $password $host $native
        .Values.clickhouse.auth.database
        (ternary "?secure=true" "" $secure) | quote }}
{{- end }}
