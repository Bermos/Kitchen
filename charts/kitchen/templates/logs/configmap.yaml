{{- if eq (include "kitchen.logsEnabled" .) "true" }}
{{- /*
The collector's configuration. One source (every container log file on the
node), one transform (lift the Kitchen labels into columns), one sink (the
telemetry store).

Where the store is and who connects to it is chart configuration and is
rendered here; the password is not. Vector resolves `SECRET[...]` at startup
from the mounted connection secret, so the credential never lands in a
ConfigMap. Environment interpolation is deliberately not used — Vector
disables it unless run with --dangerously-allow-env-var-interpolation, which
would expose every variable in the pod to the config.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kitchen.logsFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kitchen.labels" . | nindent 4 }}
    app.kubernetes.io/component: logs
data:
  vector.yaml: |
    data_dir: /vector-data-dir

    secret:
      clickhouse:
        type: directory
        # The connection secret, mounted key by key.
        path: /etc/kitchen/clickhouse
        remove_trailing_whitespace: true

    sources:
      containers:
        type: kubernetes_logs
        # self_node_name is left at its default, which reads
        # VECTOR_SELF_NODE_NAME from the pod's downward API environment.
        #
        # Kitchen's own workloads come and go with every build and deploy, so
        # new log files are picked up far more eagerly than Vector's default
        # minute.
        glob_minimum_cooldown_ms: {{ int .Values.logs.globCooldownMs }}
        {{- with .Values.logs.extraLabelSelector }}
        extra_label_selector: {{ . | quote }}
        {{- end }}
        {{- with .Values.logs.extraFieldSelector }}
        extra_field_selector: {{ . | quote }}
        {{- end }}
        exclude_paths_glob_patterns:
          - "**/*.gz"
          - "**/*.tmp"
          # Shipping the collector's own output would feed every failed
          # insert back into the batch that failed.
          - "/var/log/pods/{{ .Release.Namespace }}_{{ include "kitchen.logsFullname" . }}-*/**"
          {{- range .Values.logs.excludePathsGlobPatterns }}
          - {{ . | quote }}
          {{- end }}

    transforms:
      kitchen:
        type: remap
        inputs: [containers]
        source: |
          labels = object(.kubernetes.pod_labels) ?? {}
          namespace_labels = object(.kubernetes.namespace_labels) ?? {}

          .namespace = to_string(.kubernetes.pod_namespace) ?? ""

          .project = to_string(get(labels, ["kitchen.bermos.dev/project"]) ?? "") ?? ""
          # A project's namespace carries the project on the namespace itself,
          # so anything running in one belongs to that project whether or not
          # the pod was labelled — a claimed database, a sidecar someone added.
          if .project == "" {
            .project = to_string(get(namespace_labels, ["kitchen.bermos.dev/project"]) ?? "") ?? ""
          }
          .environment = to_string(get(labels, ["kitchen.bermos.dev/environment"]) ?? "") ?? ""
          .build = to_string(get(labels, ["kitchen.bermos.dev/build"]) ?? "") ?? ""

          # What produced the line, so the UI can ask for one kind without
          # knowing which labels imply it.
          #
          # The namespace decides whether the line is Kitchen's at all. This
          # source tails every container on the node, so "no Kitchen label" is
          # not "a platform component" — it is Cilium, cert-manager, a CSI
          # sidecar, whatever else the cluster runs. Labelling those `platform`
          # made the platform's own diagnostic facet return the entire cluster,
          # and made other people's warnings read as Kitchen faults. They are
          # still collected — a sick node is exactly when Kitchen looks broken
          # — but under a name that says whose they are.
          .source = if .namespace == {{ .Release.Namespace | quote }} {
            "platform"
          } else if .build != "" {
            "build"
          } else if .environment != "" || .project != "" {
            "runtime"
          } else {
            "cluster"
          }

          .pod = to_string(.kubernetes.pod_name) ?? ""
          .container = to_string(.kubernetes.container_name) ?? ""
          .node = to_string(.kubernetes.pod_node_name) ?? ""
          .stream = to_string(.stream) ?? ""
          .message = to_string(.message) ?? ""
          .labels = labels

          # Best-effort severity, so the observability view can facet on
          # `level` instead of only stdout/stderr. JSON logs are asked for
          # their level field; plain text is matched against the common
          # spellings. A line that says neither stays "" — honest, rather
          # than guessing from the stream.
          #
          # `??` catches errors, not nulls, so the missing-field fallbacks are
          # spelled out as null checks — and nothing here aborts the event: a
          # line the parsers cannot read still ships, just without a level.
          .level = ""
          structured = object(parse_json(.message) ?? {}) ?? {}
          raw_level = get(structured, ["level"]) ?? null
          if raw_level == null { raw_level = get(structured, ["severity"]) ?? null }
          if raw_level == null { raw_level = get(structured, ["lvl"]) ?? null }
          if raw_level != null {
            .level = downcase(to_string(raw_level) ?? "")
          }
          if .level == "" {
            matched = parse_regex(.message, r'(?i)(?:^|[\s\[("=])(?P<level>trace|debug|info|warn|warning|error|fatal|critical|panic)(?:$|[\s\])":=,])') ?? {}
            .level = downcase(to_string(get(matched, ["level"]) ?? "") ?? "")
          }
          # One spelling per severity, so `level = 'warn'` means every warning.
          if .level == "warning" { .level = "warn" }
          if .level == "critical" || .level == "panic" { .level = "fatal" }

          # A JSON line's own fields, kept rather than thrown away once the
          # level has been read out of them. They land in the `fields` map, so
          # `http.status:500` is a column lookup instead of a substring search
          # of the message — which is the difference between asking a question
          # and grepping for one.
          #
          # Nesting is flattened with dots, so `{"http": {"status": 500}}` is
          # `http.status`, and every value is stringified: the map is
          # Map(String, String) because a log field has no schema and the
          # query language compares numerically where it is asked to.
          #
          # A value `to_string` will not take — an array, which `flatten`
          # leaves whole rather than exploding into keys — keeps its JSON
          # instead of becoming an empty string, so `tags:/canary/` can still
          # find it. A field that is present must not read as absent.
          #
          # The key count is capped. A line that carries hundreds of fields is
          # a dump rather than a log, and letting one widen the map would put
          # its keys in every part the batch writes.
          .fields = {}
          if length(structured) > 0 {
            flat = object(flatten(structured, "."))
            if length(flat) <= {{ int .Values.logs.maxStructuredFields }} {
              .fields = map_values(flat) -> |value| { to_string(value) ?? encode_json(value) }
            }
          }

          # Everything the table has no column for. The sink skips unknown
          # fields anyway; dropping them here keeps the wire small.
          del(.kubernetes)
          del(.file)
          del(.source_type)

    sinks:
      clickhouse:
        type: clickhouse
        inputs: [kitchen]
        endpoint: {{ printf "http://%s:%s" (include "kitchen.clickhouseHost" .) (include "kitchen.clickhouseHTTPPort" .) | quote }}
        database: {{ .Values.clickhouse.auth.database | quote }}
        # Created, and kept in step with the retention policy, by the
        # operator from Kitchen.spec.observability.clickhouse.
        table: logs
        auth:
          strategy: basic
          user: {{ .Values.clickhouse.auth.username | quote }}
          password: SECRET[clickhouse.password]
        skip_unknown_fields: true
        date_time_best_effort: true
        # The store is a StatefulSet in the same release and the schema is
        # applied by the operator afterwards, so on a fresh install the sink
        # is unusable for a moment. Failing the healthcheck at boot would
        # only crash-loop the collector while it waits.
        healthcheck:
          enabled: false
        batch:
          max_events: {{ int .Values.logs.batch.maxEvents }}
          # Build logs are watched live, so latency matters more here than
          # insert efficiency.
          timeout_secs: {{ int .Values.logs.batch.timeoutSeconds }}
        buffer:
          type: memory
          max_events: {{ int .Values.logs.buffer.maxEvents }}
          # A wedged store must not stall the node's log collection.
          when_full: drop_newest
{{- end }}
