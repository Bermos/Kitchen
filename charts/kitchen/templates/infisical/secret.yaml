{{- include "kitchen.validate" . -}}
{{- if and .Values.infisical.connection.create (not .Values.infisical.connection.existingSecret) }}
{{- /*
The machine identity the secret sync authenticates with (universal auth). The
Infisical operator reads it through the InfisicalSecret CRs the Kitchen
operator creates, which reference this secret across namespaces — so it lives
once, here, rather than being copied into every app namespace.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kitchen.infisicalSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kitchen.labels" . | nindent 4 }}
    app.kubernetes.io/component: infisical
type: Opaque
stringData:
  clientId: {{ .Values.infisical.connection.clientId | quote }}
  clientSecret: {{ .Values.infisical.connection.clientSecret | quote }}
{{- end }}
