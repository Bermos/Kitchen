{{- if .Values.auth.enabled }}
{{- /*
The identity provider's own credentials.

`secret` signs sessions and tokens, `serviceKey` is what the operator sends to
register OAuth clients, and `bootstrapToken` is the one-time link that creates
the first administrator. All three are read back from the cluster on upgrade:
regenerating them would sign everyone out, lock the operator out of client
registration, or hand out a bootstrap link that no longer matches — set them
explicitly if you render manifests with `helm template`.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kitchen.authSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kitchen.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
type: Opaque
stringData:
  issuer: {{ include "kitchen.authIssuer" . | quote }}
  # Where the operator and the preview gate reach that same issuer from inside
  # the cluster. Clusters routinely cannot resolve their own base domain from
  # the inside, and client registration would be the first thing to notice.
  internalURL: {{ include "kitchen.authInternalURL" . | quote }}
  secret: {{ include "kitchen.authSigningSecret" . | quote }}
  serviceKey: {{ include "kitchen.authServiceKey" . | quote }}
  {{- if .Values.auth.bootstrap.enabled }}
  bootstrapToken: {{ include "kitchen.authBootstrapToken" . | quote }}
  {{- end }}
  {{- if and .Values.auth.github.clientId (not .Values.auth.github.existingSecret) }}
  githubClientSecret: {{ .Values.auth.github.clientSecret | quote }}
  {{- end }}
{{- end }}
