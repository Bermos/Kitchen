{{- include "kitchen.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kitchen.fullname" . }}-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kitchen.labels" . | nindent 4 }}
    # Names the operator in the Kitchen's component survey. Not in the
    # selector, which is immutable and stays as it was.
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kitchen.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "kitchen.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kitchen.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: {{ include "kitchen.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /manager
          args:
            {{- if .Values.leaderElection }}
            - --leader-elect
            {{- end }}
            - --health-probe-bind-address=:{{ .Values.healthProbe.port }}
            - --git-webhook-bind-address=:{{ .Values.webhookReceiver.port }}
            - --api-bind-address=:{{ .Values.api.port }}
            {{- with .Values.api.extraAudiences }}
            - --api-audiences={{ join "," . }}
            {{- end }}
            {{- if and .Values.auth.enabled .Values.auth.ui.enabled (ne .Values.auth.ui.clientId "kitchen-ui") }}
            # The dashboard signs in as the client the chart seeded.
            - --ui-client-id={{ .Values.auth.ui.clientId }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            - --metrics-secure={{ .Values.metrics.secure }}
            {{- else }}
            - --metrics-bind-address=0
            {{- end }}
            - --zap-devel={{ .Values.developmentLogging }}
            # The publisher that carries a quality gate's findings out of the
            # pod that produced them is a third binary in this same image.
            # Passed unconditionally: gates are configured on the Kitchen
            # object, which the operator reads at runtime, so the chart cannot
            # know whether any exist.
            - --quality-gate-image={{ include "kitchen.image" . }}
            {{- if (include "kitchen.previewGateEnabled" .) }}
            # The gate is a second binary in this same image, deployed by the
            # operator once it has registered an OAuth client for it.
            - --preview-gate-image={{ include "kitchen.image" . }}
            # And the identity it reads Projects and the Kitchen singleton as,
            # which is how it decides who may open a protected preview without
            # asking the REST API. The name is release-name prefixed, so the
            # operator can only learn it from here.
            - --preview-gate-service-account={{ include "kitchen.previewGateServiceAccountName" . }}
            {{- end }}
            # The scheduled backup is a CronJob the operator writes, because
            # its schedule and destination are runtime configuration this
            # chart never sees. What the chart owns is the image it runs —
            # /backup is a further binary in this same image — and the
            # account it runs as, whose name is release-name prefixed and so
            # is only knowable from here. The image is passed unconditionally,
            # because a schedule is set through the API at any time after the
            # install and this chart never hears about it.
            - --backup-image={{ include "kitchen.image" . }}
            {{- if or .Values.backup.rbac.create .Values.backup.serviceAccountName }}
            # The account is passed only where there is one to name. Left
            # unset, a run lands on the namespace's default account, which can
            # read nothing — a loud failure rather than an archive quietly
            # missing half the platform.
            - --backup-service-account={{ include "kitchen.backupServiceAccountName" . }}
            {{- end }}
            {{- if .Values.selfUpdate.enabled }}
            # Self-update reaches the operator as flags rather than as fields
            # on the Kitchen singleton, because the singleton is applied as a
            # post-install hook and is not re-applied on upgrade: a value
            # flipped here would create the ServiceAccount and never reach the
            # operator. This Deployment is re-applied every time.
            - --self-update-chart={{ .Values.selfUpdate.chart }}
            - --self-update-release={{ default .Release.Name .Values.selfUpdate.releaseName }}
            - --self-update-service-account={{ include "kitchen.selfUpdateServiceAccountName" . }}
            - --self-update-image={{ .Values.selfUpdate.image.repository }}:{{ .Values.selfUpdate.image.tag }}
            - --self-update-timeout={{ .Values.selfUpdate.timeout }}
            - --self-update-allow-minor={{ .Values.selfUpdate.allowMinor }}
            {{- end }}
            {{- if .Values.scaleToZero.install.enabled }}
            # Whether the operator *may* install an addon is the chart's to
            # say, because the account is the chart's to create — and it is a
            # flag for the same reason self-update's are. Whether it *does* is
            # spec.install on the Addon of that name, which the operator seeds
            # rather than this chart rendering: a chart cannot apply a custom
            # resource whose CRD arrives in the same release.
            - --addon-service-account=keda={{ include "kitchen.kedaInstallServiceAccountName" . }}
            - --addon-chart-repository=keda={{ .Values.scaleToZero.install.chartRepository }}
            {{- with .Values.scaleToZero.install.version }}
            - --addon-chart-version=keda/keda={{ . }}
            {{- end }}
            {{- with .Values.scaleToZero.install.addOnVersion }}
            - --addon-chart-version=keda/keda-add-ons-http={{ . }}
            {{- end }}
            - --addon-install-image=keda={{ .Values.scaleToZero.install.image.repository }}:{{ .Values.scaleToZero.install.image.tag }}
            - --addon-install-timeout=keda={{ .Values.scaleToZero.install.timeout }}
            {{- end }}
            {{- if .Values.databases.install.enabled }}
            - --addon-service-account=cloudnative-pg={{ include "kitchen.cnpgInstallServiceAccountName" . }}
            - --addon-chart-repository=cloudnative-pg={{ .Values.databases.install.chartRepository }}
            {{- with .Values.databases.install.version }}
            - --addon-chart-version=cloudnative-pg/cloudnative-pg={{ . }}
            {{- end }}
            - --addon-install-image=cloudnative-pg={{ .Values.databases.install.image.repository }}:{{ .Values.databases.install.image.tag }}
            - --addon-install-timeout=cloudnative-pg={{ .Values.databases.install.timeout }}
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            # The git webhook receiver looks for Projects and webhook secrets
            # in the namespace the operator runs in.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: health
              containerPort: {{ .Values.healthProbe.port }}
              protocol: TCP
            - name: git-webhook
              containerPort: {{ .Values.webhookReceiver.port }}
              protocol: TCP
            - name: api
              containerPort: {{ .Values.api.port }}
              protocol: TCP
            {{- /*
            No OTLP port: the receiver moved to the node agent, and the
            operator is now a client of it like any application.
            */}}
            {{- if .Values.metrics.enabled }}
            - name: {{ if .Values.metrics.secure }}https{{ else }}http{{ end }}
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.extraVolumeMounts (eq (include "kitchen.internalTLSEnabled" .) "true") }}
          volumeMounts:
            {{- if eq (include "kitchen.internalTLSEnabled" .) "true" }}
            # The platform's internal CA, which the operator and the REST API
            # in this same process verify the platform's own stores against —
            # the telemetry store on every query, and the accounts database on
            # the backup schedule. See the volume below for why it is mounted
            # optional.
            - name: internal-ca
              mountPath: {{ include "kitchen.internalCAMountPath" . }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.extraVolumes (eq (include "kitchen.internalTLSEnabled" .) "true") }}
      volumes:
        {{- if eq (include "kitchen.internalTLSEnabled" .) "true" }}
        # The CA this operator mints itself, mounted back into it. Optional,
        # and it has to be: the ConfigMap does not exist until this process
        # has run at least once, so a required mount would be a deadlock — the
        # pod that creates the CA refusing to start until the CA is there.
        #
        # A kubelet fills the volume in place once the ConfigMap appears, and
        # every client of a store is built per use from its connection secret,
        # so the first reconcile after that picks the bundle up without a
        # restart. Until then a query against a store fails naming the file it
        # could not read, which is the loud half of never falling back to
        # plaintext.
        - name: internal-ca
          configMap:
            name: {{ include "kitchen.internalCAConfigMapName" . }}
            optional: true
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
