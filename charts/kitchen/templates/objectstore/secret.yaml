{{- include "kitchen.validate" . -}}
{{- if .Values.objectStore.enabled }}
{{- /*
The store's root credential, under the two keys every s3 Connection's Secret
carries: MinIO reads them as its root user, and the operator copies them
into the Connection it seeds. Every claim's own credential is minted from
this one; no application is ever handed it.

A generated secret key is read back from the cluster on upgrade so it stays
stable — rotating it would invalidate the seeded Connection and stop every
new bucket from being provisioned. `helm template` cannot look it up, so
rendering offline produces a fresh one every time; set
objectStore.auth.secretAccessKey explicitly if you render manifests instead
of installing.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kitchen.objectStoreSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kitchen.labels" . | nindent 4 }}
    app.kubernetes.io/component: objectstore
type: Opaque
stringData:
  accessKeyId: {{ .Values.objectStore.auth.accessKeyId | quote }}
  secretAccessKey: {{ include "kitchen.objectStoreSecretAccessKey" . | quote }}
  # Where the store answers and how it is reached. The operator reads both:
  # `host` is the address the certificate is issued for, and `scheme` is what
  # decides the endpoint on the Connection it seeds — and so the endpoint in
  # every application's binding.
  host: {{ include "kitchen.objectStoreHost" . | quote }}
  scheme: {{ include "kitchen.objectStoreScheme" . | quote }}
  {{- if eq (include "kitchen.objectStoreTLSEnabled" .) "true" }}
  # The CA the store's certificate is verified against, at the path the
  # operator's pod mounts it. It is the difference between an encrypted
  # connection and a verified one.
  caFile: {{ include "kitchen.internalCAFile" . | quote }}
  # Addressed to the operator rather than to any client: it names the Secret
  # the store's certificate belongs in, and by naming it asks for one to be
  # issued from the platform's internal CA. Left out, the operator issues
  # nothing — a store somebody has deliberately left in the clear.
  certificateSecret: {{ include "kitchen.objectStoreTLSSecretName" . | quote }}
  {{- end }}
{{- end }}
