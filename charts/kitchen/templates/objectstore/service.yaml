{{- include "kitchen.validate" . -}}
{{- if .Values.objectStore.enabled }}
# The address every bucket is reached at, and what every application read and
# write uses: an application runs in the cluster, and its own traffic has no
# business leaving it. It is not the only address the store has — the operator
# publishes a second one on the shared Gateway, because a presigned URL signs
# the host it is made for and a `.svc` name resolves in no browser (#601) —
# but nothing is published here: this Service is the backend that route points
# at.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kitchen.objectStoreFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kitchen.labels" . | nindent 4 }}
    app.kubernetes.io/component: objectstore
  {{- with .Values.objectStore.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "kitchen.objectStoreSelectorLabels" . | nindent 4 }}
  ports:
    - name: s3
      port: {{ int .Values.objectStore.service.port }}
      targetPort: s3
      protocol: TCP
---
# Governing service for the StatefulSet: stable per-pod DNS.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kitchen.objectStoreFullname" . }}-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kitchen.labels" . | nindent 4 }}
    app.kubernetes.io/component: objectstore
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "kitchen.objectStoreSelectorLabels" . | nindent 4 }}
  ports:
    - name: s3
      port: {{ int .Values.objectStore.service.port }}
      targetPort: s3
      protocol: TCP
{{- end }}
