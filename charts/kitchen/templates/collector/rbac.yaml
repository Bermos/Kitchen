{{- if eq (include "kitchen.collectorEnabled" .) "true" }}
{{- if .Values.collector.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kitchen.collectorServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kitchen.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
  {{- with .Values.collector.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.collector.rbac.create }}
---
# What the agent reads, and nothing else.
#
# Pods and namespaces are what every signal is enriched from — the Kitchen
# labels that become the project, environment and build columns are on the pod,
# and on the namespace where the pod was never labelled. ReplicaSets are how a
# pod is traced back to the Deployment that owns it.
#
# The last two are the kubelet's own API on the node the agent runs on, never
# the API server's proxy to it: nodes/stats is the Summary endpoint every
# kubelet metric is scraped from, and the /pods endpoint behind nodes/proxy is
# where the volume group learns which PersistentVolumeClaim a mount belongs to
# (see the collector ConfigMap).
#
# nodes/proxy reads worse than it is, and it is not interchangeable with
# nodes/pods: the kubelet maps /pods to the `pods` subresource only where the
# KubeletFineGrainedAuthz feature gate is on — 1.33 and later — and to `proxy`
# on every release this chart supports. It admits the request if *either*
# attribute is allowed, so both are granted and the older mapping is the one
# that has to work. The agent already mounts the node's root filesystem, so
# this is not reach it lacked. Getting it wrong does not cost a label: the
# receiver fails the whole scrape when /pods answers 403, and container, pod
# and node metrics stop along with the volume ones.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kitchen.collectorFullname" . }}
  labels:
    {{- include "kitchen.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
rules:
  - apiGroups: [""]
    resources:
      - pods
      - namespaces
    verbs:
      - get
      - watch
      - list
  - apiGroups: ["apps"]
    resources:
      - replicasets
    verbs:
      - get
      - list
      - watch
  - apiGroups: ["extensions"]
    resources:
      - replicasets
    verbs:
      - get
      - list
      - watch
  - apiGroups: [""]
    resources:
      - nodes/stats
    verbs:
      - get
      - watch
      - list
  - apiGroups: [""]
    resources:
      - nodes/proxy
      - nodes/pods
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kitchen.collectorFullname" . }}
  labels:
    {{- include "kitchen.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kitchen.collectorFullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kitchen.collectorServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
