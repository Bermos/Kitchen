{{- if eq (include "kitchen.collectorEnabled" .) "true" }}
{{- if .Values.collector.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kitchen.collectorServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kitchen.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
  {{- with .Values.collector.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.collector.rbac.create }}
---
# Two grants, and nothing else.
#
# Pods and namespaces are what every signal is enriched from — the Kitchen
# labels that become the project, environment and build columns are on the pod,
# and on the namespace where the pod was never labelled. ReplicaSets are how a
# pod is traced back to the Deployment that owns it.
#
# nodes/stats is the kubelet's Summary API, which the metrics scraper reads
# from the node it runs on. It is not read through the API server's proxy, so
# nodes/proxy is not needed and is deliberately absent.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kitchen.collectorFullname" . }}
  labels:
    {{- include "kitchen.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
rules:
  - apiGroups: [""]
    resources:
      - pods
      - namespaces
    verbs:
      - get
      - watch
      - list
  - apiGroups: ["apps"]
    resources:
      - replicasets
    verbs:
      - get
      - list
      - watch
  - apiGroups: ["extensions"]
    resources:
      - replicasets
    verbs:
      - get
      - list
      - watch
  - apiGroups: [""]
    resources:
      - nodes/stats
    verbs:
      - get
      - watch
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kitchen.collectorFullname" . }}
  labels:
    {{- include "kitchen.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kitchen.collectorFullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kitchen.collectorServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
