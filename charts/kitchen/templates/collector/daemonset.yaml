{{- if eq (include "kitchen.collectorEnabled" .) "true" }}
# The telemetry agent: one OpenTelemetry collector per node, which is where
# every signal Kitchen holds enters the platform. It tails the container log
# files the kubelet writes, scrapes the kubelet and the node itself, and
# receives OTLP from applications and from the operator — enriching all of it
# with the Kitchen labels that make it queryable by project, environment and
# build, and writing ClickHouse directly.
#
# It runs as a DaemonSet rather than a sidecar per app so that build jobs —
# which the operator creates and the cluster reclaims — are collected too, and
# so that an application's OTLP endpoint is a name on its own node rather than
# a hop across the cluster.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "kitchen.collectorFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kitchen.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
spec:
  selector:
    matchLabels:
      {{- include "kitchen.collectorSelectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "kitchen.collectorSelectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: collector
        # Not only on the DaemonSet: the platform's ingest screen counts the
        # collector's pods by this label, and a DaemonSet that wants pods while
        # none carry it reads exactly like admission refusing every one of
        # them. It is deliberately not in the selector, which is immutable.
        app.kubernetes.io/part-of: kitchen
      annotations:
        # The collector reads its configuration once, at startup.
        checksum/config: {{ include (print $.Template.BasePath "/collector/configmap.yaml") . | sha256sum }}
        {{- with .Values.collector.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kitchen.collectorServiceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.collector.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ int .Values.collector.terminationGracePeriodSeconds }}
      containers:
        - name: collector
          image: {{ printf "%s:%s" .Values.collector.image.repository .Values.collector.image.tag }}
          imagePullPolicy: {{ .Values.collector.image.pullPolicy }}
          args:
            - --config
            - /conf/config.yaml
          env:
            # Which node this is, and how to reach its kubelet. The name is
            # what k8s_attributes filters its pod informer by; the address is
            # what kubelet_stats dials, because a node name is not required to
            # resolve.
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: K8S_NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            # The store's password, read out of the connection secret rather
            # than rendered into the ConfigMap beside the rest of the config.
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kitchen.clickhouseSecretName" . }}
                  key: password
            # The other half of memory_limiter: it refuses data at a share of
            # the container's limit, and this makes the Go runtime collect
            # before the kernel's OOM killer decides for it. Keep it at roughly
            # 80% of resources.limits.memory.
            - name: GOMEMLIMIT
              value: {{ .Values.collector.goMemLimit | quote }}
            {{- with .Values.collector.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            # The name the OTLP Service targets. Keeping it named is what lets
            # the Service front whichever workload receives OTLP without the
            # port number being written down twice.
            - name: otlp
              containerPort: {{ int .Values.kitchen.observability.traces.port }}
              protocol: TCP
            - name: otlp-grpc
              containerPort: {{ int .Values.collector.otlp.grpcPort }}
              protocol: TCP
            - name: health
              containerPort: {{ int (include "kitchen.collectorHealthPort" .) }}
              protocol: TCP
          # The health endpoint belongs to an extension, and the extensions
          # that start alongside it are not all instant: file_storage compacts
          # its offset database on start, which on a node that has been
          # collecting for a while is real work. Until that is done the port is
          # not bound and every probe of it is a `connection refused` — which,
          # with readiness alone, is a warning on the pod for as long as it
          # takes to start. Those land in the platform's own warnings feed, so
          # every rollout of this DaemonSet reported itself as something going
          # wrong. A startup probe is the fix: liveness and readiness do not
          # run at all until it passes, and its first attempt waits rather than
          # being spent on a certainty.
          startupProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
          securityContext:
            # The kubelet writes container log files root-owned and mode 0640,
            # and the read offsets are kept on the node, so the collector reads
            # and writes as root. It gains nothing else: no privileged mode, no
            # escalation, no capabilities, and a read-only root filesystem —
            # everything it writes goes to the hostPath below.
            runAsUser: 0
            runAsGroup: 0
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
            - name: state
              mountPath: {{ include "kitchen.collectorStateDir" . }}
            - name: var-log
              mountPath: {{ .Values.collector.hostLogsPath | quote }}
              readOnly: true
            - name: hostfs
              mountPath: /hostfs
              readOnly: true
              # Without this the container's mount table is whatever it was at
              # start, so every filesystem mounted afterwards — every volume
              # every pod on this node attaches — is invisible to the node
              # metrics scraper.
              mountPropagation: HostToContainer
      volumes:
        - name: config
          configMap:
            name: {{ include "kitchen.collectorFullname" . }}
        # Read offsets, kept on the node so a restarted collector resumes where
        # it left off instead of starting again at the end of every file and
        # losing whatever was written while it was down.
        - name: state
          hostPath:
            path: {{ .Values.collector.hostDataPath | quote }}
            type: DirectoryOrCreate
        - name: var-log
          hostPath:
            path: {{ .Values.collector.hostLogsPath | quote }}
            type: Directory
        # The node's own filesystem, for the node metrics scraper. Mounted
        # whether or not that scraper is on: what the pod may see is a property
        # of the DaemonSet and of the namespace's Pod Security level, not of
        # which pipeline happens to be enabled.
        - name: hostfs
          hostPath:
            path: /
            type: Directory
      {{- with .Values.collector.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.collector.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.collector.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
