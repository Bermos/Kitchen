{{- include "kitchen.validate" . -}}
{{- if .Values.kitchen.create }}
# The Kitchen singleton is the operator's runtime configuration. It is applied
# as a Helm hook so that it lands after the CRDs are registered — a custom
# resource rendered as a normal template would fail to build on a fresh install.
#
# By default it is created once, on install: the same object is editable from
# the management UI, and re-applying it on every upgrade would overwrite those
# edits. Set kitchen.applyOnUpgrade=true to make Helm the source of truth.
apiVersion: kitchen.bermos.dev/v1alpha1
kind: Kitchen
metadata:
  # The reconciler only acts on the singleton named "default".
  name: default
  labels:
    {{- include "kitchen.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install{{ if .Values.kitchen.applyOnUpgrade }},post-upgrade{{ end }}
    helm.sh/hook-weight: "5"
    {{- if .Values.kitchen.applyOnUpgrade }}
    # Re-applying a hook means deleting and recreating it. Nothing is
    # owned by the Kitchen object, so the Gateway and the tunnel survive;
    # only its status is rebuilt on the next reconcile. The status is also
    # why nothing here can be remembered *in* the status — it dies with the
    # object — and why the operator list is read back off the live object at
    # render time instead: see `kitchen.accessBlock`.
    helm.sh/hook-delete-policy: before-hook-creation
    {{- end }}
spec:
  baseDomain: {{ .Values.kitchen.baseDomain | quote }}
  {{- with .Values.kitchen.clusterName }}
  clusterName: {{ . | quote }}
  {{- end }}
  {{- with .Values.kitchen.residency }}
  residency: {{ . | quote }}
  {{- end }}
  {{- with include "kitchen.accessBlock" . }}
  # Who owns the platform. Absent means nobody has ever said, which is what
  # the operator seeds from — so on an upgrade that re-applies this object,
  # the list that is live is carried across rather than dropped.
  {{- . | nindent 2 }}
  {{- end }}
  api:
    externalURL: {{ include "kitchen.apiExternalURL" . | quote }}
  ingress:
    gatewayClassName: {{ .Values.kitchen.ingress.gatewayClassName | quote }}
    {{- with .Values.kitchen.ingress.publicAddresses }}
    # Where the internet reaches this platform, when that is not the Gateway's
    # own address. Nothing in the cluster can observe the outside of a router's
    # translation, so it is declared here.
    publicAddresses:
      {{- range . }}
      - {{ . | quote }}
      {{- end }}
    {{- end }}
    cloudflared:
      enabled: {{ .Values.kitchen.ingress.cloudflared.enabled }}
      {{- with .Values.kitchen.ingress.cloudflared.tunnelSecretName }}
      tunnelSecretRef:
        name: {{ . | quote }}
      {{- end }}
  tls:
    mode: {{ .Values.kitchen.tls.mode | quote }}
    {{- if eq (include "kitchen.acmeConfigured" .) "true" }}
    # The operator creates the ClusterIssuer and the wildcard Certificate from
    # this, once cert-manager answers. It cannot be done here: cert-manager's
    # webhook admits both objects, and on a first install it is not serving yet.
    acme:
      email: {{ .Values.kitchen.tls.acme.email | quote }}
      server: {{ .Values.kitchen.tls.acme.server | quote }}
      dns01:
        cloudflare:
          apiTokenSecretRef:
            name: {{ .Values.kitchen.tls.acme.dns01.cloudflare.apiTokenSecretName | quote }}
            key: {{ .Values.kitchen.tls.acme.dns01.cloudflare.apiTokenSecretKey | quote }}
    {{- end }}
  auth:
    enabled: {{ .Values.auth.enabled }}
    {{- with include "kitchen.authHost" . }}
    host: {{ . | quote }}
    {{- end }}
    {{- if .Values.auth.enabled }}
    # How the operator reaches the identity provider to register OAuth
    # clients — the preview gate's today, per-app clients later.
    secretRef:
      name: {{ include "kitchen.authSecretName" . }}
    {{- end }}
    {{- if or .Values.postgres.enabled .Values.postgres.external.host }}
    # The identity provider's own database. The operator does not run the
    # identity provider and does not need this to — the chart hands the auth
    # service its connection directly. What needs it is the backup: the
    # accounts, sessions and OAuth clients in there are the one part of the
    # platform's state that deliberately does not live in a CRD, so they are
    # the one part an export has to reach into a database for.
    databaseSecretRef:
      name: {{ include "kitchen.postgresSecretName" . }}
    {{- end }}
    previewGate:
      enabled: {{ and .Values.auth.enabled .Values.previewGate.enabled }}
      {{- with include "kitchen.previewGateHost" . }}
      host: {{ . | quote }}
      {{- end }}
      replicas: {{ int .Values.previewGate.replicas }}
      sessionTTL: {{ .Values.previewGate.sessionTTL | quote }}
  builds:
    defaultStrategy: {{ .Values.kitchen.builds.defaultStrategy | quote }}
    concurrency: {{ int .Values.kitchen.builds.concurrency }}
    # How many releases a project keeps. A release an environment still points
    # at is never pruned, so rollback targets survive the count.
    releaseRetention: {{ int .Values.kitchen.builds.releaseRetention }}
    # The layer cache lives in the registry the project pushes to, beside the
    # image and under the same credential — which is why it is on by default
    # and why turning it on installs nothing.
    cache:
      enabled: {{ .Values.kitchen.builds.cache.enabled }}
      mode: {{ .Values.kitchen.builds.cache.mode | quote }}
      scope: {{ .Values.kitchen.builds.cache.scope | quote }}
  appNamespaces:
    # The Pod Security level the operator labels each project's namespace
    # with. Set rather than inherited: the cluster default decides whether
    # Dockerfile builds are admitted at all, and distributions disagree about
    # it.
    podSecurity: {{ .Values.kitchen.appNamespaces.podSecurity | quote }}
  registry:
    # The registry the chart runs, published by the operator: the route on the
    # shared Gateway is the operator's because the Gateway is, and the seeded
    # Connection is the operator's because a credential the API never reads
    # back has to be written by something inside the cluster.
    enabled: {{ eq (include "kitchen.registryEnabled" .) "true" }}
    {{- if eq (include "kitchen.registryEnabled" .) "true" }}
    {{- with include "kitchen.registryHost" . }}
    host: {{ . | quote }}
    {{- end }}
    service: {{ include "kitchen.registryFullname" . | quote }}
    port: {{ int .Values.registry.service.port }}
    secretRef:
      name: {{ include "kitchen.registrySecretName" . }}
    {{- end }}
  scaleToZero:
    enabled: {{ .Values.scaleToZero.enabled }}
    {{- if .Values.scaleToZero.enabled }}
    # Whether the operator puts KEDA and the add-on in the cluster itself. The
    # chart cannot: Helm validates a release's whole manifest before applying
    # any of it, so the add-on's ScaledObject never resolves against a CRD
    # arriving in the same release. The operator installs one release, waits,
    # then installs the other — and adopts an existing KEDA untouched.
    install: {{ .Values.scaleToZero.install.enabled }}
    # An idling environment has no pods to route to, so its URL points at the
    # add-on's interceptor instead: it holds the first request, asks KEDA to
    # scale the workload back up, and forwards it once a pod answers. The
    # add-on is its own Helm release, so this says where to find it.
    interceptor:
      service: {{ .Values.scaleToZero.interceptor.service | quote }}
      namespace: {{ .Values.scaleToZero.interceptor.namespace | quote }}
      port: {{ int .Values.scaleToZero.interceptor.port }}
    {{- end }}
  databases:
    # Where a provisioned database lives, and whether the operator installs
    # CloudNativePG when this cluster runs none. The chart cannot install it —
    # it ships CRDs and a webhook of its own, and Helm will not adopt a release
    # another one owns — and the operator is under no such constraint. Where
    # CloudNativePG is already serving, the platform records that it installed
    # nothing and provisions into it just the same.
    install: {{ .Values.databases.install.enabled }}
    namespace: {{ .Values.databases.namespace | quote }}
    operatorNamespace: {{ .Values.databases.operatorNamespace | quote }}
  compliance:
    # The audit log and the artifact attestations. Both are the operator's own
    # word about what it did, which is why they are configured here and not
    # per project: a team that could turn its own audit log off, or sign its
    # own evidence, would be attesting to nothing.
    audit:
      enabled: {{ .Values.kitchen.compliance.audit.enabled }}
      retentionDays: {{ int .Values.kitchen.compliance.audit.retentionDays }}
    attestation:
      enabled: {{ .Values.kitchen.compliance.attestation.enabled }}
      {{- with .Values.kitchen.compliance.attestation.signingKeySecretName }}
      signingKeyRef:
        name: {{ . | quote }}
      {{- end }}
      # What the builder itself is asked to attest, as opposed to what the
      # reconciler says about the build it asked for. Only the builder can
      # say which base images it actually resolved.
      build:
        provenance: {{ .Values.kitchen.compliance.attestation.build.provenance }}
        sbom: {{ .Values.kitchen.compliance.attestation.build.sbom }}
        {{- with .Values.kitchen.compliance.attestation.build.sbomGenerator }}
        sbomGenerator: {{ . | quote }}
        {{- end }}
    {{- with .Values.kitchen.compliance.machineIdentities }}
    # Accounts exempt from a project's pull request requirement. Naming them is
    # what makes the exemption auditable rather than merely configured.
    machineIdentities:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.kitchen.compliance.exceptions.ladder }}
    # The break-glass escalation ladder: the longer a waiver is asked for, the
    # more senior the approver it takes. Beyond every rung: an operator.
    exceptions:
      ladder:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    # Who may assert that a finding does not apply here. Admission only: whose
    # word a given environment then takes is that environment's bundle
    # parameters, which can be stricter than this and never looser.
    vex:
      enabled: {{ .Values.kitchen.compliance.vex.enabled }}
      {{- with .Values.kitchen.compliance.vex.trustedAuthors }}
      trustedAuthors:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    # The continuous re-evaluation pass: every deployed release, matched
    # against a current vulnerability database on an interval and re-judged
    # against its environment's own bar. No rebuild and no redeploy — what is
    # scanned is the bill of materials the build already attested.
    rescan:
      enabled: {{ .Values.kitchen.compliance.rescan.enabled }}
      interval: {{ .Values.kitchen.compliance.rescan.interval | quote }}
      concurrency: {{ int .Values.kitchen.compliance.rescan.concurrency }}
      {{- with .Values.kitchen.compliance.rescan.scanner }}
      scanner:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    # Access recertification, orphaned identities, and the watch for writes to
    # Kitchen's own objects that no reconcile made. None of it can refuse a
    # deployment: an access control that took a workload down would be one
    # nobody leaves switched on.
    access:
      enabled: {{ .Values.kitchen.compliance.access.enabled }}
      intervalDays: {{ int .Values.kitchen.compliance.access.intervalDays }}
      dueDays: {{ int .Values.kitchen.compliance.access.dueDays }}
      inactivityDays: {{ int .Values.kitchen.compliance.access.inactivityDays }}
      detectOutOfBandWrites: {{ .Values.kitchen.compliance.access.detectOutOfBandWrites }}
      {{- with .Values.kitchen.compliance.access.expectedManagers }}
      expectedManagers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.kitchen.compliance.gates }}
    # The quality gates run over every artifact. Each records what it found and
    # never whether that was acceptable: the verdict belongs to the environment
    # being promoted to, not to the scan.
    gates:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  observability:
    clickhouse:
      retentionDays: {{ int .Values.kitchen.observability.clickhouse.retentionDays }}
      {{- if eq (include "kitchen.hasTelemetryStore" .) "true" }}
      # The operator applies the telemetry schema and its retention through
      # this secret. Without it there is no store, and it manages none.
      secretRef:
        name: {{ include "kitchen.clickhouseSecretName" . }}
      {{- end }}
    {{- with .Values.kitchen.observability.hubble.relayAddress }}
    hubble:
      # The operator follows Hubble Relay from here and ships flow
      # observations into the telemetry store.
      relayAddress: {{ . | quote }}
    {{- end }}
    metrics:
      # The operator samples every application container's CPU and memory off
      # the kubelet, and its replicas and restarts off the pods themselves.
      # There is no collector to install: the join from a container back to
      # its project and environment lives in the pod's labels, which a metrics
      # scrape does not carry and the operator is already reading.
      enabled: {{ .Values.kitchen.observability.metrics.enabled }}
      intervalSeconds: {{ int .Values.kitchen.observability.metrics.intervalSeconds }}
    traces:
      enabled: {{ .Values.kitchen.observability.traces.enabled }}
      {{- if .Values.kitchen.observability.traces.enabled }}
      # Where instrumented applications export their spans. The operator hands
      # this to every environment through OTLP's own environment variables, so
      # adding a language's SDK is the whole of instrumenting an app here.
      endpoint: {{ include "kitchen.otlpEndpoint" . | quote }}
      {{- end }}
    clockSync:
      # Whether the timestamps everything else here is stamped with mean the
      # same thing on every node. The operator compares each kubelet's lease
      # renewal with its own clock and reports drift as an unhealthy component
      # — the survey being where an operator already looks.
      enabled: {{ .Values.kitchen.observability.clockSync.enabled }}
      maxDriftSeconds: {{ int .Values.kitchen.observability.clockSync.maxDriftSeconds }}
  {{- with include "kitchen.retentionBlock" . }}
  # How long each class of what the platform keeps is kept. Only the classes
  # set in values appear here: an absent one inherits the telemetry or the
  # audit retention, which is what keeps an upgraded installation reading
  # exactly as it did.
  {{- . | nindent 2 }}
  {{- end }}
{{- end }}
