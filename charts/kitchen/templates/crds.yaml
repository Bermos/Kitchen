                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              fromVersion:
                description: FromVersion is what the platform was running when the
                  upgrade started.
                type: string
              jobName:
                description: |-
                  JobName is the helm job in the platform namespace, for as long as it
                  exists — it is reaped some time after it finishes, while this record
                  stays.
                type: string
              message:
                description: |-
                  Message explains a Pending or Failed update in the terms of whoever
                  pressed the button: which value to set, which command to run.
                type: string
              phase:
                description: PlatformUpdatePhase is the coarse lifecycle summary of
                  a PlatformUpdate.
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                type: string
              startedAt:
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
    {{- if .Values.crds.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
  labels:
    {{- include "kitchen.labels" . | nindent 4 }}
  name: projects.kitchen.bermos.dev
spec:
  group: kitchen.bermos.dev
  names:
    kind: Project
    listKind: ProjectList
    plural: projects
    singular: project
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.source.git.repo
      name: Repo
      type: string
    - jsonPath: .spec.source.image.repository
      name: Image
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Project is the Schema for the projects API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ProjectSpec defines the desired state of a Project: software that becomes a
              running application.

              It was "a repository that becomes a running application" until #307, and
              the two rules below are the whole of what changed about the *project* when
              it stopped having to be one. Each refuses a combination that would
              otherwise be a setting nothing reads:

                - A registry is where builds are *pushed*, so a project that builds
                  needs one and a project that builds nothing has no use for one. It is
                  tied to the source rather than left optional in both directions,
                  because a registry on a vendored project reads as the place its image
                  comes from and is not.
                - A workload built from the repository needs a repository. This is the
                  one cross-field rule a workload's own spec cannot state: `spec.image`
                  and `spec.build` exclude each other there, but neither knows whether
                  the project has a repository at all.

              Previews are the one refusal that is deliberately *not* here. They follow
              pull requests and an image source has none, but `previews.enabled` defaults
              to true, so an admission rule against it would refuse every vendored
              project ever written — including one that never mentioned previews. The
              refusal is the API's, where a person asking for them can be answered, and
              the Project's `Previews` condition, which says the same thing to one who
              merely inherited the default. A preview that silently never appears reads
              as a fault; a condition saying why does not.
            properties:
              access:
                description: |-
                  Access is who may do what with this Project, and it is the whole of the
                  answer: an account with no entry here holds no role on the Project at
                  all, so it is not in their project list and not theirs to build,
                  redeploy or read. The one exception is a platform operator, who holds
                  admin on every project, present and future — see
                  `spec.access.operators` on the Kitchen singleton.

                  Membership lives here, on the object the access is about, rather than
                  in the identity provider or in a token claim. A role carried in a token
                  is a snapshot good for as long as the token is, which means removing
                  somebody leaves them on the project for up to an hour — and removal is
                  the case where that delay matters most. See docs/AUTH.md, "Where
                  membership lives".

                  Entries merge per subject rather than by position (listType=map), so an
                  apply that adds one person cannot drop another.
                items:
                  description: AccessGrant is one account's role on a Project.
                  properties:
                    email:
                      description: |-
                        Email is informational: it is what makes a list of opaque subjects
                        readable in `kubectl get -o yaml` and in a git diff. Nothing resolves
                        against it — an entry that means to name an address puts the address in
                        Subject, and accepts the verified-email condition that comes with it.
                      type: string
                    role:
                      description: Role this subject holds on the Project.
                      enum:
                      - admin
                      - developer
                      - viewer
                      type: string
                    subject:
                      description: |-
                        Subject is the issuer's `sub` for the account, or an email address. A
                        value containing `@` is treated as an address and resolves against the
                        token's `email` claim only when `email_verified` is true, because an
                        unverified-email grant is a grant to whoever can claim that address at
                        the identity provider.
                      minLength: 1
                      type: string
                  required:
                  - role
                  - subject
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - subject
                x-kubernetes-list-type: map
              build:
                description: ProjectBuildSpec overrides platform build defaults for
                  one project.
                properties:
                  dockerfilePath:
                    default: Dockerfile
                    description: |-
                      Path to the Dockerfile, relative to RootDirectory, which it may not
                      leave. Used when the strategy is (or resolves to) dockerfile.
                    type: string
                  dockerfileTarget:
                    description: |-
                      DockerfileTarget is the stage of a multi-stage Dockerfile that
                      produces the image to run — BuildKit's `--target`. Empty is the file's
                      last stage, which is what every build shipped before this existed.

                      It is a setting because the last stage is often not the one to run: a
                      file that also builds a test image, a toolchain or a migration runner
                      ends on whichever of them was written last, and a build of the wrong
                      one **succeeds**. Naming the stage is how a project says which
                      artifact it meant, and a name the Dockerfile does not have fails the
                      build rather than shipping something else.

                      It means nothing to the buildpacks lifecycle, which has no stages at
                      all. A build that resolves to buildpacks with a target set fails
                      saying so rather than quietly ignoring it — a target silently dropped
                      is the same wrong image this exists to stop.
                    maxLength: 128
                    pattern: ^[A-Za-z][A-Za-z0-9_.-]*$
                    type: string
                  rootDirectory:
                    default: .
                    description: |-
                      RootDirectory is the build root: the directory within the repository
                      that is built (monorepo support), and the directory every path this
                      project declares is relative to — DockerfilePath, and the commit's own
                      kitchen.json. Nothing above it is part of the build.

                      Both strategies mean the same directory by it and reach it
                      differently: BuildKit takes the commit as a git context and is handed
                      this directory as the whole of it, while the buildpacks lifecycle is
                      pointed at it inside a clone of the repository.
                    type: string
                  strategy:
                    default: auto
                    description: BuildStrategy selects how an image is produced from
                      a repository.
                    enum:
                    - auto
                    - dockerfile
                    - buildpacks
                    type: string
                type: object
              criticality:
                description: |-
                  Criticality is how much it matters that this project's function keeps
                  working: nonCritical, important or critical. Absent means undesignated
                  — surfaced as such, never defaulted, because Kitchen does not decide
                  what is critical and must not appear to have. It is the institution's
                  input; what the platform does with it is map it onto the resources
                  that serve the function (GET /compliance/criticality) and let it
                  decide how loudly the environments running it alert.

                  A project's designation reaches its *production* environments as a
                  fallback and reaches its previews not at all — see
                  [EffectiveContinuity] for why criticality does not inherit the way a
                  data class does.
                enum:
                - nonCritical
                - important
                - critical
                type: string
              dataClass:
                description: |-
                  DataClass is the sensitivity classification of the data this project
                  handles: public, internal, confidential or strictlyConfidential, in
                  that order. Absent means unclassified — surfaced as such, never
                  defaulted. It is the parent of the classification hierarchy: a claim's
                  class may not exceed it (checked at the API), and at promotion the
                  policy engine checks it does not exceed the target environment's
                  (rule dataclass-le-environment). Reclassifying a project is always
                  possible — it makes environments below the new class non-compliant,
                  which the drift and inventory views surface rather than the API
                  refusing the correction.
                enum:
                - public
                - internal
                - confidential
                - strictlyConfidential
                type: string
              env:
                description: Environment variables, overlaid per environment type.
                items:
                  description: |-
                    EnvVar is a single environment variable for an application. Exactly one of
                    Value, SecretRef, or FromResourceClaim should be set. PreviewValue, when set,
                    replaces Value in preview environments.
                  properties:
                    fromResourceClaim:
                      description: Value taken from a ResourceClaim binding (e.g.
                        a provisioned database URL).
                      properties:
                        key:
                          minLength: 1
                          type: string
                        name:
                          minLength: 1
                          type: string
                      required:
                      - key
                      - name
                      type: object
                    name:
                      minLength: 1
                      type: string
                    previewValue:
                      description: Literal value used in preview environments instead
                        of Value.
                      type: string
                    secretRef:
                      description: Value taken from a Secret (typically synced from
                        Infisical).
                      properties:
                        key:
                          minLength: 1
                          type: string
                        name:
                          minLength: 1
                          type: string
                      required:
                      - key
                      - name
                      type: object
                    value:
                      description: Literal value.
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              files:
                description: |-
                  Files are the configuration files this project's workloads are handed
                  — software the platform did not build is configured by one, and the
                  platform had only variables (#311). Each names its content, the path
                  it is mounted at, and the workloads that read it.

                  They are here beside the variables rather than in a volume because
                  that is what they are: configuration, small, changing with a deploy,
                  and snapshotted into every Release so that a rollback restores the
                  file that release ran with.

                  A file marked `secret` carries no content here. The platform holds it
                  where nothing reads it back, and this list carries the declaration —
                  see [ConfigFile].

                  Entries merge per name rather than by position (listType=map), so two
                  people adding two files do not drop each other's.
                items:
                  description: |-
                    ConfigFile is one file of a project's deployable configuration: what is in
                    it, where it is mounted, and which of the unit's workloads read it.

                    **Secrecy is a flag on this one object rather than a second list**, and the
                    reasoning is in docs/api/files.md: a file that becomes secret keeps its
                    path, its workloads and its place in the list, so splitting the declaration
                    in two would mean moving it house to change one property of its content.
                    What *is* split is the writing: a plain file's content travels on
                    `PATCH /projects/{name}` with the rest of the declaration, and a secret
                    file's content has a route of its own that no response reads back.

                    **A file is never templated from the environment.** It is stored and
                    mounted exactly as written. Substituting variables into it would make the
                    platform a template engine, which is the first step towards the thing
                    #285's compiled catalogue exists to refuse — and the moment a file is
                    rendered per environment it stops being the thing the Release froze.
                  properties:
                    content:
                      description: |-
                        Content is the file, verbatim. It is empty for a secret file, whose
                        content the platform holds where nothing reads it back, and may be
                        empty for a plain one — a file that has to exist and say nothing is a
                        thing some software wants.
                      maxLength: 131072
                      type: string
                    name:
                      description: |-
                        Name identifies the file within the project — it is the key the
                        platform stores the content under and the name every other surface
                        refers to it by, so it is a key rather than a path: `configuration`,
                        `app-ini`. The path is separate because two workloads of one unit may
                        want the same file in different places one day, and because a path is
                        not a usable key.
                      maxLength: 253
                      pattern: ^[-._a-zA-Z0-9]+$
                      type: string
                    path:
                      description: |-
                        Path is where the file appears inside the container: absolute, and
                        naming the file itself rather than the directory it is in. Only that
                        one path is replaced — the rest of the directory is the image's, which
                        is what a config file dropped beside an application's own files needs.
                      maxLength: 1024
                      pattern: ^/([^/]+/)*[^/]+$
                      type: string
                    secret:
                      description: |-
                        Secret says the content is a credential: it is held in a Secret rather
                        than in this object, written through its own route, and never answered
                        by any response on the API. The declaration — the path, the workloads,
                        the fact of it — stays here and is read by anyone who may read the
                        project, because that is not the secret part.
                      type: boolean
                    workloads:
                      description: |-
                        Workloads are the workloads of this unit that mount the file, by name
                        — `web` for the web process, and a process's own name for anything in
                        `spec.processes`. An empty list is every workload of the unit, which
                        is what a vendored application's single config file wants and is
                        therefore the default.

                        It is a list of names rather than a per-workload declaration because
                        one file reaching three workloads is one fact: a unit is one
                        application, and its configuration file is the application's.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: atomic
                  required:
                  - name
                  - path
                  type: object
                  x-kubernetes-validations:
                  - message: 'a secret file''s content is not written here: declare
                      it with `secret: true` and send the content to PUT /projects/{name}/files/{file},
                      which no response reads back'
                    rule: '!(has(self.secret) && self.secret && has(self.content))'
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              previews:
                description: PreviewsSpec configures preview environments for pull
                  requests.
                properties:
                  enabled:
                    default: true
                    description: |-
                      Enabled says whether a pull request against this Project gets a preview
                      environment of its own. It defaults to on: the preview is the review
                      vehicle, and a project that wants pull requests generally wants them
                      looked at somewhere.

                      It is a pointer for the reason Protected next to it is: a plain bool
                      with omitempty cannot express false — the field is dropped from the
                      serialized object, and the API server then applies the default, so
                      turning previews off would be silently undone on every write.
                    type: boolean
                  max:
                    description: |-
                      Max is this Project's own ceiling on live preview Environments,
                      overriding the platform's `spec.previews.maxPerProject`. A pull
                      request that would exceed it gets no preview, and says so on the
                      request rather than on the node (#294).

                      Unset inherits the platform's, which is what almost every project
                      should do: the ceiling is a fact about the cluster, and a project
                      raising its own is a project taking room from its neighbours. It is
                      here because "almost" is doing real work in that sentence — the one
                      project a platform exists for, with twelve reviewers and no claims, is
                      exactly the project whose ceiling should differ from the estate's.

                      `0` is no ceiling at all for this project. Nil is the platform's, and
                      the two are told apart by the pointer for the reason every other
                      clearable number here is a pointer: an int32 with `omitempty`
                      serializes 0 as an absent field.
                    format: int32
                    minimum: 0
                    type: integer
                  protected:
                    default: true
                    description: |-
                      Protected gates preview URLs behind platform login: the Environment's
                      route goes through the forward-auth gate, which sends anonymous
                      requests to the identity provider and only proxies signed-in ones to
                      the application. The application itself needs no changes. Production
                      environments are never gated.

                      It defaults to on, so unreleased work is not published to anyone who
                      guesses the URL. With no gate on the platform the Environment gets no
                      route at all rather than a public one — set this to false to serve
                      previews openly on purpose.
                    type: boolean
                  ttlAfterClosed:
                    description: |-
                      Grace period before a preview Environment is torn down after its
                      pull request closes.
                    type: string
                type: object
              processes:
                description: |-
                  Processes are the project's other processes: the queue workers and the
                  scheduled jobs that share the web process's image and environment and
                  are started differently. The web process itself is `spec.runtime` and
                  is not listed here — see [ProcessType] for why it cannot be.

                  The list is snapshotted into every Release, so a rollback runs the
                  processes that release declared rather than the ones the project
                  declares now. Removing a process from the list is how it is deleted:
                  the environment reconciler tears down anything it materialized that
                  the current Release no longer names.

                  Entries merge per name rather than by position (listType=map), so two
                  people adding two workers do not drop each other's.
                items:
                  description: |-
                    ProcessSpec is one workload of a Project besides its web process: the
                    project's environment, started differently — and, since #271, optionally
                    built differently and addressed on its own.

                    The Release is already the right unit — an immutable image plus a config
                    snapshot — so a worker and a scheduled job are not another build. They are
                    the build's image run with another command, which is why this list is
                    snapshotted into the Release along with the environment variables and the
                    runtime: rolling back runs the processes the rollback target declared, not
                    the ones the Project declares today. A workload that declares a [Build] of
                    its own is the same story with one more frozen field: the Release records
                    the digest each workload was built to, so a rollback restores the exact set
                    of images that release declared rather than today's.

                    The two rules test `has(self.schedule)` rather than comparing to an empty
                    string, and it is not only shorter: the field is `omitempty`, so an absent
                    schedule is an absent key and `has` is the exact question. Only a `cron`
                    takes one — a worker and a service both run continuously, and a schedule on
                    either would be a setting that read back and did nothing.

                    The port rules and the health rules are the same shape of refusal rather
                    than a silent omission. Only a service is addressed, so only a service has
                    a port; a worker publishes no container port of its own, so a health check
                    that named none would check nothing; and a run's verdict — a scheduled
                    one's or a deploy task's — is its exit status, not a probe.

                    A task is refused a health check and a singleton declaration for the same
                    reason a scheduled process is: it is one run, so there is nothing to keep
                    alive and nothing a second copy could overlap with. It takes a `timeout`,
                    which is the one bound a deploy waiting on it needs, and it is the one
                    workload whose `replicas` is meaningless in both directions — ignored
                    rather than refused, so that changing a process's type does not require
                    deleting a field first.

                    The singleton rules are `RuntimeSpec`'s, read for a workload. A worker is
                    exactly the workload that declaration was filed for and the one it did not
                    reach (#250), and it refuses a second replica rather than clamping one for
                    the same reason: a value silently lowered reads back as a setting that did
                    not take. A service takes it on the same terms. A scheduled process is
                    refused it outright, because whether two of its runs may overlap is
                    `concurrencyPolicy` — a second spelling of that question would be a setting
                    that reads back and does nothing.
                  properties:
                    args:
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: atomic
                    build:
                      description: |-
                        Build says this workload is built from the repository in its own
                        right, rather than running the project's image with another command.

                        It is what makes a monorepo one project instead of four (#271): four
                        directories, four images, one commit, one Release, one rollback. The
                        Release records the digest each workload was built to, so restoring it
                        restores that exact set — never today's.

                        Absent is the original arrangement and stays the default: the workload
                        runs the project's own image, which is what a worker sharing the web
                        process's codebase wants and is one build rather than two.

                        It is refused on a scheduled process. A cron workload is a command run
                        against an image on a timer; giving it a build of its own would mean
                        an image built on every commit whose only purpose is to be started
                        four times a day, which is the worker or service that ships it —
                        declare the build there and point the schedule at it.
                      properties:
                        dockerfilePath:
                          default: Dockerfile
                          description: |-
                            DockerfilePath is the Dockerfile, relative to RootDirectory, for a
                            dockerfile build — and the file an `auto` build looks for before it
                            decides this workload is one.
                          type: string
                        dockerfileTarget:
                          description: |-
                            DockerfileTarget is which stage of that Dockerfile produces this
                            workload's image — BuildKit's `--target`. Empty is not "the last
                            stage": it is "nothing of its own to say", and the project's answer
                            stands in — the commit's own kitchen.json where it declared one, and
                            `ProjectBuildSpec.DockerfileTarget` where it did not. A unit built
                            from one multi-stage file names the stage once and each workload that
                            differs says so.

                            It is per workload because that is the shape the feature is for: one
                            file that yields an API, a worker and a migration runner is ordinary
                            practice, and without a stage of its own each of them ships whichever
                            stage was written last — a build that succeeds and produces the wrong
                            thing.

                            A workload built with buildpacks inherits nothing — the lifecycle has
                            no stages, so the unit's stage is not a stage of anything that image
                            builds — but one that names a stage itself keeps it and is refused for
                            it. A stage this workload's Dockerfile does not declare fails the
                            build naming this workload.
                          maxLength: 128
                          pattern: ^[A-Za-z][A-Za-z0-9_.-]*$
                          type: string
                        rootDirectory:
                          default: .
                          description: |-
                            RootDirectory is the directory of the repository this workload is
                            built from — this workload's **build root**, on exactly the terms
                            `ProjectBuildSpec.RootDirectory` is the project's: it is what is
                            built, DockerfilePath is relative to it, and nothing above it is part
                            of this workload's build. internal/detect is where that meaning is
                            written down, and everything that spells or refuses one of these paths
                            reads it there.

                            It is relative to the repository root, not to the project's own root
                            directory: the whole point is that the unit is a repository holding
                            several workloads, so each names where it lives once rather than
                            relative to whichever of them the project happened to call its own.
                          type: string
                        strategy:
                          allOf:
                          - enum:
                            - auto
                            - dockerfile
                            - buildpacks
                          - enum:
                            - auto
                            - dockerfile
                            - buildpacks
                          default: auto
                          description: |-
                            Strategy is how the image is produced, defaulting to `auto` — which is
                            the project's own default, over this workload's root directory rather
                            than over the project's.

                            `auto` resolves in one order: a Dockerfile at DockerfilePath under
                            RootDirectory wins and this is a dockerfile build; otherwise the
                            framework detection finds there decides, and this is a buildpacks
                            build; otherwise the build fails with a message naming this workload
                            and the two things that would settle it — a Dockerfile where this
                            workload's build looks for one, or a `strategy` of its own.

                            It is the repository that answers it, not the project: a workload does
                            not inherit the project's strategy, and `Kitchen.spec.builds.
                            defaultStrategy` is what an unconfigured *project* does. Detection
                            here settles the strategy alone — a workload names its own port and
                            its own command, which are the other two things detection would have
                            been asked for.
                          type: string
                      type: object
                    command:
                      description: |-
                        Command replaces the image's entrypoint, and Args its arguments. Both
                        are optional and both are exec form — a list of words, never a shell
                        line — which is the same reason the build jobs take two containers
                        instead of an `sh -c`: a string that reaches a shell is a string
                        somebody can put a `;` in.

                        A worker whose image already starts the right process needs neither. A
                        buildpacks-built image does: the buildpack chose a web server, and
                        `command: ["node", "worker.js"]` is how the same image becomes the
                        worker.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: atomic
                    concurrencyPolicy:
                      default: Forbid
                      description: |-
                        ConcurrencyPolicy is what happens when a run is due and the last one
                        has not finished.
                      enum:
                      - Allow
                      - Forbid
                      - Replace
                      type: string
                    health:
                      description: |-
                        Health is how the platform checks that a worker is working. It is
                        opt-in here where it is automatic for the web process, and the reason
                        is the same one that makes a worker cheap: nothing addresses it, so
                        there is no port to fall back on and no request whose failure would
                        otherwise show. A worker that serves a health listener says which port
                        on it; one that does not gets no probes, and its liveness is whether
                        its process is still running.
                      properties:
                        failureThreshold:
                          description: |-
                            FailureThreshold is how many checks in a row have to fail before a
                            running container is taken out of service — and, where the check is an
                            HTTP one, restarted. Defaults to DefaultProbeFailureThreshold.
                          format: int32
                          minimum: 1
                          type: integer
                        path:
                          description: |-
                            Path is the HTTP path the platform asks for. A 2xx or 3xx answer is
                            the application saying it is working.

                            **Left unset, the check is a TCP connect to the port instead.** That
