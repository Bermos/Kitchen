                  Branches are the provider-side branches created for preview
                  Environments, torn down with them.
                items:
                  description: |-
                    ClaimBranch records one provider-side database branch the claim created for
                    a preview Environment, and the Secret its binding was written into.
                  properties:
                    environment:
                      description: Environment is the preview Environment the branch
                        belongs to.
                      type: string
                    id:
                      description: ID is the provider-side branch identifier.
                      type: string
                    secretName:
                      description: |-
                        SecretName is the per-environment binding Secret in the project
                        namespace.
                      type: string
                  required:
                  - environment
                  - id
                  - secretName
                  type: object
                type: array
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              instanceID:
                description: |-
                  InstanceID is the provider-side identifier of the provisioned resource,
                  opaque to the platform. It is what deprovisioning and branch operations
                  address.
                type: string
              phase:
                description: ClaimPhase is the coarse lifecycle summary of a ResourceClaim.
                enum:
                - Pending
                - Bound
                - Failed
                type: string
              redirectURIs:
                description: |-
                  RedirectURIs is the redirect list an oidcClient claim's client is
                  registered with, as the operator last wrote it. It is what a reconcile
                  compares the project's environment URLs against, so that a preview
                  appearing costs one call to the issuer and a reconcile that changes
                  nothing costs none.
                items:
                  type: string
                type: array
              secretName:
                description: |-
                  Secret in the project namespace holding the binding keys
                  (url, host, password, ...), per environment where applicable.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
