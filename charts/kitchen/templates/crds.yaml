                              The spelling is checked here as well as at the API, since not
                              everything writes through the API: a capability the kernel has never
                              heard of reaches a container that then does not start.
                            items:
                              pattern: ^[A-Z][A-Z0-9_]*$
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                          fsGroup:
                            description: |-
                              FSGroup is the supplementary group the volumes mounted into the
                              containers are owned by. A freshly provisioned PersistentVolume comes
                              up owned by `root:root`, so a workload that asked to run as anybody
                              else is handed a volume it cannot write — it starts, reads as
                              healthy, and fails on its first write. The kubelet chowns the volume
                              to this gid before the container starts, which is the only thing that
                              makes the two features — this posture and a volume claim — work
                              together.

                              It is a pod-level field, not a container-level one, so it lands
                              beside RunAsNonRoot rather than in the per-container context. Zero is
                              the same reading RunAsUser's is: the volume's own ownership left
                              alone, not a request to own it as gid 0.
                            format: int64
                            minimum: 0
                            type: integer
                          fsGroupChangePolicy:
                            description: |-
                              FSGroupChangePolicy is when the kubelet does that chown. Left alone
                              it is Kubernetes' own default, `Always`, which walks the whole volume
                              on every start — correct, and on a large volume slow enough to be the
                              reason a pod takes minutes to come up. `OnRootMismatch` skips the
                              walk when the volume's own root already has the right ownership,
                              which is what a workload with a big persistent volume reaches for.

                              The default is deliberately not moved: `OnRootMismatch` looks only at
                              the top of the volume, so a subtree left behind by a previous uid
                              stays unwritable and the failure arrives long after the change that
                              caused it. That is a trade a project makes knowingly, not one the
                              platform makes for it.

                              It is meaningless without FSGroup and refused without one, rather
                              than stored as a setting that does nothing.
                            enum:
                            - Always
                            - OnRootMismatch
                            type: string
                          readOnlyRootFilesystem:
                            description: |-
                              ReadOnlyRootFilesystem mounts the container's own filesystem read
                              only. An application that writes to a path it did not declare fails
                              on the write rather than on the next node it lands on.

                              It is off by default and that is the decision: an image that writes a
                              temporary file, a cache or a socket into its own filesystem is
                              ordinary, and a default that broke it would break it on upgrade with
                              no warning anywhere.
                            type: boolean
                          runAsGroup:
                            format: int64
                            minimum: 0
                            type: integer
                          runAsNonRoot:
                            description: |-
                              RunAsNonRoot refuses to start a container whose image would run as
                              uid 0. The kubelet checks it before the container starts, so an image
                              that would have run as root fails at the pod rather than three layers
                              into whatever it did with the privilege.
                            type: boolean
                          runAsUser:
                            description: |-
                              RunAsUser and RunAsGroup are the uid and gid the containers run as,
                              overriding the image's own. Zero is not "run as root": it is the
                              image's own user, left alone — an image that must run as root already
                              does, and saying so again here would be a setting that changed
                              nothing.
                            format: int64
                            minimum: 0
                            type: integer
                        type: object
                      singleton:
                        description: |-
                          Singleton says two of this workload must never run at once.

                          Kitchen models what an application *is* in a fair amount of detail —
                          its criticality, its data class, its residency — and had no way to
                          record the much simpler fact that a second copy of it is a bug. For a
                          stateless web application it is not: a rolling update overlaps the
                          outgoing pod and the incoming one for a few seconds and nobody
                          notices. For an application with a poller, a scheduler or an ingest
                          loop in the same binary as the web server, those few seconds are the
                          loop running twice against a shared store — and duplicate rows in a
                          table something downstream reads as a record of what happened when is
                          not an error at the time and not obviously wrong afterwards.

                          What it does is set `strategy: Recreate` on the Deployment: the old
                          pod stops before the new one starts. The cost is a gap in serving
                          during a deploy, which is the correct trade for a workload that cannot
                          overlap — and the project has said so. It also refuses Replicas above
                          one, at admission and at the API, rather than clamping it.

                          Leader election stays the application's problem. Not overlapping it
                          during a deploy the platform itself initiated is the platform's.
                        type: boolean
                    type: object
                    x-kubernetes-validations:
                    - message: 'a singleton workload cannot run more than one replica:
                        leave replicas at 1, or turn singleton off'
                      rule: '!has(self.singleton) || !self.singleton || !has(self.replicas)
                        || self.replicas <= 1'
                type: object
              image:
                description: |-
                  Image reference by digest, never by tag. It is the *web* process's
                  image, and the image every workload that declared no build of its own
                  runs — which for a project with one workload is all of them, and is
                  why the field is spelled as it always was.
                minLength: 1
                type: string
              projectRef:
                description: |-
                  LocalObjectReference references another Kitchen object by name within the
                  platform namespace. Cross-namespace references are not supported in v1alpha1.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              workloads:
                description: |-
                  Workloads are the images the other workloads of this unit were built
                  to, one entry per workload that declared a build of its own (#271).

                  It is the half of "one commit, one coordinated release" that the
                  config snapshot cannot carry: the snapshot freezes what each workload
                  *is*, and this freezes what each workload *was built to*. Both are
                  needed for a rollback to be one — restoring a release has to bring
                  back the exact set of images that release declared, not the set the
                  project declares today, and a workload added since must not appear at
                  all.

                  A workload named here and absent from the snapshot's process list is
                  nothing: the process list is what is materialized, and this only says
                  which image each entry of it runs.
                items:
                  description: |-
                    WorkloadImage is one workload's own image within a Release: which workload,
                    and the digest reference it was built to.
                  properties:
                    image:
                      description: |-
                        Image reference by digest, never by tag — the same rule the Release's
                        own image follows, for the same reason.
                      minLength: 1
                      type: string
                    name:
                      description: Name is the process's, as the config snapshot spells
                        it.
                      minLength: 1
                      type: string
                  required:
                  - image
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            required:
            - buildRef
            - image
            - projectRef
            type: object
            x-kubernetes-validations:
            - message: Release spec is immutable
              rule: self == oldSelf
          status:
            description: ReleaseStatus defines the observed state of a Release.
            properties:
              environments:
                description: Environments currently running this Release (informational).
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
    {{- if .Values.crds.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
  labels:
    {{- include "kitchen.labels" . | nindent 4 }}
  name: resourceclaims.kitchen.bermos.dev
spec:
  group: kitchen.bermos.dev
  names:
    kind: ResourceClaim
    listKind: ResourceClaimList
    plural: resourceclaims
    singular: resourceclaim
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.projectRef.name
      name: Project
      type: string
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ResourceClaim is the Schema for the resourceclaims API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ResourceClaimSpec is a Project's request for a provisioned resource — a
              Postgres database from a capable Connection, or an OAuth client from the
              platform's own identity provider.

              The two rules below are written against the set of types that take no
              Connection — ClaimTypesWithoutConnection — rather than against a named
              exception, and the refusal names the type it refused. The set in the
              markers is held to the table by a test, since a marker cannot read one.
            properties:
              config:
                description: Provider-specific configuration, validated by the plugin.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              connectionRef:
                description: |-
                  Connection with a capability matching Type (e.g. database). Required
                  for every type that takes one, and refused on the types the platform
                  provisions itself — see ClaimTypes.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              dataClass:
                description: |-
                  DataClass is the sensitivity classification of the data this claim's
                  resource holds. It may not exceed the project's own class — children
                  narrow a classification, never widen it — which the API enforces when
                  the claim is created. Absent means unclassified, surfaced as such and
                  never defaulted.
                enum:
                - public
                - internal
                - confidential
                - strictlyConfidential
                type: string
              deletionPolicy:
                default: Retain
                description: |-
                  DeletionPolicy is what deleting the claim does to the provisioned
                  resource. Retain is the default because a claim can own a production
                  database: destroying data has to be opted into, never implied by
                  removing the platform object in front of it. Preview branches and the
                  binding Secrets are cleaned up under either policy.

                  It says nothing about an oidcClient claim, whose client is always
                  deregistered: the policy exists to protect data from a deletion nobody
                  meant, and an OAuth client holds none — what it holds is permission to
                  sign people in, which is the thing that must not outlive the claim.
                enum:
                - Retain
                - Delete
                type: string
              projectRef:
                description: |-
                  LocalObjectReference references another Kitchen object by name within the
                  platform namespace. Cross-namespace references are not supported in v1alpha1.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              promotedRecovery:
                description: |-
                  PromotedRecovery names the recovery, out of Recoveries, whose database
                  the claim binds to. Empty — the normal state — binds the instance's own
                  database.

                  It is durable desired state rather than a one-shot command: the claim
                  binds to what this names for as long as it names it, so a reconcile
                  that runs again does not undo the cutover. The database it displaces is
                  **retained**, never destroyed, under the same reasoning that makes
                  deletionPolicy Retain the default — you do not want to discover the
                  recovery was wrong after the original is gone.
                type: string
              recoveries:
                description: |-
                  Recoveries are the point-in-time recoveries asked for on this claim:
                  each one a *sibling* database holding the claim's data as it was at a
                  moment, created by the reconciler and listed on the status.

                  Nothing is rewound and nothing is replaced by asking — which is the
                  whole design. Neither provider can rewind a database in place, and none
                  needs to: recovering to a sibling leaves the original untouched while
                  somebody looks at the copy, which is the only way to find out whether
                  the timestamp was the right one. Making the copy the claim's binding is
                  PromotedRecovery, a second and deliberate act.

                  Removing an entry discards that recovery and its data at the provider.
                items:
                  description: |-
                    ClaimRecoveryRequest asks for one point-in-time recovery of the claim's
                    resource: a sibling database holding its data as of At, under a name the
                    claim's status and the binding Secret are keyed by.
                  properties:
                    at:
                      description: |-
                        At is the moment to recover to. It has to be inside the window the
                        provider reports on the status; a moment outside it is refused by the
                        API, and by the provider if it ever got that far.
                      format: date-time
                      type: string
                    name:
                      description: |-
                        Name identifies the recovery within the claim, and names its binding
                        Secret. It is a DNS label because it ends up in object names on both
                        sides of the platform.
                      maxLength: 40
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                  required:
                  - at
                  - name
                  type: object
                type: array
              type:
                description: |-
                  Kind of resource requested. It is immutable: the type decides who
                  provisions the resource and what the binding Secret holds, so changing
                  it on a bound claim would leave a database behind while the
                  application's environment quietly started reading OAuth credentials
                  out of the same keys. Ask for the other one and delete this.
                enum:
                - postgres
                - oidcClient
                - objectStore
                - volume
                - inngest
                - redis
                type: string
                x-kubernetes-validations:
                - message: 'type is immutable: delete the claim and ask for the other
                    kind'
                  rule: self == oldSelf
            required:
            - projectRef
            - type
            type: object
            x-kubernetes-validations:
            - message: 'connectionRef is required: it names the Connection that provisions
                the resource. Only a claim the platform provisions itself goes without
                one.'
              messageExpression: '''connectionRef is required: it names the Connection
                that provisions a '' + self.type + '' claim. Only a claim of a type
                the platform provisions itself (oidcClient, volume) goes without one.'''
              rule: self.type in ['oidcClient', 'volume'] || has(self.connectionRef)
            - message: 'this claim type takes no connectionRef: the platform provisions
                it itself, and a Connection here would name a provider nothing would
                ask.'
              messageExpression: '''a '' + self.type + '' claim takes no connectionRef:
                the platform provisions it itself, and a Connection here would name
                a provider nothing would ask.'''
              rule: '!(self.type in [''oidcClient'', ''volume'']) || !has(self.connectionRef)'
          status:
            description: ResourceClaimStatus defines the observed state of a ResourceClaim.
            properties:
              branches:
                description: |-
                  Branches are the provider-side branches created for preview
                  Environments, torn down with them.
                items:
                  description: |-
                    ClaimBranch records one provider-side resource the claim created for a
                    preview Environment — a database branch, a preview's own bucket — and the
                    Secret its binding was written into.
                    ClaimBranch records one provider-side branch the claim created for a
                    preview Environment — a database branch, an Inngest branch environment —
                    and the Secret its binding was written into.
                  properties:
                    environment:
                      description: Environment is the preview Environment the branch
                        belongs to.
                      type: string
                    id:
                      description: ID is the provider-side branch identifier.
                      type: string
                    idle:
                      description: |-
                        Idle says this branch is parked because the preview reading it is:
                        the provider has been asked to take it down to no compute, and will
                        be asked to bring it back when the preview wakes (#294).

                        The data is untouched either way — idling a branch is not deleting
                        it, and a preview that wakes finds what it left. A provider whose
                        declaration says it cannot idle never sets this.
                      type: boolean
                    provenance:
                      description: |-
                        Provenance is the provider's declaration of what this branch's data
                        derives from — production for a branch of a production database,
                        however cheap the copy. Empty means the provider declared nothing.
                        It is per-branch because it is the branch, not the primary, that a
                        preview's workload reads, and the policy engine judges the preview on
                        exactly this value.
                      enum:
                      - production
                      - masked
                      - synthetic
                      type: string
                    secretName:
                      description: |-
                        SecretName is the per-environment binding Secret in the project
                        namespace.
                      type: string
                  required:
                  - environment
                  - id
                  - secretName
                  type: object
                type: array
              canIdle:
                description: |-
                  CanIdle is the provider's declaration that a preview's own resource
                  parks when the preview does: the platform asks it for no compute while
                  the environment is idle and asks for it back on wake, so an open pull
                  request nobody is looking at costs storage rather than a running
                  database (#294).

                  False is the honest answer for a provider with nothing to park — a
                  bucket, an OAuth client — and for one that parks itself. The reason
                  beside it says which.
                type: boolean
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              dataProvenance:
                description: |-
                  DataProvenance is the provider's declaration of what the provisioned
                  data derives from: production, masked or synthetic. Empty means the
                  provider declared nothing (undeclared) — surfaced as such, and treated
                  by policy as the worst case rather than as clean. It is a declaration
                  the platform records and attests (a signed
                  kitchen.bermos.dev DataClass/v1 statement), never something it
                  inspects the data to establish.
                enum:
                - production
                - masked
                - synthetic
                type: string
              forcesRecreate:
                description: |-
                  ForcesRecreate is the provider's declaration that what it provisions
                  can be attached to one pod at a time, so the workload reading it is
                  deployed by recreation — stopped, then started — with a gap in serving
                  on every deploy. The environment reconciler reads it and sets the
                  strategy.
                type: boolean
              idleReason:
                description: |-
                  IdleReason is the provider's own sentence about the field above: what
                  it does when a preview idles, or why it does nothing. It is what the
                  claim's screen and `kitchen` show, so that "this preview's database is
                  still running" is a statement somebody can read rather than infer.
                type: string
              instanceID:
                description: |-
                  InstanceID is the provider-side identifier of the provisioned resource,
                  opaque to the platform. It is what deprovisioning and branch operations
                  address.
                type: string
              instanceName:
                description: |-
                  InstanceName is what the provider calls the provisioned resource: the
                  database, bucket or cache instance's own name at the provider, which
                  is what a later reconcile finds it again by.

                  It is recorded because the name is not a constant. A resource
                  provisioned before names carried the project (kitchen-<claim>) keeps
                  that name for as long as the claim is bound to it — renaming it would
                  leave its data behind and hand the application an empty one — while
                  anything provisioned since is kitchen-<project>-<claim>, which is what
                  stops one project's claim adopting another project's retained data.
                  Empty on a claim that has never bound, and on one bound by an operator
                  old enough not to have written it, which reads as the unqualified
                  name.
                type: string
              keepsPodsRunning:
                description: |-
                  KeepsPodsRunning is the provider's declaration that this claim's
                  binding holds the workload up — a worker holding an outbound
                  connection, say — so no environment reading it idles to zero. The
                  environment reconciler reads it and says so on the environment.
                type: boolean
              phase:
                description: ClaimPhase is the coarse lifecycle summary of a ResourceClaim.
                enum:
                - Pending
                - Bound
                - Failed
                type: string
              previewMode:
                description: |-
                  PreviewMode is what a preview Environment of the claim's project binds
                  to, as the reconciler resolved it from the provider's declaration and
                  the claim's own choice: branch, fresh, shared or none. It is written
                  here rather than read off the provider each time because it is the
                  fact a preview's workload, the policy engine and the screen all act
                  on, and they should act on one answer. Empty until the claim has been
                  reconciled by an operator that declares.
                enum:
                - branch
                - fresh
                - shared
                - none
                type: string
              previewReason:
                description: |-
                  PreviewReason is why previews bind nothing, when PreviewMode is none,
                  and the sentence behind the mode otherwise — the provider's own words
                  about what a preview gets.
                type: string
              recovery:
                description: |-
                  Recovery is what the claim can be recovered to and what has been
                  recovered: the window the provider reports, the siblings, and anything
                  a promote displaced. Absent on a claim of a type nothing recovers.
                properties:
                  available:
                    description: |-
                      Available says whether this claim can be recovered at all: its
                      provider implements point-in-time recovery *and* reports a window with
                      something in it. False is a complete answer — Reason says which of the
                      two it is.
                    type: boolean
                  reason:
                    description: |-
                      Reason is why recovery is unavailable, or the sentence behind an
                      available one. It is the provider's own account rather than the
                      platform's guess: "cnpg cannot recover to a point in time until its
                      backup policy exists" reads differently from "this provider keeps no
                      history", and both are true of different claims.
                    type: string
                  recoveries:
                    description: |-
                      Recoveries are the siblings this claim has recovered, newest request
                      last, each with the moment it holds and the Secret its binding was
                      written into.
                    items:
                      description: |-
                        ClaimRecovery is one recovered sibling database: what it holds, where its
                        binding was written, and what the provider declared about it.
                      properties:
                        at:
                          description: At is the moment this database holds the claim's
                            data as of.
                          format: date-time
                          type: string
                        createdAt:
                          description: |-
                            CreatedAt is when the platform first recorded this recovery, which is
                            not the moment it holds: At is.
                          format: date-time
                          type: string
                        dataClass:
                          description: |-
                            DataClass is the class the recovery inherits from the claim. A
                            recovery creates a new place the same data lives, so it carries the
                            same classification; it is recorded here rather than read off the
                            claim so that a claim reclassified later does not rewrite what a
                            recovery was made under.
                          enum:
                          - public
                          - internal
                          - confidential
                          - strictlyConfidential
                          type: string
                        id:
                          description: |-
                            ID is the provider-side identifier of the recovered database, opaque
                            like every other the platform records.
                          type: string
                        message:
                          type: string
                        name:
                          description: Name is the claim-scoped name the recovery
                            was asked for under.
                          type: string
                        phase:
                          description: |-
                            Phase is Pending while the provider is making it, Ready once its
                            binding is written, Failed when the provider refused. Message carries
                            the provider's own words.
                          enum:
                          - Pending
                          - Ready
                          - Failed
                          type: string
                        promotedAt:
                          description: |-
                            PromotedAt is when this recovery became the claim's binding. Absent on
                            every recovery nobody promoted, which is most of them.
                          format: date-time
                          type: string
                        provenance:
                          description: |-
                            Provenance is the provider's declaration of what the recovered data
                            derives from. A point-in-time recovery of a production database is
                            production data at an earlier moment, so it is production — correct by
                            construction rather than by policy.
                          enum:
                          - production
                          - masked
                          - synthetic
                          type: string
                        secretName:
                          description: |-
                            SecretName is the recovery's own binding Secret in the application
                            namespace — a second address for the same application's data, which is
                            what makes looking at the copy possible before anything is promoted.
                          type: string
                      required:
                      - at
                      - name
                      type: object
                    type: array
                  retained:
                    description: |-
                      Retained are the databases a promote displaced and did not destroy.
                      Reaping one is a separate deliberate act — the platform never does it
                      on its own, because a promote is exactly the moment somebody might
                      have chosen the wrong timestamp.
                    items:
                      description: ClaimRetainedDatabase is a database a promote displaced
                        and left behind.
                      properties:
                        at:
                          description: At is when the promote happened.
                          format: date-time
                          type: string
                        displacedBy:
                          description: DisplacedBy is the recovery that took its place.
                          type: string
                        id:
                          description: |-
                            ID is the provider-side identifier of the retained database, where the
                            platform has one to record.
                          type: string
                        recovery:
                          description: |-
                            Recovery is the recovery whose database was displaced, empty when what
                            was displaced was the instance's own database — the one the claim was
                            bound to before anything was ever promoted, which is still there under
                            the instance's name.
                          type: string
                      required:
                      - at
                      - displacedBy
                      type: object
                    type: array
                  window:
                    description: |-
                      Window is how far back the provider can actually reach. Absent where
                      the provider cannot say — which is not the same as a window of zero
                      length, and is surfaced as the absence it is.
                    properties:
                      earliest:
                        description: Earliest is the oldest moment the provider can
                          still reach.
                        format: date-time
                        type: string
                      latest:
                        description: |-
                          Latest is the newest — now, for a provider whose history is continuous
                          up to the present.
                        format: date-time
                        type: string
                      observedAt:
                        description: |-
                          ObservedAt is when the window was read. A window is a moving pair of
                          timestamps, and one read ten minutes ago has already slid.
                        format: date-time
                        type: string
                    required:
                    - earliest
                    - latest
                    - observedAt
                    type: object
                required:
                - available
                type: object
              redirectURIs:
                description: |-
                  RedirectURIs is the redirect list an oidcClient claim's client is
                  registered with, as the operator last wrote it. It is what a reconcile
                  compares the project's environment URLs against, so that a preview
                  appearing costs one call to the issuer and a reconcile that changes
                  nothing costs none.
                items:
                  type: string
                type: array
              residency:
                description: |-
                  Residency is where the provisioned resource actually is, as the
                  provider reported it — a Neon region id, for the provider that ships.
                  It is recorded from the provider's answer rather than from anything
                  declared, which is what makes it the placement of record: an
                  environment's residency says where data is meant to be, this says
                  where this resource's data is. Empty when the provider reports no
                  placement, and read as "unknown" by the inventory rather than
                  defaulted.
                type: string
              secretName:
                description: |-
                  Secret in the project namespace holding the binding keys
                  (url, host, password, ...), per environment where applicable.
                type: string
              volume:
                description: |-
                  Volume is what a volume claim materialized, and empty for every other
                  type: a volume claim binds to a mount rather than to a Secret, so
                  SecretName stays empty on it and this is where the environment
                  reconciler reads what to mount.
                properties:
                  accessMode:
                    description: |-
                      AccessMode is how the volume is mounted: for a provisioned volume
                      what the StorageClass was detected to support, and for a bound one
                      what the claim declared. ReadWriteOnce caps the process at one
                      replica and forces a recreate on every deploy; ReadOnlyMany and
                      ReadWriteMany lift both. For a provisioned volume it is detected from
                      the class's provisioner and its annotations, never assumed;
                      AccessModeReason says what decided it either way.
                    enum:
                    - ReadOnlyMany
                    - ReadWriteOnce
                    - ReadWriteMany
                    type: string
                  accessModeReason:
                    type: string
                  bound:
                    description: |-
                      Bound is the volume a bound claim mounts, once the reconciler has
                      found it. Empty for a provisioned volume, and for a bound claim that
                      has not resolved yet — a claim naming a volume the cluster does not
                      have is Failed with the name it could not find.
                    properties:
                      capacity:
                        type: string
                      identity:
                        description: |-
                          Identity is what the volume points at — "nfs://nas.lan/export/media",
                          "csi://driver/handle" — which is what tells two PersistentVolumes
                          serving one export apart from two serving different ones. Two claims
                          that would write the same identity are the refusal this exists for.
                        type: string
                      named:
                        description: |-
                          Named is what the claim named to get here: the PersistentVolume's own
                          name, or the PersistentVolumeClaim whose volume it is.
                        type: string
                      persistentVolume:
                        description: |-
                          PersistentVolume is the volume itself, and Capacity what it holds —
                          reported rather than asked for, since the platform did not make it.
                        type: string
                      sharedWith:
                        description: |-
                          SharedWith are the other claims mounting the same volume, as
                          "project/claim", every one of them a reader. It is on the status
                          because sharing a filesystem between projects is the kind of fact
                          that must not have to be discovered: whoever is looking at this claim
                          can see who else is holding the same data.
                        items:
                          type: string
                        type: array
                      writable:
                        description: |-
                          Writable says this claim's process may change what is on the volume,
                          which follows from the declared access mode. At most one claim in the
                          cluster is writable for a given Identity.
                        type: boolean
                    required:
                    - persistentVolume
                    type: object
                  claimName:
                    description: |-
                      ClaimName is the production PersistentVolumeClaim, in the project's
                      application namespace.
                    type: string
                  mountPath:
                    type: string
                  persistentVolume:
                    description: |-
                      PersistentVolume is the PersistentVolume the production claim is
                      bound to, once it is. Under deletionPolicy Retain the reconciler
                      patches that volume's reclaim policy to Retain and labels it with the
                      claim, which is what lets it outlive the application namespace — and
                      what a later claim of the same name re-binds to.
                    type: string
                  previews:
                    description: |-
                      Previews are the per-preview PersistentVolumeClaims, one per live
                      preview Environment, each fresh and empty, torn down with the
                      preview.
                    items:
                      description: ClaimPreviewVolume is one preview Environment's
                        own volume.
                      properties:
                        claimName:
                          description: ClaimName is the PersistentVolumeClaim in the
                            application namespace.
                          type: string
                        environment:
                          description: Environment is the preview Environment the
                            volume belongs to.
                          type: string
                        provenance:
                          description: |-
                            Provenance is what the volume's data derives from: synthetic, always,
                            because a preview's volume is created empty and never copied from
                            production.
                          enum:
                          - production
                          - masked
                          - synthetic
                          type: string
                      required:
                      - claimName
                      - environment
                      type: object
                    type: array
                  process:
                    description: |-
                      Process is the project's process that mounts the volume ("web" for
                      the web process), and MountPath where it appears in its container.
                      Both echo the claim's config, so a reader of the status does not have
                      to decode spec.config to know what the environment reconciler does.
                    type: string
                  source:
                    allOf:
                    - enum:
                      - provision
                      - bind
                    - enum:
                      - provision
                      - bind
                    description: |-
                      Source is where the volume came from — provision or bind — echoed
                      from the claim so that every reader of the status knows which of the
                      two shapes below it is looking at without decoding spec.config.
                    type: string
                  storageClass:
                    description: |-
                      StorageClass is the class the volume was actually cut from: the one
                      the claim named, or the cluster's default at the time. A bound volume
                      reports the class it carries, where it carries one, and nothing where
                      it does not — a statically written PersistentVolume usually has none.
                    type: string
                required:
                - accessMode
                - claimName
                - mountPath
                - process
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
    {{- if .Values.crds.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
  labels:
    {{- include "kitchen.labels" . | nindent 4 }}
  name: savedqueries.kitchen.bermos.dev
spec:
  group: kitchen.bermos.dev
  names:
    kind: SavedQuery
    listKind: SavedQueryList
    plural: savedqueries
    singular: savedquery
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.title
      name: Title
      type: string
    - jsonPath: .spec.query
      name: Query
      type: string
    - jsonPath: .status.firing
      name: Firing
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SavedQuery is the Schema for the savedqueries API.

          Its status is the alert's and only the alert's: a saved query nobody asked
          to be alerted on is observed by nothing and carries none.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              SavedQuerySpec is a question about the logs that was worth keeping.

              The observability view already puts its whole selection in the URL, so any
              question is a link. What a link cannot do is be found again by someone who
              did not receive it — "the one that shows the checkout 500s" lives in a
              person's history or nowhere. This is that question with a name on it,
              shared by everyone on the platform.

              A saved query without an alert has no reconciler and needs none: unlike a
              Domain or a ResourceClaim, which do nothing until something acts on them, a
              saved query has its whole effect by existing, and reading it back is the
              feature. An alert is the exception, and the only one — it is a standing
              question that something has to actually ask, on a schedule, which is what
              SavedQueryReconciler does.
            properties:
              alert:
                description: |-
                  Alert turns the question into a standing one: evaluated on a schedule
                  against a threshold over a window, and announced when it crosses.

                  It is on the saved query rather than in an object of its own because
                  the query *is* the alert's definition — an alert with a query nobody
                  can open in the observability view, edit and save again is an alert
                  nobody can tune. Absent means the query is only ever asked by a person.
                properties:
                  comparison:
                    default: above
                    description: |-
                      Comparison is which side of the threshold fires. `above` is the usual
                      one — more errors than this. `below` is the heartbeat: a service that
                      logs every minute and has stopped.
                    enum:
                    - above
                    - below
                    type: string
                  intervalMinutes:
                    description: |-
                      IntervalMinutes is how often it is evaluated. It is a floor rather
                      than a promise: an evaluation is due after this long, and the
                      reconciler gets to it when it gets to it.
                    format: int32
                    maximum: 1440
                    minimum: 1
                    type: integer
                  suspended:
                    description: Suspended stops evaluation without deleting the alert
                      or the query.
                    type: boolean
                  threshold:
                    description: |-
                      Threshold is the number of matching lines the count is compared
                      against.
                    format: int64
                    minimum: 0
                    type: integer
                  windowMinutes:
                    description: |-
                      WindowMinutes is how far back each evaluation counts. It is separate
                      from the query's own rangeMinutes, which is what a person opening the
                      query in the dashboard sees: an alert wants a short window it can
                      evaluate often, and the same query is usually worth reading over a
                      longer one.
                    format: int32
                    maximum: 1440
                    minimum: 1
                    type: integer
                required:
                - threshold
                - windowMinutes
                type: object
              description:
                description: Description says what the query is for, when the title
                  cannot.
                maxLength: 500
                type: string
              includeCluster:
                description: |-
                  IncludeCluster keeps the logs of pods Kitchen did not deploy, which
                  the view scopes out by default.
                type: boolean
              limit:
                description: Limit is how many lines the query asks for.
                format: int32
                maximum: 5000
                minimum: 1
                type: integer
              query:
                description: 'Query is Kitchen''s log query language: `level:error
                  service:shop`.'
                maxLength: 2000
                type: string
              rangeMinutes:
                description: |-
                  RangeMinutes is the window the question is asked over, relative to
                  whenever it is opened — which is what makes it worth saving. Zero
                  means everything retained.

                  An absolute window is deliberately not storable: "the spike on
                  Tuesday" stops being a question and becomes a screenshot, and the
                  retention deletes it out from under the name anyway.
                format: int32
                minimum: 0
                type: integer
              savedBy:
                description: |-
                  SavedBy is who saved it, as the API knew them. It is recorded rather
                  than enforced: saved queries are the platform's, not a person's, and
                  this is a byline.
                type: string
              title:
                description: |-
                  Title is what the query is called in the dashboard. It is free text,
                  unlike the object's name, which has to be a DNS label.
                maxLength: 120
                minLength: 1
                type: string
              view:
                description: |-
                  View is which of the observability view's tabs the query is read in:
                  `lines` or `patterns`. A query saved because its patterns are the
                  interesting part should open on them.
                enum:
                - lines
                - patterns
                type: string
              where:
                description: |-
                  Where is a ClickHouse expression, the escape hatch the query bar can
                  be switched into. A saved query may carry either or both, exactly as
                  the view composes them.
                maxLength: 2000
                type: string
            required:
            - title
            type: object
          status:
            description: |-
              SavedQueryStatus is what the alert has observed. A saved query with no alert
              never has one written.
            properties:
              firing:
                description: |-
                  Firing is whether the threshold is crossed right now. The notification
                  is sent on the *edge* into it — a threshold that stays crossed for an
                  afternoon is one message, not one every five minutes.
                type: boolean
              firingSince:
                format: date-time
                type: string
              lastCount:
                format: int64
                type: integer
              lastEvaluationTime:
                description: |-
                  LastEvaluationTime is when the alert was last asked, and LastCount what
                  it answered. Both are on the object rather than only in the log so that
                  "is this alert working" is answerable without one.
                format: date-time
                type: string
              message:
                description: |-
                  Message is the last evaluation in words, including the reason an
                  evaluation could not be made — no telemetry store, a query the store
                  refused — which is otherwise invisible on an alert that has simply
                  never fired.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
