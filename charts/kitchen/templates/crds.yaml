                          time, which is exactly why the digest beside it is recorded separately.
                        type: string
                      repository:
                        description: Repository the artifact was pulled from, without
                          a tag or digest.
                        type: string
                      signature:
                        description: Signature is what became of the vendor's own
                          signature on the digest.
                        properties:
                          identity:
                            description: |-
