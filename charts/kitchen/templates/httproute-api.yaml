{{- include "kitchen.validate" . -}}
{{- if .Values.api.route.enabled }}
{{- if not (include "kitchen.apiHost" .) }}
{{- fail "api.route.enabled needs a hostname: set kitchen.baseDomain, kitchen.api.externalURL or api.route.host." }}
{{- end }}
# Publishes the operator's REST API on the shared Gateway, under the same
# hostname as the git webhook receiver and next to it in the path space:
# https://<host>/api/v1/... . The Gateway itself is created by the Kitchen
# reconciler, so this route stays unaccepted until the operator has programmed
# it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "kitchen.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kitchen.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.api.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ .Values.api.route.gateway.name }}
      namespace: {{ .Values.api.route.gateway.namespace }}
      # Port 80 carries only the redirect when edge TLS is on.
      sectionName: {{ include "kitchen.gatewaySection" . }}
  hostnames:
    - {{ include "kitchen.apiHost" . | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/
      backendRefs:
        - name: {{ include "kitchen.fullname" . }}-api
          port: {{ .Values.api.service.port }}
    {{- if .Values.api.ui.enabled }}
    # The dashboard: everything outside /api/ (and the webhook receiver's more
    # specific /webhooks/git/ prefix, which wins by Gateway API precedence) is
    # the SPA and its assets, served by the same operator process.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "kitchen.fullname" . }}-api
          port: {{ .Values.api.service.port }}
    {{- end }}
{{- end }}
