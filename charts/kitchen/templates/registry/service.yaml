{{- include "kitchen.validate" . -}}
{{- if eq (include "kitchen.registryEnabled" .) "true" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kitchen.registryFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kitchen.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry
  {{- with .Values.registry.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.registry.service.type }}
  selector:
    {{- include "kitchen.registrySelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ int .Values.registry.service.port }}
      targetPort: http
      protocol: TCP
---
# Governing service for the StatefulSet: stable per-pod DNS.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kitchen.registryFullname" . }}-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kitchen.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "kitchen.registrySelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ int .Values.registry.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
