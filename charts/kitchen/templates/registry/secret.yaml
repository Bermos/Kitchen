{{- include "kitchen.validate" . -}}
{{- if eq (include "kitchen.registryEnabled" .) "true" }}
{{- /*
The registry's two accounts, in three shapes for three readers: `username` and
`password` (and `readUsername`/`readPassword`) for the operator, which copies
them into the Connection it seeds and into the pull-only credential it writes
beside it, and `htpasswd` for zot itself, which reads bcrypt lines and nothing
else.

There are two accounts because a build pod runs code the platform did not
write, and the credential that pushes an image can push over every other
project's tags (#424). The pushing account is the platform's; the read-only
one is what a buildpack script, a quality gate or a vulnerability scanner is
given, and the access control in the ConfigMap is what makes it read-only.

A generated password is read back from the cluster on upgrade so it stays
stable — rotating it would lock every project's builds out of the registry
they push to. `helm template` cannot look it up, so rendering offline produces
fresh passwords every time; set registry.auth.password and
registry.auth.readPassword explicitly if you render manifests instead of
installing.
*/}}
{{- $password := include "kitchen.registryPassword" . }}
{{- $readPassword := include "kitchen.registryReadPassword" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kitchen.registrySecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kitchen.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry
type: Opaque
stringData:
  username: {{ .Values.registry.auth.username | quote }}
  password: {{ $password | quote }}
  readUsername: {{ .Values.registry.auth.readUsername | quote }}
  readPassword: {{ $readPassword | quote }}
  htpasswd: {{ include "kitchen.registryHtpasswd" (dict "ctx" . "password" $password "readPassword" $readPassword) | quote }}
{{- end }}
