{{- include "kitchen.validate" . -}}
{{- if eq (include "kitchen.registryEnabled" .) "true" }}
{{- /*
The registry's own credential, in three shapes for three readers: `username`
and `password` for the operator, which copies them into the Connection it
seeds, and `htpasswd` for zot itself, which reads a bcrypt line and nothing
else.

A generated password is read back from the cluster on upgrade so it stays
stable — rotating it would lock every project's builds out of the registry
they push to. `helm template` cannot look it up, so rendering offline produces
a fresh password every time; set registry.auth.password explicitly if you
render manifests instead of installing.
*/}}
{{- $password := include "kitchen.registryPassword" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kitchen.registrySecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kitchen.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry
type: Opaque
stringData:
  username: {{ .Values.registry.auth.username | quote }}
  password: {{ $password | quote }}
  htpasswd: {{ include "kitchen.registryHtpasswd" (dict "ctx" . "password" $password) | quote }}
{{- end }}
