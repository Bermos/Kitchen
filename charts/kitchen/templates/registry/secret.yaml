{{- include "kitchen.validate" . -}}
{{- if eq (include "kitchen.registryEnabled" .) "true" }}
{{- /*
The registry's credentials, in two shapes for two readers.

`username`/`password` and `readUsername`/`readPassword` are the platform's own
two accounts, for the operator: it copies the first into the Connection it
seeds, and its token service is where both are checked. The first may push to
any repository and the second may read any, and neither is handed to a
project — every project gets two accounts of its own, written by the operator
when the project is created and scoped to that project's repositories.

`tokenKey` and `tokenCert` are the pair that makes that possible. zot does not
check a password itself: it sends a client to the operator's token service,
which checks the password and signs a token naming the repositories it may
touch with `tokenKey`, and zot accepts a token `tokenCert` verifies. zot is
given the certificate and nothing else in this Secret — the StatefulSet
projects that one key — so the registry pod holds no credential at all.

Everything generated is read back from the cluster on upgrade so it stays
stable: a rotated password locks out whatever holds the old one, and a rotated
key invalidates every token in flight. `helm template` cannot look anything
up, so rendering offline produces fresh values every time; set
registry.auth.password and registry.auth.readPassword explicitly if you render
manifests instead of installing, and expect a new signing key on every render.
*/}}
{{- $password := include "kitchen.registryPassword" . }}
{{- $readPassword := include "kitchen.registryReadPassword" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "kitchen.registrySecretName" .) }}
{{- $data := default dict (default dict $existing).data }}
{{- $tokenKey := "" }}
{{- $tokenCert := "" }}
{{- if and (index $data "tokenKey") (index $data "tokenCert") }}
{{- $tokenKey = index $data "tokenKey" | b64dec }}
{{- $tokenCert = index $data "tokenCert" | b64dec }}
{{- else }}
{{- /*
A self-signed certificate is the only way Helm can hand out an RSA public key
— there is no function that derives one from a private key — and zot reads
the key out of it, ignoring the rest. Its validity is not checked by anything,
so a century is a way of saying "never" that a parser still accepts.
*/}}
{{- $pair := genSelfSignedCert "kitchen-registry-token" nil nil 36500 }}
{{- $tokenKey = $pair.Key }}
{{- $tokenCert = $pair.Cert }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kitchen.registrySecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kitchen.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry
type: Opaque
stringData:
  username: {{ .Values.registry.auth.username | quote }}
  password: {{ $password | quote }}
  readUsername: {{ .Values.registry.auth.readUsername | quote }}
  readPassword: {{ $readPassword | quote }}
  tokenKey: {{ $tokenKey | quote }}
  tokenCert: {{ $tokenCert | quote }}
{{- end }}
