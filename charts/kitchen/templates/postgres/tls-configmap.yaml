{{- include "kitchen.validate" . -}}
{{- if eq (include "kitchen.postgresTLSEnabled" .) "true" }}
{{- /*
What stops the accounts database answering in the clear.

`ssl = on` alone would only *offer* TLS: the stock image's rules end in
`host all all all scram-sha-256`, which serves a plaintext client exactly as
happily as an encrypted one — and every client would keep working, which is
how that goes unnoticed. `hostssl` is the same rule for encrypted connections
only, and there is deliberately no `host` line under it, so a plaintext
connection is refused with "no pg_hba.conf entry ... SSL off" rather than
downgraded to.

The server is pointed at this file with `-c hba_file=`, not by writing into
the data directory. `pg_hba.conf` is generated by initdb and then belongs to
the volume, so an installation that already exists would keep the rules it was
created with for ever — the whole file has to come from somewhere the chart
owns for an upgrade to change anything. The one this image still writes into
PGDATA is left where it is, unread.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kitchen.postgresFullname" . }}-tls-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kitchen.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
data:
  pg_hba.conf: |
    # Managed by the Kitchen chart. See templates/postgres/tls-configmap.yaml.

    # The Unix socket, which is inside this pod's own filesystem: reaching it
    # means already being in the container, where the data directory is
    # readable anyway. It is `trust` because the image's entrypoint
    # initialises the cluster over it — with `psql --no-password`, before
    # there is a password to give — and because `pg_isready`, which is all
    # three of this pod's probes, is a socket connection too.
    local   all             all                                     trust

    # Everything over TCP: encrypted, and authenticated by password. There is
    # no `host` line, which is the point — a client that will not do TLS is
    # refused rather than served in the clear.
    hostssl all             all             all                     scram-sha-256
{{- end }}
