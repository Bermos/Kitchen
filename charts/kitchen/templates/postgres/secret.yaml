{{- if or .Values.postgres.enabled .Values.postgres.external.host }}
{{- /*
Connection details for the auth database, in one place regardless of whether
Postgres is deployed by this chart or lives outside the cluster.

A generated password is read back from the cluster on upgrade so it stays
stable. `helm template` cannot look it up, so rendering offline produces a
fresh password every time — set postgres.auth.password explicitly if you
render manifests instead of installing.
*/}}
{{- $password := include "kitchen.postgresPassword" . }}
{{- $host := include "kitchen.postgresHost" . }}
{{- $port := include "kitchen.postgresPort" . }}
{{- $database := .Values.postgres.auth.database }}
{{- $username := .Values.postgres.auth.username }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kitchen.postgresSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kitchen.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  host: {{ $host | quote }}
  port: {{ $port | quote }}
  database: {{ $database | quote }}
  username: {{ $username | quote }}
  password: {{ $password | quote }}
  dsn: {{ printf "postgres://%s:%s@%s:%s/%s"
        ($username | urlquery) ($password | urlquery) $host $port $database | quote }}
{{- end }}
