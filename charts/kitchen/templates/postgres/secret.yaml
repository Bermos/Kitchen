{{- if or .Values.postgres.enabled .Values.postgres.external.host }}
{{- /*
Connection details for the auth database, in one place regardless of whether
Postgres is deployed by this chart or lives outside the cluster.

A generated password is read back from the cluster on upgrade so it stays
stable. `helm template` cannot look it up, so rendering offline produces a
fresh password every time — set postgres.auth.password explicitly if you
render manifests instead of installing.
*/}}
{{- $password := include "kitchen.postgresPassword" . }}
{{- $host := include "kitchen.postgresHost" . }}
{{- $port := include "kitchen.postgresPort" . }}
{{- $database := .Values.postgres.auth.database }}
{{- $username := .Values.postgres.auth.username }}
{{- $sslmode := include "kitchen.postgresSSLMode" . }}
{{- $internal := eq (include "kitchen.postgresTLSEnabled" .) "true" }}
{{- $query := "" }}
{{- if $sslmode }}
{{- $query = printf "?sslmode=%s" $sslmode }}
{{- end }}
{{- if $internal }}
{{- $query = printf "%s&sslrootcert=%s" $query (include "kitchen.internalCAFile" .) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kitchen.postgresSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kitchen.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  host: {{ $host | quote }}
  port: {{ $port | quote }}
  database: {{ $database | quote }}
  username: {{ $username | quote }}
  password: {{ $password | quote }}
  {{- if $sslmode }}
  # What every client asks of the connection. It is in the DSN below, which is
  # what they all read; it is a key of its own because the platform reports on
  # it — a `Kitchen` whose accounts database is reached in the clear says so
  # rather than leaving it to be discovered.
  sslmode: {{ $sslmode | quote }}
  {{- end }}
  {{- if $internal }}
  # The CA the database's certificate is verified against, at the path the
  # operator's ConfigMap is mounted at in every pod that connects. It is the
  # difference between an encrypted connection and a verified one.
  caFile: {{ include "kitchen.internalCAFile" . | quote }}
  # Addressed to the operator rather than to any client: it names the Secret
  # the database's certificate belongs in, and by naming it asks for one to be
  # issued from the platform's internal CA. Left out, the operator issues
  # nothing — an external database's certificate is somebody else's, and a
  # bundled one without this key is one somebody has chosen to leave in the
  # clear.
  certificateSecret: {{ include "kitchen.postgresTLSSecretName" . | quote }}
  {{- end }}
  dsn: {{ printf "postgres://%s:%s@%s:%s/%s%s"
        ($username | urlquery) ($password | urlquery) $host $port $database $query | quote }}
{{- end }}
