{{- if .Values.postgres.enabled }}
# Single-node Postgres: the auth service's system of record. SQLite on a PVC
# was the obvious alternative and was rejected — it caps the identity provider
# at one replica forever.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "kitchen.postgresFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kitchen.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  serviceName: {{ include "kitchen.postgresFullname" . }}-headless
  selector:
    matchLabels:
      {{- include "kitchen.postgresSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kitchen.postgresSelectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
      {{- with .Values.postgres.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgres.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.postgres.podSecurityContext | nindent 8 }}
      containers:
        - name: postgres
          image: {{ printf "%s:%s" .Values.postgres.image.repository .Values.postgres.image.tag }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          env:
            # The entrypoint creates this database and user on first start.
            - name: POSTGRES_DB
              value: {{ .Values.postgres.auth.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kitchen.postgresSecretName" . }}
                  key: password
            # The volume is mounted at /var/lib/postgresql/data, which on some
            # storage classes is not empty (lost+found); initdb refuses that.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            {{- with .Values.postgres.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          startupProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.auth.username | quote }}, "-d", {{ .Values.postgres.auth.database | quote }}]
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.auth.username | quote }}, "-d", {{ .Values.postgres.auth.database | quote }}]
            periodSeconds: 20
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.auth.username | quote }}, "-d", {{ .Values.postgres.auth.database | quote }}]
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.postgres.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # The entrypoint writes here while initialising the cluster.
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
        {{- if not .Values.postgres.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with .Values.postgres.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgres.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgres.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.postgres.persistence.enabled }}
  volumeClaimTemplates:
    # Stable labels only. `volumeClaimTemplates` is immutable, so anything
    # embedded here that moves with the chart version — `helm.sh/chart`,
    # `app.kubernetes.io/version` — makes every upgrade to a new version an
    # attempt to mutate an immutable field, which the API server rejects. The
    # StatefulSet and the pod template carry the full set; the claim template
    # carries what never changes. No loss either way: a PVC created by a
    # StatefulSet keeps the labels it was created with and is never relabelled,
    # so a version stamped here only ever named the version that made the
    # volume.
    - metadata:
        name: data
        labels:
          {{- include "kitchen.postgresSelectorLabels" . | nindent 10 }}
          app.kubernetes.io/component: postgres
          app.kubernetes.io/part-of: kitchen
      spec:
        accessModes:
          {{- toYaml .Values.postgres.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size | quote }}
        {{- with .Values.postgres.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
  {{- end }}
{{- end }}
