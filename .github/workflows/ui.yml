name: Dashboard

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: ui

jobs:
  test:
    name: Build, typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The build comes first: it generates the auto-import declarations the
      # typecheck needs.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Run the tests
        run: npm test
