name: Auth service

# A branch push and the pull request that carries it are the same commit, so
# leaving `push` unfiltered ran every job here twice for every push to a branch
# with a pull request open. `push` is narrowed to `main` for that reason: a
# branch is covered by its pull request, and `main` is covered once, after the
# merge.
#
# This workflow is cheap, and it keeps its run on `main` where the kind-based
# ones no longer do. An Actions cache is readable by the branch that wrote it,
# that branch's base, and the default branch — so `main`'s runs are the only
# ones every pull request can restore from, the kind jobs in the other
# workflows included. Dropping them would start every pull request cold.
# See CONTRIBUTING.md, "What CI runs, and when".
on:
  push:
    branches: [main]
  pull_request:

# One run per branch or pull request. A pull request's older runs are
# superseded by the push that follows them and are cancelled; `main`'s are
# never cancelled, because they are the last gate before a release and the only
# runs whose caches every other branch can restore from.
concurrency:
  group: auth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: auth

jobs:
  test:
    name: Typecheck and integration tests
    runs-on: ubuntu-latest
    services:
      # better-auth generates the schema from the plugin set, so the tests run
      # against a real Postgres rather than a stand-in.
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: kitchen
          POSTGRES_DB: kitchen_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      KITCHEN_AUTH_TEST_DATABASE_URL: postgres://postgres:kitchen@127.0.0.1:5432/kitchen_auth_test
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: auth/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run the tests
        run: npm test

  image:
    name: Image build
    runs-on: ubuntu-latest
    # Long enough for a cold cache, short enough that a build which has stopped
    # making progress is a failure rather than a bill. The publish workflow
    # carries the same bound.
    timeout-minutes: 20
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Both platforms, and deliberately no QEMU. This job built linux/amd64
      # alone until 0.5.1, so the arm64 leg was first exercised by the release
      # tag that published it — which is where it hung, six hours at a time,
      # with no chart published at the end of it. Building both here is what
      # makes that a pull request's problem instead of a release's.
      #
      # Without the emulator a stage that needs the target's architecture fails
      # immediately with `exec format error`, which is the failure worth having:
      # the Dockerfile's cross-build is a property this asserts rather than a
      # detail it tolerates.
      - name: Build the auth image
        uses: docker/build-push-action@v6
        with:
          context: auth
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
