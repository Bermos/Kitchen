name: Auth service

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: auth

jobs:
  test:
    name: Typecheck and integration tests
    runs-on: ubuntu-latest
    services:
      # better-auth generates the schema from the plugin set, so the tests run
      # against a real Postgres rather than a stand-in.
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: kitchen
          POSTGRES_DB: kitchen_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      KITCHEN_AUTH_TEST_DATABASE_URL: postgres://postgres:kitchen@127.0.0.1:5432/kitchen_auth_test
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: auth/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run the tests
        run: npm test

  image:
    name: Image build
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the auth image
        uses: docker/build-push-action@v6
        with:
          context: auth
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
