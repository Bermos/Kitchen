name: Auth service

# A branch push and the pull request that carries it are the same commit, so
# leaving `push` unfiltered ran every job here twice for every push to a branch
# with a pull request open. `push` is narrowed to `main` for that reason: a
# branch is covered by its pull request, and `main` is covered once, after the
# merge.
#
# The run on `main` is deliberate and not a duplicate of the pull request's.
# See CONTRIBUTING.md, "What CI runs, and when".
on:
  push:
    branches: [main]
  pull_request:

# One run per branch or pull request. A pull request's older runs are
# superseded by the push that follows them and are cancelled; `main`'s are
# never cancelled, because they are the last gate before a release and the only
# runs whose caches every other branch can restore from.
concurrency:
  group: auth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: auth

jobs:
  test:
    name: Typecheck and integration tests
    runs-on: ubuntu-latest
    services:
      # better-auth generates the schema from the plugin set, so the tests run
      # against a real Postgres rather than a stand-in.
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: kitchen
          POSTGRES_DB: kitchen_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      KITCHEN_AUTH_TEST_DATABASE_URL: postgres://postgres:kitchen@127.0.0.1:5432/kitchen_auth_test
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: auth/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run the tests
        run: npm test

  image:
    name: Image build
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the auth image
        uses: docker/build-push-action@v6
        with:
          context: auth
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
