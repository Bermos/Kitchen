name: Helm Chart

on:
  push:
  pull_request:

env:
  # The Cilium release Kitchen targets. Cilium *is* the Gateway API
  # implementation here, and it pins the CRD version tightly — so the CRDs the
  # kind jobs install are the ones this release requires, resolved from
  # Cilium's own documentation below rather than written down twice. Bump this
  # alone; GATEWAY_API_VERSION is only the fallback for when the lookup cannot
  # reach GitHub.
  CILIUM_VERSION: v1.20.0
  GATEWAY_API_VERSION: v1.6.1
  # Used to poke the git webhook receiver from inside the cluster.
  PROBE_IMAGE: curlimages/curl:8.11.1

jobs:
  lint:
    name: Chart lint and render
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Check generated templates are in sync
        run: |
          ./hack/gen-helm-manifests.sh
          git diff --exit-code -- charts/ || {
            echo "::error::charts/kitchen templates are stale. Run 'make helm-manifests' and commit the result."
            exit 1
          }

      - name: Lint the chart
        run: helm lint charts/kitchen --namespace kitchen-system --set kitchen.baseDomain=apps.example.com

      - name: Render the supported value combinations
        run: |
          set -euo pipefail
          render() {
            echo "--- helm template $*"
            helm template kitchen charts/kitchen --namespace kitchen-system "$@" >/dev/null
          }
          render --set kitchen.baseDomain=apps.example.com
          render --set kitchen.baseDomain=apps.example.com --set replicaCount=3
          render --set kitchen.baseDomain=apps.example.com --set kitchen.applyOnUpgrade=true
          render --set kitchen.baseDomain=apps.example.com --set metrics.serviceMonitor.enabled=true
          render --set kitchen.baseDomain=apps.example.com --set metrics.enabled=false
          render --set kitchen.baseDomain=apps.example.com --set crds.install=false --set rbac.create=false
          render --set kitchen.baseDomain=apps.example.com \
                 --set kitchen.tls.mode=cloudflared \
                 --set kitchen.ingress.cloudflared.enabled=true \
                 --set kitchen.ingress.cloudflared.tunnelSecretName=kitchen-tunnel
          # No base domain: every hostname the chart publishes has to be given
          # explicitly, or its route turned off.
          render --set kitchen.create=false --set webhookReceiver.route.enabled=false \
                 --set api.route.host=kitchen.example.com \
                 --set auth.route.host=login.example.com \
                 --set previewGate.host=previews.example.com
          render --set kitchen.baseDomain=apps.example.com \
                 --set clickhouse.persistence.enabled=false \
                 --set clickhouse.extraConfig.logger\\.xml='<clickhouse><logger><level>debug</level></logger></clickhouse>'
          render --set kitchen.baseDomain=apps.example.com \
                 --set clickhouse.enabled=false \
                 --set clickhouse.external.host=clickhouse.telemetry.svc \
                 --set clickhouse.auth.password=hunter2
          render --set kitchen.baseDomain=apps.example.com \
                 --set clickhouse.enabled=false --set clickhouse.acknowledgeNoStore=true
          render --set kitchen.baseDomain=apps.example.com --set logs.enabled=false
          render --set kitchen.baseDomain=apps.example.com \
                 --set logs.extraLabelSelector=app.kubernetes.io/part-of=kitchen \
                 --set logs.extraFieldSelector=metadata.namespace!=kube-system
          render --set kitchen.baseDomain=apps.example.com \
                 --set auth.enabled=false --set postgres.enabled=false \
                 --set previewGate.enabled=false
          render --set kitchen.baseDomain=apps.example.com \
                 --set auth.replicaCount=2 --set auth.bootstrap.enabled=false
          render --set kitchen.baseDomain=apps.example.com \
                 --set auth.github.clientId=Iv1.deadbeef --set auth.github.clientSecret=hunter2
          render --set kitchen.baseDomain=apps.example.com \
                 --set auth.github.clientId=Iv1.deadbeef --set auth.github.existingSecret=github-oauth
          render --set kitchen.baseDomain=apps.example.com \
                 --set auth.route.host=login.example.com
          render --set kitchen.baseDomain=apps.example.com \
                 --set postgres.persistence.enabled=false
          # The forward-auth gate for protected previews.
          render --set kitchen.baseDomain=apps.example.com \
                 --set previewGate.enabled=false
          render --set kitchen.baseDomain=apps.example.com \
                 --set previewGate.host=gate.example.com \
                 --set previewGate.replicas=1 --set previewGate.sessionTTL=1h
          render --set kitchen.baseDomain=apps.example.com \
                 --set postgres.enabled=false \
                 --set postgres.external.host=postgres.databases.svc \
                 --set postgres.auth.password=hunter2
          # Plain HTTP: the way a cluster comes up before DNS and certificates.
          render --set kitchen.baseDomain=apps.example.com --set kitchen.tls.mode=none

      - name: Check published URLs follow the TLS mode
        run: |
          set -euo pipefail
          field() {
            local file=$1 key=$2
            shift 2
            helm template kitchen charts/kitchen --namespace kitchen-system \
              --set kitchen.baseDomain=apps.example.com "$@" -s "${file}" \
              | awk -v key="${key}:" '$1 == key { print $2; exit }' | tr -d '"'
          }
          issuer() { field templates/auth/secret.yaml issuer "$@"; }
          external() { field templates/kitchen.yaml externalURL "$@"; }

          [ "$(issuer)" = https://auth.apps.example.com ] || {
            echo "::error::the OIDC issuer is not served over https by default"
            exit 1
          }
          [ "$(external)" = https://kitchen.apps.example.com ] || {
            echo "::error::the API's external URL is not https by default"
            exit 1
          }
          # In TLS mode "none" the shared Gateway gets an HTTP listener and
          # nothing else, so an https URL published there is one nothing
          # serves: discovery, the JWKS fetch and every redirect built from the
          # issuer would fail.
          [ "$(issuer --set kitchen.tls.mode=none)" = http://auth.apps.example.com ] || {
            echo "::error::the OIDC issuer advertises a scheme the Gateway does not serve in tls.mode=none"
            exit 1
          }
          [ "$(external --set kitchen.tls.mode=none)" = http://kitchen.apps.example.com ] || {
            echo "::error::the API's external URL advertises https in tls.mode=none"
            exit 1
          }

      - name: Check no immutable field carries a versioned label
        run: |
          set -euo pipefail
          # `volumeClaimTemplates` is immutable: the API server rejects every
          # change to it, including one confined to labels. So a label that
          # moves with the chart version — `helm.sh/chart`,
          # `app.kubernetes.io/version` — makes the StatefulSet unupgradable to
          # any new version, on every existing install. The kind job installs
          # and upgrades; only a render can check this without a cluster.
          claim_templates() {
            helm template kitchen charts/kitchen --namespace kitchen-system \
              --set kitchen.baseDomain=apps.example.com -s "$1" \
              | awk '/^  volumeClaimTemplates:/ { inside = 1; next }
                     inside && /^  [^ #]/ { inside = 0 }
                     inside && !/^ *#/'
          }
          for file in templates/clickhouse/statefulset.yaml templates/postgres/statefulset.yaml; do
            block=$(claim_templates "${file}")
            [ -n "${block}" ] || {
              echo "::error::${file} rendered no volumeClaimTemplates to check"
              exit 1
            }
            if echo "${block}" | grep -nE 'helm\.sh/chart|app\.kubernetes\.io/version'; then
              echo "::error::${file} puts a versioned label on volumeClaimTemplates," \
                   "which is immutable — no release could then be upgraded to a new chart" \
                   "version. Use the component's selector labels there instead of kitchen.labels."
              exit 1
            fi
          done

      - name: Check the collector is only rendered with somewhere to ship to
        run: |
          set -euo pipefail
          collector() {
            helm template kitchen charts/kitchen --namespace kitchen-system "$@" \
              | grep -c 'kind: DaemonSet' || true
          }
          [ "$(collector --set kitchen.baseDomain=apps.example.com)" = 1 ] || {
            echo "::error::the log collector should be installed by default"
            exit 1
          }
          # Acknowledging no telemetry store must not leave a DaemonSet
          # crash-looping against a ClickHouse that was never installed.
          [ "$(collector --set kitchen.baseDomain=apps.example.com \
                 --set clickhouse.enabled=false --set clickhouse.acknowledgeNoStore=true)" = 0 ] || {
            echo "::error::the log collector was rendered without a telemetry store"
            exit 1
          }

      - name: Reject unsupported value combinations
        run: |
          set -uo pipefail
          expect_failure() {
            if helm template kitchen charts/kitchen --namespace "$1" "${@:2}" >/dev/null 2>&1; then
              echo "::error::expected rendering to fail: namespace=$1 ${*:2}"
              exit 1
            fi
          }
          # No base domain for the Kitchen singleton.
          expect_failure kitchen-system
          # Installed outside the operator's platform namespace.
          expect_failure default --set kitchen.baseDomain=apps.example.com
          # cloudflared without tunnel credentials.
          expect_failure kitchen-system --set kitchen.baseDomain=apps.example.com \
            --set kitchen.ingress.cloudflared.enabled=true
          # Multiple replicas without leader election.
          expect_failure kitchen-system --set kitchen.baseDomain=apps.example.com \
            --set replicaCount=3 --set leaderElection=false
          # Both a bundled and an external ClickHouse.
          expect_failure kitchen-system --set kitchen.baseDomain=apps.example.com \
            --set clickhouse.external.host=clickhouse.telemetry.svc
          # External ClickHouse without a password.
          expect_failure kitchen-system --set kitchen.baseDomain=apps.example.com \
            --set clickhouse.enabled=false --set clickhouse.external.host=clickhouse.telemetry.svc
          # No telemetry store at all, unacknowledged.
          expect_failure kitchen-system --set kitchen.baseDomain=apps.example.com \
            --set clickhouse.enabled=false
          # A collector buffer too small to hold a single batch.
          expect_failure kitchen-system --set kitchen.baseDomain=apps.example.com \
            --set logs.batch.maxEvents=5000 --set logs.buffer.maxEvents=100
          # The identity provider without a database to keep accounts in.
          expect_failure kitchen-system --set kitchen.baseDomain=apps.example.com \
            --set postgres.enabled=false
          # Both a bundled and an external Postgres.
          expect_failure kitchen-system --set kitchen.baseDomain=apps.example.com \
            --set postgres.external.host=postgres.databases.svc
          # External Postgres without a password.
          expect_failure kitchen-system --set kitchen.baseDomain=apps.example.com \
            --set postgres.enabled=false --set postgres.external.host=postgres.databases.svc
          # The preview gate without an identity provider to sign visitors in.
          expect_failure kitchen-system --set kitchen.baseDomain=apps.example.com \
            --set auth.enabled=false --set postgres.enabled=false
          # The preview gate with nowhere to bring logins back to: every other
          # hostname is given, so only the gate's is missing.
          expect_failure kitchen-system --set kitchen.create=false \
            --set webhookReceiver.route.enabled=false \
            --set api.route.host=kitchen.example.com \
            --set auth.route.host=login.example.com
          # A gate with no replicas is a preview with no URL.
          expect_failure kitchen-system --set kitchen.baseDomain=apps.example.com \
            --set previewGate.replicas=0
          # A GitHub OAuth app with no secret to go with the client id.
          expect_failure kitchen-system --set kitchen.baseDomain=apps.example.com \
            --set auth.github.clientId=Iv1.deadbeef
          # The REST API with nowhere to be published.
          expect_failure kitchen-system --set kitchen.create=false \
            --set webhookReceiver.route.enabled=false \
            --set auth.route.host=login.example.com
          # The identity provider with nowhere to be published, so no issuer.
          expect_failure kitchen-system --set kitchen.create=false \
            --set webhookReceiver.route.enabled=false \
            --set api.route.enabled=false

  install:
    name: Chart install on kind
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Create kind cluster
        run: kind create cluster

      # Layer-cached across runs, so `go mod download` only pays the network
      # cost when go.mod or go.sum actually change.
      - name: Build the operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: kitchen:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the auth image
        uses: docker/build-push-action@v6
        with:
          context: auth
          load: true
          tags: kitchen-auth:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load the images into kind
        run: |
          set -euo pipefail
          kind load docker-image kitchen:ci
          kind load docker-image kitchen-auth:ci
          # Pull the dependencies on the runner, where a failed pull can be
          # retried, rather than inside the node where it surfaces as
          # ImagePullBackOff.
          template() {
            helm template kitchen charts/kitchen \
              --namespace kitchen-system --set kitchen.baseDomain=apps.example.com \
              -s "$1" | awk '$1 == "image:" { print $2; exit }'
          }
          clickhouse_image=$(template templates/clickhouse/statefulset.yaml)
          postgres_image=$(template templates/postgres/statefulset.yaml)
          collector_image=$(template templates/logs/daemonset.yaml)
          echo "ClickHouse image: ${clickhouse_image}"
          echo "Postgres image: ${postgres_image}"
          echo "Collector image: ${collector_image}"
          for image in "${clickhouse_image}" "${postgres_image}" "${collector_image}" "${PROBE_IMAGE}"; do
            for i in 1 2 3; do
              docker pull "${image}" && break
              [ "$i" = 3 ] && exit 1
              sleep $((i * 15))
            done
            kind load docker-image "${image}"
          done

      # Cilium states the Gateway API version it supports in one place its docs
      # build from, so the pin can be read from the release Kitchen targets
      # instead of being kept in step by hand — which is how it last drifted
      # six minor versions behind. A lookup that cannot reach GitHub falls back
      # to the checked-in pin rather than failing the job; a lookup that
      # disagrees with it says so, because then the fallback is stale.
      - name: Resolve the Gateway API version Cilium requires
        run: |
          set -uo pipefail
          conf="https://raw.githubusercontent.com/cilium/cilium/${CILIUM_VERSION}/Documentation/conf.py"
          required=$(curl -fsSL --retry 3 --retry-delay 5 "${conf}" \
            | sed -n "s/^gateway_api_version *= *'\(v[0-9.]*\)'.*/\1/p" | head -1)
          if [ -z "${required}" ]; then
            echo "::warning::could not read the Gateway API version from Cilium ${CILIUM_VERSION};" \
                 "falling back to the pinned ${GATEWAY_API_VERSION}"
            exit 0
          fi
          echo "Cilium ${CILIUM_VERSION} requires Gateway API ${required}"
          if [ "${required}" != "${GATEWAY_API_VERSION}" ]; then
            echo "::warning::GATEWAY_API_VERSION is pinned at ${GATEWAY_API_VERSION} but Cilium" \
                 "${CILIUM_VERSION} requires ${required}; testing against ${required}." \
                 "Update the pin in .github/workflows/helm.yml."
            echo "GATEWAY_API_VERSION=${required}" >> "$GITHUB_ENV"
          fi

      - name: Install the Gateway API CRDs
        run: |
          echo "Installing Gateway API ${GATEWAY_API_VERSION}"
          kubectl apply -f \
            https://github.com/kubernetes-sigs/gateway-api/releases/download/${GATEWAY_API_VERSION}/standard-install.yaml

      # The chart carries its CRDs as templates, so a fresh install has to
      # register them and create the Kitchen singleton in the same release.
      - name: Install the chart
        run: |
          helm install kitchen charts/kitchen \
            --namespace kitchen-system --create-namespace \
            --set image.repository=kitchen --set image.tag=ci \
            --set auth.image.repository=kitchen-auth --set auth.image.tag=ci \
            --set kitchen.baseDomain=apps.example.com \
            --wait --timeout 8m || {
              kubectl -n kitchen-system get pods -o wide
              kubectl -n kitchen-system describe deploy kitchen-controller-manager
              kubectl -n kitchen-system describe sts kitchen-clickhouse
              kubectl -n kitchen-system describe sts kitchen-postgres
              kubectl -n kitchen-system describe deploy kitchen-auth
              kubectl -n kitchen-system logs -l control-plane=controller-manager --tail=100
              kubectl -n kitchen-system logs sts/kitchen-clickhouse --tail=100 || true
              kubectl -n kitchen-system logs sts/kitchen-postgres --tail=100 || true
              kubectl -n kitchen-system logs deploy/kitchen-auth --tail=100 || true
              exit 1
            }

      - name: Verify the installed release
        run: |
          set -euo pipefail
          kubectl get crd kitchens.kitchen.bermos.dev
          base_domain=$(kubectl get kitchen default -o jsonpath='{.spec.baseDomain}')
          [ "${base_domain}" = apps.example.com ] || {
            echo "::error::Kitchen singleton has baseDomain '${base_domain}'"
            exit 1
          }
          kubectl -n kitchen-system get httproute kitchen-git-webhook kitchen-api
          kubectl -n kitchen-system get svc kitchen-git-webhook kitchen-api kitchen-metrics
          # The operator creates the shared Gateway from the Kitchen object.
          # kind runs no Gateway controller, so it never gets programmed — it
          # only has to exist, which proves the operator's RBAC is complete.
          for i in $(seq 30); do
            kubectl -n kitchen-system get gateway kitchen >/dev/null 2>&1 && break
            [ "$i" = 30 ] && { kubectl -n kitchen-system logs -l control-plane=controller-manager --tail=50; exit 1; }
            sleep 2
          done
          # The receiver answers webhook deliveries. Run it as a plain pod and
          # read the result afterwards: attaching to a pod that exits this fast
          # is a race, and `curl | grep -q` dies of SIGPIPE under pipefail.
          kubectl -n kitchen-system run webhook-probe \
            --image="${PROBE_IMAGE}" --restart=Never --command -- \
            curl -fsS -X POST -H 'X-GitHub-Event: ping' \
            http://kitchen-git-webhook.kitchen-system.svc/webhooks/git/none
          phase=""
          for _ in $(seq 60); do
            phase=$(kubectl -n kitchen-system get pod webhook-probe -o jsonpath='{.status.phase}' 2>/dev/null || true)
            case "${phase}" in Succeeded|Failed) break ;; esac
            sleep 2
          done
          probe_output=$(kubectl -n kitchen-system logs webhook-probe 2>&1 || true)
          echo "probe phase=${phase} output=${probe_output}"
          kubectl -n kitchen-system delete pod webhook-probe --wait=false
          # curl -f already rejected any non-2xx; the body proves it was the
          # receiver answering and not something else on that address.
          [ "${phase}" = Succeeded ] && [ "${probe_output}" = pong ] || {
            echo "::error::the git webhook receiver did not answer a ping"
            exit 1
          }

      - name: Verify the REST API is shut without a token
        run: |
          set -euo pipefail
          base="http://kitchen-api.kitchen-system.svc"
          # The acceptance criterion the API was built to: nothing answers a
          # caller who cannot prove who they are. A token the platform did not
          # mint is no better than none.
          kubectl -n kitchen-system run api-probe \
            --image="${PROBE_IMAGE}" --restart=Never --command -- sh -ec "
              set -eu
              for path in /api/v1/projects /api/v1/builds /api/v1/environments /api/v1/connections; do
                status=\$(curl -s -o /dev/null -w '%{http_code}' ${base}\${path})
                [ \"\${status}\" = 401 ] || { echo \"\${path} answered \${status}\"; exit 1; }
              done
              status=\$(curl -s -o /dev/null -w '%{http_code}' \
                -H 'authorization: Bearer not-a-real-token' ${base}/api/v1/projects)
              [ \"\${status}\" = 401 ] || { echo \"a forged token answered \${status}\"; exit 1; }
              echo api-ok
            "
          phase=""
          for _ in $(seq 60); do
            phase=$(kubectl -n kitchen-system get pod api-probe -o jsonpath='{.status.phase}' 2>/dev/null || true)
            case "${phase}" in Succeeded|Failed) break ;; esac
            sleep 2
          done
          probe_output=$(kubectl -n kitchen-system logs api-probe 2>&1 || true)
          echo "probe phase=${phase} output=${probe_output}"
          kubectl -n kitchen-system delete pod api-probe --wait=false
          [ "${phase}" = Succeeded ] && [ "${probe_output}" = api-ok ] || {
            kubectl -n kitchen-system logs -l control-plane=controller-manager --tail=100 || true
            echo "::error::the REST API did not refuse an unauthenticated caller"
            exit 1
          }

      - name: Verify the telemetry store
        run: |
          set -euo pipefail
          password=$(kubectl -n kitchen-system get secret kitchen-clickhouse \
            -o jsonpath='{.data.password}' | base64 -d)
          # The credentials in the secret are the ones ClickHouse actually took.
          answer=$(kubectl -n kitchen-system exec sts/kitchen-clickhouse -- \
            clickhouse-client --user kitchen --password "${password}" \
            --database kitchen --query 'SELECT 1')
          [ "${answer}" = 1 ] || {
            echo "::error::ClickHouse rejected the credentials in the secret"
            exit 1
          }
          # The image's passwordless `default` user must be gone.
          if kubectl -n kitchen-system exec sts/kitchen-clickhouse -- \
            clickhouse-client --user default --query 'SELECT 1' >/dev/null 2>&1; then
            echo "::error::the default ClickHouse user still accepts passwordless logins"
            exit 1
          fi

      - name: Verify the identity provider
        run: |
          set -euo pipefail
          secret() {
            kubectl -n kitchen-system get secret kitchen-auth -o jsonpath="{.data.$1}" | base64 -d
          }
          service_key=$(secret serviceKey)
          bootstrap_token=$(secret bootstrapToken)
          issuer="https://auth.apps.example.com"
          # Reach the service directly, with the Host the Gateway would set.
          base="http://kitchen-auth.kitchen-system.svc"

          # One pod runs the whole check: discovery, then dynamic client
          # registration with the credential the operator is given, then the
          # first-run bootstrap link. Its log is the report.
          kubectl -n kitchen-system run auth-probe \
            --image="${PROBE_IMAGE}" --restart=Never --command -- sh -ec "
              set -eu
              discovery=\$(curl -fsS -H 'Host: auth.apps.example.com' \
                ${base}/.well-known/openid-configuration)
              echo \"\${discovery}\" | grep -q '\"issuer\":\"${issuer}\"'
              echo \"\${discovery}\" | grep -q '\"registration_endpoint\":\"${issuer}/oauth2/register\"'
              echo \"\${discovery}\" | grep -q '\"jwks_uri\":\"${issuer}/jwks\"'

              client=\$(curl -fsS -X POST -H 'Host: auth.apps.example.com' \
                -H 'content-type: application/json' -H 'x-api-key: ${service_key}' \
                -d '{\"client_name\":\"ci\",\"redirect_uris\":[\"https://ci.apps.example.com/callback\"]}' \
                ${base}/oauth2/register)
              echo \"\${client}\" | grep -q '\"client_secret\"'

              # The same call without the credential must be refused.
              status=\$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                -H 'Host: auth.apps.example.com' -H 'content-type: application/json' \
                -d '{\"client_name\":\"anon\",\"redirect_uris\":[\"https://anon.example.com/cb\"]}' \
                ${base}/oauth2/register)
              [ \"\${status}\" != 200 ]

              curl -fsS -o /dev/null -H 'Host: auth.apps.example.com' \
                '${base}/bootstrap?token=${bootstrap_token}'
              echo auth-ok
            "
          phase=""
          for _ in $(seq 60); do
            phase=$(kubectl -n kitchen-system get pod auth-probe -o jsonpath='{.status.phase}' 2>/dev/null || true)
            case "${phase}" in Succeeded|Failed) break ;; esac
            sleep 2
          done
          probe_output=$(kubectl -n kitchen-system logs auth-probe 2>&1 || true)
          echo "probe phase=${phase} output=${probe_output}"
          kubectl -n kitchen-system delete pod auth-probe --wait=false
          [ "${phase}" = Succeeded ] && [ "${probe_output}" = auth-ok ] || {
            kubectl -n kitchen-system logs deploy/kitchen-auth --tail=100 || true
            echo "::error::the identity provider did not serve a usable OIDC issuer"
            exit 1
          }

      - name: Verify the preview gate
        run: |
          set -euo pipefail
          # The gate is deployed by the operator, not by the chart, so
          # `helm install --wait` did not wait for it: it only exists once an
          # OAuth client has been registered for it at the identity provider.
          # The first reconcile can land before the identity provider accepts
          # connections — the operator then retries every 30 seconds — so wait
          # for the Deployment to appear rather than asking about one that is
          # not there yet, which `rollout status` refuses immediately.
          for _ in $(seq 60); do
            kubectl -n kitchen-system get deploy kitchen-preview-gate >/dev/null 2>&1 && break
            sleep 5
          done
          kubectl -n kitchen-system rollout status deploy/kitchen-preview-gate --timeout=5m || {
            kubectl get kitchen default -o jsonpath='{.status.conditions}'
            kubectl -n kitchen-system describe deploy kitchen-preview-gate || true
            kubectl -n kitchen-system logs -l control-plane=controller-manager --tail=100
            exit 1
          }
          kubectl -n kitchen-system get httproute kitchen-preview-gate
          client_id=$(kubectl -n kitchen-system get secret kitchen-preview-gate-oidc \
            -o jsonpath='{.data.clientId}' | base64 -d)
          [ -n "${client_id}" ] || {
            echo "::error::the operator registered no OAuth client for the gate"
            exit 1
          }
          echo "gate client: ${client_id}"

          # The acceptance criterion, from inside the cluster: an anonymous
          # request to a protected preview is sent to the platform login, and
          # never to the application. The upstream header is the one the
          # Environment reconciler puts on the route.
          base="http://kitchen-preview-gate.kitchen-system.svc"
          kubectl -n kitchen-system run gate-probe \
            --image="${PROBE_IMAGE}" --restart=Never --command -- sh -ec "
              anonymous=\$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' \
                -H 'Host: shop-pr-42.apps.example.com' \
                -H 'X-Kitchen-Upstream: shop-pr-42.kitchen-shop.svc.cluster.local:80' \
                ${base}/orders)
              echo \"anonymous: \${anonymous}\"
              case \"\${anonymous}\" in
                '302 https://previews.apps.example.com/_kitchen/gate/start?rd='*) ;;
                *) echo 'not sent to the platform login'; exit 1 ;;
              esac

              # A sign-in link nobody signed: the gate host must not redirect
              # anywhere it was merely asked to.
              forged=\$(curl -s -o /dev/null -w '%{http_code}' \
                -H 'Host: previews.apps.example.com' \
                '${base}/_kitchen/gate/start?rd=https://evil.example.com/')
              echo \"forged: \${forged}\"
              [ \"\${forged}\" = 400 ]
              echo gate-ok
            "
          phase=""
          for _ in $(seq 60); do
            phase=$(kubectl -n kitchen-system get pod gate-probe -o jsonpath='{.status.phase}' 2>/dev/null || true)
            case "${phase}" in Succeeded|Failed) break ;; esac
            sleep 2
          done
          probe_output=$(kubectl -n kitchen-system logs gate-probe 2>&1 || true)
          echo "probe phase=${phase} output=${probe_output}"
          kubectl -n kitchen-system delete pod gate-probe --wait=false
          case "${probe_output}" in
            *gate-ok) ;;
            *)
              kubectl -n kitchen-system logs deploy/kitchen-preview-gate --tail=100 || true
              echo "::error::the preview gate did not turn an anonymous request into a login"
              exit 1
              ;;
          esac

      - name: Verify the log pipeline
        run: |
          set -euo pipefail
          password=$(kubectl -n kitchen-system get secret kitchen-clickhouse \
            -o jsonpath='{.data.password}' | base64 -d)
          ch() {
            kubectl -n kitchen-system exec sts/kitchen-clickhouse -- \
              clickhouse-client --user kitchen --password "${password}" \
              --database kitchen --query "$1"
          }

          kubectl -n kitchen-system rollout status ds/kitchen-logs --timeout=5m

          # The operator applies the schema from the Kitchen object, so the
          # table carries the chart's default retention. The Kitchen object is
          # a post-install hook and the reconcile that follows it takes as long
          # as ClickHouse takes to accept a connection, so wait for the table
          # rather than reading once and calling an empty answer a failure.
          engine=""
          for _ in $(seq 30); do
            engine=$(ch "SELECT engine_full FROM system.tables WHERE database = 'kitchen' AND name = 'logs'")
            case "${engine}" in *"toIntervalDay(30)"*) break ;; esac
            sleep 5
          done
          echo "logs engine: ${engine}"
          case "${engine}" in
            *"toIntervalDay(30)"*) ;;
            *)
              echo "::error::the logs table is missing the 30 day TTL"
              kubectl get kitchen default -o jsonpath='{.status.conditions}'
              exit 1
              ;;
          esac

          # The whole point: lines written by a pod turn up in the store,
          # labelled with what produced them. The operator is the pod that is
          # certain to be running and logging here.
          collected=0
          for _ in $(seq 60); do
            collected=$(ch "SELECT count() FROM logs WHERE namespace = 'kitchen-system' AND source = 'platform' AND container = 'manager'")
            [ "${collected}" -gt 0 ] && break
            sleep 5
          done
          [ "${collected}" -gt 0 ] || {
            echo "::error::no operator logs reached ClickHouse"
            kubectl -n kitchen-system logs ds/kitchen-logs --tail=100
            ch "SELECT count() FROM logs" || true
            exit 1
          }
          echo "collected ${collected} operator log lines"

          # Retention is runtime configuration: changing it on the Kitchen
          # object has to reach the table.
          kubectl patch kitchen default --type=merge \
            -p '{"spec":{"observability":{"clickhouse":{"retentionDays":7}}}}'
          for _ in $(seq 30); do
            engine=$(ch "SELECT engine_full FROM system.tables WHERE database = 'kitchen' AND name = 'logs'")
            case "${engine}" in *"toIntervalDay(7)"*) break ;; esac
            sleep 5
          done
          case "${engine}" in
            *"toIntervalDay(7)"*) ;;
            *)
              echo "::error::the retention change did not reach the logs table: ${engine}"
              kubectl get kitchen default -o jsonpath='{.status.conditions}'
              exit 1
              ;;
          esac
          kubectl patch kitchen default --type=merge \
            -p '{"spec":{"observability":{"clickhouse":{"retentionDays":30}}}}'

      # The upgrade below has to cross a *chart version*, not re-apply the same
      # one. Every object the chart owns is labelled with `helm.sh/chart` and
      # `app.kubernetes.io/version`, so a same-version upgrade re-applies
      # byte-identical objects and says nothing about the fields that cannot be
      # re-applied at all. That is how a chart in which no release could ever be
      # upgraded to a new version passed this job.
      - name: Stage a newer chart version
        run: |
          set -euo pipefail
          rm -rf /tmp/kitchen-next
          cp -r charts/kitchen /tmp/kitchen-next
          sed -i -e 's/^version: .*/version: 9.9.9/' \
                 -e 's/^appVersion: .*/appVersion: "9.9.9"/' /tmp/kitchen-next/Chart.yaml
          grep -E '^(version|appVersion):' /tmp/kitchen-next/Chart.yaml

      - name: Upgrade the release
        run: |
          set -euo pipefail
          before=$(kubectl -n kitchen-system get secret kitchen-clickhouse \
            -o jsonpath='{.data.password}')
          auth_before=$(kubectl -n kitchen-system get secret kitchen-auth \
            -o jsonpath='{.data.secret}{" "}{.data.serviceKey}')
          # Both images have to be pinned again: an upgrade without
          # --reuse-values resets every value, and the published tags do not
          # exist on this runner. Pinning them is also what keeps the staged
          # 9.9.9 appVersion from becoming an image tag nothing published.
          helm upgrade kitchen /tmp/kitchen-next \
            --namespace kitchen-system \
            --set image.repository=kitchen --set image.tag=ci \
            --set auth.image.repository=kitchen-auth --set auth.image.tag=ci \
            --set kitchen.baseDomain=apps.example.com \
            --set replicaCount=2 \
            --wait --timeout 8m || {
              kubectl -n kitchen-system get pods -o wide
              kubectl -n kitchen-system describe deploy kitchen-auth
              exit 1
            }
          replicas=$(kubectl -n kitchen-system get deploy kitchen-controller-manager \
            -o jsonpath='{.spec.replicas}')
          [ "${replicas}" = 2 ] || {
            echo "::error::the upgrade did not scale the manager to 2 replicas"
            exit 1
          }
          # The StatefulSets are what a version bump used to break: their
          # claim templates are immutable, so a versioned label there made the
          # whole upgrade fail. Both must have taken the new version, and their
          # volumes must still be bound to the data they had before.
          for sts in kitchen-clickhouse kitchen-postgres; do
            chart=$(kubectl -n kitchen-system get sts "${sts}" \
              -o jsonpath='{.metadata.labels.helm\.sh/chart}')
            [ "${chart}" = kitchen-9.9.9 ] || {
              echo "::error::${sts} still carries chart label '${chart}' after the upgrade"
              exit 1
            }
            bound=$(kubectl -n kitchen-system get pvc "data-${sts}-0" \
              -o jsonpath='{.status.phase}')
            [ "${bound}" = Bound ] || {
              echo "::error::${sts} lost its volume on upgrade (pvc phase '${bound}')"
              exit 1
            }
          done
          # The singleton is left alone by upgrades unless applyOnUpgrade is set.
          kubectl get kitchen default
          # A regenerated password would lock the collectors out of the store.
          after=$(kubectl -n kitchen-system get secret kitchen-clickhouse \
            -o jsonpath='{.data.password}')
          [ "${before}" = "${after}" ] || {
            echo "::error::the ClickHouse password changed on upgrade"
            exit 1
          }
          # Regenerating these would sign every session out and lock the
          # operator out of client registration.
          auth_after=$(kubectl -n kitchen-system get secret kitchen-auth \
            -o jsonpath='{.data.secret}{" "}{.data.serviceKey}')
          [ "${auth_before}" = "${auth_after}" ] || {
            echo "::error::the identity provider's credentials changed on upgrade"
            exit 1
          }
          # `helm upgrade --wait` already required the auth Deployment to go
          # ready again, and readiness means it reached Postgres.

      - name: Uninstall the release
        run: |
          set -euo pipefail
          helm uninstall kitchen --namespace kitchen-system
          # CRDs are annotated keep, so custom resources survive an uninstall.
          kubectl get crd kitchens.kitchen.bermos.dev
