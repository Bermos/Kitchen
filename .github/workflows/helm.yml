name: Helm Chart

on:
  push:
  pull_request:

env:
  GATEWAY_API_VERSION: v1.2.1
  # Used to poke the git webhook receiver from inside the cluster.
  PROBE_IMAGE: curlimages/curl:8.11.1

jobs:
  lint:
    name: Chart lint and render
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Check generated templates are in sync
        run: |
          ./hack/gen-helm-manifests.sh
          git diff --exit-code -- charts/ || {
            echo "::error::charts/kitchen templates are stale. Run 'make helm-manifests' and commit the result."
            exit 1
          }

      - name: Lint the chart
        run: helm lint charts/kitchen --namespace kitchen-system --set kitchen.baseDomain=apps.example.com

      - name: Render the supported value combinations
        run: |
          set -euo pipefail
          render() {
            echo "--- helm template $*"
            helm template kitchen charts/kitchen --namespace kitchen-system "$@" >/dev/null
          }
          render --set kitchen.baseDomain=apps.example.com
          render --set kitchen.baseDomain=apps.example.com --set replicaCount=3
          render --set kitchen.baseDomain=apps.example.com --set kitchen.applyOnUpgrade=true
          render --set kitchen.baseDomain=apps.example.com --set metrics.serviceMonitor.enabled=true
          render --set kitchen.baseDomain=apps.example.com --set metrics.enabled=false
          render --set kitchen.baseDomain=apps.example.com --set crds.install=false --set rbac.create=false
          render --set kitchen.baseDomain=apps.example.com \
                 --set kitchen.tls.mode=cloudflared \
                 --set kitchen.ingress.cloudflared.enabled=true \
                 --set kitchen.ingress.cloudflared.tunnelSecretName=kitchen-tunnel
          # No base domain: every hostname the chart publishes has to be given
          # explicitly, or its route turned off.
          render --set kitchen.create=false --set webhookReceiver.route.enabled=false \
                 --set auth.route.host=login.example.com
          render --set kitchen.baseDomain=apps.example.com \
                 --set clickhouse.persistence.enabled=false \
                 --set clickhouse.extraConfig.logger\\.xml='<clickhouse><logger><level>debug</level></logger></clickhouse>'
          render --set kitchen.baseDomain=apps.example.com \
                 --set clickhouse.enabled=false \
                 --set clickhouse.external.host=clickhouse.telemetry.svc \
                 --set clickhouse.auth.password=hunter2
          render --set kitchen.baseDomain=apps.example.com \
                 --set clickhouse.enabled=false --set clickhouse.acknowledgeNoStore=true
          render --set kitchen.baseDomain=apps.example.com \
                 --set auth.enabled=false --set postgres.enabled=false
          render --set kitchen.baseDomain=apps.example.com \
                 --set auth.replicaCount=2 --set auth.bootstrap.enabled=false
          render --set kitchen.baseDomain=apps.example.com \
                 --set auth.github.clientId=Iv1.deadbeef --set auth.github.clientSecret=hunter2
          render --set kitchen.baseDomain=apps.example.com \
                 --set auth.github.clientId=Iv1.deadbeef --set auth.github.existingSecret=github-oauth
          render --set kitchen.baseDomain=apps.example.com \
                 --set auth.route.host=login.example.com
          render --set kitchen.baseDomain=apps.example.com \
                 --set postgres.persistence.enabled=false
          render --set kitchen.baseDomain=apps.example.com \
                 --set postgres.enabled=false \
                 --set postgres.external.host=postgres.databases.svc \
                 --set postgres.auth.password=hunter2

      - name: Reject unsupported value combinations
        run: |
          set -uo pipefail
          expect_failure() {
            if helm template kitchen charts/kitchen --namespace "$1" "${@:2}" >/dev/null 2>&1; then
              echo "::error::expected rendering to fail: namespace=$1 ${*:2}"
              exit 1
            fi
          }
          # No base domain for the Kitchen singleton.
          expect_failure kitchen-system
          # Installed outside the operator's platform namespace.
          expect_failure default --set kitchen.baseDomain=apps.example.com
          # cloudflared without tunnel credentials.
          expect_failure kitchen-system --set kitchen.baseDomain=apps.example.com \
            --set kitchen.ingress.cloudflared.enabled=true
          # Multiple replicas without leader election.
          expect_failure kitchen-system --set kitchen.baseDomain=apps.example.com \
            --set replicaCount=3 --set leaderElection=false
          # Both a bundled and an external ClickHouse.
          expect_failure kitchen-system --set kitchen.baseDomain=apps.example.com \
            --set clickhouse.external.host=clickhouse.telemetry.svc
          # External ClickHouse without a password.
          expect_failure kitchen-system --set kitchen.baseDomain=apps.example.com \
            --set clickhouse.enabled=false --set clickhouse.external.host=clickhouse.telemetry.svc
          # No telemetry store at all, unacknowledged.
          expect_failure kitchen-system --set kitchen.baseDomain=apps.example.com \
            --set clickhouse.enabled=false
          # The identity provider without a database to keep accounts in.
          expect_failure kitchen-system --set kitchen.baseDomain=apps.example.com \
            --set postgres.enabled=false
          # Both a bundled and an external Postgres.
          expect_failure kitchen-system --set kitchen.baseDomain=apps.example.com \
            --set postgres.external.host=postgres.databases.svc
          # External Postgres without a password.
          expect_failure kitchen-system --set kitchen.baseDomain=apps.example.com \
            --set postgres.enabled=false --set postgres.external.host=postgres.databases.svc
          # A GitHub OAuth app with no secret to go with the client id.
          expect_failure kitchen-system --set kitchen.baseDomain=apps.example.com \
            --set auth.github.clientId=Iv1.deadbeef
          # The identity provider with nowhere to be published, so no issuer.
          expect_failure kitchen-system --set kitchen.create=false \
            --set webhookReceiver.route.enabled=false

  install:
    name: Chart install on kind
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Create kind cluster
        run: kind create cluster

      # Layer-cached across runs, so `go mod download` only pays the network
      # cost when go.mod or go.sum actually change.
      - name: Build the operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: kitchen:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the auth image
        uses: docker/build-push-action@v6
        with:
          context: auth
          load: true
          tags: kitchen-auth:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load the images into kind
        run: |
          set -euo pipefail
          kind load docker-image kitchen:ci
          kind load docker-image kitchen-auth:ci
          # Pull the dependencies on the runner, where a failed pull can be
          # retried, rather than inside the node where it surfaces as
          # ImagePullBackOff.
          template() {
            helm template kitchen charts/kitchen \
              --namespace kitchen-system --set kitchen.baseDomain=apps.example.com \
              -s "$1" | awk '$1 == "image:" { print $2; exit }'
          }
          clickhouse_image=$(template templates/clickhouse/statefulset.yaml)
          postgres_image=$(template templates/postgres/statefulset.yaml)
          echo "ClickHouse image: ${clickhouse_image}"
          echo "Postgres image: ${postgres_image}"
          for image in "${clickhouse_image}" "${postgres_image}" "${PROBE_IMAGE}"; do
            for i in 1 2 3; do
              docker pull "${image}" && break
              [ "$i" = 3 ] && exit 1
              sleep $((i * 15))
            done
            kind load docker-image "${image}"
          done

      - name: Install the Gateway API CRDs
        run: |
          kubectl apply -f \
            https://github.com/kubernetes-sigs/gateway-api/releases/download/${GATEWAY_API_VERSION}/standard-install.yaml

      # The chart carries its CRDs as templates, so a fresh install has to
      # register them and create the Kitchen singleton in the same release.
      - name: Install the chart
        run: |
          helm install kitchen charts/kitchen \
            --namespace kitchen-system --create-namespace \
            --set image.repository=kitchen --set image.tag=ci \
            --set auth.image.repository=kitchen-auth --set auth.image.tag=ci \
            --set kitchen.baseDomain=apps.example.com \
            --wait --timeout 8m || {
              kubectl -n kitchen-system get pods -o wide
              kubectl -n kitchen-system describe deploy kitchen-controller-manager
              kubectl -n kitchen-system describe sts kitchen-clickhouse
              kubectl -n kitchen-system describe sts kitchen-postgres
              kubectl -n kitchen-system describe deploy kitchen-auth
              kubectl -n kitchen-system logs -l control-plane=controller-manager --tail=100
              kubectl -n kitchen-system logs sts/kitchen-clickhouse --tail=100 || true
              kubectl -n kitchen-system logs sts/kitchen-postgres --tail=100 || true
              kubectl -n kitchen-system logs deploy/kitchen-auth --tail=100 || true
              exit 1
            }

      - name: Verify the installed release
        run: |
          set -euo pipefail
          kubectl get crd kitchens.kitchen.bermos.dev
          base_domain=$(kubectl get kitchen default -o jsonpath='{.spec.baseDomain}')
          [ "${base_domain}" = apps.example.com ] || {
            echo "::error::Kitchen singleton has baseDomain '${base_domain}'"
            exit 1
          }
          kubectl -n kitchen-system get httproute kitchen-git-webhook
          kubectl -n kitchen-system get svc kitchen-git-webhook kitchen-metrics
          # The operator creates the shared Gateway from the Kitchen object.
          # kind runs no Gateway controller, so it never gets programmed — it
          # only has to exist, which proves the operator's RBAC is complete.
          for i in $(seq 30); do
            kubectl -n kitchen-system get gateway kitchen >/dev/null 2>&1 && break
            [ "$i" = 30 ] && { kubectl -n kitchen-system logs -l control-plane=controller-manager --tail=50; exit 1; }
            sleep 2
          done
          # The receiver answers webhook deliveries. Run it as a plain pod and
          # read the result afterwards: attaching to a pod that exits this fast
          # is a race, and `curl | grep -q` dies of SIGPIPE under pipefail.
          kubectl -n kitchen-system run webhook-probe \
            --image="${PROBE_IMAGE}" --restart=Never --command -- \
            curl -fsS -X POST -H 'X-GitHub-Event: ping' \
            http://kitchen-git-webhook.kitchen-system.svc/webhooks/git/none
          phase=""
          for _ in $(seq 60); do
            phase=$(kubectl -n kitchen-system get pod webhook-probe -o jsonpath='{.status.phase}' 2>/dev/null || true)
            case "${phase}" in Succeeded|Failed) break ;; esac
            sleep 2
          done
          probe_output=$(kubectl -n kitchen-system logs webhook-probe 2>&1 || true)
          echo "probe phase=${phase} output=${probe_output}"
          kubectl -n kitchen-system delete pod webhook-probe --wait=false
          # curl -f already rejected any non-2xx; the body proves it was the
          # receiver answering and not something else on that address.
          [ "${phase}" = Succeeded ] && [ "${probe_output}" = pong ] || {
            echo "::error::the git webhook receiver did not answer a ping"
            exit 1
          }

      - name: Verify the telemetry store
        run: |
          set -euo pipefail
          password=$(kubectl -n kitchen-system get secret kitchen-clickhouse \
            -o jsonpath='{.data.password}' | base64 -d)
          # The credentials in the secret are the ones ClickHouse actually took.
          answer=$(kubectl -n kitchen-system exec sts/kitchen-clickhouse -- \
            clickhouse-client --user kitchen --password "${password}" \
            --database kitchen --query 'SELECT 1')
          [ "${answer}" = 1 ] || {
            echo "::error::ClickHouse rejected the credentials in the secret"
            exit 1
          }
          # The image's passwordless `default` user must be gone.
          if kubectl -n kitchen-system exec sts/kitchen-clickhouse -- \
            clickhouse-client --user default --query 'SELECT 1' >/dev/null 2>&1; then
            echo "::error::the default ClickHouse user still accepts passwordless logins"
            exit 1
          fi

      - name: Verify the identity provider
        run: |
          set -euo pipefail
          secret() {
            kubectl -n kitchen-system get secret kitchen-auth -o jsonpath="{.data.$1}" | base64 -d
          }
          service_key=$(secret serviceKey)
          bootstrap_token=$(secret bootstrapToken)
          issuer="https://auth.apps.example.com"
          # Reach the service directly, with the Host the Gateway would set.
          base="http://kitchen-auth.kitchen-system.svc"

          # One pod runs the whole check: discovery, then dynamic client
          # registration with the credential the operator is given, then the
          # first-run bootstrap link. Its log is the report.
          kubectl -n kitchen-system run auth-probe \
            --image="${PROBE_IMAGE}" --restart=Never --command -- sh -ec "
              set -eu
              discovery=\$(curl -fsS -H 'Host: auth.apps.example.com' \
                ${base}/.well-known/openid-configuration)
              echo \"\${discovery}\" | grep -q '\"issuer\":\"${issuer}\"'
              echo \"\${discovery}\" | grep -q '\"registration_endpoint\":\"${issuer}/oauth2/register\"'
              echo \"\${discovery}\" | grep -q '\"jwks_uri\":\"${issuer}/jwks\"'

              client=\$(curl -fsS -X POST -H 'Host: auth.apps.example.com' \
                -H 'content-type: application/json' -H 'x-api-key: ${service_key}' \
                -d '{\"client_name\":\"ci\",\"redirect_uris\":[\"https://ci.apps.example.com/callback\"]}' \
                ${base}/oauth2/register)
              echo \"\${client}\" | grep -q '\"client_secret\"'

              # The same call without the credential must be refused.
              status=\$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                -H 'Host: auth.apps.example.com' -H 'content-type: application/json' \
                -d '{\"client_name\":\"anon\",\"redirect_uris\":[\"https://anon.example.com/cb\"]}' \
                ${base}/oauth2/register)
              [ \"\${status}\" != 200 ]

              curl -fsS -o /dev/null -H 'Host: auth.apps.example.com' \
                '${base}/bootstrap?token=${bootstrap_token}'
              echo auth-ok
            "
          phase=""
          for _ in $(seq 60); do
            phase=$(kubectl -n kitchen-system get pod auth-probe -o jsonpath='{.status.phase}' 2>/dev/null || true)
            case "${phase}" in Succeeded|Failed) break ;; esac
            sleep 2
          done
          probe_output=$(kubectl -n kitchen-system logs auth-probe 2>&1 || true)
          echo "probe phase=${phase} output=${probe_output}"
          kubectl -n kitchen-system delete pod auth-probe --wait=false
          [ "${phase}" = Succeeded ] && [ "${probe_output}" = auth-ok ] || {
            kubectl -n kitchen-system logs deploy/kitchen-auth --tail=100 || true
            echo "::error::the identity provider did not serve a usable OIDC issuer"
            exit 1
          }

      - name: Upgrade the release
        run: |
          set -euo pipefail
          before=$(kubectl -n kitchen-system get secret kitchen-clickhouse \
            -o jsonpath='{.data.password}')
          helm upgrade kitchen charts/kitchen \
            --namespace kitchen-system \
            --set image.repository=kitchen --set image.tag=ci \
            --set kitchen.baseDomain=apps.example.com \
            --set replicaCount=2 \
            --wait --timeout 8m
          replicas=$(kubectl -n kitchen-system get deploy kitchen-controller-manager \
            -o jsonpath='{.spec.replicas}')
          [ "${replicas}" = 2 ] || {
            echo "::error::the upgrade did not scale the manager to 2 replicas"
            exit 1
          }
          # The singleton is left alone by upgrades unless applyOnUpgrade is set.
          kubectl get kitchen default
          # A regenerated password would lock the collectors out of the store.
          after=$(kubectl -n kitchen-system get secret kitchen-clickhouse \
            -o jsonpath='{.data.password}')
          [ "${before}" = "${after}" ] || {
            echo "::error::the ClickHouse password changed on upgrade"
            exit 1
          }

      - name: Uninstall the release
        run: |
          set -euo pipefail
          helm uninstall kitchen --namespace kitchen-system
          # CRDs are annotated keep, so custom resources survive an uninstall.
          kubectl get crd kitchens.kitchen.bermos.dev
