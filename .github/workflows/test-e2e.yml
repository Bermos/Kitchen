name: E2E Tests

# A branch push and the pull request that carries it are the same commit, so
# leaving `push` unfiltered ran every job here twice for every push to a branch
# with a pull request open. `push` is narrowed to `main` for that reason.
#
# The kind job below is narrowed further still, to pull requests alone: what a
# pull request run checks out is `refs/pull/N/merge`, the branch already merged
# into its base, and squash-merging an up-to-date branch lands that same tree on
# `main`. The run on `main` was re-testing a tree that had just passed. The
# workflow still triggers there, because the cheap jobs it also carries are
# what seed the caches every pull request restores from.
#
# The release pull request runs this job unconditionally — it is exempt from
# the changed-paths filter below, because its tree is exactly what gets tagged
# and published. It is not gated on anything else: its runs need approving by
# hand anyway (release-please opens it as `github-actions[bot]`, so GitHub
# holds the run at `action_required`), and that approval is already the
# deliberate step. See CONTRIBUTING.md, "What CI runs, and when".
on:
  push:
    branches: [main]
  pull_request:

# One run per branch or pull request. A pull request's older runs are
# superseded by the push that follows them and are cancelled; `main`'s are
# never cancelled, because they are the last gate before a release and the only
# runs whose caches every other branch can restore from.
concurrency:
  group: test-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What the kind job below has to look at. It is a job rather than a `paths:`
  # filter because a required check that never runs blocks a pull request
  # forever, while a job skipped by `if:` reports `skipped`, which branch
  # protection accepts — CONTRIBUTING.md, "Skipped is not missing".
  changes:
    name: What changed
    # `github.base_ref` is empty outside a pull request, and the job below runs
    # on nothing else, so there is nothing to decide on a push to main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Clone the code
        uses: actions/checkout@v4
        with:
          # The whole history, so the merge base with the base branch is here
          # to diff against. This job is seconds long; the clone is the cost.
          fetch-depth: 0

      - name: Decide whether e2e has anything to check
        id: decide
        run: ./hack/changed-paths.sh e2e "origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"

  test-e2e:
    name: E2E on kind
    needs: changes
    # Pull requests only, and only when something this job can see has changed.
    # The release pull request is the exception: it runs whatever it touched,
    # because its tree is what gets tagged and published.
    if: >-
      github.event_name == 'pull_request'
      && (needs.changes.outputs.run == 'true'
      || startsWith(github.head_ref, 'release-please--'))
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Create kind cluster
        run: kind create cluster

      - name: Running Test e2e
        run: |
          go mod tidy
          make test-e2e

  # A project that is several workloads, on a cluster (#301).
  #
  # Everything else that proves this feature proves it against an API server
  # with no kubelet: the per-workload plan, the frozen digests, the refusals
  # and the sequencing are all held by unit and envtest coverage, and all of it
  # was green while nothing had ever run. What only a cluster can answer is the
  # other half — that the images are in a registry, that a pod resolves a
  # sibling's address and gets an answer from *its own* sibling, that traffic
  # does not arrive before a deploy task has finished, and that the stage
  # `dockerfileTarget` names is the stage that was pushed.
  #
  # So this is the one job in the tree that runs real builds: the build clones
  # this repository at the commit under test, BuildKit builds the fixture under
  # test/fixtures/multi-workload twice — once with no target and once at the
  # stage the unit's `api` workload names — pushes both to a registry beside
  # the cluster, and the operator releases and deploys the set.
  #
  # And it is where the *other* build strategy is run at all (#424). A second
  # project points at test/fixtures/buildpacks-node, which has no Dockerfile:
  # the Cloud Native Buildpacks lifecycle decides what that directory is,
  # builds it as five containers, and pushes what it built. Nothing else in
  # this repository executes that lifecycle — every other test of it reads a
  # pod spec — so a phase that cannot resolve its inputs is green everywhere
  # until here.
  #
  # Three pieces of scaffolding make that possible on kind, and all three are
  # the test cluster's rather than the platform's:
  #
  #   - **The registry speaks plain HTTP.** A registry with a private
  #     certificate would need its CA in the builder, in the node's container
  #     runtime and in the operator. A plain-HTTP one needs each builder told
  #     so once — BuildKit reads that from buildkitd.toml and the CNB lifecycle
  #     from `CNB_INSECURE_REGISTRIES`, so both pinned images are rebuilt with
  #     it and loaded into the node under their own names — and containerd told
  #     so once, which is a hosts.toml. The operator needs nothing: `http://`
  #     on a registry Connection is a shape internal/provider already honours.
  #   - **The source is this repository.** Every build clones the commit from
  #     github.com, and the fixture is a directory of this repository, so the
  #     project points at this repository at the pull request's head commit.
  #     That is why the job does not run for a pull request from a fork: the
  #     head commit is not in this repository, and there is nothing to fetch.
  #   - **The registry issues an account that cannot push.** A plain
  #     `registry:2` has one account or none, and with one the platform's
  #     read-only credential falls back to the credential builds push with —
  #     so a build phase holding the wrong one is green here and denied on any
  #     installation that supplied a narrower credential, which is what #534
  #     was. A read-only front end in front of the same storage is what makes
  #     that difference visible; only the buildpacks project below goes
  #     through it.
  #
  # The job's token is read-only on purpose and not merely by hygiene. The
  # operator registers a git webhook on the repository it is pointed at and
  # posts a commit status against the commit it builds — against *this*
  # repository, here. A token that cannot write is what makes both attempts
  # fail harmlessly rather than leaving a webhook on the repository behind.
  workloads:
    name: Several workloads on kind
    needs: changes
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (needs.changes.outputs.run == 'true'
      || startsWith(github.head_ref, 'release-please--'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PROJECT: multiwl
      APP_NS: kitchen-multiwl
      FIXTURE: test/fixtures/multi-workload
      # The second project this job builds, and the only build anywhere in the
      # tree that runs the Cloud Native Buildpacks lifecycle rather than
      # BuildKit. It is a project of its own because the two strategies are two
      # different jobs with two different failure modes, and because a
      # repository with no Dockerfile is the whole of what makes a build
      # `buildpacks` (#424).
      BP_PROJECT: bpnode
      BP_APP_NS: kitchen-bpnode
      BP_FIXTURE: test/fixtures/buildpacks-node
      # Its own registry Connection, and the only one in this job with a
      # read-only credential beside its own (#534). It points at the account
      # in front of the registry that cannot push, so the analyze phase is
      # denied its blob upload unless it holds the credential that can.
      BP_REGISTRY: e2e-registry-ro
      # The third project, and the one that is about the *default* path: a
      # stock Nuxt application with a deploy task and a postgres claim, no
      # Dockerfile and no workaround anywhere in it (#468). It is the only
      # case here where the platform decides the strategy, the port, the
      # start command, the build environment and the build's heap ceiling —
      # every one of which was missing when a real Nuxt deployment could not
      # be made to work at all.
      # The fourth project, and the only one that binds to another (#493): a
      # consumer of the unit's `api` workload, running the unit's own image
      # through `source.image` so that the case costs no fourth build. What it
      # needs of an application is an HTTP client and a hostname, which the
      # fixture already answers with.
      CONSUMER: bindshop
      CONSUMER_APP_NS: kitchen-bindshop
      OFFERING: unit-api
      BINDING: prices
      NUXT_PROJECT: nuxtapp
      NUXT_APP_NS: kitchen-nuxtapp
      NUXT_FIXTURE: test/fixtures/nuxt-stock
      NUXT_CLAIM: appdb
      # 75% of the build ceiling below, in MiB, which is what the platform
      # caps a Node build's heap to. Written here so the assertion and the
      # `--set` are read together.
      NUXT_BUILD_HEAP_MIB: 2304
      REPO: ${{ github.repository }}
      COMMIT: ${{ github.event.pull_request.head.sha }}
      BRANCH: ${{ github.head_ref }}
      # Only ever used to install the HTTPRoute CRD the Environment reconciler
      # writes into. The Helm workflow resolves this from the Cilium release it
      # pins, because there the version has to be the one Cilium's Gateway
      # implementation requires; nothing here reads a route back through a
      # controller, so a plain pin is enough.
      GATEWAY_API_VERSION: v1.6.1
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      # Not the runner's own helm, which is a 3.x. The chart carries the
      # namespace it installs into as a template and relies on Helm adopting
      # the bare one `--create-namespace` makes first; Helm 3 does not adopt at
      # all, so the install dies with `namespaces "kitchen-system" already
      # exists` before it applies anything. Every other job that installs this
      # chart takes its helm from here for the same reason.
      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Create kind cluster
        run: kind create cluster

      # Restored from the cache the Helm workflow's job writes, and it writes
      # nothing back. Both jobs build this same context on every pull request,
      # so a second exporter would spend the build re-uploading layers the
      # first one is uploading at that moment — two writers of one cache scope
      # contend rather than share, and the reader gets the same layers either
      # way.
      - name: Build the operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: kitchen:ci
          cache-from: type=gha

      - name: Start a registry the cluster can push to and pull from
        run: |
          set -euo pipefail
          pull() {
            for attempt in 1 2 3; do
              docker pull "$1" && return 0
              sleep $((attempt * 10))
            done
            return 1
          }
          # Google's Docker Hub mirror first: an anonymous rate limit failing
          # this job would say nothing about the change under test.
          image=mirror.gcr.io/library/registry:2
          pull "${image}" || { image=registry:2; pull "${image}"; }

          # On the cluster's own docker network, so the node reaches it by
          # address and so do the pods, which route out through the node.
          docker run --detach --name kitchen-e2e-registry --network kind "${image}"
          addr="$(docker inspect \
            --format '{{ (index .NetworkSettings.Networks "kind").IPAddress }}' \
            kitchen-e2e-registry):5000"
          echo "the test registry is at ${addr}"

          for _ in $(seq 60); do
            curl --fail --silent --output /dev/null "http://${addr}/v2/" && break
            sleep 1
          done
          curl --fail --silent --output /dev/null "http://${addr}/v2/" || {
            echo "::error::the test registry never answered /v2/"
            docker logs kitchen-e2e-registry
            exit 1
          }

          # The node's container runtime is what pulls an application's image,
          # and it speaks HTTPS to anything that is not a loopback address. A
          # hosts.toml under the certs.d directory kind already points
          # containerd at is how it is told otherwise.
          docker exec kind-control-plane \
            grep -n 'config_path' /etc/containerd/config.toml || echo \
            "::warning::containerd names no registry config_path; the probe below will say so"
          docker exec kind-control-plane mkdir -p "/etc/containerd/certs.d/${addr}"
          docker exec --interactive kind-control-plane \
            sh -c "cat > /etc/containerd/certs.d/${addr}/hosts.toml" <<EOF
          server = "http://${addr}"

          [host."http://${addr}"]
            capabilities = ["pull", "resolve"]
          EOF

          # Proved now rather than discovered as an ImagePullBackOff eight
          # minutes from here. The registry cannot have this image, so the pull
          # must fail — what matters is that it fails for not finding it rather
          # than for anything about TLS.
          if docker exec kind-control-plane crictl pull "${addr}/absent:1" > /tmp/pull-probe.log 2>&1; then
            echo "::error::the registry answered for an image it cannot have"
            exit 1
          fi
          cat /tmp/pull-probe.log
          if grep -qiE 'https|tls|certificate|x509' /tmp/pull-probe.log; then
            echo "::error::the node reached the test registry over HTTPS. containerd was not" \
                 "told that ${addr} speaks plain HTTP — check that kind still points it at" \
                 "/etc/containerd/certs.d."
            exit 1
          fi

          echo "REGISTRY_ADDR=${addr}" >> "$GITHUB_ENV"

      # The one thing a plain `registry:2` cannot do for itself, and the whole
      # of what #534 needs in order to be reproducible: issue a credential
      # that can pull and not push. distribution's own htpasswd authentication
      # is all-or-nothing — every account it admits can also push — so the
      # read-only half is put in front of it: nginx on the same docker
      # network, basic auth over two accounts, and the writer's file alone
      # accepted for any method that is not a GET or a HEAD. The reader's blob
      # upload is refused before it reaches the registry, which is exactly the
      # `POST /v2/<name>/blobs/uploads/` the analyze phase makes.
      #
      # It is a second address in front of the same storage rather than a
      # second registry, so nothing that already pushes to REGISTRY_ADDR
      # changes. Only the buildpacks project below is pointed at it; the
      # stock-Nuxt project further down builds with buildpacks too and keeps
      # the connection with no read-only credential beside it, which is the
      # fallback (`Read == Push`) and is the only thing CI could see before.
      #
      # That fallback is why this job was green on 0.38.0 while no buildpacks
      # build anywhere could push: with one account the analyzer holds a
      # credential that can write whatever the platform decided to hand it.
      - name: Put a read-only account in front of the registry
        run: |
          set -euo pipefail
          pull() {
            for attempt in 1 2 3; do
              docker pull "$1" && return 0
              sleep $((attempt * 10))
            done
            return 1
          }
          # Google's Docker Hub mirror first, for the reason every other pull
          # in this job takes it: an anonymous rate limit failing this job
          # would say nothing about the change under test.
          image=mirror.gcr.io/library/nginx:1-alpine
          pull "${image}" || { image=nginx:1-alpine; pull "${image}"; }

          # apr1 rather than bcrypt because `openssl` is what the runner has
          # and nginx reads both. The two files are the whole of the
          # authorization model: one holds both accounts, the other holds the
          # account allowed to write.
          mkdir -p /tmp/kitchen-registry-ro
          writer="$(openssl passwd -apr1 kitchenpush)"
          reader="$(openssl passwd -apr1 kitchenpull)"
          printf 'kitchen:%s\nreader:%s\n' "${writer}" "${reader}" \
            > /tmp/kitchen-registry-ro/htpasswd
          printf 'kitchen:%s\n' "${writer}" > /tmp/kitchen-registry-ro/htpasswd-writers

          cat > /tmp/kitchen-registry-ro/nginx.conf <<'EOF'
          user nginx;
          events {}
          http {
            # A registry moves blobs through this: nginx must neither cap them
            # nor spool them to a disk it may not be able to write to.
            client_max_body_size 0;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_http_version 1.1;
            server {
              listen 5000;
              location / {
                auth_basic "kitchen e2e registry";
                auth_basic_user_file /etc/nginx/htpasswd;
                # Read-only is enforced by method. limit_except names the
                # methods the block does *not* apply to, so everything that is
                # not a GET or a HEAD is re-checked against the file holding
                # the writer alone.
                limit_except GET HEAD {
                  auth_basic "kitchen e2e registry (write)";
                  auth_basic_user_file /etc/nginx/htpasswd-writers;
                }
                proxy_pass http://KITCHEN_REGISTRY_UPSTREAM;
                proxy_set_header Host $http_host;
              }
            }
          }
          EOF
          sed -i "s|KITCHEN_REGISTRY_UPSTREAM|${REGISTRY_ADDR}|" /tmp/kitchen-registry-ro/nginx.conf

          docker run --detach --name kitchen-e2e-registry-ro --network kind \
            --volume /tmp/kitchen-registry-ro/nginx.conf:/etc/nginx/nginx.conf:ro \
            --volume /tmp/kitchen-registry-ro/htpasswd:/etc/nginx/htpasswd:ro \
            --volume /tmp/kitchen-registry-ro/htpasswd-writers:/etc/nginx/htpasswd-writers:ro \
            "${image}"
          addr="$(docker inspect \
            --format '{{ (index .NetworkSettings.Networks "kind").IPAddress }}' \
            kitchen-e2e-registry-ro):5000"
          echo "the same registry with two accounts is at ${addr}"

          for _ in $(seq 60); do
            curl --fail --silent --output /dev/null --user kitchen:kitchenpush \
              "http://${addr}/v2/" && break
            sleep 1
          done

          # Both halves proved here rather than discovered as a build failure
          # twenty minutes from now, and the second is the one that matters:
          # a reader who can push makes the whole case below vacuous.
          curl --fail --silent --output /dev/null --user kitchen:kitchenpush "http://${addr}/v2/" || {
            echo "::error::the read-only front end never answered /v2/ for the account that pushes"
            docker logs kitchen-e2e-registry-ro
            exit 1
          }
          curl --fail --silent --output /dev/null --user reader:kitchenpull "http://${addr}/v2/" || {
            echo "::error::the read-only account cannot read, so it is not a read-only account"
            docker logs kitchen-e2e-registry-ro
            exit 1
          }
          code() { # code <user:password> — what a blob upload is answered with
            curl --silent --output /dev/null --write-out '%{http_code}' \
              --user "$1" --request POST "http://${addr}/v2/probe/blobs/uploads/"
          }
          [ "$(code kitchen:kitchenpush)" = 202 ] || {
            echo "::error::the account that pushes was answered $(code kitchen:kitchenpush)" \
                 "for a blob upload, so nothing here can push"
            docker logs kitchen-e2e-registry-ro
            exit 1
          }
          denied="$(code reader:kitchenpull)"
          case "${denied}" in
            401|403) ;;
            *)
              echo "::error::the read-only account was answered ${denied} for a blob upload." \
                   "It can push, and the buildpacks case below would pass with the analyzer" \
                   "holding either credential."
              docker logs kitchen-e2e-registry-ro
              exit 1
              ;;
          esac
          echo "the read-only account is answered ${denied} for the upload the analyzer starts"

          # The node pulls the buildpacks project's image through this address,
          # so containerd needs the same plain-HTTP entry it has for the
          # registry itself. The credential comes from the imagePullSecret the
          # platform names on the Deployment.
          docker exec kind-control-plane mkdir -p "/etc/containerd/certs.d/${addr}"
          docker exec --interactive kind-control-plane \
            sh -c "cat > /etc/containerd/certs.d/${addr}/hosts.toml" <<EOF
          server = "http://${addr}"

          [host."http://${addr}"]
            capabilities = ["pull", "resolve"]
          EOF
          if docker exec kind-control-plane crictl pull "${addr}/absent:1" > /tmp/ro-pull-probe.log 2>&1; then
            echo "::error::the read-only front end answered for an image it cannot have"
            exit 1
          fi
          cat /tmp/ro-pull-probe.log
          if grep -qiE 'https|tls|certificate|x509' /tmp/ro-pull-probe.log; then
            echo "::error::the node reached ${addr} over HTTPS. containerd was not told that it" \
                 "speaks plain HTTP."
            exit 1
          fi

          echo "RO_REGISTRY_ADDR=${addr}" >> "$GITHUB_ENV"

      - name: Teach the builder that the test registry speaks plain HTTP
        run: |
          set -euo pipefail
          # Read out of the operator rather than written down twice: bumping
          # BuildkitImage has to bump what this job actually runs, or the case
          # would keep proving something about a builder the platform no longer
          # uses. Every pin lives in internal/controller/images.go (#427) and
          # names a digest as well as a tag; the tag alone is what is pulled
          # and rebuilt here, and the whole pin is what the loaded copy is
          # given as a name further down, because the pod spec asks for it.
          pin="$(grep -oE 'moby/buildkit:[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}' \
            internal/controller/images.go | head -1)"
          builder="${pin%@*}"
          [ -n "${builder}" ] || {
            echo "::error::could not read the builder image out of internal/controller"
            exit 1
          }
          echo "the operator builds with ${pin}"
          docker pull "${builder}"

          # The one thing BuildKit cannot be told from outside the daemon: it
          # decides a registry's scheme from its own configuration and treats
          # nothing but a loopback address as plain HTTP. The image keeps its
          # own name, so the operator's pod spec is untouched and the node uses
          # the copy loaded below.
          mkdir -p /tmp/kitchen-builder
          cat > /tmp/kitchen-builder/buildkitd.toml <<EOF
          [registry."${REGISTRY_ADDR}"]
            http = true
          EOF
          # Both paths, because buildkitd reads /etc/buildkit when it is root
          # and the user's own config directory when it is not, and the build
          # pod's builder is rootless.
          cat > /tmp/kitchen-builder/Dockerfile <<EOF
          FROM ${builder}
          USER root
          RUN mkdir -p /etc/buildkit /home/user/.config/buildkit
          COPY buildkitd.toml /etc/buildkit/buildkitd.toml
          COPY buildkitd.toml /home/user/.config/buildkit/buildkitd.toml
          RUN chmod 0644 /etc/buildkit/buildkitd.toml /home/user/.config/buildkit/buildkitd.toml && chown -R 1000:1000 /home/user/.config
          USER 1000:1000
          EOF
          docker build --tag "${builder}" /tmp/kitchen-builder
          echo "BUILDER_IMAGE=${builder}" >> "$GITHUB_ENV"
          echo "BUILDER_PIN=${pin}" >> "$GITHUB_ENV"

      # The other builder, and what the lifecycle has to be told about a
      # cluster nobody configured for it.
      #
      # Three things a buildpacks build cannot work out for itself here, and
      # all three are the test cluster's rather than the platform's:
      #
      #   - **The registry speaks plain HTTP.** The lifecycle takes that as
      #     `CNB_INSECURE_REGISTRIES`, which is a platform API 0.13 input read
      #     from its environment — so it is baked into the image the node runs,
      #     exactly as buildkitd.toml is above, and the pod spec the operator
      #     writes is untouched. Both addresses are named: the registry itself,
      #     and the read-only front end the buildpacks project pushes through.
      #   - **Its run image is pulled from inside the build pod.** The image the
      #     application is built onto is fetched by the lifecycle itself, on
      #     every build, anonymously. `CNB_RUN_IMAGE` points that at Google's
      #     Docker Hub mirror for the reason the test registry is pulled through
      #     it: an anonymous rate limit failing this job would say nothing about
      #     the change under test. Which image it is comes out of the builder
      #     rather than being pinned a second time here, so bumping the builder
      #     moves it.
      #   - **The builder and the clone image are pulled by the node.** Both are
      #     loaded below, so a build fetches neither from inside the cluster.
      - name: Teach the buildpacks lifecycle where it is running
        run: |
          set -euo pipefail
          # Read out of the operator rather than written down twice, exactly as
          # the BuildKit image above is: a bump has to move what this job runs,
          # or the case keeps proving something about a builder the platform no
          # longer uses. Same file, same shape — a pin is a tag and a digest
          # (#427), the tag half is what is pulled and rebuilt here, and the
          # whole pin is what the loaded copy is named further down.
          read_pin() { # read_pin <repository>
            grep -oE "$1:[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}" \
              internal/controller/images.go | head -1
          }
          builder_pin="$(read_pin paketobuildpacks/builder-jammy-base)"
          # Both strategies clone in a container of their own now (#425), so
          # the image is pinned as the clone's rather than as either
          # strategy's.
          clone_pin="$(read_pin alpine/git)"
          for pin in "${builder_pin}" "${clone_pin}"; do
            [ -n "${pin}" ] || {
              echo "::error::could not read the buildpacks images out of internal/controller"
              exit 1
            }
          done
          builder="${builder_pin%@*}"
          clone="${clone_pin%@*}"
          echo "the lifecycle runs ${builder_pin} and clones with ${clone_pin}"

          # Google's Docker Hub mirror first, the hub itself as the fallback.
          # The builder is a gigabyte and a half: pulling it anonymously from
          # Docker Hub is the single most rate-limitable thing this job does.
          pull_as() { # pull_as <name>
            for attempt in 1 2 3; do
              docker pull "mirror.gcr.io/$1" && { docker tag "mirror.gcr.io/$1" "$1"; return 0; }
              sleep $((attempt * 10))
            done
            docker pull "$1"
          }
          pull_as "${builder}"
          pull_as "${clone}"

          # The run image the builder itself names. `stack.runImage` is where a
          # builder built for platform API 0.12 and later still records it, and
          # it is what the lifecycle would read out of /cnb/run.toml.
          metadata="$(docker inspect --format \
            '{{ index .Config.Labels "io.buildpacks.builder.metadata" }}' "${builder}")"
          run_image="$(printf '%s' "${metadata}" | jq -r '.stack.runImage.image // empty')"
          [ -n "${run_image}" ] || {
            echo "::error::the builder names no run image, so the export phase has no base"
            exit 1
          }
          mirrored_run="mirror.gcr.io/${run_image#index.docker.io/}"
          echo "the application is built onto ${run_image}, pulled as ${mirrored_run}"

          # The image keeps its own name, so the operator's pod spec is
          # untouched and the node uses the copy loaded below.
          mkdir -p /tmp/kitchen-lifecycle
          cat > /tmp/kitchen-lifecycle/Dockerfile <<EOF
          FROM ${builder}
          ENV CNB_INSECURE_REGISTRIES=${REGISTRY_ADDR},${RO_REGISTRY_ADDR}
          ENV CNB_RUN_IMAGE=${mirrored_run}
          EOF
          docker build --tag "${builder}" /tmp/kitchen-lifecycle

          echo "BP_BUILDER_IMAGE=${builder}" >> "$GITHUB_ENV"
          echo "BP_CLONE_IMAGE=${clone}" >> "$GITHUB_ENV"
          echo "BP_BUILDER_PIN=${builder_pin}" >> "$GITHUB_ENV"
          echo "BP_CLONE_PIN=${clone_pin}" >> "$GITHUB_ENV"

      # The three images a build runs are loaded rather than pulled, and two of
      # them were rebuilt above so that they know about this cluster's
      # registry. That means the copy on the node is not the content the
      # operator's pin is a digest over — so the pod spec's reference would
      # miss it and the kubelet would go to Docker Hub for the unmodified
      # original, which is the thing being avoided.
      #
      # So the loaded copy is given the name the kubelet will ask for. It has
      # to be `ctr`: a digest is not something `docker tag` will write, and
      # `kind load` names an image whatever docker called it. Both spellings
      # are written, because a reference carrying a tag *and* a digest
      # resolves as the digest alone.
      - name: Load the images into kind
        run: |
          set -euo pipefail
          kind load docker-image kitchen:ci
          kind load docker-image "${BUILDER_IMAGE}"
          kind load docker-image "${BP_BUILDER_IMAGE}"
          kind load docker-image "${BP_CLONE_IMAGE}"

          answer_to_pin() { # answer_to_pin <repository:tag@sha256:…>
            local pin="$1" reference digest repository
            reference="${pin%@*}"
            digest="${pin##*@}"
            repository="${reference%:*}"
            docker exec kind-control-plane ctr --namespace k8s.io images tag --force \
              "docker.io/${reference}" \
              "docker.io/${repository}@${digest}" \
              "docker.io/${reference}@${digest}"
          }
          answer_to_pin "${BUILDER_PIN}"
          answer_to_pin "${BP_BUILDER_PIN}"
          answer_to_pin "${BP_CLONE_PIN}"
          docker exec kind-control-plane crictl images

          df -h /

      - name: Install the Gateway API CRDs
        run: |
          kubectl apply -f \
            "https://github.com/kubernetes-sigs/gateway-api/releases/download/${GATEWAY_API_VERSION}/standard-install.yaml"

      # A postgres claim becomes a CloudNativePG Cluster, so a cluster with no
      # CloudNativePG has no databases to claim — and the stock-Nuxt case
      # below is about an application that reads one.
      #
      # It is installed here by hand rather than through the platform's own
      # addon, because what that addon does is run this same helm install in a
      # Job bound to cluster-admin: making the database half of the case wait
      # on it would put the addon under test rather than the claim. Which
      # chart version is read out of the operator, exactly as the two builder
      # images above are, so a bump moves what this job runs.
      - name: Install CloudNativePG, so a claim has a database to become
        run: |
          set -euo pipefail
          version="$(grep -oE 'DefaultCNPGChartVersion = "[0-9.]+"' \
            internal/controller/addon_cnpg.go | grep -oE '[0-9.]+')"
          [ -n "${version}" ] || {
            echo "::error::could not read the CloudNativePG chart version out of internal/controller"
            exit 1
          }
          echo "installing the CloudNativePG chart the operator pins: ${version}"
          helm install cnpg cloudnative-pg \
            --repo https://cloudnative-pg.github.io/charts \
            --version "${version}" \
            --namespace cnpg-system --create-namespace \
            --wait --timeout 6m

      # Only what a build and a deploy need. The identity provider, its
      # database, the telemetry store, the collector, the preview gate and the
      # bundled registry are all somebody else's job to check, and every one of
      # them is minutes of install this job would spend proving nothing.
      #
      # **cert-manager is the exception, and it is on for the claim's sake**
      # (#468 step 5a). The database a `postgres` claim provisions takes its
      # server certificate from the platform's own CA, which is a cert-manager
      # ClusterIssuer over a certificate cert-manager signed — so without it
      # the case below would assert the fallback and never the feature. It is
      # three small Deployments rather than a store with a volume behind it,
      # which is what makes it affordable where ClickHouse is not.
      #
      # The build ceiling is the one thing here that is not "as little as will
      # do". A stock Nuxt build is a real front-end build — npm install, Vite
      # and Nitro — and 1Gi is not a ceiling it fits under; 3Gi is, and it is
      # also what makes the heap cap a number worth asserting, since the
      # platform derives NODE_OPTIONS from exactly this value.
      - name: Install the chart
        run: |
          helm install kitchen charts/kitchen \
            --namespace kitchen-system --create-namespace \
            --set image.repository=kitchen --set image.tag=ci \
            --set kitchen.baseDomain=apps.example.com \
            --set kitchen.tls.mode=none \
            --set registry.enabled=false \
            --set auth.enabled=false \
            --set postgres.enabled=false \
            --set previewGate.enabled=false \
            --set clickhouse.enabled=false --set clickhouse.acknowledgeNoStore=true \
            --set collector.enabled=false \
            --set kitchen.compliance.attestation.enabled=false \
            --set kitchen.compliance.audit.enabled=false \
            --set kitchen.builds.cache.enabled=false \
            --set kitchen.builds.resources.cpu=1 \
            --set kitchen.builds.resources.memory=3Gi \
            --wait --timeout 6m || {
              kubectl -n kitchen-system get pods -o wide
              kubectl -n kitchen-system logs -l control-plane=controller-manager --tail=100
              exit 1
            }

      # Nothing here creates a Build. The project names its production branch
      # and the platform resolves that branch's tip and builds it, which is
      # what a project connected to a finished repository does — and it is one
      # fewer thing the case has to be right about.
      - name: Point the platform at this commit and wait for the unit to build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          kubectl -n kitchen-system create secret generic e2e-git \
            --from-literal=token="${GITHUB_TOKEN}"
          # The registry admits anyone, so this credential is never checked.
          # It is here because the platform's shape requires one: the build
          # authenticates with it and the deployment pulls with it.
          kubectl -n kitchen-system create secret docker-registry e2e-registry \
            --docker-server="${REGISTRY_ADDR}" \
            --docker-username=kitchen --docker-password=kitchen

          kubectl apply -f - <<EOF
          apiVersion: kitchen.bermos.dev/v1alpha1
          kind: Connection
          metadata:
            name: e2e-git
            namespace: kitchen-system
          spec:
            provider: github
            credentialsSecretRef: {name: e2e-git}
          ---
          apiVersion: kitchen.bermos.dev/v1alpha1
          kind: Connection
          metadata:
            name: e2e-registry
            namespace: kitchen-system
          spec:
            provider: dockerRegistry
            credentialsSecretRef: {name: e2e-registry}
            config:
              url: http://${REGISTRY_ADDR}
          ---
          apiVersion: kitchen.bermos.dev/v1alpha1
          kind: Project
          metadata:
            name: ${PROJECT}
            namespace: kitchen-system
          spec:
            source:
              git:
                connectionRef: {name: e2e-git}
                repo: ${REPO}
                productionBranch: ${BRANCH}
            build:
              strategy: dockerfile
              rootDirectory: ${FIXTURE}
            registry:
              connectionRef: {name: e2e-registry}
            previews:
              protected: false
          EOF

          build=""
          for _ in $(seq 60); do
            build="$(kubectl -n kitchen-system get builds \
              -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
            [ -n "${build}" ] && break
            sleep 5
          done
          [ -n "${build}" ] || {
            echo "::error::the platform never seeded a build for the project's production branch"
            kubectl -n kitchen-system get project "${PROJECT}" -o jsonpath='{.status.conditions}' | tr ',' '\n'
            kubectl -n kitchen-system logs -l control-plane=controller-manager --tail=200
            exit 1
          }
          echo "the platform seeded build ${build} for $(kubectl -n kitchen-system get build \
            "${build}" -o jsonpath='{.spec.git.sha}') (this pull request's head is ${COMMIT})"

          for _ in $(seq 90); do
            phase="$(kubectl -n kitchen-system get build "${build}" -o jsonpath='{.status.phase}')"
            [ "${phase}" = Succeeded ] && break
            [ "${phase}" = Failed ] && break
            sleep 10
          done
          phase="$(kubectl -n kitchen-system get build "${build}" -o jsonpath='{.status.phase}')"
          [ "${phase}" = Succeeded ] || {
            echo "::error::the unit's build ended ${phase}"
            kubectl -n kitchen-system get build "${build}" -o yaml
            kubectl -n "${APP_NS}" get jobs,pods -o wide
            for pod in $(kubectl -n "${APP_NS}" get pods -o name); do
              echo "--- ${pod}"
              kubectl -n "${APP_NS}" logs "${pod}" --all-containers --tail=200 || true
            done
            exit 1
          }

          release="$(kubectl -n kitchen-system get releases \
            -o jsonpath='{.items[0].metadata.name}')"
          echo "BUILD=${build}" >> "$GITHUB_ENV"
          echo "RELEASE=${release}" >> "$GITHUB_ENV"

      # #425, against the pod that actually built. The project above points at
      # a git Connection holding this job's token, so these are the pods the
      # finding is about: BuildKit used to be handed that token as a session
      # secret — `--secret id=GIT_AUTH_TOKEN` — and a session secret is
      # addressed by id from inside the build, so the fixture's own Dockerfile
      # could have mounted it straight back out with `RUN
      # --mount=type=secret,id=GIT_AUTH_TOKEN`.
      #
      # The Job's TTL keeps the pods for an hour, so the specs Kubernetes
      # admitted are still here to be read: this is the unit tests' assertion
      # made against what ran, exactly as the buildpacks case below is.
      - name: No Dockerfile build's builder holds the platform's git token
        run: |
          set -euo pipefail
          pods="$(kubectl -n "${APP_NS}" get pods -l "kitchen.bermos.dev/build=${BUILD}" \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')"
          [ -n "${pods}" ] || {
            echo "::error::the build left no pod to read"
            exit 1
          }
          for pod in ${pods}; do
            kubectl -n "${APP_NS}" get pod "${pod}" -o json > /tmp/buildkit-pod.json

            ran="$(jq -r '[.spec.initContainers[].name] + [.spec.containers[].name] | join(" ")' \
              /tmp/buildkit-pod.json)"
            echo "${pod} ran: ${ran}"
            [ "${ran}" = "clone buildkit" ] || {
              echo "::error::${pod} did not fetch the commit in a container of its own: ${ran}"
              exit 1
            }

            # The token is in the pod — the project's source Connection has
            # one — which is what makes the next two assertions worth making.
            [ "$(jq -r '[.spec.volumes[] | select(.name == "git-credential")] | length' \
              /tmp/buildkit-pod.json)" = 1 ] || {
              echo "::error::${pod} carries no git credential, so it proves nothing about" \
                   "which container holds one"
              jq -r '.spec.volumes[].name' /tmp/buildkit-pod.json
              exit 1
            }

            mounts() { # mounts <container>
              jq -r --arg c "$1" '[.spec.initContainers[], .spec.containers[]]
                | map(select(.name == $c))[0].volumeMounts | map(.name) | sort | join(",")' \
                /tmp/buildkit-pod.json
            }
            case "$(mounts buildkit)" in
              *git-credential*)
                echo "::error::the builder that runs the repository's Dockerfile mounts" \
                     "$(mounts buildkit)"
                exit 1
                ;;
            esac
            case "$(mounts clone)" in
              *git-credential*) ;;
              *)
                echo "::error::the clone cannot fetch a private repository: $(mounts clone)"
                exit 1
                ;;
            esac

            # And the argv, because a secret is named there rather than
            # mounted: an id is all a Dockerfile needs to mount one.
            args="$(jq -r '.spec.containers[] | select(.name == "buildkit") | .args | join(" ")' \
              /tmp/buildkit-pod.json)"
            case "${args}" in
              *--secret*|*GIT_AUTH_TOKEN*)
                echo "::error::the builder was given a session secret: ${args}"
                exit 1
                ;;
            esac
            case "${args}" in
              *"--local context=/kitchen/context/source"*) ;;
              *)
                echo "::error::the builder did not build the checkout: ${args}"
                exit 1
                ;;
            esac
          done
          echo "every builder was handed a checkout and no credential"

      # #301's first and fourth criteria. They share a step because they share
      # a Dockerfile: the same file produced both images from the same commit,
      # and the only thing that differs between them is the stage each was
      # told to ship.
      - name: One commit, two images, and the stage the target named
        run: |
          set -euo pipefail
          catalog="$(curl --fail --silent "http://${REGISTRY_ADDR}/v2/_catalog")"
          echo "the registry holds ${catalog}"
          for repository in "${PROJECT}" "${PROJECT}-api"; do
            grep -q "\"${repository}\"" <<<"${catalog}" || {
              echo "::error::${repository} was never pushed: one commit did not produce" \
                   "the whole unit"
              exit 1
            }
          done

          # The release froze an image per workload, and they are different
          # images — the `api` workload declared a build of its own, so running
          # the project's image under another command would be the wrong set.
          web_image="$(kubectl -n kitchen-system get release "${RELEASE}" \
            -o jsonpath='{.spec.image}')"
          api_image="$(kubectl -n kitchen-system get release "${RELEASE}" \
            -o jsonpath='{.spec.workloads[?(@.name=="api")].image}')"
          echo "web ${web_image}"
          echo "api ${api_image}"
          [ -n "${api_image}" ] || {
            echo "::error::the release froze no image for the api workload"
            kubectl -n kitchen-system get release "${RELEASE}" -o yaml
            exit 1
          }
          [ "${api_image}" != "${web_image}" ] || {
            echo "::error::both workloads were released to the same image"
            exit 1
          }
          echo "WEB_IMAGE=${web_image}" >> "$GITHUB_ENV"
          echo "API_IMAGE=${api_image}" >> "$GITHUB_ENV"

          # Both running. The deploy task the fixture declares runs first and
          # succeeds, so reaching this at all is already half of the third
          # criterion.
          for workload in "${PROJECT}-production" "${PROJECT}-production-api"; do
            for _ in $(seq 60); do
              kubectl -n "${APP_NS}" get deploy "${workload}" >/dev/null 2>&1 && break
              sleep 5
            done
            kubectl -n "${APP_NS}" rollout status "deploy/${workload}" --timeout=5m || {
              echo "::error::${workload} never came up"
              kubectl -n "${APP_NS}" get pods -o wide
              kubectl -n "${APP_NS}" describe deploy "${workload}"
              kubectl -n kitchen-system get environment "${PROJECT}-production" -o yaml
              exit 1
            }
          done

          # `kubectl exec deploy/<name>` resolves a pod through the
          # Deployment's own selector, and the web Deployment's selector is
          # the environment label alone — a Deployment's selector is
          # immutable, so it can never be narrowed to the component label.
          # Every pod an environment materializes carries the environment
          # label, the api workload's included, so that selector matches both
          # workloads and which of them kubectl picks is a coin toss. The web
          # pods are named by the component label the environment's Service
          # selects on, and a ready one of those is what every probe below
          # asks for.
          web_pod() { # web_pod <environment>
            kubectl -n "${APP_NS}" get pod \
              -l "kitchen.bermos.dev/environment=$1,kitchen.bermos.dev/component=web" \
              -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' \
              | awk '$2 == "True" { print $1; exit }'
          }

          # And the stages. Neither image can be asked what it was built from
          # any other way — which is the whole reason this is a cluster test:
          # the assertion is about the artifact, and BuildKit shipping the
          # file's last stage regardless would be a green build every time.
          web_stage="$(kubectl -n "${APP_NS}" exec "$(web_pod "${PROJECT}-production")" \
            -- wget -q -O - http://127.0.0.1:8080/stage.txt)"
          # The api workload's Deployment is addressed by name: its selector
          # names the process as well as the environment, so it can only
          # resolve to a pod of this workload.
          api_stage="$(kubectl -n "${APP_NS}" exec "deploy/${PROJECT}-production-api" \
            -- wget -q -O - http://127.0.0.1:9000/stage.txt)"
          echo "the web process runs the ${web_stage} stage; the api workload runs ${api_stage}"
          [ "${web_stage}" = final ] || {
            echo "::error::the web process names no dockerfileTarget and should run the" \
                 "file's last stage, but it runs '${web_stage}'"
            exit 1
          }
          [ "${api_stage}" = shipped ] || {
            echo "::error::the api workload names dockerfileTarget 'shipped' and runs" \
                 "'${api_stage}': the target was not honoured"
            exit 1
          }

      # #301's second criterion, and the one that is wrong in the most
      # expensive way if it is wrong at all: a preview's web process reaching
      # production's API.
      #
      # The preview is applied rather than built. Both environments run the
      # same release on purpose — if the two web processes are handed the same
      # image, the same variables' names and the same commit, then the only
      # thing that can make them reach different services is the platform
      # having resolved each environment's own siblings.
      - name: A workload reaches its own environment's sibling, not another's
        run: |
          set -euo pipefail
          kubectl apply -f - <<EOF
          apiVersion: kitchen.bermos.dev/v1alpha1
          kind: Environment
          metadata:
            name: ${PROJECT}-pr-1
            namespace: kitchen-system
          spec:
            projectRef: {name: ${PROJECT}}
            type: preview
            releaseRef: {name: ${RELEASE}}
            preview:
              pullRequest: 1
              branch: ${BRANCH}
          EOF

          for workload in "${PROJECT}-pr-1" "${PROJECT}-pr-1-api"; do
            for _ in $(seq 60); do
              kubectl -n "${APP_NS}" get deploy "${workload}" >/dev/null 2>&1 && break
              sleep 5
            done
            kubectl -n "${APP_NS}" rollout status "deploy/${workload}" --timeout=5m || {
              echo "::error::the preview's ${workload} never came up"
              kubectl -n "${APP_NS}" get pods -o wide
              kubectl -n kitchen-system get environment "${PROJECT}-pr-1" -o yaml
              exit 1
            }
          done

          # The environment's web pod by the label that names it, never
          # `deploy/<name>`: the web Deployment's selector is the environment
          # label alone and so matches the api workload's pod too.
          web_pod() { # web_pod <environment>
            kubectl -n "${APP_NS}" get pod \
              -l "kitchen.bermos.dev/environment=$1,kitchen.bermos.dev/component=web" \
              -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' \
              | awk '$2 == "True" { print $1; exit }'
          }

          address() {
            kubectl -n "${APP_NS}" get deploy "$1" \
              -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="KITCHEN_SERVICE_API")].value}'
          }
          preview_address="$(address "${PROJECT}-pr-1")"
          production_address="$(address "${PROJECT}-production")"
          echo "the preview is told ${preview_address}"
          echo "production is told ${production_address}"
          case "${preview_address}" in
            *"${PROJECT}-pr-1-api.${APP_NS}.svc.cluster.local:9000"*) ;;
            *)
              echo "::error::the preview's KITCHEN_SERVICE_API is '${preview_address}'," \
                   "which is not the preview's own api service"
              exit 1
              ;;
          esac
          case "${preview_address}" in
            *"${PROJECT}-production"*)
              echo "::error::the preview's KITCHEN_SERVICE_API names production's api service"
              exit 1
              ;;
          esac
          case "${production_address}" in
            *"${PROJECT}-production-api.${APP_NS}.svc.cluster.local:9000"*) ;;
            *)
              echo "::error::production's KITCHEN_SERVICE_API is '${production_address}'"
              exit 1
              ;;
          esac

          # A variable that reads correctly and resolves nowhere would pass
          # every check above, so each web process is made to actually fetch
          # from the address it was handed — and the answer says which pod
          # served it, which is the whole claim.
          reached() { # reached <environment>
            kubectl -n "${APP_NS}" exec "$(web_pod "$1")" \
              -- sh -c 'wget -q -O - "$KITCHEN_SERVICE_API/host.txt"' 2>/dev/null || true
          }
          preview_served="$(reached "${PROJECT}-pr-1")"
          production_served="$(reached "${PROJECT}-production")"
          echo "the preview's web process was answered by ${preview_served}"
          echo "production's web process was answered by ${production_served}"
          case "${preview_served}" in
            "${PROJECT}-pr-1-api-"*) ;;
            *)
              echo "::error::the preview's web process was answered by ${preview_served}," \
                   "which is not one of the preview's own api pods"
              exit 1
              ;;
          esac
          case "${production_served}" in
            "${PROJECT}-production-api-"*) ;;
            *)
              echo "::error::production's web process was answered by ${production_served}"
              exit 1
              ;;
          esac
          role="$(kubectl -n "${APP_NS}" exec "$(web_pod "${PROJECT}-pr-1")" \
            -- sh -c 'wget -q -O - "$KITCHEN_SERVICE_API/process.txt"' 2>/dev/null || true)"
          [ "${role}" = api ] || {
            echo "::error::the address resolved to a workload that says it is '${role}'"
            exit 1
          }

      # #493's whole claim, end to end: one project offers something, another
      # claims it, and the consumer's application reaches the provider through
      # the address the binding carried. Every assertion below is about a pod
      # rather than about an object — an address that reads correctly and
      # resolves nowhere would pass a status check.
      #
      # The consumer runs the **same image** through `source.image`, so this
      # case costs no fourth build: what it needs of the application is an
      # HTTP client and a hostname, which the fixture already answers with.
      - name: A project binds to another project's offering
        run: |
          set -euo pipefail
          # The provider offers its api workload to every project on the
          # platform. `visibility: open` is the grant, and it is the one part
          # of an offering a repository may not declare.
          kubectl -n kitchen-system patch project "${PROJECT}" --type merge -p \
            "{\"spec\":{\"offers\":[{\"name\":\"${OFFERING}\",\"process\":\"api\",\"protocol\":\"http\",\"visibility\":\"open\"}]}}"

          # And its production environment admits production consumers, which
          # is the *environment owners'* half of the grant (#494): an
          # environment that declares nothing serves nobody, so a project
          # opening an offering does not thereby open every environment behind
          # it. Nothing here admits a preview — the next case is about that.
          kubectl -n kitchen-system patch environment "${PROJECT}-production" --type merge -p \
            '{"spec":{"serves":{"consumers":["production"]}}}'

          # The release froze `<host>/<name>:<tag>@<digest>`, and an image
          # source names the parts separately. The digest is what pins, so the
          # tag is dropped: what is left is the repository, which is
          # everything before the tag's colon — unless taking that away leaves
          # no repository at all, which is a reference carrying the registry's
          # port and no tag.
          ref="${WEB_IMAGE%@*}"
          image_repository="${ref%:*}"
          case "${image_repository}" in
            */*) ;;
            *) image_repository="${ref}" ;;
          esac
          echo "the consumer runs ${image_repository} at ${WEB_IMAGE#*@}"

          kubectl apply -f - <<EOF
          apiVersion: kitchen.bermos.dev/v1alpha1
          kind: Project
          metadata:
            name: ${CONSUMER}
            namespace: kitchen-system
          spec:
            source:
              image:
                repository: ${image_repository}
                digest: ${WEB_IMAGE#*@}
                connectionRef: {name: e2e-registry}
            runtime:
              port: 8080
          ---
          apiVersion: kitchen.bermos.dev/v1alpha1
          kind: ResourceClaim
          metadata:
            name: ${BINDING}
            namespace: kitchen-system
          spec:
            projectRef: {name: ${CONSUMER}}
            type: service
            config:
              service:
                project: ${PROJECT}
                offering: ${OFFERING}
          EOF

          # The long name, deliberately: Kubernetes 1.34 serves a
          # `resourceclaims.resource.k8s.io` of its own for dynamic resource
          # allocation, and `kubectl get resourceclaim` on a recent kind
          # resolves to that one and answers "not found" about an object that
          # is right there.
          for _ in $(seq 60); do
            phase="$(kubectl -n kitchen-system get resourceclaims.kitchen.bermos.dev "${BINDING}" \
              -o jsonpath='{.status.phase}' 2>/dev/null || true)"
            [ "${phase}" = Bound ] && break
            sleep 5
          done
          phase="$(kubectl -n kitchen-system get resourceclaims.kitchen.bermos.dev "${BINDING}" -o jsonpath='{.status.phase}')"
          [ "${phase}" = Bound ] || {
            echo "::error::the binding ended ${phase}"
            kubectl -n kitchen-system get resourceclaims.kitchen.bermos.dev "${BINDING}" -o yaml
            kubectl -n kitchen-system logs -l control-plane=controller-manager --tail=200
            exit 1
          }

          # The binding carries an address and no credential, and it is in the
          # *consumer's* namespace.
          secret="$(kubectl -n kitchen-system get resourceclaims.kitchen.bermos.dev "${BINDING}" \
            -o jsonpath='{.status.secretName}')"
          key() { # key <name>
            kubectl -n "${CONSUMER_APP_NS}" get secret "${secret}" \
              -o jsonpath="{.data.$1}" | base64 -d
          }
          host="$(key host)"
          port="$(key port)"
          url="$(key url)"
          echo "the binding carries ${url} (host ${host}, port ${port})"
          [ "${host}" = "${PROJECT}-production-api.${APP_NS}.svc.cluster.local" ] || {
            echo "::error::the binding names ${host}, which is not the offering's api workload" \
                 "in the provider's production environment"
            exit 1
          }
          [ "${port}" = 9000 ] || {
            echo "::error::the binding names port ${port}, and the api workload answers on 9000"
            exit 1
          }
          [ "$(key environment)" = "${PROJECT}-production" ] || {
            echo "::error::the binding resolved to environment $(key environment)"
            exit 1
          }

          # The consumer deploys the image it names — no build, and no
          # repository — and its web process is handed the offering's address
          # under the same prefix a sibling workload's arrives in.
          for _ in $(seq 90); do
            kubectl -n "${CONSUMER_APP_NS}" get deploy "${CONSUMER}-production" >/dev/null 2>&1 && break
            sleep 5
          done
          kubectl -n "${CONSUMER_APP_NS}" rollout status "deploy/${CONSUMER}-production" --timeout=5m || {
            echo "::error::the consumer never came up"
            kubectl -n kitchen-system get project "${CONSUMER}" -o yaml
            kubectl -n kitchen-system get builds,releases,environments -o wide
            kubectl -n "${CONSUMER_APP_NS}" get pods -o wide
            exit 1
          }

          web_pod="$(kubectl -n "${CONSUMER_APP_NS}" get pod \
            -l "kitchen.bermos.dev/environment=${CONSUMER}-production,kitchen.bermos.dev/component=web" \
            -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' \
            | awk '$2 == "True" { print $1; exit }')"
          [ -n "${web_pod}" ] || {
            echo "::error::the consumer has no ready web pod to ask"
            kubectl -n "${CONSUMER_APP_NS}" get pods -o wide
            exit 1
          }

          variable="KITCHEN_SERVICE_$(echo "${BINDING}" | tr 'a-z-' 'A-Z_')"
          told="$(kubectl -n "${CONSUMER_APP_NS}" exec "${web_pod}" \
            -- sh -c "printenv ${variable}" 2>/dev/null || true)"
          echo "the consumer is told ${variable}=${told}"
          [ "${told}" = "${url}" ] || {
            echo "::error::the consumer's ${variable} is '${told}', and the binding says '${url}'"
            kubectl -n "${CONSUMER_APP_NS}" get deploy "${CONSUMER}-production" \
              -o jsonpath='{.spec.template.spec.containers[0].env}' | tr ',' '\n'
            exit 1
          }

          # And it actually reaches it: the answer says which workload of
          # which project served it, which is the whole claim.
          served="$(kubectl -n "${CONSUMER_APP_NS}" exec "${web_pod}" \
            -- sh -c "wget -q -O - \"\${${variable}}/host.txt\"" 2>/dev/null || true)"
          role="$(kubectl -n "${CONSUMER_APP_NS}" exec "${web_pod}" \
            -- sh -c "wget -q -O - \"\${${variable}}/process.txt\"" 2>/dev/null || true)"
          echo "the consumer was answered by ${served}, which says it is '${role}'"
          case "${served}" in
            "${PROJECT}-production-api-"*) ;;
            *)
              echo "::error::the consumer was answered by '${served}', which is not one of the" \
                   "provider's production api pods"
              exit 1
              ;;
          esac
          [ "${role}" = api ] || {
            echo "::error::the address resolved to a workload that says it is '${role}'"
            exit 1
          }

          # An offering that is not there is Failed with the name in it, and
          # never Pending: nothing appears on a timer that would make it
          # right.
          kubectl apply -f - <<EOF
          apiVersion: kitchen.bermos.dev/v1alpha1
          kind: ResourceClaim
          metadata:
            name: ${BINDING}-absent
            namespace: kitchen-system
          spec:
            projectRef: {name: ${CONSUMER}}
            type: service
            config:
              service:
                project: ${PROJECT}
                offering: not-offered
          EOF
          for _ in $(seq 30); do
            phase="$(kubectl -n kitchen-system get resourceclaims.kitchen.bermos.dev "${BINDING}-absent" \
              -o jsonpath='{.status.phase}' 2>/dev/null || true)"
            [ -n "${phase}" ] && [ "${phase}" != Pending ] && break
            sleep 5
          done
          phase="$(kubectl -n kitchen-system get resourceclaims.kitchen.bermos.dev "${BINDING}-absent" \
            -o jsonpath='{.status.phase}')"
          reason="$(kubectl -n kitchen-system get resourceclaims.kitchen.bermos.dev "${BINDING}-absent" \
            -o jsonpath='{.status.conditions[?(@.type=="Ready")].message}')"
          echo "a claim on an offering nobody makes is ${phase}: ${reason}"
          [ "${phase}" = Failed ] || {
            echo "::error::a claim naming an offering that does not exist is ${phase}"
            kubectl -n kitchen-system get resourceclaims.kitchen.bermos.dev "${BINDING}-absent" -o yaml
            exit 1
          }
          case "${reason}" in
            *not-offered*"${OFFERING}"*) ;;
            *)
              echo "::error::the refusal does not name the offering that was asked for" \
                   "and the ones the project makes: ${reason}"
              exit 1
              ;;
          esac
          kubectl -n kitchen-system delete resourceclaims.kitchen.bermos.dev "${BINDING}-absent" --wait=false

      # #494, end to end: which environment of the provider a consumer's
      # *preview* reaches is the provider environment owners' declaration, and
      # an environment that declares nothing reaches nobody.
      #
      # Both halves are asserted against pods rather than objects. The claim
      # says what each class of the consumer's environments reaches; the
      # consumer's own preview is what proves the environment reconciler acts
      # on it — a preview that was handed production's address would pass
      # every status check in the world.
      - name: What a consumer's preview may reach is the provider's to say
        run: |
          set -euo pipefail
          variable="KITCHEN_SERVICE_$(echo "${BINDING}" | tr 'a-z-' 'A-Z_')"
          stage="${PROJECT}-staging"
          consumer_preview="${CONSUMER}-pr-1"
          binding() { # binding <consumer class> <field>
            kubectl -n kitchen-system get resourceclaims.kitchen.bermos.dev "${BINDING}" \
              -o jsonpath="{.status.service.bindings[?(@.consumer=='$1')].$2}"
          }
          preview_web_pod() {
            kubectl -n "${CONSUMER_APP_NS}" get pod \
              -l "kitchen.bermos.dev/environment=${consumer_preview},kitchen.bermos.dev/component=web" \
              -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' \
              | awk '$2 == "True" { print $1; exit }'
          }
          told() { # told <pod> — the address that pod was handed, empty for none
            # The `|| true` is *inside* the container, so an unset variable is
            # an empty answer while a failed exec is still a failed command:
            # swallowing kubectl's own exit code here would let every negative
            # assertion below pass against a container nothing reached.
            kubectl -n "${CONSUMER_APP_NS}" exec "$1" -- sh -c "printenv ${variable} || true"
          }

          # Production reaches the environment the offering names. A preview
          # reaches nothing, because nothing admits one — and the row says
          # what would, as a fact about the provider rather than as an
          # instruction to a reader who could not act on it.
          echo "production reaches $(binding production environment)"
          [ "$(binding production environment)" = "${PROJECT}-production" ] || {
            echo "::error::production reaches '$(binding production environment)'"
            kubectl -n kitchen-system get resourceclaims.kitchen.bermos.dev "${BINDING}" -o yaml
            exit 1
          }
          [ -z "$(binding preview environment)" ] || {
            echo "::error::a preview reaches $(binding preview environment), and nothing admits one"
            kubectl -n kitchen-system get resourceclaims.kitchen.bermos.dev "${BINDING}" -o yaml
            exit 1
          }
          refusal="$(binding preview reason)"
          echo "a preview reaches nothing: ${refusal}"
          case "${refusal}" in
            *serves.consumers*) ;;
            *)
              echo "::error::the refusal does not name what would permit it: ${refusal}"
              exit 1
              ;;
          esac

          # The consumer's own preview, running what its production runs. It
          # is applied rather than built, like the provider's preview above.
          consumer_release="$(kubectl -n kitchen-system get environment "${CONSUMER}-production" \
            -o jsonpath='{.spec.releaseRef.name}')"
          [ -n "${consumer_release}" ] || { echo "::error::the consumer runs no release"; exit 1; }
          kubectl apply -f - <<EOF
          apiVersion: kitchen.bermos.dev/v1alpha1
          kind: Environment
          metadata:
            name: ${consumer_preview}
            namespace: kitchen-system
          spec:
            projectRef: {name: ${CONSUMER}}
            type: preview
            releaseRef: {name: ${consumer_release}}
            preview:
              pullRequest: 1
              branch: binding-policy
          EOF
          for _ in $(seq 90); do
            kubectl -n "${CONSUMER_APP_NS}" get deploy "${consumer_preview}" >/dev/null 2>&1 && break
            sleep 5
          done
          kubectl -n "${CONSUMER_APP_NS}" rollout status "deploy/${consumer_preview}" --timeout=5m || {
            echo "::error::the consumer's preview never came up"
            kubectl -n kitchen-system get environment "${consumer_preview}" -o yaml
            kubectl -n "${CONSUMER_APP_NS}" get pods -o wide
            exit 1
          }

          # It is deployed, and it has no address: the variable is left out
          # rather than the environment being held back, and the environment
          # says why on its ClaimsBound condition.
          pod="$(preview_web_pod)"
          [ -n "${pod}" ] || { echo "::error::the consumer's preview has no ready web pod"; exit 1; }
          # Captured rather than tested inside `[ ]`: an assignment carries the
          # command's failure under `set -e`, where a condition swallows it.
          address="$(told "${pod}")"
          [ -z "${address}" ] || {
            echo "::error::the consumer's preview was handed ${variable}=${address}," \
                 "and no environment of ${PROJECT} admits a preview"
            exit 1
          }
          said="$(kubectl -n kitchen-system get environment "${consumer_preview}" \
            -o jsonpath='{.status.conditions[?(@.type=="ClaimsBound")].message}')"
          echo "the preview says: ${said}"
          case "${said}" in
            *"${BINDING}"*) ;;
            *)
              echo "::error::the preview does not say which binding it is deployed without: ${said}"
              kubectl -n kitchen-system get environment "${consumer_preview}" -o yaml
              exit 1
              ;;
          esac

          # A stage of the provider, running what production runs, whose
          # owners open it to other teams' previews. It is declared rather
          # than promoted into: what is under test is who may bind to it.
          release="$(kubectl -n kitchen-system get environment "${PROJECT}-production" \
            -o jsonpath='{.spec.releaseRef.name}')"
          [ -n "${release}" ] || { echo "::error::production runs no release"; exit 1; }
          kubectl apply -f - <<EOF
          apiVersion: kitchen.bermos.dev/v1alpha1
          kind: Environment
          metadata:
            name: ${stage}
            namespace: kitchen-system
          spec:
            projectRef: {name: ${PROJECT}}
            type: stage
            releaseRef: {name: ${release}}
            serves:
              consumers: [preview]
          EOF
          for _ in $(seq 90); do
            kubectl -n "${APP_NS}" get deploy "${stage}-api" >/dev/null 2>&1 && break
            sleep 5
          done
          kubectl -n "${APP_NS}" rollout status "deploy/${stage}-api" --timeout=5m || {
            echo "::error::the provider's stage never came up"
            kubectl -n kitchen-system get environment "${stage}" -o yaml
            kubectl -n "${APP_NS}" get pods -o wide
            exit 1
          }

          # The claim resolves again on its own — the environment appearing is
          # what wakes it — and now a preview reaches the stage while
          # production is untouched.
          for _ in $(seq 60); do
            [ "$(binding preview environment)" = "${stage}" ] && break
            sleep 5
          done
          echo "a preview now reaches $(binding preview environment)"
          [ "$(binding preview environment)" = "${stage}" ] || {
            echo "::error::a preview reaches '$(binding preview environment)', not the stage that admits it"
            kubectl -n kitchen-system get resourceclaims.kitchen.bermos.dev "${BINDING}" -o yaml
            exit 1
          }
          [ "$(binding production environment)" = "${PROJECT}-production" ] || {
            echo "::error::production moved to $(binding production environment)"
            exit 1
          }
          preview_secret="$(binding preview secretName)"
          preview_host="$(kubectl -n "${CONSUMER_APP_NS}" get secret "${preview_secret}" \
            -o jsonpath='{.data.host}' | base64 -d)"
          [ "${preview_host}" = "${stage}-api.${APP_NS}.svc.cluster.local" ] || {
            echo "::error::the preview's address is ${preview_host}"
            exit 1
          }

          # And the consumer's preview is handed it, and answered by the
          # stage's own pods rather than production's — which is the whole of
          # what a preview binding to a stage means.
          for _ in $(seq 60); do
            pod="$(preview_web_pod)"
            [ -n "${pod}" ] && [ -n "$(told "${pod}")" ] && break
            sleep 5
          done
          pod="$(preview_web_pod)"
          address="$(told "${pod}")"
          echo "the consumer's preview is told ${variable}=${address}"
          case "${address}" in
            *"${stage}-api.${APP_NS}.svc.cluster.local"*) ;;
            *)
              echo "::error::the consumer's preview is told '${address}', and the stage answers at ${preview_host}"
              kubectl -n "${CONSUMER_APP_NS}" get deploy "${consumer_preview}" \
                -o jsonpath='{.spec.template.spec.containers[0].env}' | tr ',' '\n'
              exit 1
              ;;
          esac
          served="$(kubectl -n "${CONSUMER_APP_NS}" exec "${pod}" \
            -- sh -c "wget -q -O - \"\${${variable}}/host.txt\"" 2>/dev/null || true)"
          echo "the consumer's preview was answered by ${served}"
          case "${served}" in
            "${stage}-api-"*) ;;
            *)
              echo "::error::the consumer's preview was answered by '${served}', which is not one of" \
                   "the stage's api pods"
              exit 1
              ;;
          esac

          # Closing it takes the address back: the row loses its environment
          # and its Secret, so nothing is left for a preview to keep reading.
          kubectl -n kitchen-system patch environment "${stage}" --type merge -p \
            '{"spec":{"serves":{"consumers":[]}}}'
          for _ in $(seq 60); do
            [ -z "$(binding preview environment)" ] && break
            sleep 5
          done
          [ -z "$(binding preview environment)" ] || {
            echo "::error::a preview still reaches $(binding preview environment) after it was closed"
            exit 1
          }
          if kubectl -n "${CONSUMER_APP_NS}" get secret "${preview_secret}" >/dev/null 2>&1; then
            echo "::error::the preview's binding secret ${preview_secret} was left behind"
            exit 1
          fi
          echo "the address was taken back with the grant"

          # Both environments are this step's own, and which environments
          # exist decides where a binding lands — so they go with it rather
          # than being inherited by whatever runs next.
          kubectl -n kitchen-system delete environment "${stage}" "${consumer_preview}" --wait=false

      # #495, end to end: an offering that admits consumers by request binds
      # nobody until the project that makes it says so, and the answer reaches
      # the consumer's pods either way.
      #
      # **The decision is written the way the API writes it** — the grant on
      # the claim's own status — rather than through the route, because this
      # job installs no identity provider (`auth.enabled=false`), so there is
      # no token any API call here could carry. What the two routes do with a
      # request is internal/api's tests; what only a cluster can prove is
      # what this asserts: that nothing is provisioned while a request waits,
      # that an approval reaches a running pod, and that a withdrawal takes
      # the address back out of one.
      - name: A binding is requested, approved, and withdrawn
        run: |
          set -euo pipefail
          asked="${BINDING}-asked"
          variable="KITCHEN_SERVICE_$(echo "${asked}" | tr 'a-z-' 'A-Z_')"
          claim() { # claim <claim> <jsonpath>
            kubectl -n kitchen-system get resourceclaims.kitchen.bermos.dev "$1" -o jsonpath="{$2}"
          }
          await() { # await <claim> <phase>
            for _ in $(seq 60); do
              [ "$(claim "$1" .status.phase)" = "$2" ] && return 0
              sleep 5
            done
            echo "::error::claim $1 is $(claim "$1" .status.phase), and this case wants $2"
            kubectl -n kitchen-system get resourceclaims.kitchen.bermos.dev "$1" -o yaml
            kubectl -n kitchen-system logs -l control-plane=controller-manager --tail=200
            exit 1
          }
          decide() { # decide <state> <reason> — what the providing project's
                     # admins write through PATCH /projects/{name}/requests/{claim}
            kubectl -n kitchen-system patch resourceclaims.kitchen.bermos.dev "${asked}" \
              --subresource=status --type merge -p \
              "{\"status\":{\"service\":{\"grant\":{\"state\":\"$1\",\"decidedBy\":\"e2e@example.com\",\"reason\":\"$2\"}}}}"
          }
          web_pod() {
            kubectl -n "${CONSUMER_APP_NS}" get pod \
              -l "kitchen.bermos.dev/environment=${CONSUMER}-production,kitchen.bermos.dev/component=web" \
              -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' \
              | awk '$2 == "True" { print $1; exit }'
          }
          told() { # told <pod> — the address that pod was handed, empty for none
            # The `|| true` is *inside* the container, so an unset variable is
            # an empty answer while a failed exec is still a failed command:
            # swallowing kubectl's own exit code here would let every negative
            # assertion below pass against a container nothing reached.
            kubectl -n "${CONSUMER_APP_NS}" exec "$1" -- sh -c "printenv ${variable} || true"
          }

          # The offering stops admitting every project on the platform. The
          # consumer already bound to it does **not** lose its binding: the
          # claim carries the grant recorded when it bound, marked as one
          # nobody was asked about, and closing the door freezes new consumers
          # rather than cutting off the ones already through.
          kubectl -n kitchen-system patch project "${PROJECT}" --type merge -p \
            "{\"spec\":{\"offers\":[{\"name\":\"${OFFERING}\",\"process\":\"api\",\"protocol\":\"http\",\"visibility\":\"request\"}]}}"
          [ "$(claim "${BINDING}" .status.service.grant.open)" = true ] || {
            echo "::error::the binding that was admitted while the offering was open records no such grant"
            kubectl -n kitchen-system get resourceclaims.kitchen.bermos.dev "${BINDING}" -o yaml
            exit 1
          }
          sleep 30
          [ "$(claim "${BINDING}" .status.phase)" = Bound ] || {
            echo "::error::closing the offering unbound ${BINDING}, which was already through the door"
            kubectl -n kitchen-system get resourceclaims.kitchen.bermos.dev "${BINDING}" -o yaml
            exit 1
          }
          echo "the consumer already bound is still Bound"

          # A consumer arriving after the door closed. The claim *is* the
          # request: it is written, it waits, and it provisions nothing.
          kubectl apply -f - <<EOF
          apiVersion: kitchen.bermos.dev/v1alpha1
          kind: ResourceClaim
          metadata:
            name: ${asked}
            namespace: kitchen-system
            annotations:
              kitchen.bermos.dev/requested-by: ada@example.com
          spec:
            projectRef: {name: ${CONSUMER}}
            type: service
            config:
              service:
                project: ${PROJECT}
                offering: ${OFFERING}
          EOF
          await "${asked}" PendingApproval
          waiting="$(claim "${asked}" '.status.conditions[?(@.type=="Ready")].message')"
          echo "the request says: ${waiting}"
          case "${waiting}" in
            *"waiting for an admin of ${PROJECT}"*) ;;
            *)
              echo "::error::the claim does not say who it is waiting for: ${waiting}"
              exit 1
              ;;
          esac
          [ "$(claim "${asked}" .status.service.grant.requestedBy)" = ada@example.com ] || {
            echo "::error::the request does not record who asked"
            kubectl -n kitchen-system get resourceclaims.kitchen.bermos.dev "${asked}" -o yaml
            exit 1
          }
          # Nothing provisioned: no Secret for any class, and no variable in
          # the consumer's running pod.
          for suffix in "" -stage -preview; do
            if kubectl -n "${CONSUMER_APP_NS}" get secret "${asked}-binding${suffix}" >/dev/null 2>&1; then
              echo "::error::a request that is waiting wrote ${asked}-binding${suffix}"
              exit 1
            fi
          done
          pod="$(web_pod)"
          [ -n "${pod}" ] || { echo "::error::the consumer has no ready web pod"; exit 1; }
          # Captured rather than tested inside `[ ]`, so that an exec that
          # never reached the container fails this step instead of reading as
          # "the pod has no address".
          address="$(told "${pod}")"
          [ -z "${address}" ] || {
            echo "::error::a request that is waiting handed the consumer ${variable}=${address}"
            exit 1
          }
          echo "nothing is provisioned while the request waits"

          # Admitted. The claim binds on its own — the grant is all the API
          # writes — and the address reaches the consumer's pods.
          decide approved "the unit team said yes"
          await "${asked}" Bound
          secret="$(claim "${asked}" .status.secretName)"
          host="$(kubectl -n "${CONSUMER_APP_NS}" get secret "${secret}" -o jsonpath='{.data.host}' | base64 -d)"
          echo "the approved binding carries ${host}"
          [ "${host}" = "${PROJECT}-production-api.${APP_NS}.svc.cluster.local" ] || {
            echo "::error::the binding names ${host}, which is not the offering's api workload"
            exit 1
          }
          kubectl -n "${CONSUMER_APP_NS}" rollout status "deploy/${CONSUMER}-production" --timeout=5m
          for _ in $(seq 60); do
            pod="$(web_pod)"
            [ -n "${pod}" ] && [ -n "$(told "${pod}")" ] && break
            sleep 5
          done
          pod="$(web_pod)"
          address="$(told "${pod}")"
          echo "the consumer is told ${variable}=${address}"
          case "${address}" in
            *"${PROJECT}-production-api.${APP_NS}.svc.cluster.local"*) ;;
            *)
              echo "::error::the consumer is told '${address}', and the binding says ${host}"
              kubectl -n "${CONSUMER_APP_NS}" get deploy "${CONSUMER}-production" \
                -o jsonpath='{.spec.template.spec.containers[0].env}' | tr ',' '\n'
              exit 1
              ;;
          esac
          served="$(kubectl -n "${CONSUMER_APP_NS}" exec "${pod}" \
            -- sh -c "wget -q -O - \"\${${variable}}/host.txt\"" 2>/dev/null || true)"
          echo "the consumer was answered by ${served}"
          case "${served}" in
            "${PROJECT}-production-api-"*) ;;
            *)
              echo "::error::the approved binding was answered by '${served}', which is not one of" \
                   "the provider's production api pods"
              exit 1
              ;;
          esac

          # Withdrawn. A refusal and a withdrawal are one state, and the
          # address goes: the Secret is removed and the consumer's
          # environments roll without the variable.
          decide denied "the unit team is retiring this offering"
          await "${asked}" Failed
          refusal="$(claim "${asked}" '.status.conditions[?(@.type=="Ready")].message')"
          echo "the withdrawal says: ${refusal}"
          case "${refusal}" in
            *"retiring this offering"*) ;;
            *)
              echo "::error::the refusal does not carry the provider's own words: ${refusal}"
              exit 1
              ;;
          esac
          if kubectl -n "${CONSUMER_APP_NS}" get secret "${secret}" >/dev/null 2>&1; then
            echo "::error::the withdrawn binding left ${secret} behind"
            exit 1
          fi
          kubectl -n "${CONSUMER_APP_NS}" rollout status "deploy/${CONSUMER}-production" --timeout=5m
          for _ in $(seq 60); do
            pod="$(web_pod)"
            [ -n "${pod}" ] && [ -z "$(told "${pod}")" ] && break
            sleep 5
          done
          pod="$(web_pod)"
          address="$(told "${pod}")"
          [ -z "${address}" ] || {
            echo "::error::the consumer still has ${variable}=${address} after the binding was withdrawn"
            kubectl -n "${CONSUMER_APP_NS}" get deploy "${CONSUMER}-production" \
              -o jsonpath='{.spec.template.spec.containers[0].env}' | tr ',' '\n'
            exit 1
          }
          echo "the address was taken back out of the running pod"

          # And asking again is the same claim, not a new one: what
          # POST /claims/{name}/request writes puts it back in front of the
          # provider.
          kubectl -n kitchen-system patch resourceclaims.kitchen.bermos.dev "${asked}" \
            --subresource=status --type merge -p \
            '{"status":{"service":{"grant":{"state":"requested","decidedBy":"","decidedAt":null,"reason":""}}}}'
          await "${asked}" PendingApproval
          echo "the same claim is waiting again"

          # This step's own objects, and the offering it closed: later steps
          # read the project's offerings and the consumer's environment.
          kubectl -n kitchen-system delete resourceclaims.kitchen.bermos.dev "${asked}" --wait=false
          kubectl -n kitchen-system patch project "${PROJECT}" --type merge -p \
            "{\"spec\":{\"offers\":[{\"name\":\"${OFFERING}\",\"process\":\"api\",\"protocol\":\"http\",\"visibility\":\"open\"}]}}"

      # #301's third criterion. Two releases of the same images, applied by
      # hand: what differs between them is the frozen configuration the deploy
      # task runs under, which is the only way to make one commit's migration
      # fail and then succeed without rebuilding it.
      - name: A failing deploy task leaves the previous release serving
        run: |
          set -euo pipefail
          release() { # release <name> <label> <migration fails>
            kubectl apply -f - <<EOF
          apiVersion: kitchen.bermos.dev/v1alpha1
          kind: Release
          metadata:
            name: $1
            namespace: kitchen-system
          spec:
            projectRef: {name: ${PROJECT}}
            buildRef: {name: ${BUILD}}
            image: ${WEB_IMAGE}
            workloads:
              - name: api
                image: ${API_IMAGE}
            configSnapshot:
              runtime:
                port: 8080
              env:
                - name: RELEASE_LABEL
                  value: "$2"
                - name: MIGRATION_FAILS
                  value: "$3"
              processes:
                - name: api
                  type: service
                  port: 9000
                - name: migrate
                  type: task
                  command: ["/migrate.sh"]
                  timeout: 2m
          EOF
          }
          # The environment's web pod by the label that names it, never
          # `deploy/<name>`: the web Deployment's selector is the environment
          # label alone — immutable, so it can never carry the component
          # label — and every pod the environment materializes carries the
          # environment label, so `deploy/${PROJECT}-production` also resolves
          # to the api workload's pod, which listens on 9000 and answers this
          # probe with nothing.
          web_pod() { # web_pod <environment>
            kubectl -n "${APP_NS}" get pod \
              -l "kitchen.bermos.dev/environment=$1,kitchen.bermos.dev/component=web" \
              -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' \
              | awk '$2 == "True" { print $1; exit }'
          }
          deployed() {
            # Tolerant of a kubectl that answers nothing, exactly as the
            # `wget` below is: this is polled in a loop, and a blip is a
            # reason to ask again rather than to end the job.
            pod="$(web_pod "${PROJECT}-production" || true)"
            [ -n "${pod}" ] || return 0
            kubectl -n "${APP_NS}" exec "${pod}" \
              -- wget -q -O - http://127.0.0.1:8080/release.txt 2>/dev/null || true
          }
          # "Served the wrong release" and "answered nothing at all" are
          # different faults — a release that never rolled, against a probe
          # that never reached the application — and the log has to tell them
          # apart without a second run to find out which it was.
          serving_says() { # serving_says <what deployed() returned>
            if [ -n "$1" ]; then
              printf "production serves '%s'" "$1"
              return
            fi
            pod="$(web_pod "${PROJECT}-production" || true)"
            if [ -n "${pod}" ]; then
              printf "production's web pod %s answered nothing on 127.0.0.1:8080/release.txt" \
                "${pod}"
            else
              printf "production has no ready web pod to ask"
            fi
          }
          point_at() {
            kubectl -n kitchen-system patch environment "${PROJECT}-production" \
              --type=merge -p "{\"spec\":{\"releaseRef\":{\"name\":\"$1\"}}}"
          }

          serving="$(deployed)"
          [ "${serving}" = one ] || {
            echo "::error::before any of this, $(serving_says "${serving}")"
            kubectl -n "${APP_NS}" get pods -o wide --show-labels
            exit 1
          }

          release "${PROJECT}-rel-refused" two 1
          point_at "${PROJECT}-rel-refused"

          for _ in $(seq 60); do
            phase="$(kubectl -n kitchen-system get environment "${PROJECT}-production" \
              -o jsonpath='{.status.phase}')"
            [ "${phase}" = Degraded ] && break
            sleep 5
          done
          phase="$(kubectl -n kitchen-system get environment "${PROJECT}-production" \
            -o jsonpath='{.status.phase}')"
          [ "${phase}" = Degraded ] || {
            echo "::error::a deploy whose task failed left the environment ${phase}"
            kubectl -n kitchen-system get environment "${PROJECT}-production" -o yaml
            kubectl -n "${APP_NS}" get jobs
            exit 1
          }
          kubectl -n "${APP_NS}" get jobs

          # The point of the feature: nothing was applied, so the release
          # before it is still the one taking traffic.
          serving="$(deployed)"
          [ "${serving}" = one ] || {
            echo "::error::a deploy whose task failed still moved traffic:" \
                 "$(serving_says "${serving}")"
            kubectl -n "${APP_NS}" get pods -o wide --show-labels
            exit 1
          }
          label="$(kubectl -n "${APP_NS}" get deploy "${PROJECT}-production" \
            -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="RELEASE_LABEL")].value}')"
          [ "${label}" = one ] || {
            echo "::error::the web Deployment was rewritten for a release whose task failed"
            exit 1
          }

          # And a task that succeeds lets the release through.
          release "${PROJECT}-rel-applied" three 0
          point_at "${PROJECT}-rel-applied"
          for _ in $(seq 60); do
            [ "$(deployed)" = three ] && break
            sleep 5
          done
          serving="$(deployed)"
          [ "${serving}" = three ] || {
            echo "::error::a deploy whose task succeeded never took traffic:" \
                 "$(serving_says "${serving}")"
            kubectl -n kitchen-system get environment "${PROJECT}-production" -o yaml
            kubectl -n "${APP_NS}" get jobs
            kubectl -n "${APP_NS}" get pods -o wide --show-labels
            exit 1
          }
          for _ in $(seq 24); do
            phase="$(kubectl -n kitchen-system get environment "${PROJECT}-production" \
              -o jsonpath='{.status.phase}')"
            [ "${phase}" = Live ] && break
            sleep 5
          done
          [ "${phase}" = Live ] || {
            echo "::error::the environment is ${phase} after a deploy that applied"
            kubectl -n kitchen-system get environment "${PROJECT}-production" -o yaml
            exit 1
          }

      # The other build strategy, end to end (#424).
      #
      # Everything else about the buildpacks strategy is held by unit coverage
      # over a pod spec, and a pod spec that is wrong in the way that matters
      # here — a lifecycle phase that cannot resolve its inputs, an image that
      # never gets pushed — is green in every one of those tests. So one
      # project in this job has no Dockerfile at all: the Cloud Native
      # Buildpacks lifecycle decides what the repository is, builds it, and
      # pushes what it built.
      #
      # What the case asserts is the split the credential fix made (#424): the
      # lifecycle runs as five containers, the two that run the repository's
      # own build hold no registry credential at all, the phases that write to
      # the registry hold the one that can, and the image still comes back
      # with the digest the exporter reported — which is the whole of what the
      # termination-message path does for this strategy.
      #
      # It is also the only build in the tree that runs against a registry
      # issuing a credential narrower than the connection's own (#534). That
      # is what makes the split assertable at all: with one account every
      # container holds something that can push, the analyze phase's up-front
      # write check passes whichever credential it was handed, and the case
      # is green on a platform where no buildpacks build can publish. So this
      # project has a registry Connection of its own, with a `-read` Secret
      # beside its credential — the convention readCredentialSecretName
      # spells, and the whole of what an operator does to narrow this.
      - name: A project with no Dockerfile builds with buildpacks, and its analyzer can validate the tag
        run: |
          set -euo pipefail
          # Two accounts on one registry: the connection's own, which pushes,
          # and the read-only one the platform picks up by name. Neither is
          # checked by the registry this job started — they are checked by the
          # front end it is reached through.
          kubectl -n kitchen-system create secret docker-registry "${BP_REGISTRY}" \
            --docker-server="${RO_REGISTRY_ADDR}" \
            --docker-username=kitchen --docker-password=kitchenpush
          kubectl -n kitchen-system create secret docker-registry "${BP_REGISTRY}-read" \
            --docker-server="${RO_REGISTRY_ADDR}" \
            --docker-username=reader --docker-password=kitchenpull

          kubectl apply -f - <<EOF
          apiVersion: kitchen.bermos.dev/v1alpha1
          kind: Connection
          metadata:
            name: ${BP_REGISTRY}
            namespace: kitchen-system
          spec:
            provider: dockerRegistry
            credentialsSecretRef: {name: ${BP_REGISTRY}}
            config:
              url: http://${RO_REGISTRY_ADDR}
          ---
          apiVersion: kitchen.bermos.dev/v1alpha1
          kind: Project
          metadata:
            name: ${BP_PROJECT}
            namespace: kitchen-system
          spec:
            source:
              git:
                connectionRef: {name: e2e-git}
                repo: ${REPO}
                productionBranch: ${BRANCH}
            build:
              strategy: buildpacks
              rootDirectory: ${BP_FIXTURE}
            registry:
              connectionRef: {name: ${BP_REGISTRY}}
            previews:
              protected: false
          EOF

          build=""
          for _ in $(seq 60); do
            build="$(kubectl -n kitchen-system get builds \
              -l "kitchen.bermos.dev/project=${BP_PROJECT}" \
              -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
            [ -n "${build}" ] && break
            sleep 5
          done
          [ -n "${build}" ] || {
            echo "::error::the platform never seeded a build for the buildpacks project"
            kubectl -n kitchen-system get project "${BP_PROJECT}" -o yaml
            kubectl -n kitchen-system logs -l control-plane=controller-manager --tail=200
            exit 1
          }
          echo "the platform seeded build ${build}"

          # The lifecycle downloads its buildpacks and runs the application's
          # own build, which is a longer wait than BuildKit assembling a
          # busybox image: twenty minutes, and a failure that arrives sooner
          # ends the loop rather than sitting it out.
          phase=""
          for _ in $(seq 120); do
            phase="$(kubectl -n kitchen-system get build "${build}" -o jsonpath='{.status.phase}')"
            [ "${phase}" = Succeeded ] && break
            [ "${phase}" = Failed ] && break
            sleep 10
          done
          [ "${phase}" = Succeeded ] || {
            echo "::error::the buildpacks build ended ${phase}. A phase denied a blob upload" \
                 "against ${RO_REGISTRY_ADDR} is #534: the analyze phase is handed the output" \
                 "tag and validates write access to it, so it holds the credential that can push."
            kubectl -n kitchen-system get build "${build}" -o yaml
            kubectl -n "${BP_APP_NS}" get jobs,pods -o wide
            for pod in $(kubectl -n "${BP_APP_NS}" get pods -o name); do
              echo "--- ${pod}"
              kubectl -n "${BP_APP_NS}" logs "${pod}" --all-containers --tail=300 || true
            done
            # Which account was refused what, from the front end's own side.
            echo "--- the read-only front end"
            docker logs --tail=100 kitchen-e2e-registry-ro
            exit 1
          }

          # The digest is the exporter's own report, read back off the pod's
          # termination message. A tag here rather than a digest means the
          # report never arrived — which is what splitting `creator` into
          # phases could have broken and nothing short of a real build can say.
          image="$(kubectl -n kitchen-system get build "${build}" -o jsonpath='{.status.image}')"
          echo "the build pushed ${image}"
          case "${image}" in
            *"@sha256:"*) ;;
            *)
              echo "::error::the build reported '${image}': the lifecycle's report never" \
                   "reached the termination message, so the platform has a tag and not a digest"
              exit 1
              ;;
          esac

          # And the credential each phase held. The Job's TTL keeps the pod for
          # an hour, so the spec that actually ran is still here to be read —
          # this is the assertion the unit tests make against a rendered spec,
          # made against the one Kubernetes admitted.
          pod="$(kubectl -n "${BP_APP_NS}" get pods -l "kitchen.bermos.dev/build=${build}" \
            -o jsonpath='{.items[0].metadata.name}')"
          kubectl -n "${BP_APP_NS}" get pod "${pod}" -o json > /tmp/buildpacks-pod.json
          ran="$(jq -r '[.spec.initContainers[].name] + [.spec.containers[].name] | join(" ")' \
            /tmp/buildpacks-pod.json)"
          echo "the build pod ran: ${ran}"
          [ "${ran}" = "clone analyzer detector restorer builder exporter" ] || {
            echo "::error::the lifecycle did not run as its five phases: ${ran}"
            exit 1
          }

          held() { # held <container> — the docker configs it mounts
            jq -r --arg c "$1" '[.spec.initContainers[], .spec.containers[]]
              | map(select(.name == $c))[0].volumeMounts
              | map(select(.name | startswith("docker-config"))) | map(.name) | sort | join(",")' \
              /tmp/buildpacks-pod.json
          }
          for container in clone detector builder; do
            [ -z "$(held "${container}")" ] || {
              echo "::error::${container} runs code this platform did not write and mounts" \
                   "$(held "${container}")"
              exit 1
            }
          done
          # export pushes; analyze is handed the output tag and validates
          # read *and* write access to it before anything else runs, which is
          # the fail-fast the lifecycle offers and what #534 was. Both hold
          # the credential that can write. restore only reads.
          for container in analyzer exporter; do
            [ "$(held "${container}")" = docker-config ] || {
              echo "::error::${container} writes to the registry and mounts" \
                   "'$(held "${container}")'"
              exit 1
            }
          done
          [ "$(held restorer)" = docker-config-read ] || {
            echo "::error::restore only reads the registry and mounts '$(held restorer)'"
            exit 1
          }
          echo "no phase that runs the repository's own code holds any credential at all"

          # And the platform directory, which is the other thing that is not
          # the same in every phase: the two that run buildpacks read it, and
          # the three that run only the lifecycle neither mount it nor are
          # pointed at it — `-platform` is a flag only detect and build
          # define (#468).
          reads() { # reads <container> — where it mounts the platform directory
            jq -r --arg c "$1" '[.spec.initContainers[], .spec.containers[]]
              | map(select(.name == $c))[0].volumeMounts
              | map(select(.name == "platform-env"))[0].mountPath // ""' \
              /tmp/buildpacks-pod.json
          }
          for container in detector builder; do
            [ "$(reads "${container}")" = /kitchen/platform/env ] || {
              echo "::error::${container} runs buildpacks and reads their configuration from" \
                   "'$(reads "${container}")'"
              exit 1
            }
          done
          for container in clone analyzer restorer exporter; do
            [ -z "$(reads "${container}")" ] || {
              echo "::error::${container} runs no buildpack and mounts the platform directory" \
                   "at '$(reads "${container}")'"
              exit 1
            }
          done
          echo "only the two phases that run buildpacks read the platform directory"

          # And the premise every assertion above rests on: this project's
          # registry issued a credential narrower than the connection's own,
          # so the two volumes name two different Secrets. Where they name
          # one — which is every other project in this job, and was every
          # project in this job before #534 — `Read == Push` and a pod whose
          # every container can push satisfies all of it.
          secrets="$(jq -r '.spec.volumes | map(select(.name | startswith("docker-config")))
            | map(.secret.secretName) | unique | join(",")' /tmp/buildpacks-pod.json)"
          echo "the pod's docker configs come from ${secrets}"
          want="kitchen-registry-${BP_REGISTRY},kitchen-registry-${BP_REGISTRY}-read"
          [ "${secrets}" = "${want}" ] || {
            echo "::error::the build resolved '${secrets}', want '${want}'. Without two" \
                 "credentials the analyzer holds one that can push whichever volume it" \
                 "mounts, and this case proves nothing."
            exit 1
          }
          # The platform's own account of the same fact, which is what an
          # operator reads before believing any of it.
          scoped="$(kubectl -n kitchen-system get connection "${BP_REGISTRY}" \
            -o jsonpath='{.status.registry.scopedCredentials}')"
          [ "${scoped}" = true ] || {
            echo "::error::the registry connection reports scopedCredentials='${scoped}'"
            kubectl -n kitchen-system get connection "${BP_REGISTRY}" -o yaml
            exit 1
          }
          echo "the analyzer validated write access to the tag with the credential that has it"

          # And it runs. An image that says `buildpacks` cannot have come from
          # the other strategy: there is no Dockerfile in that directory.
          #
          # The Deployment arrives a reconcile after the build does — the
          # release is frozen first, and the environment is what materializes
          # it — so it is waited for rather than assumed, exactly as the
          # workloads above are.
          for _ in $(seq 60); do
            kubectl -n "${BP_APP_NS}" get deploy "${BP_PROJECT}-production" >/dev/null 2>&1 && break
            sleep 5
          done
          kubectl -n "${BP_APP_NS}" rollout status "deploy/${BP_PROJECT}-production" --timeout=5m || {
            echo "::error::the buildpacks-built image never became ready"
            kubectl -n "${BP_APP_NS}" get pods -o wide
            kubectl -n "${BP_APP_NS}" describe deploy "${BP_PROJECT}-production"
            kubectl -n "${BP_APP_NS}" logs -l "kitchen.bermos.dev/environment=${BP_PROJECT}-production" \
              --all-containers --tail=200 || true
            exit 1
          }
          # Asked from the other project's pod, which is the one thing in this
          # cluster with a shell and a `wget` in it: the run image a buildpacks
          # build produces carries the application and nothing else. It is
          # asked through the environment's own Service — port 80 in front of
          # the container's 8080 — so the answer says the platform routed to
          # what it built, not merely that a process is listening somewhere.
          served="$(kubectl -n "${APP_NS}" exec "deploy/${PROJECT}-production" \
            -- wget -q -O - "http://${BP_PROJECT}-production.${BP_APP_NS}.svc.cluster.local:80/")"
          echo "the buildpacks application answered '${served}'"
          case "${served}" in
            buildpacks*) ;;
            *)
              echo "::error::the buildpacks environment answered '${served}'"
              exit 1
              ;;
          esac

      # The default path, end to end (#468). Everything above this point is a
      # project that told the platform what it is: a strategy, a port, a
      # Dockerfile, a start script. This one tells it nothing.
      #
      # `test/fixtures/nuxt-stock` is what `nuxi init` writes, plus a database
      # driver and a migration. It has no Dockerfile, so `auto` reads the
      # repository and answers `buildpacks`. It has no `start` script, so none
      # of the three start buildpacks fires and the lifecycle exports an image
      # declaring no process at all. It has no port and no command, so the
      # detected framework supplies both. It sets no build environment,
      # because a project cannot: the build's variables are the platform's,
      # and until this change they were `CNB_PLATFORM_API` and nothing else —
      # so the repository's own `build` script never ran, the node version was
      # whatever was newest that day, and the build was killed at the memory
      # ceiling with exit 137 and no explanation.
      #
      # And it reads a postgres claim, which is the other half. A claim's
      # binding names `sslmode=verify-full` and the certificate authority the
      # platform mounts beside it, and until this case existed nothing
      # anywhere ran an application against one — #461 landed that pair with
      # no end-to-end cover, because no kind job had a claim in it.
      - name: A stock Nuxt application deploys on the default path
        run: |
          set -euo pipefail
          kubectl apply -f - <<EOF
          apiVersion: kitchen.bermos.dev/v1alpha1
          kind: Connection
          metadata:
            name: e2e-cnpg
            namespace: kitchen-system
          spec:
            provider: cnpg
            config:
              # A kind node's local-path volumes are the runner's disk, and
              # this case reads one row.
              storageSize: 1Gi
              instances: 1
          ---
          apiVersion: kitchen.bermos.dev/v1alpha1
          kind: Project
          metadata:
            name: ${NUXT_PROJECT}
            namespace: kitchen-system
          spec:
            source:
              git:
                connectionRef: {name: e2e-git}
                repo: ${REPO}
                productionBranch: ${BRANCH}
            build:
              rootDirectory: ${NUXT_FIXTURE}
            registry:
              connectionRef: {name: e2e-registry}
            previews:
              protected: false
            env:
              - name: DATABASE_URL
                fromResourceClaim: {name: ${NUXT_CLAIM}, key: url}
          ---
          apiVersion: kitchen.bermos.dev/v1alpha1
          kind: ResourceClaim
          metadata:
            name: ${NUXT_CLAIM}
            namespace: kitchen-system
          spec:
            projectRef: {name: ${NUXT_PROJECT}}
            connectionRef: {name: e2e-cnpg}
            type: postgres
            deletionPolicy: Delete
          EOF

          # The database and the build come up in parallel; neither waits for
          # the other, and the environment waits for both.
          #
          # The kind: is spelled in full everywhere below, because `kubectl get
          # resourceclaim` does not mean this one. Kubernetes serves its own
          # `resource.k8s.io` ResourceClaim — dynamic resource allocation —
          # from 1.34, and a built-in group wins the short name over a CRD's,
          # so the unqualified form answers `resourceclaims.resource.k8s.io
          # "appdb" not found` however healthy the claim is. It did exactly
          # that on every run of this case since it was written: the loop hid
          # it behind `|| true` for its whole fifteen minutes and the read
          # after it failed the step, while the claim underneath had bound and
          # the application had deployed against it.
          claim="resourceclaims.kitchen.bermos.dev"
          for _ in $(seq 90); do
            phase="$(kubectl -n kitchen-system get "${claim}" "${NUXT_CLAIM}" \
              -o jsonpath='{.status.phase}' 2>/dev/null || true)"
            [ "${phase}" = Bound ] && break
            [ "${phase}" = Failed ] && break
            sleep 10
          done
          claim_phase="$(kubectl -n kitchen-system get "${claim}" "${NUXT_CLAIM}" \
            -o jsonpath='{.status.phase}')"
          [ "${claim_phase}" = Bound ] || {
            echo "::error::the postgres claim is ${claim_phase}"
            kubectl -n kitchen-system get "${claim}" "${NUXT_CLAIM}" -o yaml
            kubectl -n kitchen-databases get clusters,pods -o wide || true
            kubectl -n cnpg-system logs -l app.kubernetes.io/name=cloudnative-pg --tail=100 || true
            exit 1
          }
          echo "the claim bound to $(kubectl -n kitchen-system get "${claim}" \
            "${NUXT_CLAIM}" -o jsonpath='{.status.instanceName}')"

          build=""
          for _ in $(seq 60); do
            build="$(kubectl -n kitchen-system get builds \
              -l "kitchen.bermos.dev/project=${NUXT_PROJECT}" \
              -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
            [ -n "${build}" ] && break
            sleep 5
          done
          [ -n "${build}" ] || {
            echo "::error::the platform never seeded a build for the nuxt project"
            kubectl -n kitchen-system get project "${NUXT_PROJECT}" -o yaml
            kubectl -n kitchen-system logs -l control-plane=controller-manager --tail=200
            exit 1
          }

          # A real front-end build: npm install, Vite and Nitro, on one CPU.
          # Twenty-five minutes, and a failure that arrives sooner ends the
          # loop rather than sitting it out.
          phase=""
          for _ in $(seq 150); do
            phase="$(kubectl -n kitchen-system get build "${build}" -o jsonpath='{.status.phase}')"
            [ "${phase}" = Succeeded ] && break
            [ "${phase}" = Failed ] && break
            sleep 10
          done
          [ "${phase}" = Succeeded ] || {
            echo "::error::the stock Nuxt build ended ${phase}"
            kubectl -n kitchen-system get build "${build}" -o yaml
            kubectl -n "${NUXT_APP_NS}" get jobs,pods -o wide
            for pod in $(kubectl -n "${NUXT_APP_NS}" get pods -o name); do
              echo "--- ${pod}"
              kubectl -n "${NUXT_APP_NS}" logs "${pod}" --all-containers --tail=300 || true
            done
            exit 1
          }

          # Read the repository, and answer buildpacks. Nothing in the project
          # or in the commit named either.
          strategy="$(kubectl -n kitchen-system get build "${build}" -o jsonpath='{.status.strategy}')"
          detected="$(kubectl -n kitchen-system get build "${build}" \
            -o jsonpath='{.status.detectedFramework}')"
          echo "the platform decided ${strategy}/${detected}"
          [ "${strategy}" = buildpacks ] && [ "${detected}" = nuxt ] || {
            echo "::error::a repository with no Dockerfile on strategy auto resolved to" \
                 "'${strategy}'/'${detected}'"
            exit 1
          }

          # What the buildpacks were told about the repository, read out of
          # the platform directory the build actually mounted. Five
          # variables, and every one of them was missing: the build script
          # the framework compiles itself with, the runtime version the
          # manifest asks for, the heap ceiling — 75% of the platform's build
          # ceiling, because V8 sizes its old space from the machine rather
          # than from the cgroup it is in — and the file the framework's own
          # start command runs, which is what makes the node-start buildpack
          # take part. Without that last pair the group stops at
          # node-run-script, node-engine keeps its layer for the build alone,
          # and the image is exported with no `node` in it: the build
          # succeeds, the deploy task dies on `node: command not found` and
          # the web process never starts (#468).
          #
          # It is read off the ConfigMap rather than off the container,
          # because a container variable is exactly what does not arrive: the
          # lifecycle rebuilds a buildpack's environment from its own include
          # list and keeps only `<platform>/env` on top of it.
          pod="$(kubectl -n "${NUXT_APP_NS}" get pods -l "kitchen.bermos.dev/build=${build}" \
            -o jsonpath='{.items[0].metadata.name}')"
          kubectl -n "${NUXT_APP_NS}" get pod "${pod}" -o json > /tmp/nuxt-build-pod.json
          platform="$(jq -r '.spec.volumes | map(select(.name == "platform-env"))[0]
            .configMap.name // ""' /tmp/nuxt-build-pod.json)"
          [ -n "${platform}" ] || {
            echo "::error::the build pod mounts no platform directory, so no BP_ variable" \
                 "the platform sets can reach a buildpack"
            jq -r '.spec.volumes' /tmp/nuxt-build-pod.json
            exit 1
          }
          echo "the buildpacks were configured from ${platform}"
          kubectl -n "${NUXT_APP_NS}" get configmap "${platform}" -o json > /tmp/nuxt-platform-env.json
          told() { # told <variable> — its file in the platform directory
            jq -r --arg v "$1" '.data[$v] // ""' /tmp/nuxt-platform-env.json
          }
          for pair in \
            "BP_NODE_RUN_SCRIPTS=build" \
            "BP_NODE_VERSION=22.x" \
            "BP_LAUNCHPOINT=.output/server/index.mjs" \
            "BP_VERIFY_LAUNCHPOINT=false" \
            "NODE_OPTIONS=--max-old-space-size=${NUXT_BUILD_HEAP_MIB}"; do
            name="${pair%%=*}"
            want="${pair#*=}"
            got="$(told "${name}")"
            [ "${got}" = "${want}" ] || {
              echo "::error::the build was told ${name}='${got}', want '${want}'"
              exit 1
            }
            echo "the build was told ${name}=${got}"
          done

          # And the credential half of the same pod, which is the *fallback*
          # (#534). This project's registry connection has no
          # `<credentials secret>-read` Secret beside it, so
          # `credentialsWithRead` answers `Read == Push`: the pod's two
          # docker-config volumes name one Secret, and every container in it
          # holds something that can push whichever volume it mounts.
          #
          # That is worth asserting rather than assuming, because it is the
          # condition under which no assertion about *which* phase holds
          # which credential means anything — which is exactly how a phase
          # given the credential that cannot push stayed green here for a
          # release. The bpnode case above is the same pod against a registry
          # that does issue a narrower credential; this is the other branch,
          # and both are reachable installations.
          secrets="$(jq -r '.spec.volumes | map(select(.name | startswith("docker-config")))
            | map(.secret.secretName) | unique | join(",")' /tmp/nuxt-build-pod.json)"
          echo "the pod's docker configs come from ${secrets}"
          [ "${secrets}" = kitchen-registry-e2e-registry ] || {
            echo "::error::a connection with no read-only credential resolved '${secrets}'," \
                 "want the connection's own Secret named once"
            exit 1
          }
          # The platform's own account of it. scopedCredentials is omitempty,
          # so false is an absent field rather than the string "false".
          scoped="$(kubectl -n kitchen-system get connection e2e-registry \
            -o jsonpath='{.status.registry.scopedCredentials}')"
          [ -z "${scoped}" ] || [ "${scoped}" = false ] || {
            echo "::error::the connection reports scopedCredentials='${scoped}' for a registry" \
                 "that was given no read-only credential"
            kubectl -n kitchen-system get connection e2e-registry -o yaml
            exit 1
          }
          echo "the connection reports no narrower credential, and the build took the fallback"

          # The deploy task, which is a command on an image whose entrypoint
          # is the buildpacks launcher. It connects to the claim's database
          # over a verified TLS connection and creates the table the
          # application reads, and the environment does not roll if it fails.
          for _ in $(seq 90); do
            run="$(kubectl -n kitchen-system get environment "${NUXT_PROJECT}-production" \
              -o jsonpath='{.status.processes[?(@.name=="migrate")].lastRun.phase}' 2>/dev/null || true)"
            case "${run}" in
              Succeeded|Failed) break ;;
            esac
            sleep 10
          done
          run="$(kubectl -n kitchen-system get environment "${NUXT_PROJECT}-production" \
            -o jsonpath='{.status.processes[?(@.name=="migrate")].lastRun.phase}' 2>/dev/null || true)"
          [ "${run}" = Succeeded ] || {
            echo "::error::the deploy task ended '${run}'"
            kubectl -n kitchen-system get environment "${NUXT_PROJECT}-production" -o yaml
            kubectl -n "${NUXT_APP_NS}" get jobs,pods -o wide
            kubectl -n "${NUXT_APP_NS}" logs -l "kitchen.bermos.dev/process=migrate" \
              --all-containers --tail=200 || true
            exit 1
          }
          echo "the deploy task ran the migration"

          kubectl -n "${NUXT_APP_NS}" rollout status "deploy/${NUXT_PROJECT}-production" \
            --timeout=5m || {
            echo "::error::the stock Nuxt image never became ready"
            kubectl -n "${NUXT_APP_NS}" get pods -o wide
            kubectl -n "${NUXT_APP_NS}" describe deploy "${NUXT_PROJECT}-production"
            kubectl -n "${NUXT_APP_NS}" logs \
              -l "kitchen.bermos.dev/environment=${NUXT_PROJECT}-production" \
              --all-containers --tail=200 || true
            exit 1
          }

          # How it is started: the launcher named explicitly, with the
          # framework's own start command as its arguments. A command written
          # in place of the launcher would run where no buildpack has put
          # anything and say `exec: "node": executable file not found in
          # $PATH`; no command at all would exit on `when there is no default
          # process a command is required`, since this image declares none.
          kubectl -n "${NUXT_APP_NS}" get deploy "${NUXT_PROJECT}-production" -o json \
            > /tmp/nuxt-deploy.json
          started="$(jq -r '.spec.template.spec.containers[]
            | select(.name == "app")
            | (.command + .args) | join(" ")' /tmp/nuxt-deploy.json)"
          echo "the web process starts with: ${started}"
          [ "${started}" = "/cnb/lifecycle/launcher node .output/server/index.mjs" ] || {
            echo "::error::the web process starts with '${started}'"
            exit 1
          }

          # And the claim's certificate authority, mounted where the binding
          # says it is. The two halves have to name the same path or the URL
          # points at a file that is not there.
          ca_dir="/var/run/kitchen/claims/${NUXT_CLAIM}"
          mounted="$(jq -r --arg d "${ca_dir}" '.spec.template.spec.containers[]
            | select(.name == "app") | .volumeMounts
            | map(select(.mountPath == $d)) | length' /tmp/nuxt-deploy.json)"
          [ "${mounted}" = 1 ] || {
            echo "::error::the application container does not mount ${ca_dir}"
            jq '.spec.template.spec.containers[] | select(.name == "app") | .volumeMounts' \
              /tmp/nuxt-deploy.json
            exit 1
          }
          secret="$(kubectl -n kitchen-system get resourceclaims.kitchen.bermos.dev \
            "${NUXT_CLAIM}" -o jsonpath='{.status.secretName}')"
          dsn="$(kubectl -n "${NUXT_APP_NS}" get secret "${secret}" \
            -o jsonpath='{.data.url}' | base64 -d)"
          # Printed without its credentials: this is a log anybody can read.
          echo "the binding connects with $(printf '%s' "${dsn}" | sed 's#//[^@]*@#//***@#')"
          case "${dsn}" in
            *"sslmode=verify-full&sslrootcert=${ca_dir}/ca.crt"*) ;;
            *)
              echo "::error::the binding does not verify against the authority the platform mounts"
              exit 1
              ;;
          esac

          # And that the authority is the platform's own rather than one the
          # database minted for itself (#443, #468 step 5a). Two facts, and
          # the second is the one that cannot be faked: the claim says
          # PlatformCA, and the bytes an application verifies against are the
          # same bytes as the CA bundle the operator publishes in
          # kitchen-system. A per-cluster CA would satisfy every assertion
          # above this one.
          for _ in $(seq 30); do
            reason="$(kubectl -n kitchen-system get resourceclaims.kitchen.bermos.dev "${NUXT_CLAIM}" \
              -o jsonpath='{.status.conditions[?(@.type=="ServerCertificate")].reason}' \
              2>/dev/null || true)"
            [ "${reason}" = PlatformCA ] && break
            sleep 10
          done
          echo "the claim reports its server certificate as ${reason:-unreported}"
          [ "${reason}" = PlatformCA ] || {
            echo "::error::the claim's database is not on the platform's CA (${reason:-unreported})"
            kubectl -n kitchen-system get resourceclaims.kitchen.bermos.dev "${NUXT_CLAIM}" -o yaml
            kubectl -n kitchen-databases get certificates,clusters -o wide || true
            kubectl -n kitchen-system get certificates,issuers || true
            kubectl get clusterissuers || true
            exit 1
          }

          kubectl -n "${NUXT_APP_NS}" get secret "${secret}" \
            -o jsonpath='{.data.ca}' | base64 -d > /tmp/claim-ca.crt
          kubectl -n kitchen-system get configmap kitchen-internal-ca \
            -o jsonpath='{.data.ca\.crt}' > /tmp/platform-ca.crt
          # Compared as certificates rather than as bytes: a trailing newline
          # is not the question, and the fingerprint is the whole of it.
          claim_ca="$(openssl x509 -in /tmp/claim-ca.crt -noout -fingerprint -sha256)"
          platform_ca="$(openssl x509 -in /tmp/platform-ca.crt -noout -fingerprint -sha256)"
          echo "the application verifies against ${claim_ca}"
          [ "${claim_ca}" = "${platform_ca}" ] || {
            echo "::error::the certificate the application verifies against is not the" \
                 "platform's CA (${platform_ca}), so a workload still trusts one root" \
                 "per database"
            openssl x509 -in /tmp/claim-ca.crt -noout -subject -issuer || true
            openssl x509 -in /tmp/platform-ca.crt -noout -subject -issuer || true
            exit 1
          }
          echo "the database is signed by $(openssl x509 -in /tmp/platform-ca.crt \
            -noout -subject | sed 's/^subject=//')"

          # The Cluster names it under both halves of CloudNativePG's schema,
          # which is what actually puts the certificate in front of Postgres.
          cluster="$(kubectl -n kitchen-system get resourceclaims.kitchen.bermos.dev "${NUXT_CLAIM}" \
            -o jsonpath='{.status.instanceName}')"
          certs="$(kubectl -n kitchen-databases get cluster "${cluster}" \
            -o jsonpath='{.spec.certificates.serverCASecret} {.spec.certificates.serverTLSSecret}')"
          echo "the cluster's server identity is ${certs}"
          [ "${certs}" = "${cluster}-server-tls ${cluster}-server-tls" ] || {
            echo "::error::the cluster does not name the certificate the platform issued it"
            exit 1
          }

          # Finally, the application itself, asked through its own Service —
          # port 80 in front of the container's 3000, which is the detected
          # framework's port and nothing the repository ever named. The
          # answer is the whole case in one line: Nitro is serving, so the
          # build ran; the migration count is non-zero, so the deploy task
          # ran against this database; and `verified` is what the application
          # sees in its own connection string.
          served="$(kubectl -n "${APP_NS}" exec "deploy/${PROJECT}-production" \
            -- wget -q -O - \
            "http://${NUXT_PROJECT}-production.${NUXT_APP_NS}.svc.cluster.local:80/api/kitchen")"
          echo "the nuxt application answered '${served}'"
          for expected in '"framework":"nuxt"' '"verified":true' '"port":3000'; do
            case "${served}" in
              *"${expected}"*) ;;
              *)
                echo "::error::the application did not answer ${expected}"
                exit 1
                ;;
            esac
          done
          migrations="$(printf '%s' "${served}" | jq -r '.migrations')"
          [ "${migrations}" -ge 1 ] || {
            echo "::error::the application sees ${migrations} migrations: the deploy task's" \
                 "work is not in the database the application reads"
            exit 1
          }

      - name: What the cluster looked like when it failed
        if: failure()
        run: |
          kubectl -n kitchen-system get projects,connections,builds,releases,environments -o wide || true
          kubectl -n kitchen-system get environments -o yaml || true
          kubectl -n "${APP_NS}" get all -o wide || true
          kubectl -n "${BP_APP_NS}" get all -o wide || true
          kubectl -n "${NUXT_APP_NS}" get all -o wide || true
          kubectl -n "${APP_NS}" get events --sort-by=.lastTimestamp || true
          kubectl -n "${BP_APP_NS}" get events --sort-by=.lastTimestamp || true
          kubectl -n "${NUXT_APP_NS}" get events --sort-by=.lastTimestamp || true
          kubectl -n kitchen-system get resourceclaims.kitchen.bermos.dev -o wide || true
          kubectl -n kitchen-databases get clusters,pods,pvc -o wide || true
          df -h / || true
          kubectl -n kitchen-system logs -l control-plane=controller-manager --tail=400 || true
          for namespace in "${APP_NS}" "${BP_APP_NS}" "${NUXT_APP_NS}"; do
            for pod in $(kubectl -n "${namespace}" get pods -o name); do
              echo "--- ${namespace} ${pod}"
              kubectl -n "${namespace}" logs "${pod}" --all-containers --tail=200 || true
            done
          done
