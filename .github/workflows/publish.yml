name: Publish

on:
  push:
    tags:
      - "v*"
  # How a release normally gets here: release.yml calls this workflow directly
  # once release-please has tagged the commit, because a tag pushed with
  # GITHUB_TOKEN never fires the `push: tags` trigger above. That trigger is
  # left in place for a tag pushed by a person.
  workflow_call:
    inputs:
      version:
        description: "Version to publish, without the leading v (e.g. 0.2.0)"
        required: true
        type: string
      release-id:
        description: "Draft GitHub release to attach the artifacts to and publish"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v (e.g. 0.2.0)"
        required: true
        type: string
      release-id:
        description: "Draft GitHub release to publish (looked up by tag if empty)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      image: ${{ steps.resolve.outputs.image }}
      auth_image: ${{ steps.resolve.outputs.auth_image }}
      chart_repo: ${{ steps.resolve.outputs.chart_repo }}
    steps:
      - name: Resolve the version and image names
        id: resolve
        env:
          # Through the environment rather than an expression: on a manual run
          # this is whatever the operator typed into the form, and ${{ }} would
          # paste it into the shell. Empty on a tag push, where the tag is the
          # version.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          # Chart and image versions are SemVer; Helm rejects anything else.
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'${version}' is not a SemVer version"
            exit 1
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "version=${version}"
            echo "image=ghcr.io/${owner}/kitchen"
            echo "auth_image=ghcr.io/${owner}/kitchen-auth"
            echo "chart_repo=oci://ghcr.io/${owner}/charts"
          } >>"$GITHUB_OUTPUT"

  image:
    name: Operator image
    runs-on: ubuntu-latest
    needs: version
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    # A release is not allowed to hang. Every job here was unbounded until
    # 0.5.1, where the auth image sat in `Build and push` until the six-hour
    # job limit killed it: the chart job that needs it was skipped, and the
    # release published two images and no chart while reading as "in progress"
    # all afternoon. These bounds are generous against a cold cache and still
    # turn that into a failure within the hour.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Lets the build attach a signed provenance attestation to the image.
      id-token: write
      attestations: write
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      # No QEMU here on purpose. The Dockerfile pins its build stages to the
      # build platform and cross-compiles, and the final stage only copies
      # binaries in, so nothing arm64 is ever executed. Verified by building
      # this image, attestations included, on a host with no arm64 emulation
      # registered at all. The auth image below is built the same way.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.version.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=Kitchen
            org.opencontainers.image.description=Self-hosted Vercel alternative for your own Kubernetes cluster
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamped into the binaries with -ldflags, which is how the dashboard
          # knows which release it is running. The build stage compiles the
          # source and nothing else, so it cannot work this out for itself.
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          # Reads the cache the branch builds populate, and deliberately
          # writes none. Actions caches are ref-scoped: anything exported from
          # a run on refs/tags/vX.Y.Z cannot be read by the next release's tag,
          # and the layers worth caching change every release regardless.
          # Exporting it cost 296s of the 43-minute v0.1.0 run for nothing.
          cache-from: type=gha
          provenance: mode=max
          sbom: true

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ needs.version.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  auth-image:
    name: Auth image
    runs-on: ubuntu-latest
    needs: version
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      # No QEMU here either, for the reason the auth Dockerfile spells out: the
      # emulated arm64 `npm ci` stopped completing, and because this job is what
      # the chart job waits on, that published 0.5.1 and 0.6.0 as images with no
      # chart behind them. Both build stages are pinned to the build host now,
      # so nothing arm64 is executed and there is no emulator to install.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.version.outputs.auth_image }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=Kitchen auth
            org.opencontainers.image.description=Kitchen's identity provider - better-auth with the OAuth/OIDC provider plugin
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: auth
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reads the cache the branch builds populate, and deliberately
          # writes none. Actions caches are ref-scoped: anything exported from
          # a run on refs/tags/vX.Y.Z cannot be read by the next release's tag,
          # and the layers worth caching change every release regardless.
          # Exporting it cost 296s of the 43-minute v0.1.0 run for nothing.
          cache-from: type=gha
          provenance: mode=max
          sbom: true

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ needs.version.outputs.auth_image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    # The chart's appVersion is the tag of both images it deploys, so they have
    # to exist before the chart that points at them is published.
    needs: [version, image, auth-image]
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Verify the chart's generated templates are in sync
        run: |
          ./hack/gen-helm-manifests.sh
          git diff --exit-code -- charts/ || {
            echo "::error::charts/kitchen templates are stale; publishing them would ship the wrong CRDs."
            exit 1
          }

      - name: Package the chart
        run: |
          set -euo pipefail
          version='${{ needs.version.outputs.version }}'
          # The chart pins the image it was published with; image.tag defaults
          # to appVersion, so the two can never drift apart in a release.
          helm package charts/kitchen \
            --version "${version}" \
            --app-version "${version}" \
            --destination dist
          # The default TLS mode is acme, and the chart refuses to render a
          # Kitchen in it without an ACME account and a solver — the API server
          # refuses that object — so the lint has to pass what an install does.
          helm lint "dist/kitchen-${version}.tgz" \
            --namespace kitchen-system \
            --set kitchen.baseDomain=apps.example.com \
            --set kitchen.tls.acme.email=platform@example.com \
            --set kitchen.tls.acme.dns01.cloudflare.apiTokenSecretName=cloudflare-api-token

      - name: Log in to GHCR
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' \
            | helm registry login ghcr.io --username '${{ github.actor }}' --password-stdin

      - name: Push the chart
        id: push
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CHART_REPO: ${{ needs.version.outputs.chart_repo }}
        run: |
          set -euo pipefail
          # helm reports the pushed digest on stderr and nowhere else, so it is
          # read back out of the output rather than asked for afterwards.
          helm push "dist/kitchen-${VERSION}.tgz" "${CHART_REPO}" 2>&1 | tee push.log
          digest="$(grep -oE 'sha256:[0-9a-f]{64}' push.log | head -1)"
          echo "digest=${digest}" >>"$GITHUB_OUTPUT"

      - name: Upload the chart as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitchen-chart-${{ needs.version.outputs.version }}
          path: dist/*.tgz

  finalize:
    name: Publish the GitHub release
    runs-on: ubuntu-latest
    # Everything the release promises has to exist before the release itself
    # does. This is the job that makes it public, and it is why the release is
    # created as a draft: 0.5.1 and 0.6.0 were live releases whose chart never
    # got pushed, because the release object was written before the artifacts
    # rather than after them.
    needs: [version, image, auth-image, chart]
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE_ID: ${{ inputs.release-id }}
      IMAGE: ${{ needs.version.outputs.image }}
      AUTH_IMAGE: ${{ needs.version.outputs.auth_image }}
      CHART_REPO: ${{ needs.version.outputs.chart_repo }}
      IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
      AUTH_IMAGE_DIGEST: ${{ needs.auth-image.outputs.digest }}
      CHART_DIGEST: ${{ needs.chart.outputs.digest }}
    steps:
      - name: Download the packaged chart
        uses: actions/download-artifact@v4
        with:
          name: kitchen-chart-${{ needs.version.outputs.version }}
          path: dist

      - name: Resolve the release
        id: release
        run: |
          set -euo pipefail
          id="${RELEASE_ID:-}"
          if [[ -z "${id}" ]]; then
            # A tag pushed by hand, or a re-run through workflow_dispatch. The
            # by-tag endpoint does not serve drafts, so the list is filtered
            # instead — drafts included, which is the whole point.
            id="$(gh api --paginate "repos/${GH_REPO}/releases" \
              --jq "map(select(.tag_name == \"v${VERSION}\")) | .[0].id // empty" | head -1)"
          fi
          if [[ -z "${id}" ]]; then
            echo "::notice::No GitHub release exists for v${VERSION}; publishing the artifacts only."
          fi
          echo "id=${id}" >>"$GITHUB_OUTPUT"

      - name: Write the release notes
        env:
          RESOLVED_ID: ${{ steps.release.outputs.id }}
        run: |
          set -euo pipefail
          # release-please wrote the changelog into the draft's body. That is
          # what the release is *about*; this appends what the run resolved,
          # which is the part no one can work out from the commits.
          if [[ -n "${RESOLVED_ID}" ]]; then
            gh api "repos/${GH_REPO}/releases/${RESOLVED_ID}" --jq .body >body.md
          else
            : >body.md
          fi
          {
            echo
            echo "## Install"
            echo
            echo '```sh'
            echo "helm install kitchen ${CHART_REPO}/kitchen --version ${VERSION} \\"
            echo "  --namespace kitchen-system --create-namespace \\"
            echo "  --set kitchen.baseDomain=apps.example.com \\"
            echo "  --set kitchen.tls.acme.email=you@example.com \\"
            echo "  --set kitchen.tls.acme.dns01.cloudflare.apiTokenSecretName=cloudflare-api-token"
            echo '```'
            echo
            echo "The \`kitchen\` CLI is not published as a binary; it is built"
            echo "from this tag by the Go toolchain:"
            echo
            echo '```sh'
            echo "go install github.com/Bermos/Kitchen/cmd/kitchen@v${VERSION}"
            echo '```'
            echo
            echo "## Artifacts"
            echo
            echo "| Artifact | Reference | Digest |"
            echo "| --- | --- | --- |"
            echo "| Operator image | \`${IMAGE}:${VERSION}\` | \`${IMAGE_DIGEST}\` |"
            echo "| Auth image | \`${AUTH_IMAGE}:${VERSION}\` | \`${AUTH_IMAGE_DIGEST}\` |"
            echo "| Chart | \`${CHART_REPO}/kitchen:${VERSION}\` | \`${CHART_DIGEST}\` |"
            echo
            echo "Both images are linux/amd64 and linux/arm64 and carry a signed"
            echo "build provenance attestation. The chart is attached below as well."
          } >>body.md
          cat body.md >>"$GITHUB_STEP_SUMMARY"

      - name: Attach the chart to the release
        if: steps.release.outputs.id != ''
        env:
          RESOLVED_ID: ${{ steps.release.outputs.id }}
        run: |
          set -euo pipefail
          chart="dist/kitchen-${VERSION}.tgz"
          # Uploaded against the release id rather than through `gh release
          # upload`, which resolves a release by tag — and a draft release has
          # no tag ref yet.
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/gzip" \
            --data-binary @"${chart}" \
            "https://uploads.github.com/repos/${GH_REPO}/releases/${RESOLVED_ID}/assets?name=$(basename "${chart}")" \
            >/dev/null

      - name: Publish the release
        if: steps.release.outputs.id != ''
        env:
          RESOLVED_ID: ${{ steps.release.outputs.id }}
        run: |
          set -euo pipefail
          # The tag ref is created here, not by release-please: GitHub holds it
          # back for as long as the release is a draft.
          jq -n --arg body "$(cat body.md)" '{draft: false, body: $body}' \
            | gh api --method PATCH "repos/${GH_REPO}/releases/${RESOLVED_ID}" --input -
          echo "::notice::Kitchen ${VERSION} published."
