name: Tests

# A branch push and the pull request that carries it are the same commit, so
# leaving `push` unfiltered ran every job here twice for every push to a branch
# with a pull request open. `push` is narrowed to `main` for that reason: a
# branch is covered by its pull request, and `main` is covered once, after the
# merge.
#
# This workflow is cheap, and it keeps its run on `main` where the kind-based
# ones no longer do. An Actions cache is readable by the branch that wrote it,
# that branch's base, and the default branch — so `main`'s runs are the only
# ones every pull request can restore from, the kind jobs in the other
# workflows included. Dropping them would start every pull request cold.
# See CONTRIBUTING.md, "What CI runs, and when".
on:
  push:
    branches: [main]
  pull_request:

# One run per branch or pull request. A pull request's older runs are
# superseded by the push that follows them and are cancelled; `main`'s are
# never cancelled, because they are the last gate before a release and the only
# runs whose caches every other branch can restore from.
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit and envtest
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The dashboard renders its controls from a generated copy of the API's
      # enforcement table (hack/gen-ui-policy). It is checked in, so this is
      # where a route whose role moved without the dashboard's copy moving with
      # it is caught — before the tests, so the failure is about the stale file
      # rather than about whatever else the run turns up.
      - name: Check the dashboard's generated policy is in sync
        run: |
          go run ./hack/gen-ui-policy
          git diff --exit-code -- ui/src/lib/policy.generated.ts || {
            echo "::error::ui/src/lib/policy.generated.ts is stale. Run 'make ui-policy' and commit the result."
            exit 1
          }

      # The claim provider matrix in docs/api/claims.md is generated from the
      # declarations next to the provisioners (hack/gen-claim-matrix). Same
      # reason, same shape: a declaration that moved without the page moving
      # with it is caught here, before the tests.
      - name: Check the claim provider matrix is in sync
        run: |
          go run ./hack/gen-claim-matrix
          git diff --exit-code -- docs/api/claims.md || {
            echo "::error::docs/api/claims.md is stale. Run 'make claim-matrix' and commit the result."
            exit 1
          }

      - name: Running Tests
        run: |
          go mod tidy
          make test
