name: Tests

# A branch push and the pull request that carries it are the same commit, so
# leaving `push` unfiltered ran every job here twice for every push to a branch
# with a pull request open. `push` is narrowed to `main` for that reason: a
# branch is covered by its pull request, and `main` is covered once, after the
# merge.
#
# This workflow is cheap, and it keeps its run on `main` where the kind-based
# ones no longer do. An Actions cache is readable by the branch that wrote it,
# that branch's base, and the default branch — so `main`'s runs are the only
# ones every pull request can restore from, the kind jobs in the other
# workflows included. Dropping them would start every pull request cold.
# See CONTRIBUTING.md, "What CI runs, and when".
on:
  push:
    branches: [main]
  pull_request:

# One run per branch or pull request. A pull request's older runs are
# superseded by the push that follows them and are cancelled; `main`'s are
# never cancelled, because they are the last gate before a release and the only
# runs whose caches every other branch can restore from.
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit and envtest
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The dashboard renders its controls from a generated copy of the API's
      # enforcement table (hack/gen-ui-policy). It is checked in, so this is
      # where a route whose role moved without the dashboard's copy moving with
      # it is caught — before the tests, so the failure is about the stale file
      # rather than about whatever else the run turns up.
      - name: Check the dashboard's generated policy is in sync
        run: |
          go run ./hack/gen-ui-policy
          git diff --exit-code -- ui/src/lib/policy.generated.ts || {
            echo "::error::ui/src/lib/policy.generated.ts is stale. Run 'make ui-policy' and commit the result."
            exit 1
          }

      # The claim provider matrix in docs/api/claims.md is generated from the
      # declarations next to the provisioners (hack/gen-claim-matrix). Same
      # reason, same shape: a declaration that moved without the page moving
      # with it is caught here, before the tests.
      - name: Check the claim provider matrix is in sync
        run: |
          go run ./hack/gen-claim-matrix
          git diff --exit-code -- docs/api/claims.md || {
            echo "::error::docs/api/claims.md is stale. Run 'make claim-matrix' and commit the result."
            exit 1
          }

      # `internal/clickhouse`'s integration suite runs here and nowhere else.
      # Every other test in that package asks "did we build the statement we
      # meant to" of a fake that records what it was sent; only a real server
      # answers "will ClickHouse accept it", and that is where the interesting
      # mistakes are — a statement a server refuses reads perfectly, passes
      # every unit test, and then fails deterministically in front of whoever
      # opens the page (#449).
      #
      # The store is started by a step rather than declared as a `services:`
      # block, for two reasons that are the same reason. Its version is pinned
      # in one place — `clickhouse.image` in the chart's values, so that
      # bumping the platform's ClickHouse moves CI with it — and a service
      # container's `image:` is an expression resolved before any step of its
      # own job runs, so there is no checkout for it to read the pin from. And
      # when a service container does not come up, the job dies in "Initialize
      # containers" with every step skipped and nothing but a health-check
      # verdict to go on; a step can print what the store itself said.
      - name: Start the store at the version the chart pins
        run: |
          set -euo pipefail
          values=charts/kitchen/values.yaml
          # The quote stripping is not superstition: the two programs called
          # `yq` disagree about whether a scalar comes back quoted, and this
          # reads the same under either.
          field() { yq ".clickhouse.image.$1" "${values}" | tr -d '"' | tr -d '[:space:]'; }
          repository=$(field repository)
          tag=$(field tag)
          if [ -z "${repository}" ] || [ "${repository}" = "null" ] ||
             [ -z "${tag}" ] || [ "${tag}" = "null" ]; then
            echo "::error::clickhouse.image.repository/.tag is not readable from ${values}."
            echo "::error::The store below has nothing to pin to."
            exit 1
          fi
          image="${repository}:${tag}"
          echo "Store image: ${image}"
          docker run -d --name kitchen-store -p 8123:8123 \
            -e CLICKHOUSE_USER=kitchen \
            -e CLICKHOUSE_PASSWORD=hunter2 \
            -e CLICKHOUSE_DB=kitchen \
            "${image}"
          # Ready means "answers a query as the user, over the port and the
          # interface the tests use", not "the process started". The entrypoint
          # creates the user and the database with a server of its own before
          # it starts the real one, so a socket that accepts is not yet a store
          # that reads.
          for _ in $(seq 1 90); do
            if curl -fsS 'http://kitchen:hunter2@127.0.0.1:8123/?query=SELECT%201' >/dev/null 2>&1; then
              echo "The store answered after ${SECONDS}s."
              exit 0
            fi
            sleep 2
          done
          echo "::error::The store never answered on 127.0.0.1:8123. Its own output follows."
          docker logs kitchen-store 2>&1 | tail -50 || true
          docker exec kitchen-store \
            tail -50 /var/log/clickhouse-server/clickhouse-server.err.log 2>&1 || true
          exit 1

      - name: Running Tests
        env:
          # The store above, as the integration suite reads it. Unset on a
          # laptop, where the suite skips itself and `make test` needs no store.
          KITCHEN_CLICKHOUSE_URL: http://kitchen:hunter2@127.0.0.1:8123/kitchen
        run: |
          go mod tidy
          make test
