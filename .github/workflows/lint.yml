name: Lint

# A branch push and the pull request that carries it are the same commit, so
# leaving `push` unfiltered ran every job here twice for every push to a branch
# with a pull request open. `push` is narrowed to `main` for that reason: a
# branch is covered by its pull request, and `main` is covered once, after the
# merge.
#
# This workflow is cheap, and it keeps its run on `main` where the kind-based
# ones no longer do. An Actions cache is readable by the branch that wrote it,
# that branch's base, and the default branch — so `main`'s runs are the only
# ones every pull request can restore from, the kind jobs in the other
# workflows included. Dropping them would start every pull request cold.
# See CONTRIBUTING.md, "What CI runs, and when".
on:
  push:
    branches: [main]
  pull_request:

# One run per branch or pull request. A pull request's older runs are
# superseded by the push that follows them and are cancelled; `main`'s are
# never cancelled, because they are the last gate before a release and the only
# runs whose caches every other branch can restore from.
concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run linter
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.63.4
          # Build the pinned version with the repo's own Go rather than
          # downloading the release binary: that binary is built with go1.23,
          # and golangci-lint refuses to run against a go.mod that targets a
          # newer language version (go 1.24, required by the Hubble flow
          # client's cilium dependency). goinstall matches what `make lint`
          # runs locally.
          install-mode: goinstall
          # The action's config check is `golangci-lint config verify`, which
          # for a v1 linter fetches the JSON schema for its own version from
          # golangci-lint.run every time it runs. That is the only thing this
          # job wants from the network once the module cache is warm, and it
          # is enough to fail the job: the fetch timed out on a pull request
          # carrying a config that had passed on `main` minutes earlier, which
          # blocks a release for a reason that has nothing to do with the
          # branch. `make lint-config` runs the same check, on the machine of
          # whoever is editing .golangci.yml, where a schema download is worth
          # waiting for and a failure to reach the site is not somebody else's
          # red pull request.
          verify: false

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    # Advisory reports are not the branch's to fix, so this job does not gate:
    # a report here is a fact about the world on the day the job ran, not a
    # fact about the branch, so a blocking job would turn a pull request red
    # for an advisory published between two pushes and hold a release for a
    # reason nobody on the branch can fix. That is the same failure mode the
    # linter's config check was turned off for, above. The job therefore
    # reports and does not gate: the finding lands in the step summary, where
    # it is read without opening a log, and the branch that *introduces* a
    # reachable advisory still shows it next to the diff that brought it in.
    continue-on-error: true
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Pinned like golangci-lint above, so the job's verdict changes when the
      # tree changes or the database moves, never because the tool did.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Scan for reachable advisories
        run: |
          echo '## govulncheck' >> "$GITHUB_STEP_SUMMARY"
          # `run:` is bash -e, so the non-zero exit has to be caught here
          # rather than read from $? on the next line.
          status=0
          govulncheck ./... > govulncheck.txt 2>&1 || status=$?
          cat govulncheck.txt
          if [ "$status" -eq 0 ]; then
            echo 'No advisory has a symbol this code reaches.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # 3 is govulncheck's "findings"; anything else is the tool or the
          # database being unreachable, which says nothing about the tree.
          if [ "$status" -eq 3 ]; then
            echo 'Reachable advisories. Bump the modules they name, or say in the' >> "$GITHUB_STEP_SUMMARY"
            echo 'pull request why the reachable symbol is not a path this platform runs.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "govulncheck could not complete (exit $status); the scan says nothing about this branch." >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo
            echo '```'
            cat govulncheck.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
