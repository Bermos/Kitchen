name: Release

# Cutting a release is merging a pull request. release-please keeps that pull
# request open and up to date: it reads the Conventional Commits landed on main
# since the last tag, works out whether they add up to a patch, a minor or a
# major, writes CHANGELOG.md and bumps the version everywhere it is written
# down (release-please-config.json lists those files). Merging it tags the
# commit and publishes the release; nothing here is decided by hand.
#
# The release object it creates is a *draft* ("draft": true in the config), and
# publish.yml is what makes it public, after every artifact is pushed. Until
# 0.6.0 the release was live the moment this job finished, so a publish that
# died afterwards left a release announcing a version nobody could install:
# 0.5.1 and 0.6.0 both shipped images with no chart behind them and read as
# finished releases anyway. A draft cannot make that claim.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    permissions:
      # Writes the release branch, the tag and the GitHub release.
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag_name }}
      # The draft publish.yml finalizes. Passed by id rather than looked up by
      # tag, because a draft release has no tag ref to look it up by.
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    # Called rather than triggered by the tag: a tag pushed with the workflow's
    # own GITHUB_TOKEN does not start another workflow run, so waiting for the
    # `push: tags` trigger in publish.yml would wait forever. The version is
    # passed straight through instead.
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
      release-id: ${{ needs.release-please.outputs.release_id }}
    permissions:
      # write, not read: the last job attaches the chart to the draft release
      # and flips it live.
      contents: write
      packages: write
      id-token: write
      attestations: write
    secrets: inherit
