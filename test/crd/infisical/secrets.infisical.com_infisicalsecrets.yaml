# A minimal stand-in for Infisical's InfisicalSecret CRD, just enough for
# envtest to admit the objects the operator writes. The real schema ships with
# the secrets-operator sub-chart; the operator addresses the kind as
# unstructured and never depends on more than what is written here.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: infisicalsecrets.secrets.infisical.com
spec:
  group: secrets.infisical.com
  names:
    kind: InfisicalSecret
    listKind: InfisicalSecretList
    plural: infisicalsecrets
    singular: infisicalsecret
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
